<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Expansion, contraction et mémoire : la réponse secondaire est plus rapide et plus forte"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-15385f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#15385f"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="650" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Réponse primaire, réponse secondaire</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Nombre de LT spécifiques au cours du temps (schéma, sans échelle)</text><rect x="30" y="124" width="1140" height="500" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><path d="M110,140 V560 H1160" fill="none" stroke="#15385f" stroke-width="2.5" marker-end="url(#arr-15385f)"/><text transform="translate(66 355.0) rotate(-90)" font-size="16" fill="#4b6380" text-anchor="middle" font-weight="700">LT spécifiques</text><text x="1156.0" y="588.0" font-size="15" fill="#4b6380" text-anchor="end">temps</text><rect x="262" y="150" width="168" height="410" rx="0" fill="#e8f5ed"/><text x="346.0" y="172.0" font-size="15" fill="#0f6e51" text-anchor="middle"><tspan font-weight="700">J4</tspan><tspan font-weight="700"> –</tspan><tspan font-weight="700"> J10</tspan></text><text x="346.0" y="192.0" font-size="15" fill="#0f6e51" text-anchor="middle"><tspan font-weight="700">expansion</tspan><tspan font-weight="700"> clonale</tspan></text><text x="346.0" y="212.0" font-size="15" fill="#0f6e51" text-anchor="middle">× 10⁴ à 10⁵</text><path d="M120,546 L196,546 C240,544 262,500 300,370 C330,270 360,254 392,260 C430,270 460,410 520,464 C548,486 580,488 690,488" fill="none" stroke="#1d4f9e" stroke-width="5" stroke-linecap="round"/><path d="M752,488 C772,488 786,360 806,230 C820,168 846,162 870,180 C910,220 950,390 1010,432 C1040,448 1080,450 1140,450" fill="none" stroke="#b52a35" stroke-width="5" stroke-linecap="round"/><path d="M706,468 L722,508 M720,468 L736,508" stroke="#4b6380" stroke-width="3"/><path d="M196,560 V440" stroke="#9fb6cc" stroke-width="2" stroke-dasharray="4 5"/><path d="M240,560 V440" stroke="#9fb6cc" stroke-width="2" stroke-dasharray="4 5"/><text x="196.0" y="586.0" font-size="15" fill="#15385f" text-anchor="middle"><tspan font-weight="700">J0</tspan></text><text x="240.0" y="586.0" font-size="15" fill="#15385f" text-anchor="middle"><tspan font-weight="700">J2</tspan></text><text x="192.0" y="408.0" font-size="14" fill="#4b6380" text-anchor="end">infection</text><text x="236.0" y="430.0" font-size="14" fill="#4b6380" text-anchor="end">symptômes</text><text x="470.0" y="310.0" font-size="15" fill="#15385f"><tspan font-weight="700">Contraction</tspan> : apoptose</text><text x="470.0" y="329.0" font-size="15" fill="#15385f">programmée (−90 % des</text><text x="470.0" y="348.0" font-size="15" fill="#15385f">effecteurs)</text><text x="530.0" y="510.0" font-size="15" fill="#1d4f9e"><tspan font-weight="700">Mémoire</tspan> : la courbe ne</text><text x="530.0" y="529.0" font-size="15" fill="#1d4f9e">revient pas à zéro</text><text x="935.0" y="180.0" font-size="15" fill="#b52a35"><tspan font-weight="700">Réexposition</tspan> : réponse en</text><text x="935.0" y="199.0" font-size="15" fill="#b52a35">moins de 2 jours, plus forte,</text><text x="935.0" y="218.0" font-size="15" fill="#b52a35">plus efficace,<tspan font-weight="700"> sans</tspan><tspan font-weight="700"> symptômes</tspan></text><text x="400.0" y="612.0" font-size="16" fill="#1d4f9e" text-anchor="middle"><tspan font-weight="700">Réponse</tspan><tspan font-weight="700"> primaire</tspan><tspan font-weight="700"> :</tspan><tspan font-weight="700"> élimination</tspan><tspan font-weight="700"> en</tspan><tspan font-weight="700"> 14</tspan><tspan font-weight="700"> à</tspan><tspan font-weight="700"> 21</tspan><tspan font-weight="700"> jours</tspan></text><text x="950.0" y="612.0" font-size="16" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">Réponse</tspan><tspan font-weight="700"> secondaire</tspan><tspan font-weight="700"> (réinfection,</tspan><tspan font-weight="700"> rappel)</tspan></text></svg>