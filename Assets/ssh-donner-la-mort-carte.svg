<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 939" width="1200" height="939" role="img" aria-label="Arguments utilitaristes et déontologiques sur la différence entre tuer et laisser mourir"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-1d4f9e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1d4f9e"/></marker><marker id="arr-5b3db8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b3db8"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="939" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Donner la mort : la carte des arguments</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Juger par les conséquences ou par les intentions, et ce qu’on répond à chaque argument</text><rect x="200" y="124" width="800" height="92" rx="18" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="600.0" y="160.0" font-size="21" fill="#15385f" text-anchor="middle"><tspan font-weight="700">Tuer</tspan><tspan font-weight="700"> ou</tspan><tspan font-weight="700"> laisser</tspan><tspan font-weight="700"> mourir</tspan><tspan font-weight="700"> :</tspan><tspan font-weight="700"> une</tspan><tspan font-weight="700"> différence</tspan><tspan font-weight="700"> morale</tspan><tspan font-weight="700"> ?</tspan></text><text x="600.0" y="192.0" font-size="16" fill="#4b6380" text-anchor="middle">Rachels : pas de différence entre commission et omission → on juge autrement</text><rect x="30" y="270" width="555" height="563" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="54.0" y="308.0" font-size="20" fill="#1d4f9e"><tspan font-weight="700">PAR</tspan><tspan font-weight="700"> LES</tspan><tspan font-weight="700"> CONSÉQUENCES</tspan></text><text x="561.0" y="308.0" font-size="15" fill="#1d4f9e" text-anchor="end">utilitarisme</text><rect x="48" y="330" width="519" height="71" rx="12" fill="#ffffff" stroke="#bcd3f2" stroke-width="2"/><text x="68.0" y="357.0" font-size="17" fill="#1d4f9e"><tspan font-weight="700">Abréger</tspan><tspan font-weight="700"> les</tspan><tspan font-weight="700"> souffrances</tspan></text><text x="68.0" y="382.0" font-size="16" fill="#15385f">Laisser mourir peut être<tspan font-weight="700"> plus</tspan><tspan font-weight="700"> cruel</tspan> que donner la mort.</text><rect x="48" y="413" width="519" height="126" rx="12" fill="#ffffff" stroke="#bcd3f2" stroke-width="2"/><text x="68.0" y="440.0" font-size="17" fill="#1d4f9e"><tspan font-weight="700">Calcul</tspan><tspan font-weight="700"> des</tspan><tspan font-weight="700"> chances</tspan></text><text x="68.0" y="465.0" font-size="16" fill="#15385f">Pronostic et geste<tspan font-weight="700"> incertains</tspan> ; pari de Pascal : la vie est</text><text x="68.0" y="486.0" font-size="16" fill="#15385f"><tspan font-weight="700">incommensurable</tspan>.</text><path d="M68,499 V519" stroke="#1d4f9e" stroke-width="3" stroke-linecap="round"/><text x="80.0" y="511.0" font-size="15" fill="#4b6380">Réponse : risque d’<tspan font-weight="700">immobilisme</tspan> ; vaudrait aussi pour l’<tspan font-weight="700">abstention</tspan>.</text><rect x="48" y="551" width="519" height="146" rx="12" fill="#ffffff" stroke="#bcd3f2" stroke-width="2"/><text x="68.0" y="578.0" font-size="17" fill="#1d4f9e"><tspan font-weight="700">Pente</tspan><tspan font-weight="700"> glissante</tspan></text><text x="68.0" y="603.0" font-size="16" fill="#15385f">Logique (<tspan font-weight="700">concept</tspan><tspan font-weight="700"> vague</tspan>), psychologique (<tspan font-weight="700">érosion</tspan><tspan font-weight="700"> du</tspan><tspan font-weight="700"> sens</tspan></text><text x="68.0" y="624.0" font-size="16" fill="#15385f"><tspan font-weight="700">moral</tspan>), argumentative (mêmes raisons).</text><path d="M68,637 V677" stroke="#1d4f9e" stroke-width="3" stroke-linecap="round"/><text x="80.0" y="649.0" font-size="15" fill="#4b6380">Réponse : poser une<tspan font-weight="700"> limite</tspan> (consentement explicite) ; montrer le</text><text x="80.0" y="669.0" font-size="15" fill="#4b6380"><tspan font-weight="700">mécanisme</tspan> (critères de<tspan font-weight="700"> Bok</tspan>).</text><rect x="48" y="709" width="519" height="92" rx="12" fill="#ffffff" stroke="#bcd3f2" stroke-width="2"/><text x="68.0" y="736.0" font-size="17" fill="#1d4f9e"><tspan font-weight="700">Utilitarisme</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> la</tspan><tspan font-weight="700"> règle</tspan></text><text x="68.0" y="761.0" font-size="16" fill="#15385f"><tspan font-weight="700">Beauchamp</tspan> : garder l’interdit de l’homicide, dont l’adoption a les</text><text x="68.0" y="782.0" font-size="16" fill="#15385f">meilleures conséquences.</text><rect x="615" y="270" width="555" height="563" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="639.0" y="308.0" font-size="20" fill="#5b3db8"><tspan font-weight="700">PAR</tspan><tspan font-weight="700"> LES</tspan><tspan font-weight="700"> INTENTIONS</tspan></text><text x="1146.0" y="308.0" font-size="15" fill="#5b3db8" text-anchor="end">déontologie</text><rect x="633" y="330" width="519" height="126" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="653.0" y="357.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">Double</tspan><tspan font-weight="700"> effet</tspan></text><text x="653.0" y="382.0" font-size="16" fill="#15385f"><tspan font-weight="700">Thomas</tspan><tspan font-weight="700"> d’Aquin</tspan> : soulager au risque d’abréger la vie (morphine)</text><text x="653.0" y="403.0" font-size="16" fill="#15385f">≠ tuer (chlorure de potassium).</text><path d="M653,416 V436" stroke="#5b3db8" stroke-width="3" stroke-linecap="round"/><text x="665.0" y="428.0" font-size="15" fill="#4b6380">Fondait la loi<tspan font-weight="700"> Claeys-Leonetti</tspan> (2016).</text><rect x="633" y="468" width="519" height="92" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="653.0" y="495.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">Quatre</tspan><tspan font-weight="700"> conditions</tspan><tspan font-weight="700"> (Foot)</tspan></text><text x="653.0" y="520.0" font-size="16" fill="#15385f">Acte<tspan font-weight="700"> bon</tspan><tspan font-weight="700"> ou</tspan><tspan font-weight="700"> neutre</tspan> ; le mal n’est<tspan font-weight="700"> pas</tspan><tspan font-weight="700"> un</tspan><tspan font-weight="700"> moyen</tspan> ; il est seulement</text><text x="653.0" y="541.0" font-size="16" fill="#15385f"><tspan font-weight="700">prévu</tspan><tspan font-weight="700"> ou</tspan><tspan font-weight="700"> toléré</tspan> ;<tspan font-weight="700"> proportionnalité</tspan>.</text><rect x="633" y="572" width="519" height="105" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="653.0" y="599.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">Critique</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> Foot</tspan></text><text x="653.0" y="624.0" font-size="16" fill="#15385f">Les<tspan font-weight="700"> intentions</tspan> sont opaques (tribunal, mauvaise foi).</text><path d="M653,637 V657" stroke="#5b3db8" stroke-width="3" stroke-linecap="round"/><text x="665.0" y="649.0" font-size="15" fill="#4b6380">Autre clé : obligations<tspan font-weight="700"> négatives</tspan> &gt;<tspan font-weight="700"> positives</tspan> (pont ≠ aiguillage).</text><rect x="633" y="689" width="519" height="126" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="653.0" y="716.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">Euthanasie</tspan></text><text x="653.0" y="741.0" font-size="16" fill="#15385f">Aider et ne pas nuire visent<tspan font-weight="700"> le</tspan><tspan font-weight="700"> même</tspan><tspan font-weight="700"> patient</tspan> : bienfaisance contre</text><text x="653.0" y="762.0" font-size="16" fill="#15385f">non-malfaisance.</text><path d="M653,775 V795" stroke="#5b3db8" stroke-width="3" stroke-linecap="round"/><text x="665.0" y="787.0" font-size="15" fill="#4b6380"><tspan font-weight="700">Primum</tspan><tspan font-weight="700"> non</tspan><tspan font-weight="700"> nocere</tspan> : la non-malfaisance prime.</text><path d="M380,216 C380,236 300,246 300,262" fill="none" stroke="#1d4f9e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-1d4f9e)"/><path d="M820,216 C820,236 900,246 900,262" fill="none" stroke="#5b3db8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-5b3db8)"/><rect x="30" y="855" width="1140" height="60" rx="14" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="600.0" y="892.0" font-size="17" fill="#15385f" text-anchor="middle">Le cours ne tranche pas : il apprend à classer les arguments et à les évaluer</text></svg>