<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 520" aria-label="Réglette de concentration de l’apixaban : inefficace sous 30 ng/mL, zone thérapeutique de 30 à 450, toxique au-delà ; un patient à 250"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif;fill:#15385f}.title{fill:#fff;font-size:32px;font-weight:800}.sub{fill:#c6e4ee;font-size:16px}.h{font-size:18px;font-weight:800}.p{font-size:15px}.s{font-size:13px}.ax{stroke:#15385f;stroke-width:2.5;fill:none}.grid{stroke:#d5e3ee;stroke-width:1}.dash{stroke:#3c7b9d;stroke-width:2;stroke-dasharray:7 6;fill:none}</style><rect x="0" y="0" width="1200" height="520" rx="26" fill="#eef5fb"/><path d="M0 28Q0 0 28 0H1172Q1200 0 1200 28V108H0Z" fill="#123257"/><text x="42" y="48" class="title">Un dosage sans seuil ne veut rien dire</text><text x="42" y="80" class="sub">Il faut une borne inférieure et une borne supérieure pour interpréter une concentration</text><rect x="30" y="128" width="1140" height="362" rx="20" fill="#fff" stroke="#caddea" stroke-width="2"/><rect x="110" y="260" width="49.0" height="80" fill="#d6e4f0"/><rect x="159.0" y="260" width="686.0" height="80" fill="#cfead5"/><rect x="845.0" y="260" width="245.0" height="80" fill="#f6d0c8"/><rect x="110" y="260" width="980" height="80" fill="none" stroke="#15385f" stroke-width="2"/><text x="116" y="242" class="h">inefficace</text><text x="502.0" y="306" class="h" text-anchor="middle">zone thérapeutique</text><text x="967.5" y="306" class="h" text-anchor="middle" fill="#a1301f">toxique</text><line x1="159.0" y1="248" x2="159.0" y2="352" stroke="#15385f" stroke-width="3"/><text x="159.0" y="376" class="p" text-anchor="middle">borne inférieure : 30 ng/mL</text><line x1="845.0" y1="248" x2="845.0" y2="352" stroke="#15385f" stroke-width="3"/><text x="845.0" y="376" class="p" text-anchor="middle">borne supérieure : 450 ng/mL</text><path d="M518.3 256l-11 -22h22z" fill="#e8743b"/><text x="518.3" y="226" class="h" text-anchor="middle">patient : 250 ng/mL</text><text x="110" y="420" class="p"><tspan font-weight="800">Apixaban</tspan> : à 250 ng/mL le médicament est efficace → saignement important attendu → on diffère l’opération.</text><text x="110" y="450" class="p"><tspan font-weight="800">Sans bornes connues</tspan> (ex. rétatrutide), le dosage dit seulement présence ou absence, pas toxique ou non.</text></svg>