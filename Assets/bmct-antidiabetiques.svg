<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756" role="img" aria-label="Antidiabétiques : cellule bêta, intestin, muscle, rein"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="756" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Où agissent les antidiabétiques ?</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Type 2 : plus d’insuline, moins d’insulinorésistance, moins de glucose</text><rect x="30" y="124" width="550" height="252" rx="16" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="54.0" y="162.0" font-size="20" fill="#8a5206"><tspan font-weight="700">CELLULE</tspan><tspan font-weight="700"> BÊTA</tspan><tspan font-weight="700"> (pancréas)</tspan></text><text x="54.0" y="194.0" font-size="16" fill="#4b6380">Le glucose<tspan font-weight="700"> dépolarise</tspan> la cellule : le Ca²⁺ entre →<tspan font-weight="700"> sécrétion</tspan></text><text x="54.0" y="215.0" font-size="16" fill="#4b6380"><tspan font-weight="700">d’insuline</tspan>.</text><rect x="48" y="236" width="514" height="60" rx="10" fill="#ffffff" stroke="#f0d39a" stroke-width="2"/><text x="66.0" y="258.0" font-size="16" fill="#15385f"><tspan font-weight="700">Sulfonylurées</tspan> et<tspan font-weight="700"> glinides</tspan> (répaglinide) : bloquent les<tspan font-weight="700"> canaux</tspan><tspan font-weight="700"> K⁺</tspan></text><text x="66.0" y="279.0" font-size="16" fill="#15385f"><tspan font-weight="700">ATP-dépendants</tspan> → insulinosécrétion</text><rect x="620" y="124" width="550" height="252" rx="16" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><text x="644.0" y="162.0" font-size="20" fill="#0f6e51"><tspan font-weight="700">INTESTIN</tspan></text><text x="644.0" y="194.0" font-size="16" fill="#4b6380">Les alpha-glucosidases libèrent le glucose ;<tspan font-weight="700"> GLP-1</tspan> et<tspan font-weight="700"> GIP</tspan> stimulent</text><text x="644.0" y="215.0" font-size="16" fill="#4b6380">l’insuline et sont dégradés par la<tspan font-weight="700"> DPP-4</tspan>.</text><rect x="638" y="236" width="514" height="60" rx="10" fill="#ffffff" stroke="#b8dfc7" stroke-width="2"/><text x="656.0" y="258.0" font-size="16" fill="#15385f"><tspan font-weight="700">Inhibiteurs</tspan><tspan font-weight="700"> des</tspan><tspan font-weight="700"> alpha-glucosidases</tspan> : moins d’absorption du</text><text x="656.0" y="279.0" font-size="16" fill="#15385f">glucose</text><rect x="638" y="306" width="514" height="60" rx="10" fill="#ffffff" stroke="#b8dfc7" stroke-width="2"/><text x="656.0" y="328.0" font-size="16" fill="#15385f"><tspan font-weight="700">Analogues</tspan><tspan font-weight="700"> du</tspan><tspan font-weight="700"> GLP-1</tspan> (sous-cutanés) ;<tspan font-weight="700"> gliptines</tspan> = anti-DPP-4</text><text x="656.0" y="349.0" font-size="16" fill="#15385f">(orales) → plus de GLP-1</text><rect x="30" y="400" width="550" height="252" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="54.0" y="438.0" font-size="20" fill="#1d4f9e"><tspan font-weight="700">MUSCLE</tspan><tspan font-weight="700"> :</tspan><tspan font-weight="700"> INSULINORÉSISTANCE</tspan></text><text x="54.0" y="470.0" font-size="16" fill="#4b6380">Les muscles portent les récepteurs à l’insuline.</text><rect x="48" y="491" width="514" height="60" rx="10" fill="#ffffff" stroke="#bcd3f2" stroke-width="2"/><text x="66.0" y="513.0" font-size="16" fill="#15385f"><tspan font-weight="700">Metformine</tspan> (biguanide) : ↓ insulinorésistance, ↑ captation</text><text x="66.0" y="534.0" font-size="16" fill="#15385f">musculaire du glucose ; le meilleur antidiabétique oral du type 2</text><rect x="48" y="561" width="514" height="39" rx="10" fill="#ffffff" stroke="#bcd3f2" stroke-width="2"/><text x="66.0" y="583.0" font-size="16" fill="#15385f"><tspan font-weight="700">Glitazones</tspan> : agonistes<tspan font-weight="700"> PPAR-γ</tspan> (abandonnées)</text><rect x="620" y="400" width="550" height="252" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="644.0" y="438.0" font-size="20" fill="#5b3db8"><tspan font-weight="700">REIN</tspan></text><text x="644.0" y="470.0" font-size="16" fill="#4b6380">Le glucose filtré est réabsorbé par le cotransport sodium-glucose.</text><rect x="638" y="491" width="514" height="60" rx="10" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="656.0" y="513.0" font-size="16" fill="#15385f"><tspan font-weight="700">Gliflozines</tspan> = inhibiteurs du<tspan font-weight="700"> SGLT2</tspan> : le glucose part dans les</text><text x="656.0" y="534.0" font-size="16" fill="#15385f">urines (<tspan font-weight="700">glycosurie</tspan>)</text><circle cx="600" cy="388" r="58" fill="#123257" stroke="#ffffff" stroke-width="6"/><text x="600.0" y="382.0" font-size="17" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">Glycémie</tspan></text><text x="600.0" y="406.0" font-size="22" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">↓</tspan></text><rect x="30" y="672" width="1140" height="60" rx="14" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="600.0" y="709.0" font-size="16" fill="#15385f" text-anchor="middle">Metformine :<tspan font-weight="700"> acidose</tspan><tspan font-weight="700"> lactique</tspan> si déshydratation → réhydrater, arrêter · Type 1 :<tspan font-weight="700"> insuline</tspan> · Glucocorticoïdes : diabète iatrogène</text></svg>