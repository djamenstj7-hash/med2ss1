<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-label="Portes d’entrée des virus : infections localisées ou généralisées, avec leurs exemples"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-0f6466" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f6466"/></marker><marker id="arr-b52a35" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b52a35"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="770" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Les portes d’entrée des virus</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Une infection qui reste sur place, ou un tremplin vers une infection généralisée</text><text x="48.0" y="150.0" font-size="16" fill="#4b6380"><tspan font-weight="700">PORTE</tspan><tspan font-weight="700"> D’ENTRÉE</tspan></text><rect x="330" y="124" width="410" height="40" rx="20" fill="#e1f3f3" stroke="#a9d8d8" stroke-width="2"/><text x="535.0" y="150.0" font-size="16" fill="#0f6466" text-anchor="middle"><tspan font-weight="700">L’INFECTION</tspan><tspan font-weight="700"> RESTE</tspan><tspan font-weight="700"> LOCALE</tspan></text><rect x="754" y="124" width="416" height="40" rx="20" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="962.0" y="150.0" font-size="16" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">L’INFECTION</tspan><tspan font-weight="700"> SE</tspan><tspan font-weight="700"> GÉNÉRALISE</tspan></text><rect x="30" y="178" width="286" height="76" rx="14" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><rect x="330" y="178" width="410" height="76" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><rect x="754" y="178" width="416" height="76" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="50.0" y="211.0" font-size="19" fill="#1d4f9e"><tspan font-weight="700">Respiratoire</tspan></text><text x="50.0" y="235.0" font-size="14" fill="#4b6380">Gouttelettes, aérosols</text><text x="350.0" y="211.0" font-size="16" fill="#15385f"><tspan font-weight="700">Rhinovirus</tspan>,<tspan font-weight="700"> grippe</tspan>,<tspan font-weight="700"> parainfluenza</tspan>,<tspan font-weight="700"> VRS</tspan> : fièvre,</text><text x="350.0" y="232.0" font-size="16" fill="#15385f">toux, dyspnée</text><text x="774.0" y="211.0" font-size="16" fill="#15385f"><tspan font-weight="700">Rubéole</tspan>,<tspan font-weight="700"> oreillons</tspan>,<tspan font-weight="700"> rougeole</tspan>,<tspan font-weight="700"> VZV</tspan>,<tspan font-weight="700"> parvovirus</tspan></text><text x="774.0" y="232.0" font-size="16" fill="#15385f"><tspan font-weight="700">B19</tspan>,<tspan font-weight="700"> hantavirus</tspan>, sans signes respiratoires</text><rect x="30" y="266" width="286" height="94" rx="14" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><rect x="330" y="266" width="410" height="94" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><rect x="754" y="266" width="416" height="94" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="50.0" y="299.0" font-size="19" fill="#8a5206"><tspan font-weight="700">Digestive</tspan></text><text x="50.0" y="323.0" font-size="14" fill="#4b6380">Virus nus, résistants à l’acide et à la</text><text x="50.0" y="341.0" font-size="14" fill="#4b6380">bile</text><text x="350.0" y="308.0" font-size="16" fill="#15385f">Gastro-entérites :<tspan font-weight="700"> rotavirus</tspan>,<tspan font-weight="700"> adénovirus</tspan>,</text><text x="350.0" y="329.0" font-size="16" fill="#15385f"><tspan font-weight="700">astrovirus</tspan>,<tspan font-weight="700"> calicivirus</tspan></text><text x="774.0" y="308.0" font-size="16" fill="#15385f"><tspan font-weight="700">Hépatite</tspan><tspan font-weight="700"> A</tspan> (foie),<tspan font-weight="700"> entérovirus</tspan> ;<tspan font-weight="700"> poliovirus</tspan> :</text><text x="774.0" y="329.0" font-size="16" fill="#15385f">ganglions → sang → moelle</text><rect x="30" y="372" width="286" height="54" rx="14" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><rect x="330" y="372" width="410" height="54" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><rect x="754" y="372" width="416" height="54" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="50.0" y="405.0" font-size="19" fill="#5b3db8"><tspan font-weight="700">Bouche</tspan></text><text x="350.0" y="404.5" font-size="16" fill="#15385f"><tspan font-weight="700">HSV</tspan></text><text x="774.0" y="404.5" font-size="16" fill="#15385f"><tspan font-weight="700">CMV</tspan>,<tspan font-weight="700"> EBV</tspan>,<tspan font-weight="700"> HHV-6</tspan>,<tspan font-weight="700"> HHV-7</tspan></text><rect x="30" y="438" width="286" height="76" rx="14" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><rect x="330" y="438" width="410" height="76" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><rect x="754" y="438" width="416" height="76" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="50.0" y="471.0" font-size="19" fill="#0f6e51"><tspan font-weight="700">Peau</tspan><tspan font-weight="700"> lésée</tspan></text><text x="50.0" y="495.0" font-size="14" fill="#4b6380">La peau saine, kératinisée, protège</text><text x="350.0" y="471.0" font-size="16" fill="#15385f">Verrues (<tspan font-weight="700">papillomavirus</tspan>),<tspan font-weight="700"> poxvirus</tspan> (orf, nodule</text><text x="350.0" y="492.0" font-size="16" fill="#15385f">des trayeurs)</text><text x="774.0" y="471.0" font-size="16" fill="#15385f">Piqûre (<tspan font-weight="700">dengue</tspan>,<tspan font-weight="700"> fièvre</tspan><tspan font-weight="700"> jaune</tspan>), aiguille souillée (<tspan font-weight="700">VIH</tspan>,</text><text x="774.0" y="492.0" font-size="16" fill="#15385f"><tspan font-weight="700">VHC</tspan>), morsure (<tspan font-weight="700">rage</tspan>, voie nerveuse)</text><rect x="30" y="526" width="286" height="54" rx="14" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><rect x="330" y="526" width="410" height="54" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><rect x="754" y="526" width="416" height="54" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="50.0" y="559.0" font-size="19" fill="#b52a35"><tspan font-weight="700">Muqueuse</tspan><tspan font-weight="700"> génitale</tspan></text><text x="350.0" y="558.5" font-size="16" fill="#15385f"><tspan font-weight="700">HPV</tspan> (cancer du col),<tspan font-weight="700"> herpès</tspan><tspan font-weight="700"> génital</tspan></text><text x="774.0" y="558.5" font-size="16" fill="#15385f"><tspan font-weight="700">VIH</tspan>,<tspan font-weight="700"> VHB</tspan>,<tspan font-weight="700"> HTLV</tspan>,<tspan font-weight="700"> CMV</tspan></text><rect x="30" y="592" width="286" height="76" rx="14" fill="#e1f3f3" stroke="#a9d8d8" stroke-width="2"/><rect x="330" y="592" width="410" height="76" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><rect x="754" y="592" width="416" height="76" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="50.0" y="625.0" font-size="19" fill="#0f6466"><tspan font-weight="700">Conjonctive</tspan></text><text x="50.0" y="649.0" font-size="14" fill="#4b6380">Très exposée aux aérosols</text><text x="350.0" y="635.5" font-size="16" fill="#15385f"><tspan font-weight="700">Herpès</tspan>,<tspan font-weight="700"> adénovirus</tspan></text><text x="774.0" y="635.5" font-size="16" fill="#15385f"><tspan font-weight="700">Rougeole</tspan></text><rect x="30" y="686" width="1140" height="60" rx="14" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="600.0" y="723.0" font-size="16" fill="#15385f" text-anchor="middle">Porte d’entrée ≠ organe malade : la<tspan font-weight="700"> polio</tspan> entre par le tube digestif et donne des<tspan font-weight="700"> paralysies</tspan>, sans signe digestif</text></svg>