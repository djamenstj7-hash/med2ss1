<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 818" width="1200" height="818" role="img" aria-label="Comparaison des effets indésirables attendus (type A) et inattendus (type B), et critères de gravité"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-5b3db8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b3db8"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="818" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Effet indésirable attendu ou inattendu</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Ce qui les distingue, ce qui fait la gravité, et pourquoi un effet non grave compte aussi</text><rect x="210" y="124" width="470" height="64" rx="14" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="228.0" y="153.0" font-size="19" fill="#1d4f9e"><tspan font-weight="700">ATTENDU</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> type</tspan><tspan font-weight="700"> A</tspan></text><text x="228.0" y="176.0" font-size="15" fill="#4b6380">connu, décrit dans le RCP</text><rect x="694" y="124" width="476" height="64" rx="14" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="712.0" y="153.0" font-size="19" fill="#8a5206"><tspan font-weight="700">INATTENDU</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> type</tspan><tspan font-weight="700"> B</tspan></text><text x="712.0" y="176.0" font-size="15" fill="#4b6380">inconnu à la mise sur le marché</text><rect x="30" y="200" width="1140" height="68" rx="12" fill="#ffffff" stroke="#c8dceb" stroke-width="1.5"/><path d="M204,208 V260 M687,208 V260" stroke="#c8dceb" stroke-width="1.5"/><text x="46.0" y="230.0" font-size="16" fill="#123257"><tspan font-weight="700">Connu</tspan><tspan font-weight="700"> ?</tspan></text><text x="228.0" y="230.0" font-size="16" fill="#15385f">Oui : vu dans les<tspan font-weight="700"> essais</tspan>, connu<tspan font-weight="700"> avant</tspan> la commercialisation,</text><text x="228.0" y="251.0" font-size="16" fill="#15385f">inscrit au<tspan font-weight="700"> RCP</tspan> et dans la monographie.</text><text x="712.0" y="230.0" font-size="16" fill="#15385f">Non : découvert<tspan font-weight="700"> après</tspan> la commercialisation, absent du RCP.</text><rect x="30" y="276" width="1140" height="47" rx="12" fill="#ffffff" stroke="#c8dceb" stroke-width="1.5"/><path d="M204,284 V315 M687,284 V315" stroke="#c8dceb" stroke-width="1.5"/><text x="46.0" y="306.0" font-size="16" fill="#123257"><tspan font-weight="700">Fréquence</tspan></text><text x="228.0" y="306.0" font-size="16" fill="#15385f">Le plus souvent<tspan font-weight="700"> fréquent</tspan>.</text><text x="712.0" y="306.0" font-size="16" fill="#15385f"><tspan font-weight="700">Rare</tspan> : il faut beaucoup de patients traités pour le voir.</text><rect x="30" y="331" width="1140" height="47" rx="12" fill="#ffffff" stroke="#c8dceb" stroke-width="1.5"/><path d="M204,339 V370 M687,339 V370" stroke="#c8dceb" stroke-width="1.5"/><text x="46.0" y="361.0" font-size="16" fill="#123257"><tspan font-weight="700">Gravité</tspan></text><text x="228.0" y="361.0" font-size="16" fill="#15385f">Souvent<tspan font-weight="700"> peu</tspan><tspan font-weight="700"> grave</tspan>… mais<tspan font-weight="700"> parfois</tspan><tspan font-weight="700"> grave</tspan> : on le connaît.</text><text x="712.0" y="361.0" font-size="16" fill="#15385f">Souvent<tspan font-weight="700"> grave</tspan>.</text><rect x="30" y="386" width="1140" height="47" rx="12" fill="#ffffff" stroke="#c8dceb" stroke-width="1.5"/><path d="M204,394 V425 M687,394 V425" stroke="#c8dceb" stroke-width="1.5"/><text x="46.0" y="416.0" font-size="16" fill="#123257"><tspan font-weight="700">Mécanisme</tspan></text><text x="228.0" y="416.0" font-size="16" fill="#15385f">Lié au<tspan font-weight="700"> mécanisme</tspan><tspan font-weight="700"> d’action</tspan>, souvent<tspan font-weight="700"> dose-dépendant</tspan>.</text><text x="712.0" y="416.0" font-size="16" fill="#15385f"><tspan font-weight="700">Pas</tspan> d’explication pharmacologique, souvent inexpliqué.</text><rect x="30" y="441" width="1140" height="68" rx="12" fill="#ffffff" stroke="#c8dceb" stroke-width="1.5"/><path d="M204,449 V501 M687,449 V501" stroke="#c8dceb" stroke-width="1.5"/><text x="46.0" y="471.0" font-size="16" fill="#123257"><tspan font-weight="700">Que</tspan><tspan font-weight="700"> faire</tspan><tspan font-weight="700"> ?</tspan></text><text x="228.0" y="471.0" font-size="16" fill="#15385f">Connaître ses<tspan font-weight="700"> conditions</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> survenue</tspan> pour le<tspan font-weight="700"> prévenir</tspan> : il</text><text x="228.0" y="492.0" font-size="16" fill="#15385f">peut souvent l’être.</text><text x="712.0" y="471.0" font-size="16" fill="#15385f">Le<tspan font-weight="700"> repérer</tspan> : la pharmacovigilance rassemble les cas</text><text x="712.0" y="492.0" font-size="16" fill="#15385f">dispersés.</text><rect x="30" y="517" width="1140" height="89" rx="12" fill="#ffffff" stroke="#c8dceb" stroke-width="1.5"/><path d="M204,525 V598 M687,525 V598" stroke="#c8dceb" stroke-width="1.5"/><text x="46.0" y="547.0" font-size="16" fill="#123257"><tspan font-weight="700">Exemples</tspan></text><text x="228.0" y="547.0" font-size="16" fill="#15385f"><tspan font-weight="700">Hémorragie</tspan> sous anticoagulant ; risque<tspan font-weight="700"> digestif</tspan> des AINS.</text><text x="712.0" y="547.0" font-size="16" fill="#15385f"><tspan font-weight="700">Myocardites</tspan> et<tspan font-weight="700"> thrombopénies</tspan><tspan font-weight="700"> thrombosantes</tspan></text><text x="712.0" y="568.0" font-size="16" fill="#15385f">découvertes en vie réelle avec des vaccins contre la</text><text x="712.0" y="589.0" font-size="16" fill="#15385f">Covid-19.</text><rect x="30" y="620" width="1140" height="58" rx="14" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><rect x="50" y="632" width="136" height="34" rx="17.0" fill="#ffffff" stroke="#8a5206" stroke-width="2.5"/><text x="118.0" y="654.8" font-size="16" fill="#8a5206" text-anchor="middle"><tspan font-weight="700">inattendu</tspan></text><path d="M196,649 L252,649" fill="none" stroke="#5b3db8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-5b3db8)"/><rect x="262" y="632" width="118" height="34" rx="17.0" fill="#ffffff" stroke="#1d4f9e" stroke-width="2.5"/><text x="321.0" y="654.8" font-size="16" fill="#1d4f9e" text-anchor="middle"><tspan font-weight="700">attendu</tspan></text><text x="402.0" y="655.0" font-size="16" fill="#15385f">Un effet qui se répète devient attendu une fois<tspan font-weight="700"> connu</tspan><tspan font-weight="700"> et</tspan><tspan font-weight="700"> inscrit</tspan><tspan font-weight="700"> au</tspan><tspan font-weight="700"> RCP</tspan> (vaccins contre la Covid-19).</text><rect x="30" y="692" width="1140" height="100" rx="14" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="50.0" y="722.0" font-size="16" fill="#b52a35"><tspan font-weight="700">LA</tspan><tspan font-weight="700"> GRAVITÉ</tspan></text><text x="50.0" y="746.0" font-size="16" fill="#15385f"><tspan font-weight="700">Grave</tspan> : létal, menace vitale, invalidité ou incapacité, hospitalisation — ce</text><text x="50.0" y="767.0" font-size="16" fill="#15385f">qui mène à l’hôpital ou en réanimation.</text><text x="620.0" y="746.0" font-size="16" fill="#15385f"><tspan font-weight="700">Non</tspan><tspan font-weight="700"> grave</tspan> (nausées, vomissements, chute des cheveux…) ne veut pas</text><text x="620.0" y="767.0" font-size="16" fill="#15385f">dire<tspan font-weight="700"> sans</tspan><tspan font-weight="700"> conséquence</tspan> : gêne,<tspan font-weight="700"> non-observance</tspan>, refus de soin.</text></svg>