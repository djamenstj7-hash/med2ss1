<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-label="Récepteurs plaquettaires de l’adhésion, de l’amplification et de l’agrégation, et cibles des antiplaquettaires"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-b52a35" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b52a35"/></marker><marker id="arr-5b3db8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b3db8"/></marker><marker id="arr-1d4f9e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1d4f9e"/></marker><marker id="arr-0f6466" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f6466"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="730" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">La plaquette : récepteurs, ligands, antiplaquettaires</text><text x="40" y="83" font-size="17" fill="#c6e4ee">GPIb et GPVI font adhérer, ADP, TXA2 et thrombine amplifient, αIIbβ3 agrège</text><rect x="30" y="124" width="364" height="500" rx="16" fill="#e1f3f3" stroke="#a9d8d8" stroke-width="2"/><text x="52.0" y="162.0" font-size="19" fill="#0f6466"><tspan font-weight="700">ADHÉSION</tspan></text><text x="52.0" y="186.0" font-size="15" fill="#4b6380">au sous-endothélium exposé</text><rect x="418" y="124" width="364" height="500" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="440.0" y="162.0" font-size="19" fill="#5b3db8"><tspan font-weight="700">ACTIVATION,</tspan><tspan font-weight="700"> AMPLIFICATION</tspan></text><text x="440.0" y="186.0" font-size="15" fill="#4b6380">recruter les plaquettes voisines</text><rect x="806" y="124" width="364" height="500" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="828.0" y="162.0" font-size="19" fill="#1d4f9e"><tspan font-weight="700">AGRÉGATION</tspan></text><text x="828.0" y="186.0" font-size="15" fill="#4b6380">souder les plaquettes entre elles</text><path d="M397,156 L413,156" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M785,156 L801,156" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="48" y="208" width="328" height="64" rx="12" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="64.0" y="235.0" font-size="16" fill="#15385f"><tspan font-weight="700">Collagène</tspan></text><path d="M64,250 L150,250" fill="none" stroke="#0f6466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6466)"/><text x="160.0" y="256.0" font-size="17" fill="#0f6466"><tspan font-weight="700">GPVI</tspan></text><rect x="48" y="284" width="328" height="106" rx="12" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="64.0" y="311.0" font-size="16" fill="#15385f"><tspan font-weight="700">Facteur</tspan><tspan font-weight="700"> Willebrand</tspan></text><path d="M64,326 L150,326" fill="none" stroke="#0f6466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6466)"/><text x="160.0" y="332.0" font-size="17" fill="#0f6466"><tspan font-weight="700">GPIbα</tspan></text><text x="64.0" y="356.0" font-size="14" fill="#4b6380">complexe GPIb-IX-V : le récepteur clé de</text><text x="64.0" y="374.0" font-size="14" fill="#4b6380">l’adhésion</text><text x="52.0" y="424.0" font-size="16" fill="#15385f">La signalisation qui suit mobilise le<tspan font-weight="700"> calcium</tspan>,</text><text x="52.0" y="445.0" font-size="16" fill="#15385f">fait libérer<tspan font-weight="700"> ADP</tspan> et<tspan font-weight="700"> TXA2</tspan>, et fait passer</text><text x="52.0" y="466.0" font-size="16" fill="#15385f"><tspan font-weight="700">αIIbβ3</tspan> en<tspan font-weight="700"> forte</tspan><tspan font-weight="700"> affinité</tspan>.</text><text x="52.0" y="501.0" font-size="15" fill="#4b6380">Endothélium<tspan font-weight="700"> sain</tspan> : antithrombotique, aucune</text><text x="52.0" y="521.0" font-size="15" fill="#4b6380">adhésion.</text><rect x="436" y="208" width="328" height="64" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="452.0" y="235.0" font-size="16" fill="#15385f"><tspan font-weight="700">ADP</tspan></text><path d="M452,250 L538,250" fill="none" stroke="#5b3db8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-5b3db8)"/><text x="548.0" y="256.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">P2Y12</tspan></text><rect x="635.2890625" y="221" width="109.421875" height="30" rx="15" fill="#ffffff" stroke="#b52a35" stroke-width="2"/><path d="M646.2890625,231 l10,10 m0,-10 l-10,10" stroke="#b52a35" stroke-width="2.6" stroke-linecap="round"/><text x="663.3" y="241.0" font-size="14" fill="#b52a35"><tspan font-weight="700">clopidogrel</tspan></text><rect x="436" y="284" width="328" height="106" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="452.0" y="311.0" font-size="16" fill="#15385f"><tspan font-weight="700">Thromboxane</tspan><tspan font-weight="700"> A2</tspan></text><path d="M452,326 L538,326" fill="none" stroke="#5b3db8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-5b3db8)"/><text x="548.0" y="332.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">TP</tspan></text><text x="452.0" y="356.0" font-size="14" fill="#4b6380">formé par la COX-1 à partir de l’acide</text><text x="452.0" y="374.0" font-size="14" fill="#4b6380">arachidonique</text><rect x="660.1640625" y="297" width="87.671875" height="30" rx="15" fill="#ffffff" stroke="#b52a35" stroke-width="2"/><path d="M671.1640625,307 l10,10 m0,-10 l-10,10" stroke="#b52a35" stroke-width="2.6" stroke-linecap="round"/><text x="688.2" y="317.0" font-size="14" fill="#b52a35"><tspan font-weight="700">aspirine</tspan></text><rect x="436" y="402" width="328" height="106" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="452.0" y="429.0" font-size="16" fill="#15385f"><tspan font-weight="700">Thrombine</tspan><tspan font-weight="700"> (IIa)</tspan></text><path d="M452,444 L538,444" fill="none" stroke="#5b3db8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-5b3db8)"/><text x="548.0" y="450.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">PAR-1</tspan></text><text x="452.0" y="474.0" font-size="14" fill="#4b6380">le plus puissant activateur : pont avec la</text><text x="452.0" y="492.0" font-size="14" fill="#4b6380">coagulation</text><text x="440.0" y="536.0" font-size="15" fill="#15385f">Pseudopodes,<tspan font-weight="700"> sécrétion</tspan> des granules denses</text><text x="440.0" y="556.0" font-size="15" fill="#15385f">et alpha,<tspan font-weight="700"> phospholipides</tspan><tspan font-weight="700"> anioniques</tspan></text><text x="440.0" y="576.0" font-size="15" fill="#15385f">exposés : la plaquette devient procoagulante.</text><rect x="824" y="208" width="328" height="88" rx="12" fill="#ffffff" stroke="#bcd3f2" stroke-width="2"/><text x="840.0" y="235.0" font-size="16" fill="#15385f"><tspan font-weight="700">Fibrinogène</tspan></text><path d="M840,250 L926,250" fill="none" stroke="#1d4f9e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-1d4f9e)"/><text x="936.0" y="256.0" font-size="17" fill="#1d4f9e"><tspan font-weight="700">αIIbβ3</tspan></text><text x="840.0" y="280.0" font-size="14" fill="#4b6380">surtout ; ancienne nomenclature GPIIb-IIIa</text><rect x="824" y="308" width="328" height="88" rx="12" fill="#ffffff" stroke="#bcd3f2" stroke-width="2"/><text x="840.0" y="335.0" font-size="16" fill="#15385f"><tspan font-weight="700">Facteur</tspan><tspan font-weight="700"> Willebrand</tspan></text><path d="M840,350 L926,350" fill="none" stroke="#1d4f9e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-1d4f9e)"/><text x="936.0" y="356.0" font-size="17" fill="#1d4f9e"><tspan font-weight="700">αIIbβ3</tspan></text><text x="840.0" y="380.0" font-size="14" fill="#4b6380">dans une moindre mesure</text><ellipse cx="916" cy="534" rx="56" ry="34" fill="#f4edfc" stroke="#5b3db8" stroke-width="2.5"/><ellipse cx="1066" cy="534" rx="56" ry="34" fill="#f4edfc" stroke="#5b3db8" stroke-width="2.5"/><path d="M968,520 C986,510 996,530 1014,520" stroke="#1d4f9e" stroke-width="3" fill="none"/><path d="M968,534 C986,524 996,544 1014,534" stroke="#1d4f9e" stroke-width="3" fill="none"/><path d="M968,548 C986,538 996,558 1014,548" stroke="#1d4f9e" stroke-width="3" fill="none"/><text x="991.0" y="596.0" font-size="14" fill="#1d4f9e" text-anchor="middle"><tspan font-weight="700">ponts</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> fibrinogène</tspan></text><rect x="30" y="646" width="1140" height="60" rx="14" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="600.0" y="683.0" font-size="16" fill="#15385f" text-anchor="middle">Aspirine :<tspan font-weight="700"> COX-1</tspan> bloquée, pas de TXA2 · Inhibiteurs de<tspan font-weight="700"> P2Y12</tspan> : clopidogrel, prasugrel, ticagrélor, cangrélor · aucun ne vise PAR-1</text></svg>