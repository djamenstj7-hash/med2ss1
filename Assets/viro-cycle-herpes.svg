<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 600" aria-label="Cycle de l’herpès en 8 étapes, du noyau au cytoplasme"><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="8" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif;fill:#15385f}.title{fill:#fff;font-size:32px;font-weight:800}.sub{fill:#c6e4ee;font-size:16px}.h{font-size:17px;font-weight:800}.p{font-size:14.5px}.n{fill:#fff;font-size:18px;font-weight:800}.arrow{stroke:#3c7b9d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect x="0" y="0" width="1200" height="600" rx="26" fill="#eef5fb"/><path d="M0 28Q0 0 28 0H1172Q1200 0 1200 28V108H0Z" fill="#123257"/><text x="42" y="48" class="title">Cycle de l’herpès (virus à ADN) en 8 temps</text><text x="42" y="80" class="sub">Pré-précoces = le moteur, précoces = copie du plan (ADN), tardives = la carrosserie (capside)</text><rect x="43" y="140" width="250" height="170" rx="16" fill="#e4f3e7" stroke="#9fd0aa" stroke-width="2"/><circle cx="71" cy="168" r="17" fill="#123257"/><text x="71" y="174" class="n" text-anchor="middle">1</text><text x="99" y="174" class="h">Attachement, fusion</text><text x="61" y="210" class="p">L’enveloppe fusionne</text><text x="61" y="232" class="p">avec la membrane</text><text x="61" y="254" class="p">cytoplasmique</text><rect x="331" y="140" width="250" height="170" rx="16" fill="#fff1d6" stroke="#f0c987" stroke-width="2"/><circle cx="359" cy="168" r="17" fill="#123257"/><text x="359" y="174" class="n" text-anchor="middle">2</text><text x="387" y="174" class="h">Entrée</text><text x="349" y="210" class="p">Capside + protéines de</text><text x="349" y="232" class="p">tégument et de matrice,</text><text x="349" y="254" class="p">dirigées vers le noyau</text><rect x="619" y="140" width="250" height="170" rx="16" fill="#e6e9fb" stroke="#a9b2e8" stroke-width="2"/><circle cx="647" cy="168" r="17" fill="#123257"/><text x="647" y="174" class="n" text-anchor="middle">3</text><text x="675" y="174" class="h">Décapsidation</text><text x="637" y="210" class="p">L’ADN passe les pores</text><text x="637" y="232" class="p">nucléaires et est</text><text x="637" y="254" class="p">transcrit en ARNm</text><rect x="907" y="140" width="250" height="170" rx="16" fill="#fff1d6" stroke="#f0c987" stroke-width="2"/><circle cx="935" cy="168" r="17" fill="#123257"/><text x="935" y="174" class="n" text-anchor="middle">4</text><text x="963" y="174" class="h">Sortie des ARNm</text><text x="925" y="210" class="p">Traduits dans le</text><text x="925" y="232" class="p">cytoplasme en protéines</text><text x="925" y="254" class="p">pré-précoces</text><rect x="907" y="380" width="250" height="170" rx="16" fill="#e6e9fb" stroke="#a9b2e8" stroke-width="2"/><circle cx="935" cy="408" r="17" fill="#123257"/><text x="935" y="414" class="n" text-anchor="middle">5</text><text x="963" y="414" class="h">Retour au noyau</text><text x="925" y="450" class="p">Les pré-précoces</text><text x="925" y="472" class="p">activent la transcription</text><text x="925" y="494" class="p">d’autres gènes viraux</text><rect x="619" y="380" width="250" height="170" rx="16" fill="#e6e9fb" stroke="#a9b2e8" stroke-width="2"/><circle cx="647" cy="408" r="17" fill="#123257"/><text x="647" y="414" class="n" text-anchor="middle">6</text><text x="675" y="414" class="h">Protéines précoces</text><text x="637" y="450" class="p">Elles copient l’ADN</text><text x="637" y="472" class="p">et lancent la</text><text x="637" y="494" class="p">transcription des tardifs</text><rect x="331" y="380" width="250" height="170" rx="16" fill="#fff1d6" stroke="#f0c987" stroke-width="2"/><circle cx="359" cy="408" r="17" fill="#123257"/><text x="359" y="414" class="n" text-anchor="middle">7</text><text x="387" y="414" class="h">Protéines tardives</text><text x="349" y="450" class="p">Elles forment les</text><text x="349" y="472" class="p">futures protéines</text><text x="349" y="494" class="p">de capside</text><rect x="43" y="380" width="250" height="170" rx="16" fill="#f6dccb" stroke="#e8a27c" stroke-width="2"/><circle cx="71" cy="408" r="17" fill="#123257"/><text x="71" y="414" class="n" text-anchor="middle">8</text><text x="99" y="414" class="h">Assemblage, sortie</text><text x="61" y="450" class="p">Capside assemblée,</text><text x="61" y="472" class="p">enveloppe acquise :</text><text x="61" y="494" class="p">nouveaux virus infectieux</text><path class="arrow" d="M297 225.0H323"/><path class="arrow" d="M585 225.0H611"/><path class="arrow" d="M873 225.0H899"/><path class="arrow" d="M1032 314V372"/><path class="arrow" d="M903 465.0H877"/><path class="arrow" d="M615 465.0H589"/><path class="arrow" d="M327 465.0H301"/><rect x="62" y="566" width="16" height="16" rx="4" fill="#e6e9fb" stroke="#a9b2e8"/><text x="84" y="579" class="p">noyau</text><rect x="160" y="566" width="16" height="16" rx="4" fill="#fff1d6" stroke="#f0c987"/><text x="182" y="579" class="p">cytoplasme</text><rect x="290" y="566" width="16" height="16" rx="4" fill="#e4f3e7" stroke="#9fd0aa"/><text x="312" y="579" class="p">membrane</text><text x="1140" y="579" class="p" text-anchor="end">Chaque vague de protéines prépare la suivante (navette noyau ↔ cytoplasme)</text></svg>