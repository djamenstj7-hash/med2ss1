<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 536" width="1200" height="536" role="img" aria-label="Rôles des anticorps antiviraux : neutralisation, complément, ADCC, séroprophylaxie ; isotypes IgM, IgG, IgA et diagnostic ; complexes immuns, mimétisme moléculaire et facilitation de la dengue"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="536" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Les anticorps antiviraux : protéger, signer, nuire</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Ce qu’ils font contre le virus, ce qu’ils disent au diagnostic, et quand ils aggravent</text><rect x="30" y="124" width="364" height="386" rx="16" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><text x="52.0" y="160.0" font-size="20" fill="#0f6e51"><tspan font-weight="700">PROTÉGER</tspan></text><text x="52.0" y="184.0" font-size="15" fill="#4b6380">surtout contre les réinfections</text><circle cx="60" cy="211" r="4.5" fill="#0f6e51"/><text x="74.0" y="216.0" font-size="15" fill="#15385f"><tspan font-weight="700">Neutralisation</tspan> : l’anticorps empêche le virus</text><text x="74.0" y="236.0" font-size="15" fill="#15385f">de se fixer à son récepteur.</text><circle cx="60" cy="265" r="4.5" fill="#0f6e51"/><text x="74.0" y="270.0" font-size="15" fill="#15385f"><tspan font-weight="700">Complément</tspan> : activé sur un virus enveloppé</text><text x="74.0" y="290.0" font-size="15" fill="#15385f">ou une cellule infectée.</text><circle cx="60" cy="319" r="4.5" fill="#0f6e51"/><text x="74.0" y="324.0" font-size="15" fill="#15385f"><tspan font-weight="700">Récepteurs</tspan><tspan font-weight="700"> Fc</tspan> des phagocytes et des NK :</text><text x="74.0" y="344.0" font-size="15" fill="#15385f">destruction des cellules infectées (ADCC).</text><circle cx="60" cy="373" r="4.5" fill="#0f6e51"/><text x="74.0" y="378.0" font-size="15" fill="#15385f">Apparition<tspan font-weight="700"> tardive</tspan> : rôle minime en</text><text x="74.0" y="398.0" font-size="15" fill="#15385f">primo-infection,<tspan font-weight="700"> majeur</tspan> à la rencontre</text><text x="74.0" y="418.0" font-size="15" fill="#15385f">suivante (mémoire).</text><circle cx="60" cy="447" r="4.5" fill="#0f6e51"/><text x="74.0" y="452.0" font-size="15" fill="#15385f"><tspan font-weight="700">Séroprophylaxie</tspan> dans les heures : hépatites</text><text x="74.0" y="472.0" font-size="15" fill="#15385f">A et B, rage (avec le vaccin), anti-VRS.</text><rect x="418" y="124" width="364" height="386" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="440.0" y="160.0" font-size="20" fill="#1d4f9e"><tspan font-weight="700">SIGNER</tspan></text><text x="440.0" y="184.0" font-size="15" fill="#4b6380">les isotypes et le diagnostic</text><circle cx="448" cy="211" r="4.5" fill="#1d4f9e"/><text x="462.0" y="216.0" font-size="15" fill="#15385f"><tspan font-weight="700">IgM</tspan> : précoces, disparaissent en 3 à 6 mois ;</text><text x="462.0" y="236.0" font-size="15" fill="#15385f">signent une<tspan font-weight="700"> primo-infection</tspan> (hépatite A,</text><text x="462.0" y="256.0" font-size="15" fill="#15385f">rougeole).</text><circle cx="448" cy="285" r="4.5" fill="#1d4f9e"/><text x="462.0" y="290.0" font-size="15" fill="#15385f">Les IgM peuvent<tspan font-weight="700"> réapparaître</tspan> lors d’une</text><text x="462.0" y="310.0" font-size="15" fill="#15385f">réinfection ou d’une réactivation (herpès).</text><circle cx="448" cy="339" r="4.5" fill="#1d4f9e"/><text x="462.0" y="344.0" font-size="15" fill="#15385f"><tspan font-weight="700">IgG</tspan> : immunité systémique ; traversent le</text><text x="462.0" y="364.0" font-size="15" fill="#15385f"><tspan font-weight="700">placenta</tspan>, protègent le nouveau-né ≈ 6 mois.</text><circle cx="448" cy="393" r="4.5" fill="#1d4f9e"/><text x="462.0" y="398.0" font-size="15" fill="#15385f"><tspan font-weight="700">IgA</tspan> : immunité<tspan font-weight="700"> locale</tspan>, au niveau des</text><text x="462.0" y="418.0" font-size="15" fill="#15385f">muqueuses.</text><rect x="806" y="124" width="364" height="386" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="828.0" y="160.0" font-size="20" fill="#b52a35"><tspan font-weight="700">NUIRE</tspan></text><text x="828.0" y="184.0" font-size="15" fill="#4b6380">trois effets néfastes</text><circle cx="836" cy="211" r="4.5" fill="#b52a35"/><text x="850.0" y="216.0" font-size="15" fill="#15385f"><tspan font-weight="700">Complexes</tspan><tspan font-weight="700"> immuns</tspan> : antigène HBs +</text><text x="850.0" y="236.0" font-size="15" fill="#15385f">anti-HBs déposés dans les reins ou les</text><text x="850.0" y="256.0" font-size="15" fill="#15385f">artères (VHB, VHC).</text><circle cx="836" cy="285" r="4.5" fill="#b52a35"/><text x="850.0" y="290.0" font-size="15" fill="#15385f"><tspan font-weight="700">Mimétisme</tspan><tspan font-weight="700"> moléculaire</tspan> : une protéine virale</text><text x="850.0" y="310.0" font-size="15" fill="#15385f">ressemble au soi → auto-immunité.</text><circle cx="836" cy="339" r="4.5" fill="#b52a35"/><text x="850.0" y="344.0" font-size="15" fill="#15385f"><tspan font-weight="700">Facilitation</tspan> (dengue) : les anticorps d’un</text><text x="850.0" y="364.0" font-size="15" fill="#15385f">premier sérotype font entrer un autre</text><text x="850.0" y="384.0" font-size="15" fill="#15385f">sérotype dans les macrophages (récepteurs</text><text x="850.0" y="404.0" font-size="15" fill="#15385f">Fc).</text><circle cx="836" cy="433" r="4.5" fill="#b52a35"/><text x="850.0" y="438.0" font-size="15" fill="#15385f">Macrophages très activés →<tspan font-weight="700"> médiateurs</tspan> →</text><text x="850.0" y="458.0" font-size="15" fill="#15385f">forme<tspan font-weight="700"> hémorragique</tspan>, voire choc.</text></svg>