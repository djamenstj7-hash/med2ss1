<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" width="1200" height="735" role="img" aria-label="Circuit de la pharmacovigilance : déclaration au centre régional, remontée à l’ANSM, décisions européennes, base mondiale VigiBase, surveillance parallèle des firmes et retour d’information"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-b52a35" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b52a35"/></marker><marker id="arr-0f6e51" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f6e51"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="735" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Le circuit de la pharmacovigilance</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Du cabinet au centre régional, puis au national, à l’Europe et à l’OMS — et retour vers les prescripteurs</text><rect x="30.0" y="128" width="207.2" height="324" rx="16" fill="#e1f3f3" stroke="#a9d8d8" stroke-width="2"/><text x="47.0" y="160.0" font-size="17" fill="#0f6466"><tspan font-weight="700">TERRAIN</tspan></text><text x="47.0" y="184.0" font-size="15" fill="#4b6380">Professionnels de santé</text><text x="47.0" y="203.0" font-size="15" fill="#4b6380">et patients</text><text x="47.0" y="232.0" font-size="15" fill="#15385f">Déclarent un effet</text><text x="47.0" y="251.0" font-size="15" fill="#15385f"><tspan font-weight="700">présumé</tspan> : téléphone,</text><text x="47.0" y="270.0" font-size="15" fill="#15385f">courriel, courrier,<tspan font-weight="700"> portail</tspan></text><text x="47.0" y="289.0" font-size="15" fill="#15385f"><tspan font-weight="700">des</tspan><tspan font-weight="700"> vigilances</tspan>.</text><text x="47.0" y="318.0" font-size="15" fill="#15385f">Patients : depuis<tspan font-weight="700"> 2011</tspan></text><text x="47.0" y="337.0" font-size="15" fill="#15385f">(après le Mediator).</text><path d="M240.2,162 L258.2,162" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="263.2" y="128" width="207.2" height="324" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="280.2" y="160.0" font-size="17" fill="#1d4f9e"><tspan font-weight="700">CENTRE</tspan><tspan font-weight="700"> RÉGIONAL</tspan></text><text x="280.2" y="184.0" font-size="15" fill="#4b6380">CRPV : plus de 30 en</text><text x="280.2" y="203.0" font-size="15" fill="#4b6380">France</text><text x="280.2" y="232.0" font-size="15" fill="#15385f">Recueille et<tspan font-weight="700"> analyse</tspan> les</text><text x="280.2" y="251.0" font-size="15" fill="#15385f">cas.</text><text x="280.2" y="280.0" font-size="15" fill="#15385f"><tspan font-weight="700">Conseille</tspan> : aide au</text><text x="280.2" y="299.0" font-size="15" fill="#15385f">diagnostic, prescriptions</text><text x="280.2" y="318.0" font-size="15" fill="#15385f">délicates.</text><text x="280.2" y="347.0" font-size="15" fill="#15385f">Lille : ≈<tspan font-weight="700"> 2</tspan><tspan font-weight="700"> 500</tspan> cas reçus,</text><text x="280.2" y="366.0" font-size="15" fill="#15385f"><tspan font-weight="700">40</tspan><tspan font-weight="700"> à</tspan><tspan font-weight="700"> 50</tspan> remontés.</text><path d="M473.4,162 L491.4,162" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="496.4" y="128" width="207.2" height="324" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="513.4" y="160.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">NATIONAL</tspan></text><text x="513.4" y="184.0" font-size="15" fill="#4b6380">ANSM</text><text x="513.4" y="213.0" font-size="15" fill="#15385f">Cas<tspan font-weight="700"> graves</tspan> : remontée</text><text x="513.4" y="232.0" font-size="15" fill="#15385f">immédiate.</text><text x="513.4" y="261.0" font-size="15" fill="#15385f">Autres : base de</text><text x="513.4" y="280.0" font-size="15" fill="#15385f">données ; s’ils se</text><text x="513.4" y="299.0" font-size="15" fill="#15385f">multiplient, c’est un</text><text x="513.4" y="318.0" font-size="15" fill="#15385f"><tspan font-weight="700">signal</tspan>.</text><text x="513.4" y="347.0" font-size="15" fill="#15385f">La<tspan font-weight="700"> moitié</tspan> des cas</text><text x="513.4" y="366.0" font-size="15" fill="#15385f">remontés modifie la</text><text x="513.4" y="385.0" font-size="15" fill="#15385f">monographie ou</text><text x="513.4" y="404.0" font-size="15" fill="#15385f">l’information.</text><path d="M706.5999999999999,162 L724.5999999999999,162" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="729.5999999999999" y="128" width="207.2" height="324" rx="16" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="746.6" y="160.0" font-size="17" fill="#8a5206"><tspan font-weight="700">EUROPE</tspan></text><text x="746.6" y="184.0" font-size="15" fill="#4b6380">surveillance européenne</text><text x="746.6" y="213.0" font-size="15" fill="#15385f">Les<tspan font-weight="700"> décisions</tspan> s’y</text><text x="746.6" y="232.0" font-size="15" fill="#15385f">prennent.</text><text x="746.6" y="261.0" font-size="15" fill="#15385f">Un<tspan font-weight="700"> pays</tspan><tspan font-weight="700"> rapporteur</tspan> suit</text><text x="746.6" y="280.0" font-size="15" fill="#15385f">chaque médicament.</text><text x="746.6" y="309.0" font-size="15" fill="#15385f">Un pays seul peut refuser</text><text x="746.6" y="328.0" font-size="15" fill="#15385f">le<tspan font-weight="700"> remboursement</tspan>, pas</text><text x="746.6" y="347.0" font-size="15" fill="#15385f">la commercialisation.</text><path d="M939.8,162 L957.8,162" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="962.8" y="128" width="207.2" height="324" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="979.8" y="160.0" font-size="17" fill="#15385f"><tspan font-weight="700">MONDE</tspan></text><text x="979.8" y="184.0" font-size="15" fill="#4b6380">OMS</text><text x="979.8" y="213.0" font-size="15" fill="#15385f"><tspan font-weight="700">VigiBase</tspan>, consultée par</text><text x="979.8" y="232.0" font-size="15" fill="#15385f"><tspan font-weight="700">VigiLyze</tspan> : base mondiale</text><text x="979.8" y="251.0" font-size="15" fill="#15385f">des notifications.</text><text x="979.8" y="280.0" font-size="15" fill="#15385f">Compare la fréquence</text><text x="979.8" y="299.0" font-size="15" fill="#15385f">d’un effet notifié d’un</text><text x="979.8" y="318.0" font-size="15" fill="#15385f">médicament à l’autre.</text><rect x="263.2" y="498" width="673.5999999999999" height="115" rx="14" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="283.2" y="528.0" font-size="16" fill="#b52a35"><tspan font-weight="700">FIRMES</tspan><tspan font-weight="700"> PHARMACEUTIQUES</tspan></text><text x="283.2" y="552.0" font-size="15" fill="#15385f">Surveillance<tspan font-weight="700"> obligatoire</tspan>, menée<tspan font-weight="700"> en</tspan><tspan font-weight="700"> parallèle</tspan> du réseau public, qui reste indépendant (conflits</text><text x="283.2" y="571.0" font-size="15" fill="#15385f">d’intérêts) : rapports périodiques pendant les<tspan font-weight="700"> 5</tspan><tspan font-weight="700"> premières</tspan><tspan font-weight="700"> années</tspan> ; veille d’Internet et des</text><text x="283.2" y="590.0" font-size="15" fill="#15385f">blogs.</text><path d="M546.112,495 L546.112,457" fill="none" stroke="#b52a35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arr-b52a35)"/><path d="M815.5519999999999,495 L815.5519999999999,457" fill="none" stroke="#b52a35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arr-b52a35)"/><rect x="30" y="635" width="1140" height="76" rx="14" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><path d="M1150,446 V673.0 H1150" fill="none"/><text x="60.0" y="665.0" font-size="16" fill="#15385f"><tspan font-weight="700">Retour</tspan><tspan font-weight="700"> vers</tspan><tspan font-weight="700"> les</tspan><tspan font-weight="700"> prescripteurs</tspan><tspan font-weight="700"> et</tspan><tspan font-weight="700"> le</tspan><tspan font-weight="700"> public</tspan> : RCP et monographie modifiés, lettres aux prescripteurs, communiqués (exemple : mise en garde</text><text x="60.0" y="686.0" font-size="16" fill="#15385f">contre les peptides amaigrissants vendus sur Internet).</text><path d="M133.6,632 L133.6,457" fill="none" stroke="#0f6e51" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6e51)"/></svg>