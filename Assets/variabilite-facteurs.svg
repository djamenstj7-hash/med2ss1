ss="p">Passage placentaire</text><text x="628" y="304" class="p">Période du risque</text><rect x="889" y="165" width="254" height="184" rx="15" fill="#eef5fb" stroke="#caddea" stroke-width="2"/><text x="907" y="202" class="h">POIDS / ORGANES</text><text x="907" y="240" class="p">Composition corporelle</text><text x="907" y="272" class="p">Rein, foie, génétique</text><text x="907" y="304" class="p">Interactions</text><text x="61" y="396" class="h">DOSE → ABSORPTION → DISTRIBUTION → MÉTABOLISME → ÉLIMINATION → RÉPONSE</text><text x="61" y="432" class="p">Toujours distinguer pharmacocinétique (exposition) et pharmacodynamie (sensibilité).</text></svg>