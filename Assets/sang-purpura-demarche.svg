<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 712" width="1200" height="712" role="img" aria-label="Démarche devant un purpura : affirmer, trier l’urgence, plaquettes, mécanisme"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-b52a35" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b52a35"/></marker><marker id="arr-8a5206" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8a5206"/></marker><marker id="arr-0f6e51" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f6e51"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="712" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Devant un purpura</text><text x="40" y="83" font-size="17" fill="#c6e4ee">D’abord affirmer et trier l’urgence, ensuite seulement chercher le mécanisme</text><rect x="30" y="124" width="258" height="178" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><circle cx="60" cy="156" r="17" fill="#1d4f9e"/><text x="60" y="162.1" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="86.0" y="163.0" font-size="18" fill="#1d4f9e"><tspan font-weight="700">AFFIRMER</tspan></text><text x="50.0" y="200.0" font-size="16" fill="#15385f">La tache<tspan font-weight="700"> ne</tspan><tspan font-weight="700"> s’efface</tspan><tspan font-weight="700"> pas</tspan> à la</text><text x="50.0" y="221.0" font-size="16" fill="#15385f">vitropression : du sang est</text><text x="50.0" y="242.0" font-size="16" fill="#15385f">sorti des capillaires. Pétéchies,</text><text x="50.0" y="263.0" font-size="16" fill="#15385f">ecchymoses, vibices, nécrose.</text><path d="M294,213.0 L316,213.0" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="324" y="124" width="258" height="178" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><circle cx="354" cy="156" r="17" fill="#b52a35"/><text x="354" y="162.1" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="380.0" y="163.0" font-size="18" fill="#b52a35"><tspan font-weight="700">TRIER</tspan><tspan font-weight="700"> L’URGENCE</tspan></text><text x="344.0" y="200.0" font-size="16" fill="#15385f">Extension rapide, fièvre,</text><text x="344.0" y="221.0" font-size="16" fill="#15385f">nécrose,<tspan font-weight="700"> bulles</tspan></text><text x="344.0" y="242.0" font-size="16" fill="#15385f"><tspan font-weight="700">hémorragiques</tspan></text><text x="344.0" y="263.0" font-size="16" fill="#15385f"><tspan font-weight="700">endobuccales</tspan>, céphalées ou</text><text x="344.0" y="284.0" font-size="16" fill="#15385f">signes neurologiques focaux.</text><path d="M588,213.0 L610,213.0" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="618" y="124" width="258" height="178" rx="16" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><circle cx="648" cy="156" r="17" fill="#8a5206"/><text x="648" y="162.1" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="674.0" y="163.0" font-size="18" fill="#8a5206"><tspan font-weight="700">PLAQUETTES</tspan></text><text x="638.0" y="200.0" font-size="16" fill="#15385f"><tspan font-weight="700">Numération</tspan><tspan font-weight="700"> plaquettaire</tspan> : le</text><text x="638.0" y="221.0" font-size="16" fill="#15385f">premier examen à faire devant</text><text x="638.0" y="242.0" font-size="16" fill="#15385f">tout purpura.</text><path d="M882,213.0 L904,213.0" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="912" y="124" width="258" height="178" rx="16" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><circle cx="942" cy="156" r="17" fill="#0f6e51"/><text x="942" y="162.1" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="968.0" y="163.0" font-size="18" fill="#0f6e51"><tspan font-weight="700">MÉCANISME</tspan></text><text x="932.0" y="200.0" font-size="16" fill="#15385f">Seulement<tspan font-weight="700"> après</tspan> avoir écarté</text><text x="932.0" y="221.0" font-size="16" fill="#15385f">l’urgence : plaquettaire ou</text><text x="932.0" y="242.0" font-size="16" fill="#15385f">vasculaire ?</text><path d="M413.0,306 C350,336 230,306 212.0,338" fill="none" stroke="#b52a35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b52a35)"/><path d="M483.0,306 C520,336 590,306 600.0,338" fill="none" stroke="#8a5206" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-8a5206)"/><path d="M1041.0,306 L1035.0,338" fill="none" stroke="#0f6e51" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6e51)"/><rect x="30" y="346" width="364" height="340" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="52.0" y="384.0" font-size="20" fill="#b52a35"><tspan font-weight="700">PURPURA</tspan><tspan font-weight="700"> FÉBRILE</tspan></text><text x="52.0" y="416.0" font-size="17" fill="#15385f"><tspan font-weight="700">=</tspan><tspan font-weight="700"> purpura</tspan><tspan font-weight="700"> fulminans</tspan> jusqu’à preuve du</text><text x="52.0" y="439.0" font-size="17" fill="#15385f">contraire</text><text x="52.0" y="468.0" font-size="16" fill="#15385f">Méningocoque ou pneumocoque ; état de</text><text x="52.0" y="489.0" font-size="16" fill="#15385f">choc possible en 1 à 2 heures.</text><rect x="48" y="514" width="328" height="92" rx="12" fill="#ffffff" stroke="#b52a35" stroke-width="2"/><text x="64.0" y="542.0" font-size="16" fill="#15385f">→<tspan font-weight="700"> Antibiothérapie</tspan><tspan font-weight="700"> IV</tspan><tspan font-weight="700"> à</tspan><tspan font-weight="700"> large</tspan><tspan font-weight="700"> spectre</tspan></text><text x="64.0" y="563.0" font-size="16" fill="#15385f"><tspan font-weight="700">(C3G)</tspan>, sans attendre la ponction</text><text x="64.0" y="584.0" font-size="16" fill="#15385f">lombaire</text><text x="52.0" y="638.0" font-size="15" fill="#4b6380">Piège : une thrombopénie (CIVD) n’écarte pas</text><text x="52.0" y="658.0" font-size="15" fill="#4b6380">ce diagnostic.</text><rect x="418" y="346" width="364" height="340" rx="16" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="440.0" y="384.0" font-size="20" fill="#8a5206"><tspan font-weight="700">BULLES</tspan><tspan font-weight="700"> HÉMORRAGIQUES</tspan></text><text x="440.0" y="409.0" font-size="20" fill="#8a5206"><tspan font-weight="700">ENDOBUCCALES</tspan></text><text x="440.0" y="442.0" font-size="17" fill="#15385f"><tspan font-weight="700">=</tspan><tspan font-weight="700"> thrombopénie</tspan><tspan font-weight="700"> sévère</tspan>, pas un signe</text><text x="440.0" y="465.0" font-size="17" fill="#15385f">spécifique du purpura fulminans</text><text x="440.0" y="494.0" font-size="16" fill="#15385f">Risque hémorragique, notamment</text><text x="440.0" y="515.0" font-size="16" fill="#15385f"><tspan font-weight="700">intracrânien</tspan>.</text><rect x="436" y="540" width="328" height="64" rx="12" fill="#ffffff" stroke="#8a5206" stroke-width="2"/><text x="452.0" y="579.0" font-size="17" fill="#15385f">→<tspan font-weight="700"> Hospitalisation</tspan><tspan font-weight="700"> en</tspan><tspan font-weight="700"> urgence</tspan></text><rect x="806" y="346" width="364" height="340" rx="16" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><text x="828.0" y="384.0" font-size="20" fill="#0f6e51"><tspan font-weight="700">TROUVER</tspan><tspan font-weight="700"> LE</tspan><tspan font-weight="700"> MÉCANISME</tspan></text><rect x="824" y="404" width="328" height="118" rx="12" fill="#ffffff" stroke="#b8dfc7" stroke-width="2"/><text x="840.0" y="432.0" font-size="16" fill="#15385f"><tspan font-weight="700">Plaquettaire</tspan> (thrombopénie ou</text><text x="840.0" y="453.0" font-size="16" fill="#15385f">thrombopathie) : purpura plan,</text><text x="840.0" y="474.0" font-size="16" fill="#15385f">topographie fixe. Ex.<tspan font-weight="700"> PTI</tspan>.</text><rect x="824" y="536" width="328" height="132" rx="12" fill="#ffffff" stroke="#b8dfc7" stroke-width="2"/><text x="840.0" y="564.0" font-size="16" fill="#15385f"><tspan font-weight="700">Vasculaire</tspan> : infiltré, palpable, déclive, par</text><text x="840.0" y="585.0" font-size="16" fill="#15385f">poussées ; plaquettes normales. Ex.</text><text x="840.0" y="606.0" font-size="16" fill="#15385f"><tspan font-weight="700">purpura</tspan><tspan font-weight="700"> rhumatoïde</tspan> (risque rénal).</text></svg>