<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Initiation par le facteur tissulaire, amplification par la thrombine, propagation par les complexes ténase et prothrombinase"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-b52a35" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b52a35"/></marker><marker id="arr-8a5206" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8a5206"/></marker><marker id="arr-5b3db8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b3db8"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="660" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Le modèle cellulaire de la coagulation</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Le facteur tissulaire allume, la thrombine amplifie, ténase et prothrombinase propagent</text><rect x="30" y="124" width="364" height="430" rx="16" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="52.0" y="162.0" font-size="19" fill="#8a5206"><tspan font-weight="700">1</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> INITIATION</tspan></text><text x="52.0" y="186.0" font-size="15" fill="#4b6380">cellules porteuses de facteur tissulaire</text><rect x="418" y="124" width="364" height="430" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="440.0" y="162.0" font-size="19" fill="#5b3db8"><tspan font-weight="700">2</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> AMPLIFICATION</tspan></text><text x="440.0" y="186.0" font-size="15" fill="#4b6380">la thrombine active plaquettes et cofacteurs</text><rect x="806" y="124" width="364" height="430" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="828.0" y="162.0" font-size="19" fill="#b52a35"><tspan font-weight="700">3</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> PROPAGATION</tspan></text><text x="828.0" y="186.0" font-size="15" fill="#4b6380">à la surface des plaquettes activées</text><path d="M397,339.0 L413,339.0" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M785,339.0 L801,339.0" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="70" y="218" width="284" height="46" rx="12" fill="#ffffff" stroke="#f0d39a" stroke-width="2"/><text x="212.0" y="247.0" font-size="16" fill="#15385f" text-anchor="middle"><tspan font-weight="700">Facteur</tspan><tspan font-weight="700"> tissulaire</tspan> + VII</text><path d="M212.0,267 L212.0,283" fill="none" stroke="#8a5206" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-8a5206)"/><rect x="70" y="288" width="284" height="46" rx="12" fill="#ffffff" stroke="#f0d39a" stroke-width="2"/><text x="212.0" y="317.0" font-size="16" fill="#15385f" text-anchor="middle"><tspan font-weight="700">VIIa</tspan> active le X</text><path d="M212.0,337 L212.0,353" fill="none" stroke="#8a5206" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-8a5206)"/><rect x="70" y="358" width="284" height="46" rx="12" fill="#ffffff" stroke="#f0d39a" stroke-width="2"/><text x="212.0" y="387.0" font-size="16" fill="#15385f" text-anchor="middle"><tspan font-weight="700">Xa</tspan> → traces de<tspan font-weight="700"> IIa</tspan></text><rect x="52" y="422" width="320" height="50" rx="12" fill="#ffffff" stroke="#b52a35" stroke-width="2"/><text x="212.0" y="453.0" font-size="15" fill="#b52a35" text-anchor="middle">freinée par le<tspan font-weight="700"> TFPI</tspan> : ≈ 5 % de thrombine</text><text x="52.0" y="504.0" font-size="14" fill="#4b6380">Brèche :<tspan font-weight="700"> fibroblastes</tspan> de l’adventice (constitutif).</text><text x="52.0" y="522.0" font-size="14" fill="#4b6380">Sepsis :<tspan font-weight="700"> endothélium</tspan>,<tspan font-weight="700"> monocytes</tspan> (inductible).</text><text x="600.0" y="232.0" font-size="15" fill="#4b6380" text-anchor="middle">la thrombine (IIa) active en parallèle :</text><rect x="458" y="248" width="284" height="46" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="600.0" y="277.0" font-size="16" fill="#15385f" text-anchor="middle">les plaquettes (<tspan font-weight="700">PAR-1</tspan>)</text><rect x="458" y="318" width="284" height="46" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="600.0" y="347.0" font-size="16" fill="#15385f" text-anchor="middle"><tspan font-weight="700">V</tspan> →<tspan font-weight="700"> Va</tspan></text><rect x="458" y="388" width="284" height="46" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="600.0" y="417.0" font-size="16" fill="#15385f" text-anchor="middle"><tspan font-weight="700">VIII</tspan> →<tspan font-weight="700"> VIIIa</tspan></text><text x="440.0" y="464.0" font-size="15" fill="#15385f">Rétrocontrôle<tspan font-weight="700"> positif</tspan> : la thrombine active ses</text><text x="440.0" y="484.0" font-size="15" fill="#15385f">propres accélérateurs, les cofacteurs V et VIII.</text><rect x="828" y="218" width="320" height="70" rx="12" fill="#ffffff" stroke="#f2b7bd" stroke-width="2"/><text x="846.0" y="246.0" font-size="15" fill="#b52a35"><tspan font-weight="700">TÉNASE</tspan></text><text x="846.0" y="272.0" font-size="16" fill="#15385f"><tspan font-weight="700">IXa</tspan> +<tspan font-weight="700"> VIIIa</tspan> : X →<tspan font-weight="700"> Xa</tspan></text><path d="M988.0,292 L988.0,308" fill="none" stroke="#b52a35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b52a35)"/><rect x="828" y="312" width="320" height="70" rx="12" fill="#ffffff" stroke="#f2b7bd" stroke-width="2"/><text x="846.0" y="340.0" font-size="15" fill="#b52a35"><tspan font-weight="700">PROTHROMBINASE</tspan></text><text x="846.0" y="366.0" font-size="16" fill="#15385f"><tspan font-weight="700">Xa</tspan> +<tspan font-weight="700"> Va</tspan> : II →<tspan font-weight="700"> IIa</tspan></text><path d="M988.0,386 L988.0,402" fill="none" stroke="#b52a35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b52a35)"/><rect x="828" y="406" width="320" height="64" rx="12" fill="#b52a35"/><text x="988.0" y="444.0" font-size="17" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">Thrombine</tspan><tspan font-weight="700"> explosive</tspan><tspan font-weight="700"> (95</tspan><tspan font-weight="700"> %)</tspan></text><text x="828.0" y="498.0" font-size="15" fill="#15385f">Fibrinogène →<tspan font-weight="700"> fibrine</tspan>, stabilisée par le<tspan font-weight="700"> XIIIa</tspan></text><text x="828.0" y="518.0" font-size="15" fill="#15385f">(transglutaminase).</text><rect x="30" y="576" width="1140" height="60" rx="14" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="600.0" y="613.0" font-size="16" fill="#15385f" text-anchor="middle">Hémophilie A ou B : sans<tspan font-weight="700"> VIII</tspan> ou<tspan font-weight="700"> IX</tspan>, pas de ténase → amplification et propagation déficientes,<tspan font-weight="700"> initiation</tspan><tspan font-weight="700"> normale</tspan></text></svg>