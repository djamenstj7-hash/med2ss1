<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 616" width="1200" height="616" role="img" aria-label="Remodelage osseux : ce qui active les ostéoblastes, ce qui freine les ostéoclastes"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="616" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Remodelage osseux : les cibles des médicaments</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Un bon traitement active les ostéoblastes et/ou freine les ostéoclastes</text><rect x="30" y="124" width="1140" height="64" rx="32" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="600.0" y="164.0" font-size="20" fill="#15385f" text-anchor="middle"><tspan font-weight="700">FORMATION</tspan><tspan font-weight="700"> (ostéoblastes)</tspan><tspan font-weight="700"> ⇄</tspan><tspan font-weight="700"> RÉSORPTION</tspan><tspan font-weight="700"> (ostéoclastes)</tspan></text><rect x="30" y="210" width="550" height="262" rx="16" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><text x="54.0" y="250.0" font-size="21" fill="#0f6e51"><tspan font-weight="700">OSTÉOBLASTE</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> forme</tspan><tspan font-weight="700"> l’os</tspan></text><text x="54.0" y="282.0" font-size="15" fill="#0f6e51"><tspan font-weight="700">Le</tspan><tspan font-weight="700"> traitement</tspan><tspan font-weight="700"> les</tspan><tspan font-weight="700"> ACTIVE</tspan><tspan font-weight="700"> :</tspan></text><circle cx="62" cy="310" r="4.5" fill="#0f6e51"/><text x="76.0" y="316.0" font-size="17" fill="#15385f"><tspan font-weight="700">PTH</tspan> (parathormone ; tériparatide) : différenciation des</text><text x="76.0" y="338.0" font-size="17" fill="#15385f">ostéoblastes</text><circle cx="62" cy="364" r="4.5" fill="#0f6e51"/><text x="76.0" y="370.0" font-size="17" fill="#15385f"><tspan font-weight="700">Strontium</tspan> (qui freine aussi les ostéoclastes)</text><circle cx="62" cy="396" r="4.5" fill="#0f6e51"/><text x="76.0" y="402.0" font-size="17" fill="#15385f"><tspan font-weight="700">Anti-sclérostine</tspan> : formation et résorption</text><rect x="620" y="210" width="550" height="262" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="644.0" y="250.0" font-size="21" fill="#5b3db8"><tspan font-weight="700">OSTÉOCLASTE</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> résorbe</tspan><tspan font-weight="700"> l’os</tspan></text><text x="644.0" y="282.0" font-size="15" fill="#5b3db8"><tspan font-weight="700">Le</tspan><tspan font-weight="700"> traitement</tspan><tspan font-weight="700"> les</tspan><tspan font-weight="700"> FREINE</tspan><tspan font-weight="700"> :</tspan></text><circle cx="652" cy="310" r="4.5" fill="#5b3db8"/><text x="666.0" y="316.0" font-size="17" fill="#15385f"><tspan font-weight="700">Bisphosphonates</tspan> : différenciation des ostéoclastes</text><circle cx="652" cy="342" r="4.5" fill="#5b3db8"/><text x="666.0" y="348.0" font-size="17" fill="#15385f"><tspan font-weight="700">Œstrogènes</tspan> : protection jusqu’à la ménopause</text><circle cx="652" cy="374" r="4.5" fill="#5b3db8"/><text x="666.0" y="380.0" font-size="17" fill="#15385f"><tspan font-weight="700">Calcitonine</tspan></text><circle cx="652" cy="406" r="4.5" fill="#5b3db8"/><text x="666.0" y="412.0" font-size="17" fill="#15385f"><tspan font-weight="700">Strontium</tspan></text><circle cx="652" cy="438" r="4.5" fill="#5b3db8"/><text x="666.0" y="444.0" font-size="17" fill="#15385f"><tspan font-weight="700">Anti-RANK</tspan><tspan font-weight="700"> ligand</tspan> : formation des ostéoclastes</text><rect x="30" y="494" width="550" height="96" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="54.0" y="532.0" font-size="17" fill="#15385f"><tspan font-weight="700">Glucocorticoïdes</tspan> : ↓ ostéoblastes, ↑ ostéoclastes →</text><text x="54.0" y="555.0" font-size="17" fill="#15385f"><tspan font-weight="700">ostéoporose</tspan><tspan font-weight="700"> iatrogène</tspan></text><rect x="620" y="494" width="550" height="96" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="644.0" y="532.0" font-size="17" fill="#15385f"><tspan font-weight="700">Vitamine</tspan><tspan font-weight="700"> D,</tspan><tspan font-weight="700"> calcium</tspan> : seulement en cas de<tspan font-weight="700"> carence</tspan></text><text x="644.0" y="555.0" font-size="17" fill="#15385f">(ostéomalacie, rachitisme)</text></svg>