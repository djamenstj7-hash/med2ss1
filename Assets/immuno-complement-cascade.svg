<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 784" width="1200" height="784" role="img" aria-label="Activation du complément : trois voies, C3 convertase, voie finale commune et complexe d’attaque membranaire"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="784" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Le complément : trois voies, une C3 convertase</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Une trentaine de protéines plasmatiques (foie), enzymes inactives activées en cascade</text><rect x="30" y="124" width="364" height="196" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="52.0" y="162.0" font-size="20" fill="#5b3db8"><tspan font-weight="700">VOIE</tspan><tspan font-weight="700"> CLASSIQUE</tspan></text><text x="52.0" y="196.0" font-size="16" fill="#15385f"><tspan font-weight="700">Complexe</tspan><tspan font-weight="700"> immun</tspan> : IgG ou IgM fixée sur</text><text x="52.0" y="217.0" font-size="16" fill="#15385f">son antigène (pas les IgA)</text><text x="52.0" y="246.0" font-size="16" fill="#15385f">C1q + C1r + C1s → clivent<tspan font-weight="700"> C4</tspan><tspan font-weight="700"> et</tspan><tspan font-weight="700"> C2</tspan></text><rect x="418" y="124" width="364" height="196" rx="16" fill="#e1f3f3" stroke="#a9d8d8" stroke-width="2"/><text x="440.0" y="162.0" font-size="20" fill="#0f6466"><tspan font-weight="700">VOIE</tspan><tspan font-weight="700"> DES</tspan><tspan font-weight="700"> LECTINES</tspan></text><text x="440.0" y="196.0" font-size="16" fill="#15385f">Activée par des<tspan font-weight="700"> motifs</tspan> présents sur</text><text x="440.0" y="217.0" font-size="16" fill="#15385f">certaines bactéries</text><rect x="806" y="124" width="364" height="196" rx="16" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><text x="828.0" y="162.0" font-size="20" fill="#0f6e51"><tspan font-weight="700">VOIE</tspan><tspan font-weight="700"> ALTERNE</tspan></text><text x="828.0" y="196.0" font-size="16" fill="#15385f"><tspan font-weight="700">Directe,</tspan><tspan font-weight="700"> sans</tspan><tspan font-weight="700"> anticorps</tspan> : parois</text><text x="828.0" y="217.0" font-size="16" fill="#15385f">bactériennes ou fongiques, virus, cellules</text><text x="828.0" y="238.0" font-size="16" fill="#15385f">tumorales</text><text x="52.0" y="302.0" font-size="16" fill="#5b3db8">→ C3 convertase<tspan font-weight="700"> C4b2a</tspan></text><rect x="420" y="352" width="360" height="56" rx="28" fill="#123257"/><text x="600.0" y="389.0" font-size="22" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">C3</tspan><tspan font-weight="700"> CONVERTASE</tspan></text><path d="M212,324 C212,338 464.20000000000005,326 483.6,346" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M600,324 C600,338 600.0,326 600.0,346" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M988,324 C988,338 735.8,326 716.4,346" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="420" y="438" width="360" height="56" rx="28" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="600.0" y="474.0" font-size="21" fill="#15385f" text-anchor="middle">C3 →<tspan font-weight="700"> C3a</tspan> +<tspan font-weight="700"> C3b</tspan></text><path d="M600,412 L600,432" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="30" y="416" width="350" height="100" rx="16" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="52.0" y="448.0" font-size="17" fill="#15385f"><tspan font-weight="700">C3a</tspan> (et C5a) : anaphylatoxines,</text><text x="52.0" y="470.0" font-size="17" fill="#15385f">chimiotactisme, inflammation</text><rect x="820" y="416" width="350" height="100" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="842.0" y="448.0" font-size="17" fill="#15385f"><tspan font-weight="700">C3b</tspan> : opsonisation →<tspan font-weight="700"> phagocytose</tspan></text><path d="M416,466 L386,466" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M784,466 L814,466" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M600,498 L600,528" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="330" y="534" width="540" height="70" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="600.0" y="564.0" font-size="18" fill="#15385f" text-anchor="middle"><tspan font-weight="700">VOIE</tspan><tspan font-weight="700"> FINALE</tspan><tspan font-weight="700"> COMMUNE</tspan></text><text x="600.0" y="590.0" font-size="18" fill="#15385f" text-anchor="middle">C5 → C5a +<tspan font-weight="700"> C5b</tspan></text><path d="M600,608 L600,634" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="200" y="640" width="800" height="118" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="600.0" y="678.0" font-size="21" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">COMPLEXE</tspan><tspan font-weight="700"> D’ATTAQUE</tspan><tspan font-weight="700"> MEMBRANAIRE</tspan><tspan font-weight="700"> (CAM)</tspan></text><text x="600.0" y="710.0" font-size="18" fill="#15385f" text-anchor="middle"><tspan font-weight="700">C5b</tspan><tspan font-weight="700"> +</tspan><tspan font-weight="700"> C6,</tspan><tspan font-weight="700"> C7,</tspan><tspan font-weight="700"> C8,</tspan><tspan font-weight="700"> C9</tspan> → pores dans la membrane →<tspan font-weight="700"> lyse</tspan><tspan font-weight="700"> osmotique</tspan></text><text x="600.0" y="739.0" font-size="16" fill="#4b6380" text-anchor="middle">Formé quelle que soit la voie d’activation, voie alterne comprise</text></svg>