<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 508" aria-label="Où agit un médicament végétatif ?"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif;fill:#15385f} .title{fill:#fff;font-size:32px;font-weight:800}.sub{fill:#c6e4ee;font-size:16px}.panel{fill:white;stroke:#c8dceb;stroke-width:2}.h{font-size:18px;font-weight:800}.p{font-size:15px}.small{font-size:13px}.caption{font-size:14px;font-weight:700}.arrow{stroke:#3c7b9d;stroke-width:3;fill:none;marker-end:url(#arrow)} </style><rect x="0" y="0" width="1200" height="508" rx="26" fill="#eef5fb"/><path d="M0 28Q0 0 28 0H1172Q1200 0 1200 28V108H0Z" fill="#123257"/><text x="42" y="48" class="title">Où agit un médicament végétatif ?</text><text x="42" y="80" class="sub">La synapse comme carte des mécanismes pharmacologiques</text><rect x="30" y="134" width="1140" height="338" rx="20" fill="#fff" stroke="#caddea" stroke-width="2"/><rect x="55" y="164" width="190" height="111" rx="16" fill="#f4edfc" stroke="#caddea" stroke-width="2"/><text x="67" y="199" class="h">1 · PRÉPARER</text><text x="68" y="232" class="small">Synthèse du</text><text x="68" y="255" class="small">neuromédiateur</text><rect x="285" y="164" width="190" height="111" rx="16" fill="#f4edfc" stroke="#caddea" stroke-width="2"/><text x="297" y="199" class="h">2 · LIBÉRER</text><text x="298" y="232" class="small">Vésicules → fente</text><text x="298" y="255" class="small">synaptique</text><rect x="515" y="164" width="190" height="111" rx="16" fill="#e8f5ed" stroke="#caddea" stroke-width="2"/><text x="527" y="199" class="h">3 · RECONNAÎTRE</text><text x="528" y="232" class="small">Récepteurs α/β ou</text><text x="528" y="255" class="small">muscariniques</text><rect x="745" y="164" width="190" height="111" rx="16" fill="#fff1d6" stroke="#caddea" stroke-width="2"/><text x="757" y="199" class="h">4 · TERMINER</text><text x="758" y="232" class="small">Recapture ou</text><text x="758" y="255" class="small">dégradation</text><rect x="975" y="164" width="190" height="111" rx="16" fill="#eef5fb" stroke="#caddea" stroke-width="2"/><text x="987" y="199" class="h">5 · FREINER</text><text x="988" y="232" class="small">Autorécepteurs</text><text x="988" y="255" class="small">présynaptiques</text><path class="arrow" d="M248,219 L278,219"/><path class="arrow" d="M478,219 L508,219"/><path class="arrow" d="M708,219 L738,219"/><path class="arrow" d="M938,219 L968,219"/><rect x="55" y="308" width="530" height="121" rx="20" fill="#e8f5ed" stroke="#caddea" stroke-width="2"/><text x="78" y="348" class="p">DIRECT : agoniste ou antagoniste du récepteur</text><text x="78" y="376" class="p">Exemple : agoniste muscarinique, bêtabloquant</text><rect x="616" y="308" width="526" height="121" rx="20" fill="#fff1d6" stroke="#caddea" stroke-width="2"/><text x="641" y="348" class="p">INDIRECT : modifier libération, recapture ou dégradation</text><text x="641" y="376" class="p">Exemple : inhibiteur de recapture ou cholinestérase</text></svg>