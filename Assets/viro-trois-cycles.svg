 <rect width="1000" height="440" rx="25" fill="#f7fbff"/><text x="500" y="42" text-anchor="middle" font-size="27" font-family="Arial,sans-serif" font-weight="700" fill="#123654">Trois itinéraires de multiplication virale</text><rect x="28" y="96" width="940" height="80" rx="14" fill="#e6f3ff" stroke="#bfd7eb" stroke-width="2"/><text x="225" y="130" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700" fill="#153956">HERPÈS · ADN</text><text x="520" y="158" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="500" fill="#204966">ADN → transcription → protéines → réplication → assemblage</text><rect x="28" y="202" width="940" height="80" rx="14" fill="#e7f7ee" stroke="#bfd7eb" stroke-width="2"/><text x="225" y="236" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700" fill="#153956">ENTÉROVIRUS · ARN +</text><text x="520" y="264" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="500" fill="#204966">ARN + → polyprotéine → ARN – → nouvel ARN + → capside</text><rect x="28" y="308" width="940" height="80" rx="14" fill="#fff0e2" stroke="#bfd7eb" stroke-width="2"/><text x="225" y="342" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700" fill="#153956">VIH · RÉTROVIRUS</text><text x="520" y="370" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="500" fill="#204966">ARN → transcriptase inverse → ADN intégré → virions</text></svg>