 y="220" class="p">Tissu :</text><text x="942" y="242" class="p">acétylcholine</text><path class="arrow" d="M250,232 L340,232"/><path class="arrow" d="M834,232 L922,232"/><text x="67" y="306" class="p">Relais ganglionnaire : ACh → nicotinique</text><text x="67" y="335" class="p">Postganglionnaire : souvent NA → α / β</text><text x="67" y="364" class="p">Exception : sudation, sympathique cholinergique</text><text x="67" y="393" class="p">Médullosurrénale : libération de catécholamines</text><text x="648" y="306" class="p">Relais ganglionnaire : ACh → nicotinique</text><text x="648" y="335" class="p">Postganglionnaire : ACh → muscarinique</text><text x="648" y="364" class="p">Ganglion près de l’organe cible</text><text x="648" y="393" class="p">Régulation du cœur, tube digestif, œil…</text></svg>