<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 812" width="1200" height="812" role="img" aria-label="Infection aiguë résolutive ; infections persistantes : réplication continue, latence et réactivations, virus lent"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="812" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Aiguë ou persistante : comment évolue l’infection ?</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Quantité de virus au cours du temps (schémas, sans échelle)</text><rect x="30" y="124" width="555" height="262" rx="16" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><text x="52.0" y="160.0" font-size="17" fill="#0f6e51"><tspan font-weight="700">AIGUË,</tspan><tspan font-weight="700"> RÉSOLUTIVE</tspan></text><rect x="52" y="180" width="230" height="178" rx="12" fill="#ffffff" stroke="#b8dfc7" stroke-width="2"/><path d="M74,198 V332 H268" fill="none" stroke="#4b6380" stroke-width="2"/><text x="268.0" y="351.0" font-size="12" fill="#4b6380" text-anchor="end">temps</text><text transform="translate(66 265.0) rotate(-90)" font-size="12" fill="#4b6380" text-anchor="middle">virus</text><path d="M77.88,329.32 C101.16,326.64 112.80000000000001,211.39999999999998 136.07999999999998,211.39999999999998 C159.36,211.39999999999998 171.0,327.98 194.28,329.32 L264.12,329.32" fill="none" stroke="#0f6e51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="229.2" y="313.2" font-size="12" fill="#0f6e51" text-anchor="middle"><tspan font-weight="700">éliminé</tspan></text><text x="304.0" y="204.0" font-size="16" fill="#15385f">Le système immunitaire<tspan font-weight="700"> élimine</tspan> le</text><text x="304.0" y="225.0" font-size="16" fill="#15385f">virus :<tspan font-weight="700"> rhinovirus</tspan>,<tspan font-weight="700"> rotavirus</tspan>,</text><text x="304.0" y="246.0" font-size="16" fill="#15385f"><tspan font-weight="700">grippe</tspan>. Souvent<tspan font-weight="700"> asymptomatique</tspan></text><text x="304.0" y="267.0" font-size="16" fill="#15385f">(environ 90 % pour les<tspan font-weight="700"> entérovirus</tspan></text><text x="304.0" y="288.0" font-size="16" fill="#15385f">et l’<tspan font-weight="700">hépatite</tspan><tspan font-weight="700"> A</tspan>).</text><rect x="615" y="124" width="555" height="262" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="637.0" y="160.0" font-size="17" fill="#b52a35"><tspan font-weight="700">PERSISTANTE</tspan><tspan font-weight="700"> :</tspan><tspan font-weight="700"> RÉPLICATION</tspan><tspan font-weight="700"> CONTINUE</tspan></text><rect x="637" y="180" width="230" height="178" rx="12" fill="#ffffff" stroke="#f2b7bd" stroke-width="2"/><path d="M659,198 V332 H853" fill="none" stroke="#4b6380" stroke-width="2"/><text x="853.0" y="351.0" font-size="12" fill="#4b6380" text-anchor="end">temps</text><text transform="translate(651 265.0) rotate(-90)" font-size="12" fill="#4b6380" text-anchor="middle">virus</text><path d="M662.88,329.32 C682.28,326.64 693.92,211.39999999999998 717.2,214.07999999999998 C736.6,216.76 748.24,238.2 767.64,235.52 L849.12,232.84" fill="none" stroke="#b52a35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="810.3" y="216.8" font-size="12" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">à</tspan><tspan font-weight="700"> vie</tspan></text><text x="889.0" y="204.0" font-size="16" fill="#15385f"><tspan font-weight="700">VIH</tspan> : 1 à 10 milliards de virions par</text><text x="889.0" y="225.0" font-size="16" fill="#15385f">jour sans traitement.<tspan font-weight="700"> VHB</tspan>,<tspan font-weight="700"> VHC</tspan> :</text><text x="889.0" y="246.0" font-size="16" fill="#15385f">risque de<tspan font-weight="700"> cirrhose</tspan> et de<tspan font-weight="700"> cancer</tspan><tspan font-weight="700"> du</tspan></text><text x="889.0" y="267.0" font-size="16" fill="#15385f"><tspan font-weight="700">foie</tspan>.</text><rect x="30" y="406" width="555" height="262" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="52.0" y="442.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">PERSISTANTE</tspan><tspan font-weight="700"> :</tspan><tspan font-weight="700"> LATENCE</tspan><tspan font-weight="700"> ET</tspan><tspan font-weight="700"> RÉACTIVATIONS</tspan></text><rect x="52" y="462" width="230" height="178" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><path d="M74,480 V614 H268" fill="none" stroke="#4b6380" stroke-width="2"/><text x="268.0" y="633.0" font-size="12" fill="#4b6380" text-anchor="end">temps</text><text transform="translate(66 547.0) rotate(-90)" font-size="12" fill="#4b6380" text-anchor="middle">virus</text><path d="M77.88,611.32 C89.52,608.64 95.34,506.8 106.98,506.8 C118.62,506.8 122.5,608.64 134.14,608.64 L194.28,608.64 C200.10000000000002,608.64 202.04,557.72 207.85999999999999,557.72 C213.68,557.72 215.62,608.64 221.44,608.64 L235.01999999999998,608.64 C240.84,608.64 242.78,565.76 248.6,565.76 C254.42000000000002,565.76 256.36,608.64 262.18,608.64" fill="none" stroke="#5b3db8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="164.2" y="595.2" font-size="12" fill="#4b6380" text-anchor="middle">latence</text><text x="228.2" y="539.0" font-size="12" fill="#5b3db8" text-anchor="middle"><tspan font-weight="700">réveils</tspan></text><text x="304.0" y="486.0" font-size="16" fill="#15385f"><tspan font-weight="700">Herpèsvirus</tspan> (HSV, VZV, CMV,</text><text x="304.0" y="507.0" font-size="16" fill="#15385f">EBV, HHV-6, 7 et 8) et</text><text x="304.0" y="528.0" font-size="16" fill="#15385f"><tspan font-weight="700">polyomavirus</tspan> (BK, JC) : silence</text><text x="304.0" y="549.0" font-size="16" fill="#15385f">non réplicatif, puis réveils, avec ou</text><text x="304.0" y="570.0" font-size="16" fill="#15385f">sans signes.</text><rect x="615" y="406" width="555" height="262" rx="16" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="637.0" y="442.0" font-size="17" fill="#8a5206"><tspan font-weight="700">PERSISTANTE</tspan><tspan font-weight="700"> :</tspan><tspan font-weight="700"> VIRUS</tspan><tspan font-weight="700"> LENT</tspan></text><rect x="637" y="462" width="230" height="178" rx="12" fill="#ffffff" stroke="#f0d39a" stroke-width="2"/><path d="M659,480 V614 H853" fill="none" stroke="#4b6380" stroke-width="2"/><text x="853.0" y="633.0" font-size="12" fill="#4b6380" text-anchor="end">temps</text><text transform="translate(651 547.0) rotate(-90)" font-size="12" fill="#4b6380" text-anchor="middle">virus</text><path d="M662.88,611.32 C674.52,608.64 678.4,540.3 691.98,540.3 C705.56,540.3 709.44,592.56 723.02,592.56 L787.04,589.88 C806.44,587.2 821.96,533.6 847.1800000000001,490.72" fill="none" stroke="#8a5206" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="756.0" y="573.8" font-size="12" fill="#4b6380" text-anchor="middle">des années</text><text x="889.0" y="486.0" font-size="16" fill="#15385f">La primo-infection semble contrôlée,</text><text x="889.0" y="507.0" font-size="16" fill="#15385f">puis le virus reprend le dessus des</text><text x="889.0" y="528.0" font-size="16" fill="#15385f">années plus tard :<tspan font-weight="700"> VIH</tspan> →<tspan font-weight="700"> sida</tspan> ;</text><text x="889.0" y="549.0" font-size="16" fill="#15385f"><tspan font-weight="700">rougeole</tspan> →<tspan font-weight="700"> PESS</tspan> (environ 10 ans</text><text x="889.0" y="570.0" font-size="16" fill="#15385f">après).</text><rect x="30" y="692" width="1140" height="96" rx="14" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="52.0" y="726.0" font-size="15" fill="#4b6380"><tspan font-weight="700">RISQUE</tspan><tspan font-weight="700"> DE</tspan><tspan font-weight="700"> CHRONICITÉ</tspan></text><text x="52.0" y="764.0" font-size="18" fill="#15385f"><tspan font-weight="700">VHC</tspan> :</text><text x="105.0" y="764.0" font-size="18" fill="#b52a35"><tspan font-weight="700">70</tspan><tspan font-weight="700"> à</tspan><tspan font-weight="700"> 80</tspan><tspan font-weight="700"> %</tspan></text><text x="360.0" y="764.0" font-size="18" fill="#15385f"><tspan font-weight="700">VHB</tspan>, adulte :</text><text x="472.1" y="764.0" font-size="18" fill="#b52a35"><tspan font-weight="700">5</tspan><tspan font-weight="700"> à</tspan><tspan font-weight="700"> 10</tspan><tspan font-weight="700"> %</tspan></text><text x="668.0" y="764.0" font-size="18" fill="#15385f"><tspan font-weight="700">VHB</tspan>, nouveau-né :</text><text x="826.1" y="764.0" font-size="18" fill="#b52a35"><tspan font-weight="700">≈</tspan><tspan font-weight="700"> 90</tspan><tspan font-weight="700"> %,</tspan><tspan font-weight="700"> proche</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> 100</tspan><tspan font-weight="700"> %</tspan></text></svg>