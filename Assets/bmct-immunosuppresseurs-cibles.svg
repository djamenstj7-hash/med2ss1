<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 658" width="1200" height="658" role="img" aria-label="Antigène, cellules, cytokines, réponse : les cibles des immunosuppresseurs"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="658" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Où agissent les immunosuppresseurs ?</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Freiner une réponse excessive ou inadaptée : greffe, maladies dysimmunitaires et auto-immunes</text><rect x="34" y="132" width="236" height="96" rx="16" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="152.0" y="187.0" font-size="18" fill="#8a5206" text-anchor="middle"><tspan font-weight="700">Antigène</tspan></text><rect x="334" y="132" width="236" height="96" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="452.0" y="172.0" font-size="18" fill="#1d4f9e" text-anchor="middle"><tspan font-weight="700">Cellules</tspan></text><text x="452.0" y="194.0" font-size="18" fill="#1d4f9e" text-anchor="middle"><tspan font-weight="700">immunocompétentes</tspan></text><text x="452.0" y="216.0" font-size="18" fill="#1d4f9e" text-anchor="middle"><tspan font-weight="700">(LB,</tspan><tspan font-weight="700"> LT)</tspan></text><rect x="634" y="132" width="236" height="96" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="752.0" y="187.0" font-size="18" fill="#5b3db8" text-anchor="middle"><tspan font-weight="700">Cytokines</tspan></text><rect x="934" y="132" width="236" height="96" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="1052.0" y="172.0" font-size="18" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">Inflammation,</tspan><tspan font-weight="700"> réponse</tspan></text><text x="1052.0" y="194.0" font-size="18" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">immunitaire</tspan></text><path d="M276,180.0 L326,180.0" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M576,180.0 L626,180.0" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M876,180.0 L926,180.0" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M302.0,236 V268 M288.0,236 H316.0" stroke="#b52a35" stroke-width="4" stroke-linecap="round"/><circle cx="302.0" cy="286" r="16" fill="#b52a35"/><text x="302.0" y="291.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><path d="M452.0,236 V268 M438.0,236 H466.0" stroke="#b52a35" stroke-width="4" stroke-linecap="round"/><circle cx="452.0" cy="286" r="16" fill="#b52a35"/><text x="452.0" y="291.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><path d="M752.0,236 V268 M738.0,236 H766.0" stroke="#b52a35" stroke-width="4" stroke-linecap="round"/><circle cx="752.0" cy="286" r="16" fill="#b52a35"/><text x="752.0" y="291.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><path d="M1052.0,236 V268 M1038.0,236 H1066.0" stroke="#b52a35" stroke-width="4" stroke-linecap="round"/><circle cx="1052.0" cy="286" r="16" fill="#b52a35"/><text x="1052.0" y="291.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><rect x="30" y="318" width="270" height="196" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><circle cx="60" cy="350" r="16" fill="#b52a35"/><text x="60" y="355.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="86.0" y="348.0" font-size="15" fill="#b52a35"><tspan font-weight="700">LIMITER</tspan><tspan font-weight="700"> L’ACTIVATION</tspan></text><text x="52.0" y="394.0" font-size="16" fill="#15385f">Cibler des molécules<tspan font-weight="700"> CD</tspan> ou la</text><text x="52.0" y="415.0" font-size="16" fill="#15385f"><tspan font-weight="700">costimulation</tspan>.</text><rect x="320" y="318" width="270" height="196" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><circle cx="350" cy="350" r="16" fill="#b52a35"/><text x="350" y="355.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="376.0" y="348.0" font-size="15" fill="#b52a35"><tspan font-weight="700">LIMITER</tspan><tspan font-weight="700"> LA</tspan></text><text x="376.0" y="367.0" font-size="15" fill="#b52a35"><tspan font-weight="700">PROLIFÉRATION</tspan><tspan font-weight="700"> OU</tspan></text><text x="376.0" y="386.0" font-size="15" fill="#b52a35"><tspan font-weight="700">DÉTRUIRE</tspan></text><text x="342.0" y="419.0" font-size="16" fill="#15385f"><tspan font-weight="700">Antimétabolites</tspan>,<tspan font-weight="700"> agents</tspan></text><text x="342.0" y="440.0" font-size="16" fill="#15385f"><tspan font-weight="700">alkylants</tspan>,<tspan font-weight="700"> Ig</tspan></text><text x="342.0" y="461.0" font-size="16" fill="#15385f"><tspan font-weight="700">antilymphocytaires</tspan>, certains</text><text x="342.0" y="482.0" font-size="16" fill="#15385f"><tspan font-weight="700">anticorps</tspan><tspan font-weight="700"> monoclonaux</tspan>.</text><rect x="610" y="318" width="270" height="196" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><circle cx="640" cy="350" r="16" fill="#b52a35"/><text x="640" y="355.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="666.0" y="348.0" font-size="15" fill="#b52a35"><tspan font-weight="700">AGIR</tspan><tspan font-weight="700"> SUR</tspan><tspan font-weight="700"> LES</tspan></text><text x="666.0" y="367.0" font-size="15" fill="#b52a35"><tspan font-weight="700">CYTOKINES</tspan></text><text x="632.0" y="400.0" font-size="16" fill="#15385f">Diminuer leur<tspan font-weight="700"> synthèse</tspan>, les</text><text x="632.0" y="421.0" font-size="16" fill="#15385f"><tspan font-weight="700">neutraliser</tspan>, bloquer leur</text><text x="632.0" y="442.0" font-size="16" fill="#15385f"><tspan font-weight="700">récepteur</tspan> ou leur</text><text x="632.0" y="463.0" font-size="16" fill="#15385f"><tspan font-weight="700">signalisation</tspan>.</text><rect x="900" y="318" width="270" height="196" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><circle cx="930" cy="350" r="16" fill="#b52a35"/><text x="930" y="355.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="956.0" y="348.0" font-size="15" fill="#b52a35"><tspan font-weight="700">EMPÊCHER</tspan><tspan font-weight="700"> LA</tspan></text><text x="956.0" y="367.0" font-size="15" fill="#b52a35"><tspan font-weight="700">MIGRATION</tspan></text><text x="922.0" y="400.0" font-size="16" fill="#15385f">Sclérose en plaques : retenir</text><text x="922.0" y="421.0" font-size="16" fill="#15385f">les lymphocytes hors du</text><text x="922.0" y="442.0" font-size="16" fill="#15385f"><tspan font-weight="700">cerveau</tspan>.</text><rect x="30" y="534" width="1140" height="60" rx="14" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="600.0" y="571.0" font-size="17" fill="#15385f" text-anchor="middle">Le prix :<tspan font-weight="700"> risque</tspan><tspan font-weight="700"> infectieux</tspan> et, selon le traitement et la durée,<tspan font-weight="700"> risque</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> certains</tspan><tspan font-weight="700"> cancers</tspan></text><text x="600.0" y="630.0" font-size="16" fill="#4b6380" text-anchor="middle">Piège d’annale :<tspan font-weight="700"> activer</tspan> l’interaction antigène – cellules immunocompétentes n’a aucune action immunosuppressive.</text></svg>