<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 712" width="1200" height="712" role="img" aria-label="Cellule NK : CMH I présent = tolérance ; CMH I absent, stress ou IgG fixée = destruction"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="712" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">La cellule NK : une balance de signaux</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Récepteurs inhibiteurs contre récepteurs activateurs</text><rect x="30" y="124" width="1140" height="200" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><circle cx="140" cy="224.0" r="70" fill="#f4edfc" stroke="#d9c8f3" stroke-width="3"/><text x="140.0" y="231.0" font-size="18" fill="#5b3db8" text-anchor="middle"><tspan font-weight="700">NK</tspan></text><circle cx="500" cy="224.0" r="70" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="3"/><text x="500.0" y="220.0" font-size="16" fill="#0f6e51" text-anchor="middle"><tspan font-weight="700">Cellule</tspan></text><text x="500.0" y="242.0" font-size="16" fill="#0f6e51" text-anchor="middle"><tspan font-weight="700">saine</tspan></text><path d="M210,224.0 H312" stroke="#5b3db8" stroke-width="5"/><rect x="312" y="208.0" width="16" height="32" rx="4" fill="#5b3db8"/><path d="M430,224.0 H356" stroke="#0f6e51" stroke-width="5"/><rect x="340" y="208.0" width="16" height="32" rx="4" fill="#0f6e51"/><text x="320.0" y="196.0" font-size="15" fill="#5b3db8" text-anchor="middle"><tspan font-weight="700">KIR</tspan></text><text x="352.0" y="268.0" font-size="15" fill="#0f6e51" text-anchor="middle"><tspan font-weight="700">HLA</tspan><tspan font-weight="700"> I</tspan></text><text x="640.0" y="178.0" font-size="23" fill="#0f6e51"><tspan font-weight="700">TOLÉRANCE</tspan></text><text x="640.0" y="214.0" font-size="18" fill="#15385f">Les récepteurs inhibiteurs (<tspan font-weight="700">KIR</tspan>) reconnaissent le<tspan font-weight="700"> HLA</tspan><tspan font-weight="700"> de</tspan></text><text x="640.0" y="239.0" font-size="18" fill="#15385f"><tspan font-weight="700">classe</tspan><tspan font-weight="700"> I</tspan>, présent sur toutes les cellules saines : signal</text><text x="640.0" y="264.0" font-size="18" fill="#15385f">inhibiteur,<tspan font-weight="700"> pas</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> lyse</tspan>.</text><rect x="30" y="344" width="1140" height="270" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><circle cx="140" cy="479.0" r="70" fill="#f4edfc" stroke="#d9c8f3" stroke-width="3"/><text x="140.0" y="486.0" font-size="18" fill="#5b3db8" text-anchor="middle"><tspan font-weight="700">NK</tspan></text><circle cx="500" cy="479.0" r="82" fill="#fde8ea" stroke="#b52a35" stroke-width="3" stroke-dasharray="9 7"/><text x="500.0" y="475.0" font-size="16" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">Cellule</tspan><tspan font-weight="700"> infectée</tspan></text><text x="500.0" y="497.0" font-size="16" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">ou</tspan><tspan font-weight="700"> tumorale</tspan></text><path d="M204,441.0 L312,423.0" stroke="#5b3db8" stroke-width="5"/><rect x="312" y="407.0" width="16" height="32" rx="4" fill="#5b3db8"/><rect x="340" y="407.0" width="16" height="32" rx="4" fill="none" stroke="#9aa8bb" stroke-width="2" stroke-dasharray="4 4"/><text x="226.0" y="397.0" font-size="14" fill="#b52a35"><tspan font-weight="700">1</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> CMH</tspan><tspan font-weight="700"> I</tspan><tspan font-weight="700"> absent</tspan></text><path d="M210,479.0 H318" stroke="#0f6e51" stroke-width="5"/><rect x="318" y="465.0" width="14" height="28" rx="4" fill="#0f6e51"/><path d="M334,479.0 L346,467.0 L358,479.0 L346,491.0 Z" fill="#8a5206"/><path d="M358,479.0 H420" stroke="#8a5206" stroke-width="5"/><text x="226.0" y="465.0" font-size="14" fill="#8a5206"><tspan font-weight="700">2</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> stress</tspan></text><path d="M206,515.0 L298,529.0" stroke="#1d4f9e" stroke-width="5"/><rect x="298" y="519.0" width="14" height="20" rx="4" fill="#1d4f9e"/><path d="M314,529.0 H396 M396,529.0 L428,514.0 M396,529.0 L428,544.0" stroke="#b52a35" stroke-width="5" fill="none" stroke-linecap="round"/><text x="226.0" y="565.0" font-size="14" fill="#1d4f9e"><tspan font-weight="700">3</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> IgG</tspan><tspan font-weight="700"> +</tspan><tspan font-weight="700"> récepteur</tspan><tspan font-weight="700"> Fc</tspan></text><text x="640.0" y="394.0" font-size="23" fill="#b52a35"><tspan font-weight="700">DESTRUCTION</tspan></text><text x="640.0" y="430.0" font-size="17" fill="#15385f">1 ·<tspan font-weight="700"> Missing</tspan><tspan font-weight="700"> self</tspan> : la cellule a perdu son CMH I</text><text x="640.0" y="460.0" font-size="17" fill="#15385f">2 ·<tspan font-weight="700"> Molécules</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> stress</tspan> → récepteurs activateurs</text><text x="640.0" y="490.0" font-size="17" fill="#15385f">3 ·<tspan font-weight="700"> ADCC</tspan> : IgG fixée sur la cible → récepteur Fc</text><rect x="628" y="514" width="524" height="78" rx="12" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="646.0" y="542.0" font-size="16" fill="#15385f">Lyse :<tspan font-weight="700"> perforines</tspan><tspan font-weight="700"> +</tspan><tspan font-weight="700"> granzymes</tspan>,<tspan font-weight="700"> FasL</tspan> et<tspan font-weight="700"> TRAIL</tspan>, TNF → apoptose</text><text x="646.0" y="563.0" font-size="16" fill="#15385f">(comme les LT CD8)</text><rect x="30" y="632" width="1140" height="56" rx="14" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="600.0" y="667.0" font-size="16" fill="#5b3db8" text-anchor="middle">Lymphocyte inné (~10 % des lymphocytes), sans mémoire ni TCR/BCR · recrutée par les IFN de type 1 · produit de l’IFN-γ</text></svg>