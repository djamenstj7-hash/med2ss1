<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 742" width="1200" height="742" role="img" aria-label="Synapse immunologique : signal 1 sélection, signal 2 activation, signal 3 prolifération"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-1d4f9e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1d4f9e"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="742" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">La synapse immunologique : trois signaux</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Cellule dendritique mature et lymphocyte T naïf, dans le ganglion de drainage</text><rect x="30" y="124" width="250" height="516" rx="16" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><rect x="920" y="124" width="250" height="516" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="155.0" y="160.0" font-size="19" fill="#8a5206" text-anchor="middle"><tspan font-weight="700">Cellule</tspan><tspan font-weight="700"> dendritique</tspan></text><text x="155.0" y="184.0" font-size="19" fill="#8a5206" text-anchor="middle"><tspan font-weight="700">mature</tspan></text><text x="155.0" y="216.0" font-size="15" fill="#4b6380" text-anchor="middle">ganglion de drainage</text><text x="1045.0" y="160.0" font-size="19" fill="#1d4f9e" text-anchor="middle"><tspan font-weight="700">LT</tspan><tspan font-weight="700"> naïf</tspan> CD4 ou CD8</text><rect x="266" y="228" width="28" height="40" rx="6" fill="#8a5206"/><text x="256.0" y="254.0" font-size="16" fill="#8a5206" text-anchor="end"><tspan font-weight="700">CMH–peptide</tspan></text><rect x="906" y="228" width="28" height="40" rx="6" fill="#1d4f9e"/><text x="944.0" y="254.0" font-size="16" fill="#1d4f9e"><tspan font-weight="700">TCR</tspan><tspan font-weight="700"> (+</tspan><tspan font-weight="700"> CD4</tspan><tspan font-weight="700"> ou</tspan><tspan font-weight="700"> CD8)</tspan></text><path d="M298,248 H902" stroke="#9fb6cc" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="420" y="204" width="360" height="40" rx="20" fill="#123257"/><text x="600.0" y="231.0" font-size="17" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">SIGNAL</tspan><tspan font-weight="700"> 1</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> antigénique</tspan></text><text x="600.0" y="270.0" font-size="18" fill="#15385f" text-anchor="middle"><tspan font-weight="700">Sélection</tspan><tspan font-weight="700"> :</tspan><tspan font-weight="700"> spécificité</tspan><tspan font-weight="700"> du</tspan><tspan font-weight="700"> LT</tspan></text><text x="600.0" y="296.0" font-size="15" fill="#4b6380" text-anchor="middle">Renforcé par CD4 (CMH II) ou CD8 (CMH I) · insuffisant seul</text><rect x="266" y="364" width="28" height="40" rx="6" fill="#8a5206"/><text x="256.0" y="390.0" font-size="16" fill="#8a5206" text-anchor="end"><tspan font-weight="700">CD80</tspan><tspan font-weight="700"> /</tspan><tspan font-weight="700"> CD86</tspan></text><rect x="906" y="364" width="28" height="40" rx="6" fill="#1d4f9e"/><text x="944.0" y="390.0" font-size="16" fill="#1d4f9e"><tspan font-weight="700">CD28</tspan></text><path d="M298,384 H902" stroke="#9fb6cc" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="420" y="340" width="360" height="40" rx="20" fill="#123257"/><text x="600.0" y="367.0" font-size="17" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">SIGNAL</tspan><tspan font-weight="700"> 2</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> costimulation</tspan></text><text x="600.0" y="406.0" font-size="18" fill="#15385f" text-anchor="middle"><tspan font-weight="700">Activation</tspan><tspan font-weight="700"> réciproque</tspan><tspan font-weight="700"> CD</tspan><tspan font-weight="700"> ⇄</tspan><tspan font-weight="700"> LT</tspan></text><text x="600.0" y="432.0" font-size="15" fill="#4b6380" text-anchor="middle">puis CD40 (CD) ⇄ CD40 ligand (LT activé) · CD80/86 = CD mature = danger</text><rect x="906" y="500" width="28" height="40" rx="6" fill="#1d4f9e"/><text x="944.0" y="526.0" font-size="16" fill="#1d4f9e"><tspan font-weight="700">Récepteur</tspan><tspan font-weight="700"> IL-2</tspan><tspan font-weight="700"> αβγ</tspan></text><rect x="420" y="476" width="360" height="40" rx="20" fill="#123257"/><text x="600.0" y="503.0" font-size="17" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">SIGNAL</tspan><tspan font-weight="700"> 3</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> cytokinique</tspan></text><text x="600.0" y="542.0" font-size="18" fill="#15385f" text-anchor="middle"><tspan font-weight="700">Prolifération</tspan><tspan font-weight="700"> et</tspan><tspan font-weight="700"> différenciation</tspan></text><text x="600.0" y="568.0" font-size="15" fill="#4b6380" text-anchor="middle">IL-2 produite par le LT activé ; récepteur βγ → αβγ de forte affinité</text><path d="M1098,546 C1146,590 1030,608 1000,566" fill="none" stroke="#1d4f9e" stroke-width="3" marker-end="url(#arr-1d4f9e)"/><text x="1062.0" y="578.0" font-size="16" fill="#1d4f9e" text-anchor="middle"><tspan font-weight="700">IL-2</tspan></text><text x="1045.0" y="624.0" font-size="14" fill="#4b6380" text-anchor="middle">autocrine + paracrine</text><rect x="30" y="658" width="1140" height="60" rx="14" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="600.0" y="695.0" font-size="17" fill="#15385f" text-anchor="middle">Signal 1 sans signal 2 →<tspan font-weight="700"> anergie</tspan> ou<tspan font-weight="700"> apoptose</tspan> : une sécurité, car CD80/86 n’apparaissent qu’en cas de danger</text></svg>