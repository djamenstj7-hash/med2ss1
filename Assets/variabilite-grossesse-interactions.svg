<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 490" aria-label="Lire la variabilité comme un mécanisme"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif;fill:#15385f} .title{fill:#fff;font-size:32px;font-weight:800}.sub{fill:#c6e4ee;font-size:16px}.panel{fill:white;stroke:#c8dceb;stroke-width:2}.h{font-size:18px;font-weight:800}.p{font-size:15px}.small{font-size:13px}.caption{font-size:14px;font-weight:700}.arrow{stroke:#3c7b9d;stroke-width:3;fill:none;marker-end:url(#arrow)} </style><rect x="0" y="0" width="1200" height="490" rx="26" fill="#eef5fb"/><path d="M0 28Q0 0 28 0H1172Q1200 0 1200 28V108H0Z" fill="#123257"/><text x="42" y="48" class="title">Lire la variabilité comme un mécanisme</text><text x="42" y="80" class="sub">Ne pas confondre exposition maternelle, risque foetal, cinétique et dynamique</text><rect x="30" y="130" width="555" height="322" rx="20" fill="#fff" stroke="#caddea" stroke-width="2"/><rect x="615" y="130" width="555" height="322" rx="20" fill="#fff" stroke="#caddea" stroke-width="2"/><text x="55" y="174" class="h">GROSSESSE : deux enjeux</text><text x="60" y="218" class="p">1. Concentration maternelle modifiée</text><text x="60" y="267" class="p">2. Passage placentaire éventuel</text><text x="60" y="316" class="p">3. Période du développement</text><text x="60" y="365" class="p">4. Type de risque foetal</text><text x="640" y="174" class="h">INTERACTIONS : deux mécanismes</text><text x="643" y="216" class="p">CINÉTIQUE : variation de concentration</text><text x="643" y="265" class="p">ex. inhibition du métabolisme</text><text x="643" y="314" class="p">DYNAMIQUE : variation de l’effet</text><text x="643" y="363" class="p">ex. addition de risques hémorragiques</text></svg>