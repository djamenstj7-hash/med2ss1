<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 600" aria-label="Cycle de l’entérovirus en 8 étapes, entièrement cytoplasmique"><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="8" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif;fill:#15385f}.title{fill:#fff;font-size:32px;font-weight:800}.sub{fill:#c6e4ee;font-size:16px}.h{font-size:17px;font-weight:800}.p{font-size:14.5px}.n{fill:#fff;font-size:18px;font-weight:800}.arrow{stroke:#3c7b9d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect x="0" y="0" width="1200" height="600" rx="26" fill="#eef5fb"/><path d="M0 28Q0 0 28 0H1172Q1200 0 1200 28V108H0Z" fill="#123257"/><text x="42" y="48" class="title">Cycle de l’entérovirus (virus à ARN +)</text><text x="42" y="80" class="sub">Un photographe tire un négatif (ARN −) pour imprimer autant de photos (ARN +) qu’il le souhaite</text><rect x="43" y="140" width="250" height="170" rx="16" fill="#e4f3e7" stroke="#9fd0aa" stroke-width="2"/><circle cx="71" cy="168" r="17" fill="#123257"/><text x="71" y="174" class="n" text-anchor="middle">1</text><text x="99" y="174" class="h">Attachement, entrée</text><text x="61" y="210" class="p">Pore au sommet de la</text><text x="61" y="232" class="p">capside (ou endocytose) :</text><text x="61" y="254" class="p">l’ARN + entre</text><rect x="331" y="140" width="250" height="170" rx="16" fill="#fff1d6" stroke="#f0c987" stroke-width="2"/><circle cx="359" cy="168" r="17" fill="#123257"/><text x="359" y="174" class="n" text-anchor="middle">2</text><text x="387" y="174" class="h">Traduction directe</text><text x="349" y="210" class="p">ARN + lisible : les</text><text x="349" y="232" class="p">ribosomes le traduisent</text><text x="349" y="254" class="p">en une polyprotéine</text><rect x="619" y="140" width="250" height="170" rx="16" fill="#fff1d6" stroke="#f0c987" stroke-width="2"/><circle cx="647" cy="168" r="17" fill="#123257"/><text x="647" y="174" class="n" text-anchor="middle">3</text><text x="675" y="174" class="h">Découpage</text><text x="637" y="210" class="p">La polyprotéine est</text><text x="637" y="232" class="p">clivée : protéases,</text><text x="637" y="254" class="p">ARN polymérases…</text><rect x="907" y="140" width="250" height="170" rx="16" fill="#fff1d6" stroke="#f0c987" stroke-width="2"/><circle cx="935" cy="168" r="17" fill="#123257"/><text x="935" y="174" class="n" text-anchor="middle">4</text><text x="963" y="174" class="h">Ateliers</text><text x="925" y="210" class="p">Organelles de</text><text x="925" y="232" class="p">réplication : structures</text><text x="925" y="254" class="p">lipidiques induites</text><rect x="907" y="380" width="250" height="170" rx="16" fill="#fff1d6" stroke="#f0c987" stroke-width="2"/><circle cx="935" cy="408" r="17" fill="#123257"/><text x="935" y="414" class="n" text-anchor="middle">5</text><text x="963" y="414" class="h">Copie de l’ARN</text><text x="925" y="450" class="p">ARN polymérase virale :</text><text x="925" y="472" class="p">ARN + → ARN − (le</text><text x="925" y="494" class="p">« négatif » photo)</text><rect x="619" y="380" width="250" height="170" rx="16" fill="#fff1d6" stroke="#f0c987" stroke-width="2"/><circle cx="647" cy="408" r="17" fill="#123257"/><text x="647" y="414" class="n" text-anchor="middle">6</text><text x="675" y="414" class="h">Multiplication</text><text x="637" y="450" class="p">ARN − → nombreux ARN + :</text><text x="637" y="472" class="p">traduits à nouveau ou</text><text x="637" y="494" class="p">futurs génomes</text><rect x="331" y="380" width="250" height="170" rx="16" fill="#fff1d6" stroke="#f0c987" stroke-width="2"/><circle cx="359" cy="408" r="17" fill="#123257"/><text x="359" y="414" class="n" text-anchor="middle">7</text><text x="387" y="414" class="h">Assemblage</text><text x="349" y="450" class="p">Pro-capsides (VP1, VP3,</text><text x="349" y="472" class="p">VP0) + ARN → pro-virion ;</text><text x="349" y="494" class="p">VP0 → VP2 + VP4</text><rect x="43" y="380" width="250" height="170" rx="16" fill="#f6dccb" stroke="#e8a27c" stroke-width="2"/><circle cx="71" cy="408" r="17" fill="#123257"/><text x="71" y="414" class="n" text-anchor="middle">8</text><text x="99" y="414" class="h">Libération</text><text x="61" y="450" class="p">Virions nus libérés ;</text><text x="61" y="472" class="p">en culture, cellules</text><text x="61" y="494" class="p">détruites (lyse)</text><path class="arrow" d="M297 225.0H323"/><path class="arrow" d="M585 225.0H611"/><path class="arrow" d="M873 225.0H899"/><path class="arrow" d="M1032 314V372"/><path class="arrow" d="M903 465.0H877"/><path class="arrow" d="M615 465.0H589"/><path class="arrow" d="M327 465.0H301"/><text x="62" y="579" class="p">Tout se passe dans le cytoplasme : la cellule sait transcrire l’ADN, pas copier l’ARN, d’où l’ARN polymérase virale.</text></svg>