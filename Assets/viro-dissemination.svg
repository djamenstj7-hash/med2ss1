<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 662" width="1200" height="662" role="img" aria-label="Dissémination des virus : infection locale ou voyage par la lymphe, le sang et les organes relais"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-b52a35" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b52a35"/></marker><marker id="arr-0f6466" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f6466"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="662" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">De la porte d’entrée à l’organe cible</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Plus le virus voyage, plus l’incubation (du contage aux premiers signes) est longue</text><rect x="30.0" y="176" width="166" height="119" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="113.0" y="208.0" font-size="16" fill="#1d4f9e" text-anchor="middle"><tspan font-weight="700">PORTE</tspan><tspan font-weight="700"> D’ENTRÉE</tspan></text><text x="113.0" y="234.0" font-size="15" fill="#15385f" text-anchor="middle">muqueuse, peau</text><text x="113.0" y="253.0" font-size="15" fill="#15385f" text-anchor="middle">lésée</text><rect x="224.8" y="176" width="166" height="119" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="307.8" y="208.0" font-size="16" fill="#5b3db8" text-anchor="middle"><tspan font-weight="700">LYMPHE</tspan></text><text x="307.8" y="234.0" font-size="15" fill="#15385f" text-anchor="middle">ganglions (poliovirus)</text><rect x="419.6" y="176" width="166" height="119" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="502.6" y="208.0" font-size="16" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">SANG</tspan></text><text x="502.6" y="234.0" font-size="15" fill="#15385f" text-anchor="middle">virémie<tspan font-weight="700"> primaire</tspan> :</text><text x="502.6" y="253.0" font-size="15" fill="#15385f" text-anchor="middle">transitoire, modérée</text><rect x="614.4000000000001" y="176" width="166" height="119" rx="16" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="697.4" y="208.0" font-size="16" fill="#8a5206" text-anchor="middle"><tspan font-weight="700">ORGANES</tspan><tspan font-weight="700"> RELAIS</tspan></text><text x="697.4" y="234.0" font-size="15" fill="#15385f" text-anchor="middle">vaisseaux, rate, foie,</text><text x="697.4" y="253.0" font-size="15" fill="#15385f" text-anchor="middle">muscles :</text><text x="697.4" y="272.0" font-size="15" fill="#15385f" text-anchor="middle">multiplication</text><rect x="809.2" y="176" width="166" height="119" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="892.2" y="208.0" font-size="16" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">SANG</tspan></text><text x="892.2" y="234.0" font-size="15" fill="#15385f" text-anchor="middle">virémie<tspan font-weight="700"> secondaire</tspan> :</text><text x="892.2" y="253.0" font-size="15" fill="#15385f" text-anchor="middle">plus importante</text><rect x="1004.0" y="176" width="166" height="119" rx="16" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><text x="1087.0" y="208.0" font-size="16" fill="#0f6e51" text-anchor="middle"><tspan font-weight="700">ORGANES</tspan><tspan font-weight="700"> CIBLES</tspan></text><text x="1087.0" y="234.0" font-size="15" fill="#15385f" text-anchor="middle">peau (varicelle),</text><text x="1087.0" y="253.0" font-size="15" fill="#15385f" text-anchor="middle">système nerveux,</text><text x="1087.0" y="272.0" font-size="15" fill="#15385f" text-anchor="middle">foie…</text><path d="M200.0,235.5 L218.8,235.5" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M394.8,235.5 L413.6,235.5" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M589.6,235.5 L608.4000000000001,235.5" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M784.4000000000001,235.5 L803.2,235.5" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M979.2,235.5 L998.0,235.5" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M143.0,170 C143.0,132 482.6,132 482.6,168" fill="none" stroke="#b52a35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arr-b52a35)"/><text x="312.8" y="130.0" font-size="15" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">piqûre</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> moustique</tspan><tspan font-weight="700"> :</tspan><tspan font-weight="700"> inoculation</tspan><tspan font-weight="700"> directe</tspan><tspan font-weight="700"> dans</tspan><tspan font-weight="700"> le</tspan><tspan font-weight="700"> sang</tspan></text><rect x="30" y="365" width="364" height="271" rx="16" fill="#e1f3f3" stroke="#a9d8d8" stroke-width="2"/><text x="52.0" y="403.0" font-size="18" fill="#0f6466"><tspan font-weight="700">L’INFECTION</tspan><tspan font-weight="700"> RESTE</tspan><tspan font-weight="700"> LOCALE</tspan></text><circle cx="58" cy="432" r="4.5" fill="#0f6466"/><text x="72.0" y="437.0" font-size="16" fill="#15385f">Multiplication là où le virus est entré, ou</text><text x="72.0" y="458.0" font-size="16" fill="#15385f"><tspan font-weight="700">de</tspan><tspan font-weight="700"> proche</tspan><tspan font-weight="700"> en</tspan><tspan font-weight="700"> proche</tspan> : du nez aux</text><text x="72.0" y="479.0" font-size="16" fill="#15385f">alvéoles (rhinopharyngite → bronchiolite)</text><circle cx="58" cy="505" r="4.5" fill="#0f6466"/><text x="72.0" y="510.0" font-size="16" fill="#15385f">Les<tspan font-weight="700"> papillomavirus</tspan> restent dans</text><text x="72.0" y="531.0" font-size="16" fill="#15385f">l’épithélium (verrues)</text><rect x="50" y="564" width="324" height="54" rx="12" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="68.0" y="586.0" font-size="17" fill="#0f6466"><tspan font-weight="700">Incubation</tspan><tspan font-weight="700"> courte</tspan></text><text x="68.0" y="608.0" font-size="14" fill="#4b6380">ex. infections respiratoires</text><rect x="418" y="365" width="364" height="271" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="440.0" y="403.0" font-size="18" fill="#b52a35"><tspan font-weight="700">L’INFECTION</tspan><tspan font-weight="700"> SE</tspan><tspan font-weight="700"> GÉNÉRALISE</tspan></text><circle cx="446" cy="432" r="4.5" fill="#b52a35"/><text x="460.0" y="437.0" font-size="16" fill="#15385f">Diffusion par voie<tspan font-weight="700"> sanguine</tspan>, ou<tspan font-weight="700"> nerveuse</tspan></text><text x="460.0" y="458.0" font-size="16" fill="#15385f">(rage)</text><circle cx="446" cy="484" r="4.5" fill="#b52a35"/><text x="460.0" y="489.0" font-size="16" fill="#15385f">Le virus s’amplifie dans les<tspan font-weight="700"> organes</tspan></text><text x="460.0" y="510.0" font-size="16" fill="#15385f"><tspan font-weight="700">relais</tspan> avant d’atteindre ses<tspan font-weight="700"> cibles</tspan></text><rect x="438" y="564" width="324" height="54" rx="12" fill="#ffffff" stroke="#f2b7bd" stroke-width="2"/><text x="456.0" y="586.0" font-size="17" fill="#b52a35"><tspan font-weight="700">Incubation</tspan><tspan font-weight="700"> longue</tspan></text><text x="456.0" y="608.0" font-size="14" fill="#4b6380">ex. hépatites : il faut atteindre le foie</text><rect x="806" y="365" width="364" height="271" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="828.0" y="403.0" font-size="18" fill="#5b3db8"><tspan font-weight="700">DANS</tspan><tspan font-weight="700"> LE</tspan><tspan font-weight="700"> SANG</tspan></text><circle cx="834" cy="432" r="4.5" fill="#5b3db8"/><text x="848.0" y="437.0" font-size="16" fill="#15385f"><tspan font-weight="700">Libre</tspan> dans le plasma :<tspan font-weight="700"> VHB</tspan>,<tspan font-weight="700"> VHC</tspan>,<tspan font-weight="700"> VIH</tspan>,</text><text x="848.0" y="458.0" font-size="16" fill="#15385f"><tspan font-weight="700">parvovirus</tspan><tspan font-weight="700"> B19</tspan></text><circle cx="834" cy="484" r="4.5" fill="#5b3db8"/><text x="848.0" y="489.0" font-size="16" fill="#15385f"><tspan font-weight="700">Associé</tspan><tspan font-weight="700"> aux</tspan><tspan font-weight="700"> cellules</tspan> :<tspan font-weight="700"> CMV</tspan>,<tspan font-weight="700"> EBV</tspan>,<tspan font-weight="700"> VIH</tspan>,</text><text x="848.0" y="510.0" font-size="16" fill="#15385f"><tspan font-weight="700">HTLV</tspan>,<tspan font-weight="700"> rougeole</tspan>,<tspan font-weight="700"> rubéole</tspan></text><path d="M113.0,301 L113.0,357" fill="none" stroke="#0f6466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6466)"/><text x="127.0" y="337.0" font-size="14" fill="#0f6466"><tspan font-weight="700">multiplication</tspan><tspan font-weight="700"> sur</tspan><tspan font-weight="700"> place</tspan></text><path d="M232.8,305 V313 H1162.0 V305" fill="none" stroke="#b52a35" stroke-width="2.5" stroke-linejoin="round"/><path d="M600.0,313 L600.0,357" fill="none" stroke="#b52a35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b52a35)"/><text x="614.0" y="339.0" font-size="14" fill="#b52a35"><tspan font-weight="700">le</tspan><tspan font-weight="700"> virus</tspan><tspan font-weight="700"> voyage</tspan></text></svg>