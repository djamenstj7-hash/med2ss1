<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 726" width="1200" height="726" role="img" aria-label="Balance bénéfice/risque et les dix points de son évaluation : pathologie, nature du bénéfice, alternatives, effets indésirables, facteurs de risque, mésusage, patients ciblés, acceptabilité, médias, laboratoires"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-b52a35" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b52a35"/></marker><marker id="arr-0f6e51" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f6e51"/></marker><marker id="arr-5b3db8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b3db8"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="726" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Les dix points de la balance bénéfice/risque</text><text x="40" y="83" font-size="17" fill="#c6e4ee">QROC d’annales : ce qui pèse côté bénéfice, côté risque, et le contexte</text><text x="189.0" y="128.0" font-size="17" fill="#0f6e51" text-anchor="middle"><tspan font-weight="700">CÔTÉ</tspan><tspan font-weight="700"> BÉNÉFICE</tspan></text><rect x="30" y="146" width="318" height="98" rx="14" fill="#ffffff" stroke="#b8dfc7" stroke-width="2"/><circle cx="58" cy="176" r="16" fill="#0f6e51"/><text x="58" y="181.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="86.0" y="182.0" font-size="17" fill="#0f6e51"><tspan font-weight="700">Pathologie</tspan></text><text x="86.0" y="206.0" font-size="15" fill="#4b6380">sa gravité : celle de la maladie à</text><text x="86.0" y="225.0" font-size="15" fill="#4b6380">traiter</text><rect x="30" y="256" width="318" height="98" rx="14" fill="#ffffff" stroke="#b8dfc7" stroke-width="2"/><circle cx="58" cy="286" r="16" fill="#0f6e51"/><text x="58" y="291.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="86.0" y="292.0" font-size="17" fill="#0f6e51"><tspan font-weight="700">Nature</tspan><tspan font-weight="700"> du</tspan><tspan font-weight="700"> bénéfice</tspan></text><text x="86.0" y="316.0" font-size="15" fill="#4b6380">SMR et ASMR : intérêt et progrès</text><text x="86.0" y="335.0" font-size="15" fill="#4b6380">apportés</text><rect x="30" y="366" width="318" height="79" rx="14" fill="#ffffff" stroke="#b8dfc7" stroke-width="2"/><circle cx="58" cy="396" r="16" fill="#0f6e51"/><text x="58" y="401.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="86.0" y="402.0" font-size="17" fill="#0f6e51"><tspan font-weight="700">Alternatives</tspan></text><text x="86.0" y="426.0" font-size="15" fill="#4b6380">existe-t-il mieux pour ce patient ?</text><text x="1011.0" y="128.0" font-size="17" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">CÔTÉ</tspan><tspan font-weight="700"> RISQUE</tspan></text><rect x="852" y="146" width="318" height="79" rx="14" fill="#ffffff" stroke="#f2b7bd" stroke-width="2"/><circle cx="880" cy="176" r="16" fill="#b52a35"/><text x="880" y="181.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="908.0" y="182.0" font-size="17" fill="#b52a35"><tspan font-weight="700">Effets</tspan><tspan font-weight="700"> indésirables</tspan></text><text x="908.0" y="206.0" font-size="15" fill="#4b6380">leur nature : gravité, fréquence</text><rect x="852" y="237" width="318" height="98" rx="14" fill="#ffffff" stroke="#f2b7bd" stroke-width="2"/><circle cx="880" cy="267" r="16" fill="#b52a35"/><text x="880" y="272.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="908.0" y="273.0" font-size="17" fill="#b52a35"><tspan font-weight="700">Facteurs</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> risque</tspan></text><text x="908.0" y="297.0" font-size="15" fill="#4b6380">ceux qu’on peut maîtriser : dose,</text><text x="908.0" y="316.0" font-size="15" fill="#4b6380">terrain, associations</text><rect x="852" y="347" width="318" height="98" rx="14" fill="#ffffff" stroke="#f2b7bd" stroke-width="2"/><circle cx="880" cy="377" r="16" fill="#b52a35"/><text x="880" y="382.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="908.0" y="383.0" font-size="17" fill="#b52a35"><tspan font-weight="700">Mésusage</tspan></text><text x="908.0" y="407.0" font-size="15" fill="#4b6380">utilisation hors des conditions</text><text x="908.0" y="426.0" font-size="15" fill="#4b6380">prévues</text><rect x="852" y="457" width="318" height="79" rx="14" fill="#ffffff" stroke="#f2b7bd" stroke-width="2"/><circle cx="880" cy="487" r="16" fill="#b52a35"/><text x="880" y="492.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">7</text><text x="908.0" y="493.0" font-size="17" fill="#b52a35"><tspan font-weight="700">Patients</tspan><tspan font-weight="700"> ciblés</tspan></text><text x="908.0" y="517.0" font-size="15" fill="#4b6380">la population qui sera traitée</text><path d="M600,208 L548,448 H652 Z" fill="#123257" opacity="0.9"/><rect x="490" y="448" width="220" height="16" rx="8" fill="#123257"/><line x1="460" y1="220" x2="740" y2="176" stroke="#123257" stroke-width="9" stroke-linecap="round"/><circle cx="600" cy="198" r="13" fill="#ffffff" stroke="#123257" stroke-width="5"/><path d="M460,220 L396,312 M460,220 L524,312" stroke="#0f6e51" stroke-width="2.5"/><path d="M376,312 H544 Q532,366 460,366 Q388,366 376,312 Z" fill="#e8f5ed" stroke="#0f6e51" stroke-width="2.5"/><text x="460.0" y="344.0" font-size="17" fill="#0f6e51" text-anchor="middle"><tspan font-weight="700">BÉNÉFICE</tspan></text><path d="M740,176 L676,268 M740,176 L804,268" stroke="#b52a35" stroke-width="2.5"/><path d="M656,268 H824 Q812,322 740,322 Q668,322 656,268 Z" fill="#fde8ea" stroke="#b52a35" stroke-width="2.5"/><text x="740.0" y="300.0" font-size="17" fill="#b52a35" text-anchor="middle"><tspan font-weight="700">RISQUE</tspan></text><text x="600.0" y="498.0" font-size="16" fill="#15385f" text-anchor="middle">Pour prescrire, la balance doit<tspan font-weight="700"> pencher</tspan></text><text x="600.0" y="519.0" font-size="16" fill="#15385f" text-anchor="middle"><tspan font-weight="700">du</tspan><tspan font-weight="700"> côté</tspan><tspan font-weight="700"> du</tspan><tspan font-weight="700"> bénéfice</tspan>, pour ce patient et à</text><text x="600.0" y="540.0" font-size="16" fill="#15385f" text-anchor="middle">ce moment.</text><text x="600.0" y="578.0" font-size="17" fill="#5b3db8" text-anchor="middle"><tspan font-weight="700">LE</tspan><tspan font-weight="700"> CONTEXTE,</tspan><tspan font-weight="700"> QUI</tspan><tspan font-weight="700"> FAIT</tspan><tspan font-weight="700"> PENCHER</tspan><tspan font-weight="700"> LA</tspan><tspan font-weight="700"> BALANCE</tspan></text><rect x="30" y="596" width="368" height="98" rx="14" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><circle cx="58" cy="626" r="16" fill="#5b3db8"/><text x="58" y="631.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">8</text><text x="86.0" y="632.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">Acceptabilité</tspan><tspan font-weight="700"> du</tspan><tspan font-weight="700"> risque</tspan></text><text x="86.0" y="656.0" font-size="15" fill="#4b6380">selon le patient, la culture du pays, les</text><text x="86.0" y="675.0" font-size="15" fill="#4b6380">alternatives, l’information donnée</text><rect x="416" y="596" width="368" height="98" rx="14" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><circle cx="444" cy="626" r="16" fill="#5b3db8"/><text x="444" y="631.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">9</text><text x="472.0" y="632.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">Médias</tspan></text><text x="472.0" y="656.0" font-size="15" fill="#4b6380">risque perçu, rumeurs et fausses</text><text x="472.0" y="675.0" font-size="15" fill="#4b6380">informations</text><rect x="802" y="596" width="368" height="98" rx="14" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><circle cx="830" cy="626" r="16" fill="#5b3db8"/><text x="830" y="631.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">10</text><text x="858.0" y="632.0" font-size="17" fill="#5b3db8"><tspan font-weight="700">Laboratoires</tspan></text><text x="858.0" y="656.0" font-size="15" fill="#4b6380">visite médicale, marché économique : des</text><text x="858.0" y="675.0" font-size="15" fill="#4b6380">acteurs intéressés</text></svg>