<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 602" width="1200" height="602" role="img" aria-label="LT mémoire centraux, effecteurs et résidents"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="602" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Trois couches de mémoire T</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Où elles vivent, ce qu’elles font quand le pathogène revient</text><rect x="30" y="124" width="364" height="386" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><rect x="50" y="144" width="76" height="40" rx="20" fill="#1d4f9e"/><text x="88.0" y="171.0" font-size="19" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">TCM</tspan></text><text x="140.0" y="171.0" font-size="19" fill="#1d4f9e"><tspan font-weight="700">Mémoire</tspan><tspan font-weight="700"> centraux</tspan></text><rect x="48" y="200" width="328" height="92" rx="12" fill="#ffffff" stroke="#bcd3f2" stroke-width="2"/><text x="64.0" y="226.0" font-size="13" fill="#1d4f9e"><tspan font-weight="700">OÙ</tspan><tspan font-weight="700"> ?</tspan></text><text x="64.0" y="250.0" font-size="16" fill="#15385f">Circulent entre les<tspan font-weight="700"> organes</tspan><tspan font-weight="700"> lymphoïdes</tspan></text><text x="64.0" y="270.0" font-size="16" fill="#15385f"><tspan font-weight="700">secondaires</tspan> (ganglions)</text><circle cx="60" cy="324" r="4.5" fill="#1d4f9e"/><text x="74.0" y="330.0" font-size="16" fill="#15385f">Surtout<tspan font-weight="700"> LT</tspan><tspan font-weight="700"> CD4</tspan></text><circle cx="60" cy="357" r="4.5" fill="#1d4f9e"/><text x="74.0" y="363.0" font-size="16" fill="#15385f"><tspan font-weight="700">Très</tspan><tspan font-weight="700"> forte</tspan><tspan font-weight="700"> prolifération</tspan></text><circle cx="60" cy="390" r="4.5" fill="#1d4f9e"/><text x="74.0" y="396.0" font-size="16" fill="#15385f">Cytokines<tspan font-weight="700"> peu</tspan><tspan font-weight="700"> polarisées</tspan> : l’IL-2,</text><text x="74.0" y="417.0" font-size="16" fill="#15385f">« carburant » des autres cellules</text><circle cx="60" cy="444" r="4.5" fill="#1d4f9e"/><text x="74.0" y="450.0" font-size="16" fill="#15385f"><tspan font-weight="700">Réactivent</tspan> mémoire et naïves à la</text><text x="74.0" y="471.0" font-size="16" fill="#15385f">nouvelle exposition</text><rect x="418" y="124" width="364" height="386" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><rect x="438" y="144" width="76" height="40" rx="20" fill="#5b3db8"/><text x="476.0" y="171.0" font-size="19" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">TEM</tspan></text><text x="528.0" y="171.0" font-size="19" fill="#5b3db8"><tspan font-weight="700">Mémoire</tspan><tspan font-weight="700"> effecteurs</tspan></text><rect x="436" y="200" width="328" height="92" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="452.0" y="226.0" font-size="13" fill="#5b3db8"><tspan font-weight="700">OÙ</tspan><tspan font-weight="700"> ?</tspan></text><text x="452.0" y="250.0" font-size="16" fill="#15385f">Circulent<tspan font-weight="700"> entre</tspan><tspan font-weight="700"> les</tspan><tspan font-weight="700"> tissus</tspan> (rate, poumon,</text><text x="452.0" y="270.0" font-size="16" fill="#15385f">intestin…)</text><circle cx="448" cy="324" r="4.5" fill="#5b3db8"/><text x="462.0" y="330.0" font-size="16" fill="#15385f">Surtout<tspan font-weight="700"> LT</tspan><tspan font-weight="700"> CD8</tspan></text><circle cx="448" cy="357" r="4.5" fill="#5b3db8"/><text x="462.0" y="363.0" font-size="16" fill="#15385f">Déjà engagés : cytokines<tspan font-weight="700"> polarisées</tspan></text><circle cx="448" cy="390" r="4.5" fill="#5b3db8"/><text x="462.0" y="396.0" font-size="16" fill="#15385f">Activés, deviennent<tspan font-weight="700"> effecteurs</tspan> (mort vers</text><text x="462.0" y="417.0" font-size="16" fill="#15385f">15 jours)</text><circle cx="448" cy="444" r="4.5" fill="#5b3db8"/><text x="462.0" y="450.0" font-size="16" fill="#15385f"><tspan font-weight="700">Auto-renouvellement</tspan> : une cellule fille</text><text x="462.0" y="471.0" font-size="16" fill="#15385f">reste mémoire</text><rect x="806" y="124" width="364" height="386" rx="16" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><rect x="826" y="144" width="76" height="40" rx="20" fill="#0f6e51"/><text x="864.0" y="171.0" font-size="19" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">TRM</tspan></text><text x="916.0" y="171.0" font-size="19" fill="#0f6e51"><tspan font-weight="700">Mémoire</tspan><tspan font-weight="700"> résidents</tspan></text><rect x="824" y="200" width="328" height="92" rx="12" fill="#ffffff" stroke="#b8dfc7" stroke-width="2"/><text x="840.0" y="226.0" font-size="13" fill="#0f6e51"><tspan font-weight="700">OÙ</tspan><tspan font-weight="700"> ?</tspan></text><text x="840.0" y="250.0" font-size="16" fill="#15385f"><tspan font-weight="700">Restent</tspan> dans le tissu d’entrée :</text><text x="840.0" y="270.0" font-size="16" fill="#15385f">épithélium (CD8), chorion (CD4)</text><circle cx="836" cy="324" r="4.5" fill="#0f6e51"/><text x="850.0" y="330.0" font-size="16" fill="#15385f">Différenciation<tspan font-weight="700"> quasi</tspan><tspan font-weight="700"> terminale</tspan></text><circle cx="836" cy="357" r="4.5" fill="#0f6e51"/><text x="850.0" y="363.0" font-size="16" fill="#15385f"><tspan font-weight="700">Très</tspan><tspan font-weight="700"> rapides</tspan> : cytotoxiques, cytokines</text><text x="850.0" y="384.0" font-size="16" fill="#15385f">polarisées</text><circle cx="836" cy="411" r="4.5" fill="#0f6e51"/><text x="850.0" y="417.0" font-size="16" fill="#15385f">Spécifiques du pathogène<tspan font-weight="700"> et</tspan> du tissu</text><circle cx="836" cy="444" r="4.5" fill="#0f6e51"/><text x="850.0" y="450.0" font-size="16" fill="#15385f">Peau → herpèsvirus ; poumon → grippe ;</text><text x="850.0" y="471.0" font-size="16" fill="#15385f">intestin → virus des diarrhées</text><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1140" y2="0"><stop offset="0" stop-color="#1d4f9e"/><stop offset="0.5" stop-color="#5b3db8"/><stop offset="1" stop-color="#0f6e51"/></linearGradient></defs><path d="M60,540 H1140" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/><path d="M60,526 L36,540 L60,554 Z" fill="#1d4f9e"/><path d="M1140,526 L1164,540 L1140,554 Z" fill="#0f6e51"/><text x="60.0" y="574.0" font-size="16" fill="#1d4f9e"><tspan font-weight="700">capacité</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> prolifération</tspan></text><text x="1140.0" y="574.0" font-size="16" fill="#0f6e51" text-anchor="end"><tspan font-weight="700">rapidité</tspan><tspan font-weight="700"> d’action,</tspan><tspan font-weight="700"> différenciation</tspan></text><text x="600.0" y="574.0" font-size="15" fill="#4b6380" text-anchor="middle">catégories non figées</text></svg>