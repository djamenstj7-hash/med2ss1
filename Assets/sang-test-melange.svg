<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 786" width="1200" height="786" role="img" aria-label="Test du mélange : TCA corrigé = déficit, non corrigé = anticoagulant circulant"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-0f6e51" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f6e51"/></marker><marker id="arr-b52a35" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b52a35"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="786" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Le test du mélange</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Allongement isolé du TCA : déficit en facteur ou anticoagulant circulant ?</text><rect x="400" y="122" width="400" height="52" rx="26" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="600.0" y="156.0" font-size="20" fill="#1d4f9e" text-anchor="middle"><tspan font-weight="700">TCA</tspan><tspan font-weight="700"> allongé,</tspan><tspan font-weight="700"> TQ</tspan><tspan font-weight="700"> normal</tspan></text><path d="M600,178 L600,198" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="250" y="204" width="700" height="108" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="600.0" y="238.0" font-size="20" fill="#15385f" text-anchor="middle"><tspan font-weight="700">MÉLANGE</tspan><tspan font-weight="700"> 1</tspan><tspan font-weight="700"> +</tspan><tspan font-weight="700"> 1</tspan><tspan font-weight="700"> :</tspan><tspan font-weight="700"> plasma</tspan><tspan font-weight="700"> du</tspan><tspan font-weight="700"> malade</tspan><tspan font-weight="700"> +</tspan><tspan font-weight="700"> plasma</tspan><tspan font-weight="700"> témoin</tspan></text><text x="600.0" y="268.0" font-size="16" fill="#4b6380" text-anchor="middle">Exemple : facteur VIII à 1 % + témoin à 100 % ≈ 50 %, assez pour raccourcir le TCA</text><text x="600.0" y="295.0" font-size="16" fill="#4b6380" text-anchor="middle">On mesure le TCA du mélange (indice de Rosner)</text><path d="M420,316 C420,334 290,330 280,350" fill="none" stroke="#0f6e51" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6e51)"/><path d="M780,316 C780,334 860,330 870,350" fill="none" stroke="#b52a35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b52a35)"/><rect x="30" y="356" width="500" height="178" rx="16" fill="#e8f5ed" stroke="#b8dfc7" stroke-width="2"/><text x="54.0" y="396.0" font-size="21" fill="#0f6e51"><tspan font-weight="700">TCA</tspan><tspan font-weight="700"> CORRIGÉ</tspan><tspan font-weight="700"> (raccourci)</tspan></text><text x="54.0" y="432.0" font-size="18" fill="#15385f">→<tspan font-weight="700"> Déficit</tspan><tspan font-weight="700"> en</tspan><tspan font-weight="700"> facteur</tspan> de la voie intrinsèque :<tspan font-weight="700"> VIII,</tspan><tspan font-weight="700"> IX,</tspan><tspan font-weight="700"> XI</tspan></text><text x="54.0" y="464.0" font-size="17" fill="#15385f">Indice de Rosner<tspan font-weight="700"> &lt;</tspan><tspan font-weight="700"> 12</tspan></text><text x="54.0" y="494.0" font-size="17" fill="#15385f">Étape suivante :<tspan font-weight="700"> doser</tspan> le facteur en cause.</text><rect x="30" y="556" width="500" height="140" rx="16" fill="#ffffff" stroke="#c8dceb" stroke-width="2"/><text x="54.0" y="590.0" font-size="17" fill="#15385f"><tspan font-weight="700">Indice</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> Rosner</tspan></text><text x="54.0" y="620.0" font-size="16" fill="#15385f">[TCA (malade + témoin) − TCA (témoin)] / TCA (malade) × 100</text><text x="54.0" y="649.0" font-size="16" fill="#15385f"><tspan font-weight="700">&lt;</tspan><tspan font-weight="700"> 12</tspan> : déficit ·<tspan font-weight="700"> &gt;</tspan><tspan font-weight="700"> 15</tspan> : anticoagulant circulant</text><rect x="570" y="356" width="600" height="112" rx="16" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="594.0" y="396.0" font-size="21" fill="#b52a35"><tspan font-weight="700">TCA</tspan><tspan font-weight="700"> NON</tspan><tspan font-weight="700"> CORRIGÉ</tspan></text><text x="594.0" y="428.0" font-size="18" fill="#15385f">→<tspan font-weight="700"> Anticoagulant</tspan><tspan font-weight="700"> circulant</tspan><tspan font-weight="700"> (ACC)</tspan> · Rosner<tspan font-weight="700"> &gt;</tspan><tspan font-weight="700"> 15</tspan></text><text x="594.0" y="455.0" font-size="16" fill="#4b6380">Les anticorps neutralisent les phospholipides du réactif.</text><rect x="604" y="488" width="566" height="73" rx="12" fill="#fff1d6" stroke="#f0d39a" stroke-width="2"/><text x="620.0" y="518.0" font-size="16" fill="#15385f"><tspan font-weight="700">Transitoire</tspan> : enfant, après une virose (parfois un médicament) ; bénin, ni</text><text x="620.0" y="539.0" font-size="16" fill="#15385f">saignement ni thrombose. →<tspan font-weight="700"> Recontrôler</tspan><tspan font-weight="700"> à</tspan><tspan font-weight="700"> 12</tspan><tspan font-weight="700"> semaines.</tspan></text><rect x="604" y="573" width="566" height="94" rx="12" fill="#fde8ea" stroke="#f2b7bd" stroke-width="2"/><text x="620.0" y="603.0" font-size="16" fill="#15385f"><tspan font-weight="700">Persistant</tspan><tspan font-weight="700"> &gt;</tspan><tspan font-weight="700"> 12</tspan><tspan font-weight="700"> semaines</tspan> :<tspan font-weight="700"> SAPL</tspan> — thromboses, fausses couches ;</text><text x="620.0" y="624.0" font-size="16" fill="#15385f">anticardiolipine, anti-β2GPI ; lupus. Risque<tspan font-weight="700"> thrombotique</tspan>, pas</text><text x="620.0" y="645.0" font-size="16" fill="#15385f">hémorragique.</text><rect x="604" y="679" width="566" height="73" rx="12" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="620.0" y="709.0" font-size="16" fill="#15385f"><tspan font-weight="700">Anti-facteur</tspan><tspan font-weight="700"> VIII</tspan> + facteur VIII effondré :<tspan font-weight="700"> hémophilie</tspan><tspan font-weight="700"> acquise</tspan> (anticorps</text><text x="620.0" y="730.0" font-size="16" fill="#15385f">inhibiteur spécifique).</text><path d="M584,470 V715.5" stroke="#b52a35" stroke-width="2.5" fill="none"/><path d="M584,524.5 L598,524.5" fill="none" stroke="#b52a35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b52a35)"/><path d="M584,620.0 L598,620.0" fill="none" stroke="#b52a35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b52a35)"/><path d="M584,715.5 L598,715.5" fill="none" stroke="#b52a35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b52a35)"/></svg>