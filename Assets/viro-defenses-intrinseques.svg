<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 698" width="1200" height="698" role="img" aria-label="TRIM5α bloque le VIH dans la cellule de singe ; APOBEC3G provoque une hypermutation de l’ADN viral, contournée par la protéine Vif ; génome du VIH : gag, pol, env, vif"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker><marker id="arr-0f6466" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f6466"/></marker><marker id="arr-5b3db8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b3db8"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="698" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">Deux défenses de la cellule contre le VIH</text><text x="40" y="83" font-size="17" fill="#c6e4ee">TRIM5α détruit la capside ; APOBEC3G fait muter l’ADN viral, sauf si Vif l’élimine</text><rect x="30" y="124" width="555" height="432" rx="16" fill="#e1f3f3" stroke="#a9d8d8" stroke-width="2"/><text x="50.0" y="158.0" font-size="19" fill="#0f6466"><tspan font-weight="700">TRIM5α</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> restriction</tspan><tspan font-weight="700"> post-entrée</tspan></text><text x="50.0" y="182.0" font-size="15" fill="#4b6380">la capside est détruite avant toute copie</text><rect x="615" y="124" width="555" height="432" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="635.0" y="158.0" font-size="19" fill="#5b3db8"><tspan font-weight="700">APOBEC3G</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> défense</tspan><tspan font-weight="700"> contre</tspan><tspan font-weight="700"> l’ADN</tspan><tspan font-weight="700"> étranger</tspan></text><text x="635.0" y="182.0" font-size="15" fill="#4b6380">l’ADN viral est saboté… sauf si Vif intervient</text><text x="173.2" y="220.0" font-size="16" fill="#0f6466" text-anchor="middle"><tspan font-weight="700">Cellule</tspan><tspan font-weight="700"> humaine</tspan></text><text x="441.8" y="220.0" font-size="16" fill="#0f6466" text-anchor="middle"><tspan font-weight="700">Cellule</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> singe</tspan></text><text x="758.2" y="220.0" font-size="16" fill="#5b3db8" text-anchor="middle"><tspan font-weight="700">Rétrovirus</tspan><tspan font-weight="700"> sans</tspan><tspan font-weight="700"> Vif</tspan></text><text x="1026.8" y="220.0" font-size="16" fill="#5b3db8" text-anchor="middle"><tspan font-weight="700">VIH,</tspan><tspan font-weight="700"> avec</tspan><tspan font-weight="700"> Vif</tspan></text><rect x="48" y="240" width="250.5" height="56" rx="10" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="62.0" y="262.0" font-size="15" fill="#15385f">Le VIH se fixe à<tspan font-weight="700"> CD4</tspan> et à<tspan font-weight="700"> CCR5</tspan></text><text x="62.0" y="281.0" font-size="15" fill="#15385f">ou<tspan font-weight="700"> CXCR4</tspan>, puis entre.</text><path d="M173.25,299 L173.25,313" fill="none" stroke="#0f6466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6466)"/><rect x="48" y="316" width="250.5" height="37" rx="10" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="62.0" y="338.0" font-size="15" fill="#15385f">La capside libère l’ARN.</text><path d="M173.25,356 L173.25,370" fill="none" stroke="#0f6466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6466)"/><rect x="48" y="373" width="250.5" height="56" rx="10" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="62.0" y="395.0" font-size="15" fill="#15385f"><tspan font-weight="700">Transcription</tspan><tspan font-weight="700"> inverse</tspan> : ADN</text><text x="62.0" y="414.0" font-size="15" fill="#15385f">viral.</text><path d="M173.25,432 L173.25,446" fill="none" stroke="#0f6466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6466)"/><rect x="48" y="449" width="250.5" height="37" rx="10" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="62.0" y="471.0" font-size="15" fill="#15385f">Intégration, réplication.</text><rect x="316.5" y="240" width="250.5" height="56" rx="10" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="330.5" y="262.0" font-size="15" fill="#15385f">Mêmes récepteurs : le VIH<tspan font-weight="700"> entre</tspan></text><text x="330.5" y="281.0" font-size="15" fill="#15385f">aussi.</text><path d="M441.75,299 L441.75,313" fill="none" stroke="#0f6466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6466)"/><rect x="316.5" y="316" width="250.5" height="37" rx="10" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="330.5" y="338.0" font-size="15" fill="#15385f"><tspan font-weight="700">TRIM5α</tspan> se lie à la<tspan font-weight="700"> capside</tspan>.</text><path d="M441.75,356 L441.75,370" fill="none" stroke="#0f6466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6466)"/><rect x="316.5" y="373" width="250.5" height="37" rx="10" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="330.5" y="395.0" font-size="15" fill="#15385f">Ubiquitination,<tspan font-weight="700"> dégradation</tspan>.</text><path d="M441.75,413 L441.75,427" fill="none" stroke="#0f6466" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-0f6466)"/><rect x="316.5" y="430" width="250.5" height="37" rx="10" fill="#ffffff" stroke="#a9d8d8" stroke-width="2"/><text x="330.5" y="452.0" font-size="15" fill="#15385f"><tspan font-weight="700">Aucun</tspan><tspan font-weight="700"> ADN</tspan> viral produit.</text><rect x="633" y="240" width="250.5" height="75" rx="10" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="647.0" y="262.0" font-size="15" fill="#15385f">Dans la cellule productrice,</text><text x="647.0" y="281.0" font-size="15" fill="#15385f"><tspan font-weight="700">APOBEC3G</tspan> est<tspan font-weight="700"> embarquée</tspan></text><text x="647.0" y="300.0" font-size="15" fill="#15385f">dans le virion.</text><path d="M758.25,318 L758.25,332" fill="none" stroke="#5b3db8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-5b3db8)"/><rect x="633" y="335" width="250.5" height="75" rx="10" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="647.0" y="357.0" font-size="15" fill="#15385f">Cellule suivante : elle<tspan font-weight="700"> désamine</tspan></text><text x="647.0" y="376.0" font-size="15" fill="#15385f"><tspan font-weight="700">les</tspan><tspan font-weight="700"> cytidines</tspan> du premier brin</text><text x="647.0" y="395.0" font-size="15" fill="#15385f">d’ADN.</text><path d="M758.25,413 L758.25,427" fill="none" stroke="#5b3db8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-5b3db8)"/><rect x="633" y="430" width="250.5" height="37" rx="10" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="647.0" y="452.0" font-size="15" fill="#15385f"><tspan font-weight="700">Hypermutation</tspan> : ADN anormal.</text><rect x="901.5" y="240" width="250.5" height="37" rx="10" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="915.5" y="262.0" font-size="15" fill="#15385f"><tspan font-weight="700">Vif</tspan> se lie à APOBEC3G.</text><path d="M1026.75,280 L1026.75,294" fill="none" stroke="#5b3db8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-5b3db8)"/><rect x="901.5" y="297" width="250.5" height="56" rx="10" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="915.5" y="319.0" font-size="15" fill="#15385f">APOBEC3G part à la</text><text x="915.5" y="338.0" font-size="15" fill="#15385f"><tspan font-weight="700">dégradation</tspan>.</text><path d="M1026.75,356 L1026.75,370" fill="none" stroke="#5b3db8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-5b3db8)"/><rect x="901.5" y="373" width="250.5" height="56" rx="10" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="915.5" y="395.0" font-size="15" fill="#15385f">Elle<tspan font-weight="700"> n’est</tspan><tspan font-weight="700"> pas</tspan><tspan font-weight="700"> incorporée</tspan> dans</text><text x="915.5" y="414.0" font-size="15" fill="#15385f">les virions.</text><path d="M1026.75,432 L1026.75,446" fill="none" stroke="#5b3db8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-5b3db8)"/><rect x="901.5" y="449" width="250.5" height="37" rx="10" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="915.5" y="471.0" font-size="15" fill="#15385f">Transcription inverse normale.</text><rect x="48" y="498" width="250.5" height="36" rx="18" fill="#0f6e51"/><path d="M64,516 l6,6 l12,-13" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/><text x="92.0" y="522.0" font-size="15" fill="#ffffff"><tspan font-weight="700">infection</tspan></text><rect x="316.5" y="498" width="250.5" height="36" rx="18" fill="#b52a35"/><path d="M332.5,509 l13,13 m0,-13 l-13,13" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/><text x="360.5" y="522.0" font-size="15" fill="#ffffff"><tspan font-weight="700">pas</tspan><tspan font-weight="700"> d’infection</tspan></text><rect x="633" y="498" width="250.5" height="36" rx="18" fill="#b52a35"/><path d="M649,509 l13,13 m0,-13 l-13,13" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/><text x="677.0" y="522.0" font-size="15" fill="#ffffff"><tspan font-weight="700">virus</tspan><tspan font-weight="700"> non</tspan><tspan font-weight="700"> fonctionnel</tspan></text><rect x="901.5" y="498" width="250.5" height="36" rx="18" fill="#0f6e51"/><path d="M917.5,516 l6,6 l12,-13" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/><text x="945.5" y="522.0" font-size="15" fill="#ffffff"><tspan font-weight="700">virus</tspan><tspan font-weight="700"> infectieux</tspan></text><rect x="30" y="578" width="1140" height="96" rx="14" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="50.0" y="608.0" font-size="16" fill="#1d4f9e"><tspan font-weight="700">LE</tspan><tspan font-weight="700"> GÉNOME</tspan><tspan font-weight="700"> DU</tspan><tspan font-weight="700"> VIH</tspan></text><rect x="50" y="622" width="182" height="38" rx="8" fill="#ffffff" stroke="#1d4f9e" stroke-width="2"/><text x="62.0" y="647.0" font-size="15" fill="#15385f"><tspan font-weight="700">gag</tspan> · capside, matrice</text><rect x="240" y="622" width="382" height="38" rx="8" fill="#ffffff" stroke="#1d4f9e" stroke-width="2"/><text x="252.0" y="647.0" font-size="15" fill="#15385f"><tspan font-weight="700">pol</tspan> · transcriptase inverse, intégrase, protéase</text><rect x="630" y="622" width="162" height="38" rx="8" fill="#ffffff" stroke="#1d4f9e" stroke-width="2"/><text x="642.0" y="647.0" font-size="15" fill="#15385f"><tspan font-weight="700">vif…</tspan> · petits gènes</text><rect x="800" y="622" width="322" height="38" rx="8" fill="#ffffff" stroke="#1d4f9e" stroke-width="2"/><text x="812.0" y="647.0" font-size="15" fill="#15385f"><tspan font-weight="700">env</tspan> · glycoprotéines d’enveloppe</text></svg>