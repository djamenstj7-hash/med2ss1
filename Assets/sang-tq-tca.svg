<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="TQ et TCA : voies explorées et facteurs à doser"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3c7b9d"/></marker></defs><style>text{font-family:Arial,"Liberation Sans","Helvetica Neue",sans-serif}</style><rect x="0" y="0" width="1200" height="700" rx="26" fill="#eef5fb"/><path d="M0 26Q0 0 26 0H1174Q1200 0 1200 26V104H0Z" fill="#123257"/><text x="40" y="50" font-size="31" font-weight="800" fill="#ffffff">TQ et TCA : quelle voie, quels facteurs ?</text><text x="40" y="83" font-size="17" fill="#c6e4ee">Plasma pauvre en plaquettes (tube citraté bleu) + phospholipides + calcium + activateur de la voie</text><rect x="30" y="124" width="540" height="214" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="54.0" y="164.0" font-size="22" fill="#1d4f9e"><tspan font-weight="700">TQ</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> temps</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> Quick</tspan></text><text x="54.0" y="198.0" font-size="17" fill="#15385f">Activateur :<tspan font-weight="700"> facteur</tspan><tspan font-weight="700"> tissulaire</tspan> (thromboplastine)</text><rect x="52" y="218" width="496" height="70" rx="12" fill="#ffffff" stroke="#bcd3f2" stroke-width="2"/><text x="70.0" y="260.0" font-size="17" fill="#4b6380"><tspan font-weight="700">Voie</tspan><tspan font-weight="700"> extrinsèque</tspan></text><text x="530.0" y="262.0" font-size="24" fill="#1d4f9e" text-anchor="end"><tspan font-weight="700">VII</tspan></text><text x="54.0" y="318.0" font-size="16" fill="#4b6380">TQ ≈ 11–13 s · TP &gt; 70 %</text><rect x="630" y="124" width="540" height="214" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="654.0" y="164.0" font-size="22" fill="#5b3db8"><tspan font-weight="700">TCA</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> temps</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> céphaline</tspan><tspan font-weight="700"> activée</tspan></text><text x="654.0" y="198.0" font-size="17" fill="#15385f">Activateur :<tspan font-weight="700"> phase</tspan><tspan font-weight="700"> contact</tspan> (+ céphaline)</text><rect x="652" y="218" width="496" height="70" rx="12" fill="#ffffff" stroke="#d9c8f3" stroke-width="2"/><text x="670.0" y="260.0" font-size="17" fill="#4b6380"><tspan font-weight="700">Voie</tspan><tspan font-weight="700"> intrinsèque</tspan></text><text x="1130.0" y="262.0" font-size="24" fill="#5b3db8" text-anchor="end"><tspan font-weight="700">XII</tspan><tspan font-weight="700"> →</tspan><tspan font-weight="700"> XI</tspan><tspan font-weight="700"> →</tspan><tspan font-weight="700"> IX</tspan><tspan font-weight="700"> →</tspan><tspan font-weight="700"> VIII</tspan></text><text x="654.0" y="318.0" font-size="16" fill="#4b6380">Ratio malade / témoin &lt; 1,2</text><rect x="330" y="386" width="540" height="128" rx="16" fill="#e1f3f3" stroke="#a9d8d8" stroke-width="2"/><text x="354.0" y="424.0" font-size="20" fill="#0f6466"><tspan font-weight="700">VOIE</tspan><tspan font-weight="700"> COMMUNE</tspan></text><text x="600.0" y="464.0" font-size="25" fill="#0f6466" text-anchor="middle"><tspan font-weight="700">X</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> V</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> II</tspan><tspan font-weight="700"> ·</tspan><tspan font-weight="700"> fibrinogène</tspan></text><text x="600.0" y="496.0" font-size="16" fill="#4b6380" text-anchor="middle">→ premières traces de fibrine : fin de la mesure</text><path d="M300,342 C300,368 420,360 470,380" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M900,342 C900,368 780,360 730,380" fill="none" stroke="#3c7b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="30.0" y="544.0" font-size="17" fill="#15385f"><tspan font-weight="700">En</tspan><tspan font-weight="700"> seconde</tspan><tspan font-weight="700"> intention,</tspan><tspan font-weight="700"> les</tspan><tspan font-weight="700"> dosages</tspan><tspan font-weight="700"> de</tspan><tspan font-weight="700"> facteurs</tspan><tspan font-weight="700"> sont</tspan><tspan font-weight="700"> orientés</tspan><tspan font-weight="700"> par</tspan><tspan font-weight="700"> le</tspan><tspan font-weight="700"> TQ</tspan><tspan font-weight="700"> et</tspan><tspan font-weight="700"> le</tspan><tspan font-weight="700"> TCA</tspan><tspan font-weight="700"> :</tspan></text><rect x="30" y="556" width="364" height="118" rx="16" fill="#f4edfc" stroke="#d9c8f3" stroke-width="2"/><text x="50.0" y="590.0" font-size="18" fill="#5b3db8"><tspan font-weight="700">TCA</tspan><tspan font-weight="700"> seul</tspan><tspan font-weight="700"> allongé</tspan></text><text x="50.0" y="622.0" font-size="17" fill="#15385f">→ doser<tspan font-weight="700"> XII,</tspan><tspan font-weight="700"> XI,</tspan><tspan font-weight="700"> IX,</tspan><tspan font-weight="700"> VIII</tspan></text><text x="50.0" y="646.0" font-size="15" fill="#4b6380">Déficit en XII : TCA long<tspan font-weight="700"> sans</tspan> saignement</text><rect x="418" y="556" width="364" height="118" rx="16" fill="#e6f0fc" stroke="#bcd3f2" stroke-width="2"/><text x="438.0" y="590.0" font-size="18" fill="#1d4f9e"><tspan font-weight="700">TQ</tspan><tspan font-weight="700"> seul</tspan><tspan font-weight="700"> allongé</tspan><tspan font-weight="700"> (TP</tspan><tspan font-weight="700"> bas)</tspan></text><text x="438.0" y="622.0" font-size="17" fill="#15385f">→ doser<tspan font-weight="700"> VII</tspan></text><rect x="806" y="556" width="364" height="118" rx="16" fill="#e1f3f3" stroke="#a9d8d8" stroke-width="2"/><text x="826.0" y="590.0" font-size="18" fill="#0f6466"><tspan font-weight="700">TQ</tspan><tspan font-weight="700"> et</tspan><tspan font-weight="700"> TCA</tspan><tspan font-weight="700"> allongés</tspan></text><text x="826.0" y="622.0" font-size="17" fill="#15385f">→ voie commune :<tspan font-weight="700"> X,</tspan><tspan font-weight="700"> V,</tspan><tspan font-weight="700"> II,</tspan><tspan font-weight="700"> fibrinogène</tspan></text></svg>