r la page 11 du CM.","page":"11","format":"QRU","lessonId":"cm-b60fb75949097685","source":{"label":"Ronéo & Juliette 2026–2027 · 16 pages","url":"https://drive.google.com/file/d/19lyloIBLN6hcFdvnr-b2cOlK7Zmem7Sx/view","pages":16}}],"cases":[{"title":"Un hémogramme à interpréter","vignette":"Situation pédagogique fictive : l’hémogramme indique 10 G/L de leucocytes, dont 50 % de neutrophiles. Le clinicien cherche ensuite à comprendre le potentiel de régénération érythrocytaire.","questions":[{"question":"Combien de neutrophiles par litre cela représente-t-il ?","options":["5 G/L","50 G/L","0,5 G/L","10 G/L"],"correct":[0],"explanation":"10 × 50 % = 5 G/L. La valeur absolue importe davantage que le seul pourcentage.","page":"3","format":"QRU","id":"sang-dc-01-01"},{"question":"Pour apprécier la réponse de la moelle dans la lignée érythrocytaire, quel élément du cours est particulièrement informatif ?","options":["La proportion de basophiles","La présence de réticulocytes","La seule couleur du plasma","Le nombre de monocytes exclusivement"],"correct":[1],"explanation":"Les réticulocytes permettent d’apprécier la régénération érythrocytaire, car ils sont des globules rouges jeunes ayant expulsé leur noyau.","page":"7","format":"QRU","id":"sang-dc-01-02"},{"question":"Quel énoncé relie correctement une fonction et un facteur de croissance ?","options":["G-CSF : production des globules rouges","EPO : neutrophiles","G-CSF : neutrophiles","Éosine : croissance des plaquettes"],"correct":[2],"explanation":"Le G-CSF stimule les neutrophiles ; l’EPO stimule la production érythrocytaire.","page":"8","format":"QRU","id":"sang-dc-01-03"},{"question":"Quels stades sont situés en amont des cellules sanguines matures ?","options":["CSH","Progéniteurs","Précurseurs","Uniquement le plasma"],"correct":[0,1,2],"explanation":"Le modèle du cours distingue CSH, progéniteurs et précurseurs avant l’état mature.","page":"5","format":"QRM","id":"sang-dc-01-04"}],"id":"sang-dc-01"},{"id":"sang-dc-02","title":"Dans le laboratoire de l’hémogramme","vignette":"Situation pédagogique fictive : un étudiant reçoit une formule de 12 G/L de leucocytes avec 60 % de neutrophiles. Il doit interpréter la valeur absolue, puis proposer l’étape de raisonnement adaptée à la production sanguine.","questions":[{"id":"sang-dc-02-01","question":"Combien de neutrophiles sont présents en valeur absolue ?","options":["72 G/L","6 G/L","0,6 G/L","7,2 G/L"],"correct":[3],"explanation":"12 × 0,60 = 7,2 G/L.","page":"3","format":"QRU"},{"id":"sang-dc-02-02","question":"Pourquoi le pourcentage seul peut-il être insuffisant ?","options":["Il n’exprime pas le nombre absolu de cellules","Il est toujours égal au nombre de leucocytes","Il indique le taux d’EPO","Il mesure la concentration médullaire"],"correct":[0],"explanation":"La proportion doit être multipliée par le nombre total de leucocytes.","page":"3","format":"QRU"},{"id":"sang-dc-02-03","question":"Quel groupe représente les granulocytes selon le cours ?","options":["Lymphocytes","Neutrophiles","Éosinophiles","Basophiles"],"correct":[1,2,3],"explanation":"Neutrophiles, éosinophiles et basophiles forment les granulocytes.","page":"3","format":"QRM"},{"id":"sang-dc-02-04","question":"Pour examiner directement le compartiment médullaire, on réalise plutôt...","options":["Un dosage du Ki","Une spirométrie","Un myélogramme","Une auscultation seule"],"correct":[2],"explanation":"Un myélogramme consiste en une aspiration médullaire puis examen de cellules.","page":"4","format":"QRU"},{"id":"sang-dc-02-05","question":"Dans ce cours, quel facteur favorise la production de neutrophiles ?","options":["EPO","Éosine","Hémoglobine","G-CSF"],"correct":[3],"explanation":"Le G-CSF est associé à la lignée neutrophile.","page":"8","format":"QRU"}]},{"id":"sang-dc-03","title":"La réponse de la moelle osseuse","vignette":"Situation fictive d’apprentissage : devant une baisse d’hématies, on cherche à comprendre si la moelle fournit de nouveaux globules e pour fatigue. Le bilan fourni par l’enseignant montre une hémoglobine abaissée, un VGM de 72 fL et une ferritine basse. L’étudiant doit relier ces données aux notions du CM, sans prendre de décision thérapeutique.","questions":[{"id":"sang-dc-04-01","question":"Quel qualificatif décrit un VGM de 72 fL selon les repères du cours ?","options":["Microcytaire","Macrocytaire","Normocytaire supérieur à 100","Mégaloblastique par définition"],"correct":[0],"explanation":"VGM < 80 fL = microcytose selon le support.","page":"5","format":"QRU","source":{"title":"Les cellules matures du sang — Dr Duployez (CM 10 pages)","url":"https://drive.google.com/file/d/12_208_I2Dg_TKRp_SujyTVA4WE1VodJ0/view"},"lessonId":"cm-22ef8ab1d84a9a4e"},{"id":"sang-dc-04-02","question":"La ferritine basse oriente d’abord vers...","options":["Un déficit des réserves de fer","Une mutation HbS obligatoire","Une production accrue d’histamine","Un déficit de GPIIb/IIIa"],"correct":[0],"explanation":"La ferritine est décrite comme le marqueur des réserves en fer.","page":"5","format":"QRU","source":{"title":"Les cellules matures du sang — Dr Duployez (CM 10 pages)","url":"https://drive.google.com/file/d/12_208_I2Dg_TKRp_SujyTVA4WE1VodJ0/view"},"lessonId":"cm-22ef8ab1d84a9a4e"},{"id":"sang-dc-04-03","question":"Quel rôle physiologique du fer explique les hématies petites ?","options":["Synthèse d’hémoglobine","Production de sélectines","Fabrication d’histamine","Pont plaquettaire"],"correct":[0],"explanation":"Le fer est indispensable pour fabriquer l’hémoglobine.","page":"5","format":"QRU","source":{"title":"Les cellules matures du sang — Dr Duployez (CM 10 pages)","url":"https://drive.google.com/file/d/12_208_I2Dg_TKRp_SujyTVA4WE1VodJ0/view"},"lessonId":"cm-22ef8ab1d84a9a4e"},{"id":"sang-dc-04-04","question":"Quelles caractéristiques du profil du CM sont compatibles avec une carence martiale ?","options":["Microcytose","Hypochromie","Ferritine basse","VGM > 120 fL obligatoire"],"correct":[0,1,2],"expla ie + neutrophilie + thrombocytose","Anémie + neutropénie + thrombopénie","Lymphocytose + thrombocytose + polyglobulie","Seule diminution des leucocytes"],"correct":[1],"explanation":"Anémie + neutropénie + thrombopénie — Définitions. Voir la page 14 du CM.","page":"14","format":"QRU","lessonId":"cm-b60fb75949097685","source":{"label":"Ronéo & Juliette 2026–2027 · 16 pages","url":"https://drive.google.com/file/d/19lyloIBLN6hcFdvnr-b2cOlK7Zmem7Sx/view","pages":16}},{"id":"sang-v09-dc-b60fb7-02","question":"Neutropénie dans ce cours : PNN…","options":["Supérieurs à 7 G/L","Inférieurs à 1,5 G/L","Supérieurs à 4 G/L","Inférieurs à 150 G/L"],"correct":[1],"explanation":"Inférieurs à 1,5 G/L — Neutropénie. Voir la page 8 du CM.","page":"8","format":"QRU","lessonId":"cm-b60fb75949097685","source":{"label":"Ronéo & Juliette 2026–2027 · 16 pages","url":"https://drive.google.com/file/d/19lyloIBLN6hcFdvnr-b2cOlK7Zmem7Sx/view","pages":16}},{"id":"sang-v09-dc-b60fb7-03","question":"Le diagnostic d’anémie repose d’abord sur…","options":["Le pourcentage de lymphocytes","Le nombre de leucocytes totaux","La concentration en hémoglobine","La forme des basophiles"],"correct":[2],"explanation":"La concentration en hémoglobine — Anémie. Voir la page 9 du CM.","page":"9","format":"QRU","lessonId":"cm-b60fb75949097685","source":{"label":"Ronéo & Juliette 2026–2027 · 16 pages","url":"https://drive.google.com/file/d/19lyloIBLN6hcFdvnr-b2cOlK7Zmem7Sx/view","pages":16}},{"id":"sang-v09-dc-b60fb7-04","question":"Quel seuil définit la thrombopénie ?","options":["Plaquettes > 450 G/L","Plaquettes < 150 G/L","Plaquettes < 10 G/L uniquement","Plaquettes > 20 G/L"],"correct":[1],"explanation":"Plaquettes < 150 G/L — Plaquettes. Voir la page 13 du CM.","page":"13","format":"QRU","lessonId":"cm-b60fb75949097685","source":{"label":"Ronéo & Juliette 2026–2027 · 16 pages","url":"https://drive.google.com/file/d/19lyloIBLN6hcFdvnr-b2cOlK7Zmem7Sx/view","pages":16}},{"id":"sang-v09-dc-b60fb7-05","question":" <script>

let cat=fallback('default-catalogue'), exams=fallback('default-examens').exams, modes=fallback('default-modalites');
let trainingData=fallback('default-entrainements'); let training={subject:null,mode:'qi',index:0,selected:[]}; let pedagogie=fallback('default-pedagogie'); let learning={id:null,tab:'story',card:0,shown:false,quizPage:0};
const lesson=id=>pedagogie.lessons?.[id];

const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(st))}catch(e){alert('La mémoire locale est pleine. Exporte ta progression depuis Suivi.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const diff=date=>Math.ceil((new Date(date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);

const subjects=()=>cat.subjects||[];
const syncCounts=()=>{for(const s of subjects()){s.cmCount=cat.resources.filter(r=>r.subject===s.id&&r.kind==='cm').length;s.annaleCount=cat.resources.filter(r=>r.subject===s.id&&r.kind==='annale').length;}};
syncCounts();
const subject=id=>subjects().find(s=>s.id===id)||{name:id,date:'2099-01-01'};

const evalOf=id=>modes.subjectModes?.[id]||null;
const examFormats=id=>{const m=evalOf(id);return m?m.components.map(c=>c.label+(c.percent===null?'':` (${c.percent} %)`)).join(' · '):'Modalités à préciser';};

 const coef=String(m.coefficient).replace('.',',');
 return `<div class="eval-info"><span class="tag">Coef. ${esc(coef)} · ${esc(m.points)} pts</span><span class="tiny">${esc(m.duration||'Durée selon Moodle')} · ${esc(m.ects)} ECTS</span><p style="margin:6px 0 0;font-size:13px"><strong>Format :</strong> ${esc(examFormats(id))}</p></div>`;}

const gradeOf=id=>st.memory[id]||{count:0,step:0};
const nextExam=()=>[...exams].filter(x=>diff(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];
function urg(subjectId){const e=exams.filter(x=>x.subject===subjectId&&diff(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];if(!e)return 0.5;let d=diff(e.date);return d<=7?8:d<=21?5:d<=45?3:d<=75?1.5:1;}
function rank(r){const m=gradeOf(r.id);let due=m.nextDue&&m.nextDue<=today()?6:0;const lag=m.count?Math.max(0,5-m.step):2;return urg(r.subject)*(10+Math.max(0,(evalOf(r.subject)?.coefficient||1)-1)*1.5)+due+lag+(m.lastScore==='forgot'?12:0)}
function dueRecalls(){return cms().filter(r=>st.memory[r.id]?.nextDue&&st.memory[r.id].nextDue<=today()).sort((a,b)=>rank(b)-rank(a));}
function cycles(){return cms().filter(r=>!st.cycleDone.includes(r.id));}
function missionBatch(){const active=cms();if(!active.length)return [];
 let pending=cycles();const left=Math.max(1,st.pace-(st.activeDay%st.pace));const num=Math.max(1,Math.ceil(pending.length/left));
 // Blend subjects instead of showing a wall of the same subject; exam urgency still controls order.
 const bins={};for(const r of pending){(bins[r.subject]??=[]).push(r)}
 for(const arr of Object.values(bins))arr.sort((a,b)=>rank(b)-rank(a)||a.id.localeCompare(b.id));
 const subjectOrder=Object.keys(bins).sort((a,b)=>(urg(b)*(1+0.08*((evalOf(b)?.coefficient||1)-1)))-(urg(a)*(1+0.08*((evalOf(a)?.coefficient||1)-1)))||a.localeCompare(b));
 const chosen=[];while(chosen.length<num){let added=0;for(const key of subjectOrder){if(bins[key].length){chosen.push(bins[key].shift());added++;if(chosen.length>=num)break;}}if(!added)break;}
 return chosen;
}
function stage(r){const m=gradeOf(r.id);return !m.count?'Découverte':m.lastScore==='forgot'?'Renforcement':'Consolidation'}

function missions(){const missions=missionBatch(), due=dueRecalls(), left=cycles().length;const count=Math.max(1,Math.ceil(left/Math.max(1,st.pace-st.activeDay%st.pace)));return `${mast()}<main class="shell"><div class="topbar"><h1>Missions du Jour</h1><span class="tag pink">Jour actif ${st.activeDay+1}</span></div><p class="subtle">Trois rythmes. Aucune pénalité si tu ne viens pas. Les dates d'examen modifient la priorité, pas la couverture totale.</p><div class="panel"><div class="speed">${[[21,'Chill'],[14,'Normal'],[7,'Intense']].map(([n,t])=>`<button class="${st.pace===n?'active':''}" data-action="pace" data-id="${n}">${t}<br><span style="font-weight:500;font-size:10px">${n} jours</span></button>`).join('')}</div><div style="margin-top:13px"><div class="row between"><strong style="font-size:13px">Cycle en cours</strong><span class="tiny">${st.cycleDone.length}/${cms().length} CM abordés</span></div>${bar(st.cycleDone.length,cms().length)}</div><p class="subtle" style="margin-bottom:0">${left?`~${count} points de contact avec les cours aujourd'hui pour terminer le cycle en ${st.pace} jours actifs.`:'Tous les CM indexés ont été abordés dans ce cycle.'} Un point de contact ne signifie pas qu’un cours entier est maîtrisé.</p></div>${due.length?`<section class="section"><div class="row between"><h2>🧠 Rappels échus</h2><span class="tag warn">${due.length}</span></div><p class="subtle">Rappelle la notion sans la relire, puis vérifie seulement en cas d’oubli.</p>${due.slice(0,st.expanded?due.length:3).map((r,i)=>missionCard(r,true)).join('')}</section>`:''}<section class="section"><div class="row between"><h2>🎯 Cycle de couverture</h2><span class="tag">${missions.length} CM</span></div>${missions.length?missions.slice(0,st.expanded?missions.length:3).map(r=>missionCard(r,false)).join(''):'<div class="notice success">Bravo, le passage complet est terminé. Relance un nouveau cycle quand tu es prêt.</div>'}${(missions.length>3||due.length>3)?`<button class="btn secondary" data-action="expand">${st.expanded?'Réduire les missions':'Afficher toutes les missions du jour'}</button>`:''}<div class="actions" style="margin-top:13px"><button class="btn" data-action="nextday">Clore cette journée active →</button>${!left?'<button class="btn secondary" data-action="resetcycle">Commencer un nouveau cycle</button>':''}</div></section><section class="section"><div class="panel"><h2>🎯 Entraînement aux épreuves de novembre</h2><p class="subtle">Lance un exercice conforme à la structure évaluée. Les réponses s'enregistrent localement. Les dossiers sont fictifs.</p><div class="train-cta">${['semio','sang','immuno','bmct'].map(key=>`<button class="btn secondary small" data-action="training-open" data-id="${key}">${esc(subject(key).name)} →</button>`).join('')}</div></div></section><section class="section"><div class="notice">📅 Les rappels suivent une base J+1, J+3, J+7, J+14, J+30, ajustée par ton autoévaluation. Pas de notification automatique pour le moment.</div></section></main>`}

function trainSet(){return trainingData.subjects?.[training.subject]||null;}
function trainItems(){const set=trainSet();if(!set)return [];return training.mode==='qi'?set.qi:set.cases.flatMap(c=>c.questions.map(q=>({...q,caseTitle:c.title,vignette:c.vignette,caseId:c.id})));}
function trainSummary(subj){const set=trainingData.subjects?.[subj];if(!set)return '';const all=[...set.qi,...set.cases.flatMap(c=>c.questions)];let count=all.filter(q=>st.trainingAnswers?.[q.id]).length;return `${count}/${all.length} questions traitées`}
function openTraining(subj,mode='qi'){
 training={subject:subj,mode,index:0,selected:[]};drawTraining(true);
}
function correctFor(q,selected){return q.correct.slice().sort((a,b)=>a-b).join(',')===selected.slice().sort((a,b)=>a-b).join(',');}
function drawTraining(reset=false){
 const before=modal.querySelector('.modal')?.scrollTop||0;const key=training.subject;const set=trainSet();
 if(!set){
 const l=Object.values(pedagogie.lessons||{}).filter(x=>x.subject===key);
 const total=l.reduce((n,x)=>n+(x.qcm?.length||0),0);
 modal.innerHTML=`<div class="modalbg" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true"><div class="row between"><span class="tag">Sémiologie · QI en QCM</span><button class="btn ghost small" data-action="close-modal">✕ Fermer</button></div><h2>QCM individuels de sémiologie</h2><p class="subtle">La sémiologie est évaluée uniquement par QCM indépendants. Les QCM déjà créés sont à réponse unique ; la proportion éventuelle de QRU et de QRM à l'examen n'est pas connue.</p><div class="notice">${total} QCM disponibles dans les trois premiers modules. Aucun dossier clinique ou QROC en simulation de sémiologie.</div>${l.map(x=>`<div class="source" style="justify-content:space-between;gap:9px"><strong>${esc(x.title)}</strong><button class="btn small" data-action="training-semio-lesson" data-id="${esc(x.id)}">${x.qcm.length} QCM →</button></div>`).join('')}<p class="tiny">Les autres chapitres de sémiologie seront intégrés progressivement.</p></div></div>`;return;
 }
 const items=trainItems(),n=items.length;if(!n){modal.innerHTML='';return;}training.index=Math.max(0,Math.min(training.index,n-1));const q=items[training.index],a=st.trainingAnswers?.[q.id]||null,selected=a?a.selected:training.selected;const done=items.filter(x=>st.trainingAnswers?.[x.id]).length,good=items.filter(x=>st.trainingAnswers?.[x.id]?.correct).length;
 const source=q.source||set.source,linkedLesson=q.lessonId||set.lessonId;
 const opts=q.options.map((opt,i)=>`<button type="button" data-action="train-toggle" data-id="${i}" ${a?'disabled':''} class="train-option ${selected.includes(i)?'picked':''} ${a&&q.correct.includes(i)?'right':''} ${a&&selected.includes(i)&&!q.correct.includes(i)?'wrong':''}"><strong>${'ABCD'[i]}.</strong> ${esc(opt)} ${selected.includes(i)?'●':''}</button>`).join('');

function drawLesson(reset=false){
 const l=lesson(learning.id);if(!l)return;
 const before=modal.querySelector('.modal')?.scrollTop||0;
 const tabs=[['story','📖 Cours intéressant'],['summary','⚡ Synthèse'],['qcm',`🧠 ${l.qcm.length} QCM`],['cards',`🃏 ${l.flashcards.length} cartes`],['source','📄 Source']];
 const tabsHtml=tabs.map(([id,label])=>`<button class="${learning.tab===id?'active':''}" data-action="lesson-tab" data-id="${id}">${label}</button>`).join('');
 const sourceLine=`<p class="note">Source : ${esc(l.source.label)} · Pr ${esc(l.teacher.replace(/^Pr\s*/,''))}. Les pages indiquées renvoient au PDF.</p>`;
 const intro=`<div class="learning-head"><span class="tag green">${esc(subject(l.subject).name)}</span><h3>${esc(l.title)}</h3><p class="subtle" style="margin:0">${esc(l.hook)}</p></div>`;
 const flags=l.flags?.length?`<details class="lesson-warning"><summary style="cursor:pointer;font-weight:800">⚠️ ${l.flags.length} points de vigilance du cours source (appuyer pour lire)</summary>${l.flags.map(x=>`<p>${esc(x)}</p>`).join('')}</details>`:'';
 const flowSteps=l.flow||['Premier contact','Interrogatoire','Examen physique','Décision et information'];
 const flow=`<div class="logic-chain">${flowSteps.map((x,i)=>`${i?'<b>→</b>':''}<span>${esc(x)}</span>`).join('')}</div>`;
 let body='';
 if(learning.tab==='story')body=`${intro}${flow}${flags}${l.sections.map((sect,i)=>`<section class="lesson-section"><span class="lesson-pages">PARTIE ${i+1} · PDF p. ${esc(sect.pages)}</span><h3>${esc(sect.heading)}</h3>${sect.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${sect.visual?(v08Diagram(sect.visual)||v09Diagram(sect.visual)):''}<div class="lesson-memory"><strong>À retenir :</strong> ${esc(sect.memory)}</div></section>`).join('')}`;
 if(learning.tab==='summary')body=`<div class="learning-head"><h3>Le chapitre en ${l.summary.length} idées</h3><p class="subtle">Synthèse fidèle au cours. Utilise-la pour réactiver tes connaissances avant l'examen.</p></div>${flow}${l.summary.map((s,i)=>`<div class="lesson-section"><span class="lesson-pages">REPÈRE ${i+1} · p. ${esc(s.pages)}</span><h3>${esc(s.name)}</h3><p>${esc(s.detail)}</p></div>`).join('')}`;
 if(learning.tab==='qcm'){
  const done=l.qcm.filter((_,i)=>st.quizAnswers?.[`${l.id}#${i}`]!==undefined).length;
  const good=l.qcm.filter((q,i)=>st.quizAnswers?.[`${l.id}#${i}`]?.choice===q.answer).length;
  const perPage=10, totalPages=Math.max(1,Math.ceil(l.qcm.length/perPage));
  learning.quizPage=Math.max(0,Math.min(learning.quizPage||0,totalPages-1));
  const page=learning.quizPage, start=page*perPage, end=Math.min(l.qcm.length,start+perPage);
  const pct=done?Math.round(100*good/done):0;
  body=`<div class="learning-head"><h3>${l.qcm.length} QCM · ${done} réponses enregistrées</h3><p class="subtle">${done?`${good} correctes sur ${done} réponses (${pct} %).`: 'Réponds, puis lis l’explication.'} Questions pédagogiques inédites, non issues d’annales. Correction et page du PDF pour chaque réponse.</p><div class="quiz-meter"><span style="width:${Math.round(100*done/(l.qcm.length||1))}%"></span></div><p class="tiny">Série ${page+1} / ${totalPages} · questions ${start+1} à ${end}</p></div>${l.qcm.slice(start,end).map((q,local)=>{const i=start+local,a=st.quizAnswers?.[`${l.id}#${i}`];return `<article class="qitem"><span class="lesson-pages">QUESTION ${i+1} · PDF p. ${esc(q.pages)}${q.topic?' · '+esc(q.topic):''}</span><h3>${esc(q.q)}</h3>${q.choices.map((c,j)=>`<button class="qchoice ${a&&a.choice===j?(j===q.answer?'selected-correct':'selected-wrong'):''}" data-action="quiz-answer" data-id="${i}:${j}">${'ABCD'[j]}. ${esc(c)} ${a&&j===q.answer?'✓':''}</button>`).join('')}${a?`<div class="qfeedback"><strong>${a.choice===q.answer?'✅ Exact':'🔎 À revoir'}</strong><p style="margin:5px 0 0">${esc(q.why)} Réponse : ${'ABCD'[q.answer]}.</p></div>`:''}</article>`}).join('')}<div class="quiz-pagination"><button class="btn secondary" data-action="quiz-page" data-id="${page-1}" ${page===0?'disabled':''}>← Précédente</button><span class="tiny">${page+1} / ${totalPages}</span><button class="btn" data-action="quiz-page" data-id="${page+1}" ${page>=totalPages-1?'disabled':''}>Suivante →</button></div>`;
 }
 if(learning.tab==='cards'){
  const i=learning.card,q=l.flashcards[i],a=st.flashcards?.[`${l.id}#${i}`];
  body=`<div class="learning-head"><h3>Flashcards · ${i+1}/${l.flashcards.length}</h3><p class="subtle">Rappelle la réponse sans regarder ; retourne ensuite la carte.</p></div><div class="fc ${learning.shown?'answer':''}">${esc(learning.shown?q.a:q.q)}</div><p class="tiny">Source PDF : p. ${esc(q.pages)} ${a?'· Dernière autoévaluation : '+esc(a.result):''}</p><div class="actions" style="margin:16px 0">${learning.shown?`<button class="btn secondary" data-action="card-mark" data-id="again">🔁 À retravailler</button><button class="btn" data-action="card-mark" data-id="good">✅ Je savais</button>`:`<button class="btn" data-action="card-reveal">Afficher la réponse</button>`}</div><div class="actions"><button class="btn ghost small" data-action="card-prev" ${i===0?'disabled':''}>← Précédente</button><button class="btn ghost small" data-action="card-next" ${i===l.flashcards.length-1?'disabled':''}>Suivante →</button></div>`;
 }
 if(learning.tab==='source')body=`<div class="learning-head"><h3>Retrouver le cours original</h3><p class="subtle">${esc(l.editorialNote)}</p></div>${flags}${sourceLine}<p>Les descriptions complètes, les illustrations cliniques et le texte original se trouvent dans la ronéo.</p><a href="${esc(l.source.url)}" class="btn" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none">Ouvrir le PDF sur Drive ↗</a><p class="note" style="margin-top:17px">La réécriture et les exercices sont des supports pédagogiques nouveaux, fondés exclusivement sur le chapitre cité. Ils ne remplacent pas le document original.</p>`;
 modal.innerHTML=`<div class="modalbg" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="Module pédagogique"><div class="row between"><span class="tag">✨ Module pédagogique</span><button class="btn ghost small" data-action="close-modal">✕ Fermer</button></div><div class="lesson-tabs">${tabsHtml}</div>${body}<hr class="divider">${sourceLine}</div></div>`;
 const el=modal.querySelector('.modal');if(el)el.scrollTop=reset?0:before;
}
function grade(score){if(!st.currentMission)return;const id=st.currentMission, r=cms().find(x=>x.id===id);if(!r)return;const prev=gradeOf(id);const step=score==='good'?(prev.count?Math.min(4,(prev.step||0)+1):0):score==='partial'?Math.max(0,(prev.step||0)):0;const days=[1,3,7,14,30][step];const nd=new Date(today()+'T12:00:00');nd.setDate(nd.getDate()+days);const due=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}-${String(nd.getDate()).padStart(2,'0')}`;
st.memory[id]={count:(prev.count||0)+1,step,lastScore:score,nextDue:due,lastReviewed:today()};if(!st.cycleDone.includes(id))st.cycleDone.push(id);st.history.push({id,subject:r.subject,date:today(),score});save();closeModal();render();toast('Autoévaluation enregistrée · prochain rappel '+due)}
function toast(message){let box=document.createElement('div');box.setAttribute('role','status');box.style.cssText='position:fixed;z-index:90;left:15px;right:15px;bottom:95px;max-width:550px;margin:auto;background:#142f4f;color:white;border-radius:13px;padding:13px 16px;box-shadow:0 6px 24px #0003;text-align:center;font-size:13px';box.textContent=message;document.body.appendChild(box);setTimeout(()=>box.remove(),3000)}
function download(name,text,mime='application/json'){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
const importer=(catalog)=>{if(!catalog||!Array.isArray(catalog.resources)||!Array.isArray(catalog.subjects)||catalog.schemaVersion!==1)throw Error('Schéma de manifeste invalide.');const ids=new Set();for(const r of catalog.resources){if(!r.id||!r.subject||!r.kind||!r.title||ids.has(r.id))throw Error('Entrée de document manquante ou dupliquée.');ids.add(r.id)}for(const s of catalog.subjects){if(!s.id||!s.name)throw Error('Matière incomplète.')}cat=catalog;syncCounts();localStorage.setItem(OVERRIDE,JSON.stringify(catalog));st.cycleDone=st.cycleDone.filter(id=>ids.has(id));save();render()};
function fileImport(type){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const f=input.files[0];if(!f)return;const j=JSON.parse(await f.text());if(type==='state'){if(!j||j.app!=='med2-s1'||!j.state)throw Error('Cette sauvegarde n’appartient pas à MED2 S1.');st={...defaultState,...j.state};save();render();toast('Sauvegarde importée.')}else{importer(j);toast('Nouveau catalogue importé localement : '+cat.resources.length+' documents.')}}catch(e){alert('Import impossible : '+e.message)}};input.click();}
app.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const x=document.getElementById('search');if(x){x.focus();x.setSelectionRange(pos,pos)}}});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action,id=btn.dataset.id;if(act==='nav'){st.view=id;st.expanded=false;save();render();scrollTo({top:0,behavior:'instant'})}
if(act==='settings'){st.view='settings';save();render();scrollTo(0,0)}if(act==='subject'){st.selectedSubject=id;save();render();document.getElementById('subject-detail')?.scrollIntoView({behavior:'smooth'})}
if(act==='close-subject'){st.selectedSubject=null;save();render()}
if(act==='pace'){st.pace=Number(id);save();render()}
if(act==='expand'){st.expanded=!st.expanded;save();render()}
if(act==='open-mission'){const r=cms().find(r=>r.id===id);if(r)missionDialog(r)}
if(act==='training-open')openTraining(id);
 if(act==='training-semio-lesson')beginLesson(id,'qcm');
  if(act==='train-open-lesson'&&lesson(id))beginLesson(id,'story');
 if(act==='train-mode'){training.mode=id;training.index=0;training.selected=[];drawTraining(true)}
 if(act==='train-prev')trainMove(-1);
 if(act==='train-next')trainMove(1);
 if(act==='train-toggle'){const items=trainItems(),q=items[training.index],i=Number(id);if(q&&!st.trainingAnswers?.[q.id]&&q.options[i]!==undefined){if(q.format==='QRU')training.selected=[i];else training.selected=training.selected.includes(i)?training.selected.filter(x=>x!==i):[...training.selected,i];drawTraining()}}
 if(act==='train-check'){const q=trainItems()[training.index];if(q&&training.selected.length&&!st.trainingAnswers?.[q.id]){st.trainingAnswers??={};st.trainingAnswers[q.id]={selected:training.selected.slice(),correct:correctFor(q,training.selected),date:today()};save();drawTraining()}}
 if(act==='open-lesson')beginLesson(id,'story');
if(act==='quick-quiz')beginLesson(id,'qcm');
if(act==='quick-cards')beginLesson(id,'cards');
if(act==='lesson-tab'){learning.tab=id;learning.shown=false;drawLesson(true)}
if(act==='quiz-answer'&&learning.id){const [i,j]=id.split(':').map(Number);const l=lesson(learning.id);if(l?.qcm?.[i]?.choices?.[j]!==undefined){st.quizAnswers??={};st.quizAnswers[`${learning.id}#${i}`]={choice:j,at:today()};save();drawLesson();}}
if(act==='quiz-page'&&learning.id){learning.quizPage=Number(id)||0;drawLesson(true)}
if(act==='card-reveal'){learning.shown=true;drawLesson()}
if(act==='card-next'&&learning.id){learning.card=Math.min(lesson(learning.id).flashcards.length-1,learning.card+1);learning.shown=false;drawLesson(true)}
if(act==='card-prev'&&learning.id){learning.card=Math.max(0,learning.card-1);learning.shown=false;drawLesson(true)}
if(act==='card-mark'&&learning.id){st.flashcards??={};st.flashcards[`${learning.id}#${learning.card}`]={result:id,at:today()};save();if(learning.card<lesson(learning.id).flashcards.length-1){learning.card++;learning.shown=false;drawLesson(true)}else{toast(`${lesson(learning.id).flashcards.length} cartes parcourues.`);drawLesson()}}
if(act==='close-modal'){if(e.target.classList.contains('modalbg')||btn!==e.target.closest('.modal'))closeModal()}
if(act==='grade')grade(id)
if(act==='nextday'){if(confirm('Clore cette journée de révision ? Les tâches non faites ne provoqueront aucune pénalité.')){st.activeDay+=1;st.expanded=false;save();render();toast('Nouvelle journée active prête')}}
if(act==='resetcycle'){if(confirm('Recommencer une rotation ? Les mémorisations et rappels déjà enregistrés seront conservés.')){st.cycleDone=[];st.activeDay=0;save();render()}}
if(act==='export')download('MED2_S1_sauvegarde_'+today()+'.json',JSON.stringify({app:'med2-s1',version:1,exported:today(),state:st},null,2))
if(act==='import-state')fileImport('state')
if(act==='import-catalogue')fileImport('catalogue')
if(act==='reload'){localStorage.removeItem(OVERRIDE);location.reload()}
if(act==='open-semio')window.open('https://djamenstj7-hash.github.io/semiomed2/','_blank','noopener')
if(act==='clear'){if(confirm('Effacer uniquement la progression MED2 S1 de cet appareil ? Sémio MED2 restera intact.')){localStorage.removeItem(STORE);st={...defaultState};render()}}
});
async function hydrate(){try{const response=await fetch('./data/catalogue.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(j.schemaVersion===1&&Array.isArray(j.resources))cat=j;}}catch{}
try{const response=await fetch('./data/examens.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(Array.isArray(j.exams))exams=j.exams;}}catch{}
try{const override=JSON.parse(localStorage.getItem(OVERRIDE)||'null');if(override?.schemaVersion===1){const ids=new Set(cat.resources.map(x=>x.id));for(const r of override.resources||[]){if(!ids.has(r.id)){cat.resources.push(r);ids.add(r.id)}}const sids=new Set(cat.subjects.map(x=>x.id));for(const s of override.subjects||[]){if(!sids.has(s.id)){cat.subjects.push(s);sids.add(s.id)}}}}catch{}
try{const response=await fetch('./data/modalites.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(j.schemaVersion===1&&j.subjectModes&&Object.keys(j.subjectModes).length>0)modes=j;}}catch{}
try{const response=await fetch('./data/entrainements.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(j.schemaVersion===1&&j.subjects)trainingData=j;}}catch{}
 try{const response=await fetch('./data/pedagogie.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(j.schemaVersion===1&&j.lessons&&typeof j.lessons==='object')pedagogie=j;}}catch{}
syncCounts();render();}
render();hydrate();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
})();
</script></body></html>
