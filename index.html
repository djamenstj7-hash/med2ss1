","pages":"9","topic":"Mort / putréfaction","difficulty":"Fondamentaux"},{"q":"Quelle idée associer à « xén(o)- » ?","choices":["mort, mortel","étranger","putréfaction, infection dans les exemples du cours","qui tue"],"answer":1,"why":"« xén(o)- » : étranger. Exemple du cours : axénique : exempt de pathogènes ou de saprophytes selon la ronéo.","pages":"9","topic":"Mort / putréfaction","difficulty":"Fondamentaux"},{"q":"Quel mot désigne des mesures préventives pour écarter les microbes ?","choices":["Ostéolyse","Homéopathie","Asepsie","Antiseptique"],"answer":2,"why":"Le CM définit l’asepsie comme un ensemble de mesures préventives.","pages":"9","topic":"Mort / putréfaction","difficulty":"Piège / distinction"},{"q":"Pour décoder « -lyse / -lytique », quelle définition faut-il retenir ?","choices":["dissolution, destruction, mais parfois libération","excroissance pathologique","réparation ou modelage","excroissance d’origine naturelle"],"answer":0,"why":"« -lyse / -lytique » : dissolution, destruction, mais parfois libération. Exemple du cours : ostéolyse : destruction du tissu osseux ; salpingolyse : libération des trompes.","pages":"9","topic":"Destruction / réparation","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « -clasie » ?","choices":["réparation ou modelage","écrasement, fragmentation","dissolution, destruction, mais parfois libération","brisure, fracture"],"answer":3,"why":"« -clasie » : brisure, fracture. Exemple du cours : ostéoclasie : fracture chirurgicale d’un os pour le remettre en place.","pages":"10","topic":"Destruction / réparation","difficulty":"Fondamentaux"},{"q":"Dans un terme médical, « -tripsie » évoque :","choices":["dissolution, destruction, mais parfois libération","brisure, fracture","excroissance d’origine naturelle","écrasement, fragmentation"],"answer":3,"why":"« -tripsie » : écrasement, fragmentation. Exemple du cours : lithotripsie : fragmentation des calculs.","pages":"10","topic":"Destruction / réparation","difficulty":"Fondamentaux"},{"q":"Quel suffixe signifie « brisure » et non « dissolution » ?","choices":["-phyte","-lyse","-plastie","-clasie"],"answer":3,"why":"-clasie = brisure ; -lyse = dissolution/destruction ou libération selon le contexte.","pages":"10","topic":"Destruction / réparation","difficulty":"Application"},{"q":"Quelle idée associer à « -plastie » ?","choices":["brisure, fracture","excroissance pathologique","écrasement, fragmentation","réparation ou modelage"],"answer":3,"why":"« -plastie » : réparation ou modelage. Exemple du cours : élytroplastie : chirurgie réparatrice du vagin.","pages":"10","topic":"Destruction / réparation","difficulty":"Fondamentaux"},{"q":"Pour décoder « -physe », quelle définition faut-il retenir ?","choices":["écrasement, fragmentation","excroissance pathologique","excroissance d’origine naturelle","dissolution, destruction, mais parfois libération"],"answer":2,"why":"« -physe » : excroissance d’origine naturelle. Exemple du cours : hypophyse : protubérance à la base du cerveau, selon le CM.","pages":"10","topic":"Destruction / réparation","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « -phyte » ?","choices":["excroissance d’origine naturelle","dissolution, destruction, mais parfois libération","excroissance pathologique","écrasement, fragmentation"],"answer":2,"why":"« -phyte » : excroissance pathologique. Exemple du cours : ostéophyte : excroissance osseuse.","pages":"10","topic":"Destruction / réparation","difficulty":"Fondamentaux"},{"q":"Quelle combinaison exprime la fragmentation des calculs ?","choices":["litho- + -tripsie","litho- + -rrhée","litho- + -crin","litho- + -plégie"],"answer":0,"why":"Lithotripsie est l’exemple de fragmentation de calculs donné par le cours.","pages":"10","topic":"Destruction / réparation","difficulty":"Application"},{"q":"Dans le cours, pourquoi « -lyse » demande-t-il de lire le mot complet ?","choices":["Parce qu’il indique toujours la mort","Parce qu’il peut évoquer dissolution ou libération","Parce qu’il ne s’utilise que dans les âges","Parce qu’il signifie toujours noyau"],"answer":1,"why":"Ostéolyse = destruction ; salpingolyse illustre le sens de libération.","pages":"9–10","topic":"Destruction / réparation","difficulty":"Piège / distinction"},{"q":"Quelle association est correcte ?","choices":["-phyte = cellule ; -physe = vessie","-phyte = enfant ; -physe = âgé","-phyte = paralysie ; -physe = chute","-phyte = excroissance pathologique ; -physe = excroissance naturelle"],"answer":3,"why":"Le tableau oppose les deux suffixes en fonction du type d’excroissance.","pages":"10","topic":"Destruction / réparation","difficulty":"Application"},{"q":"Quel terme renvoie à une intervention de réparation ou de modelage ?","choices":["-staxis","-plastie","-ptose","-plégie"],"answer":1,"why":"-plastie signifie réparation ou modelage, illustré en chirurgie.","pages":"10","topic":"Destruction / réparation","difficulty":"Application"}],"flashcards":[{"q":"Que signifie « isch(é)- » ?","a":"Diminution ou arrêt. Exemple : ischémie : diminution ou arrêt de la circulation sanguine.","pages":"2","topic":"Mouvement"},{"q":"Que signifie « kinés(i)- / -kinésie » ?","a":"Mouvement. Exemple : dyskinésie : mouvement anormal ou difficile.","pages":"2","topic":"Mouvement"},{"q":"Que signifie « -praxie » ?","a":"Action ou geste coordonné. Exemple : dyspraxie : difficulté à effectuer des gestes coordonnés.","pages":"2","topic":"Mouvement"},{"q":"Que signifie « -stase » ?","a":"Lenteur ou arrêt d’un écoulement. Exemple : cholostase : arrêt de l’écoulement de la bile, selon le CM.","pages":"2","topic":"Mouvement"},{"q":"Que signifie « -pause » ?","a":"Arrêt ou cessation. Exemple : ménopause : fin de la fonction menstruelle.","pages":"2","topic":"Mouvement"},{"q":"Que signifie « endo- » ?","a":"À l’intérieur. Exemple : endocrine : sécrétion vers l’intérieur de l’organisme, dans le sang.","pages":"2","topic":"Sécrétion"},{"q":"Que signifie « crin- » ?","a":"Sécrétion. Exemple : endocrine : endo- (intérieur) + crin- (sécrétion).","pages":"2","topic":"Sécrétion"},{"q":"Que signifie « -agogue » ?","a":"Qui conduit ou évacue. Exemple : cholagogue : qui évacue la bile.","pages":"3","topic":"Écoulements"},{"q":"Que signifie « -rrhée » ?","a":"Écoulement, flux. Exemple : aménorrhée : absence de flux menstruel.","pages":"3","topic":"Écoulements"},{"q":"Que signifie « -rrhagie / -ragie » ?","a":"Jaillissement, écoulement intense. Exemple : hémorragie : écoulement important de sang.","pages":"3","topic":"Écoulements"},{"q":"Que signifie « -staxis » ?","a":"Écoulement goutte à goutte. Exemple : épistaxis : saignement de nez.","pages":"3","topic":"Écoulements"},{"q":"Que signifie « cata- » ?","a":"Mouvement descendant. Exemple : catarrhe : écoulement ou hypersécrétion des muqueuses.","pages":"3","topic":"Écoulements"},{"q":"Que signifie « -ptose / -ptosis » ?","a":"Chute. Exemple : onychoptose : chute de l’ongle.","pages":"3","topic":"Chute"},{"q":"Que signifie « lapsus / collapsus » ?","a":"Glissement, affaissement. Exemple : collapsus : affaissement d’un organe, selon le CM.","pages":"3","topic":"Chute"},{"q":"Que signifie « -sclérose » ?","a":"Durcissement d’un tissu ou d’un organe. Exemple : artériosclérose : épaississement et durcissement artériel.","pages":"3","topic":"Tonus des tissus"},{"q":"Que signifie « -spasme » ?","a":"Contraction. Exemple : cystospasme : spasme de la vessie.","pages":"3","topic":"Tonus des tissus"},{"q":"Que signifie « -malacie » ?","a":"Ramollissement. Exemple : ostéomalacie : ramollissement des os.","pages":"4","topic":"Tonus des tissus"},{"q":"Que signifie « -chalasie » ?","a":"Relâchement (sens du radical dans le tableau). Exemple : chalasie : radical présenté avec le relâchement ; voir alerte de vérification sur « achalasie ».","pages":"4","topic":"Tonus des tissus"},{"q":"Que signifie « -leptique » ?","a":"Qui agit sur, diminue ou calme, selon le terme. Exemple : neuroleptique : calme l’agitation et l’hyperactivité neuromusculaire.","pages":"4","topic":"Tonus des tissus"},{"q":"Que signifie « -parésie » ?","a":"Déficit moteur partiel, paralysie légère. Exemple : parésie : affaiblissement de la contraction musculaire.","pages":"4","topic":"Paralysie"},{"q":"Que signifie « -plégie » ?","a":"Paralysie totale. Exemple : hémiplégie : paralysie d’une moitié du corps.","pages":"4","topic":"Paralysie"},{"q":"Que signifie « hémi- » ?","a":"Moitié. Exemple : hémiplégie : atteinte d’une moitié du corps.","pages":"4","topic":"Paralysie"},{"q":"Que signifie « phil(o)- » ?","a":"Aimer, être attiré par. Exemple : coprophilie : attirance liée aux excréments.","pages":"4","topic":"Attirance / aversion"},{"q":"Que signifie « mis(o)- » ?","a":"Détester, avoir de l’aversion. Exemple : misandrie : aversion pour les hommes ; misogynie : aversion pour les femmes.","pages":"4","topic":"Attirance / aversion"},{"q":"Que signifie « andr- / andro- » ?","a":"Homme, sexe masculin. Exemple : misandrie : aversion envers les hommes.","pages":"4","topic":"Attirance / aversion"},{"q":"Que signifie « gyn- / gyné- » ?","a":"Femme, sexe féminin. Exemple : misogynie : aversion envers les femmes.","pages":"4","topic":"Attirance / aversion"},{"q":"Que signifie « anthrop- » ?","a":"Être humain. Exemple : misanthropie : aversion à l’égard du genre humain.","pages":"4","topic":"Attirance / aversion"},{"q":"Que signifie « noc(i)- » ?","a":"Nuisible. Exemple : innocuité : absence de risque pour la santé, selon le CM.","pages":"5","topic":"Nocivité"},{"q":"Que signifie « phtisi(o)- » ?","a":"Consomption progressive. Exemple : phtisiologie : étude de la tuberculose.","pages":"5","topic":"Nocivité"},{"q":"Que signifie « path- / patho- » ?","a":"Maladie, affection, ce que l’on subit. Exemple : pathologie : étude de la maladie.","pages":"5","topic":"Maladie / ressenti"},{"q":"Que signifie « -pathie (après un organe) » ?","a":"Maladie de l’organe nommé. Exemple : neuropathie : maladie des nerfs.","pages":"5","topic":"Maladie / ressenti"},{"q":"Que signifie « pathognomonique » ?","a":"Permet de reconnaître une maladie par ses signes caractéristiques. Exemple : signe pathognomonique : signe caractéristique d’une maladie.","pages":"5","topic":"Maladie / ressenti"},{"q":"Que signifie « pathomimie » ?","a":"Simulation ou imitation d’une maladie. Exemple : pathomimie : fait de simuler une maladie.","pages":"5","topic":"Maladie / ressenti"},{"q":"Que signifie « idio- » ?","a":"Propre, particulier. Exemple : idiopathique : terme expliqué via « particulier » dans le CM.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « homéo- » ?","a":"Semblable. Exemple : homéopathique : homéo- exprime le semblable.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « allo- » ?","a":"Autre. Exemple : allopathique : allo- exprime l’autre.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « a- (apathie) » ?","a":"Absence. Exemple : apathie : ne rien ressentir, selon le découpage du CM.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « em- (empathie) » ?","a":"Intérieur. Exemple : empathie : ressentir de l’intérieur les sentiments d’autrui.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « sym- (sympathie) » ?","a":"Avec, ensemble. Exemple : sympathie : souffrir ou ressentir à l’unisson, selon le cours.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « -gène (sens actif) » ?","a":"Qui engendre ou provoque x. Exemple : tératogène : qui produit des malformations, traduit par « génère un monstre » dans la ronéo.","pages":"6","topic":"Origine / genèse"},{"q":"Que signifie « -gène (sens passif) » ?","a":"Qui est engendré par x. Exemple : iatrogène : engendré par le médecin.","pages":"6","topic":"Origine / genèse"},{"q":"Que signifie « hypo- » ?","a":"Sous, peu. Exemple : hypoallergène : qui provoque peu d’allergies.","pages":"6","topic":"Origine / genèse"},{"q":"Que signifie « endo- (endogène) » ?","a":"Origine intérieure. Exemple : endogène : engendré de l’intérieur.","pages":"6","topic":"Origine / genèse"},{"q":"Que signifie « exo- » ?","a":"De l’extérieur. Exemple : exogène : engendré de l’extérieur.","pages":"6","topic":"Origine / genèse"},{"q":"Que signifie « -genèse / -génèse » ?","a":"Production, formation, développement. Exemple : angiogenèse : formation de vaisseaux.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « a- (agénésie) » ?","a":"Absence. Exemple : agénésie : absence de formation d’un organe.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « dys- (dysgénésie) » ?","a":"Anomalie, difficulté, mauvaise formation. Exemple : dysgénésie : mauvaise formation d’un organe.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « congénital » ?","a":"Présent dès la naissance. Exemple : congénital ne signifie pas nécessairement héréditaire.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « gon- (gonade) » ?","a":"Descendance, semence, reproduction. Exemple : gonade : ovaire ou testicule produisant les gamètes.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « gon- / gony- (genou) » ?","a":"Genou. Exemple : gonarthrite : inflammation de l’articulation du genou.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « gen- (menton) » ?","a":"Menton, dans certains termes. Exemple : rétrogénie : menton fuyant.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « bi(o)- / -bie » ?","a":"Vie. Exemple : biopsie : prélèvement d’un fragment de tissu pour examen.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « blast(o)- / -blaste » ?","a":"Germe, cellule peu différenciée dans les exemples du cm. Exemple : néoblaste : cellule décrite comme indifférenciée dans le CM.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « hist(o)- » ?","a":"Tissu. Exemple : histologie : étude microscopique des tissus.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « cyto- / -cyte » ?","a":"Cellule. Exemple : ostéocyte : cellule de l’os.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « cysto- » ?","a":"Vessie, à distinguer de cyto-. Exemple : cystospasme : spasme de la vessie.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « nucléo- » ?","a":"Noyau. Exemple : mononucléaire : cellule à un seul noyau.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « caryo- » ?","a":"Noyau. Exemple : caryoclasique : qui frappe la cellule en division, selon le CM.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « -plasie » ?","a":"Formation ou développement d’un tissu / organe. Exemple : dysplasie : développement anormal.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « aplasie » ?","a":"Absence de développement d’un tissu ou organe. Exemple : aplasie : défaut de formation ou développement.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « dysplasie » ?","a":"Anomalie du développement d’un tissu ou organe. Exemple : dysplasie : mauvais développement.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « péd- » ?","a":"Enfant. Exemple : pédiatre : médecin spécialiste des enfants.","pages":"8","topic":"Âges"},{"q":"Que signifie « puér- » ?","a":"Enfant. Exemple : puériculture : art d’élever les enfants.","pages":"8","topic":"Âges"},{"q":"Que signifie « hébé- » ?","a":"Jeune, adolescent. Exemple : hébéphrénie : forme de schizophrénie débutant à l’adolescence selon le CM.","pages":"8","topic":"Âges"},{"q":"Que signifie « gér- » ?","a":"Personne âgée. Exemple : gériatrie : médecine de la personne âgée.","pages":"8","topic":"Âges"},{"q":"Que signifie « presby- » ?","a":"Vieux, lié à l’âge. Exemple : presbytie : diminution de l’accommodation visuelle.","pages":"8","topic":"Âges"},{"q":"Que signifie « sénesc- » ?","a":"Vieillissement. Exemple : sénescence : phénomènes non pathologiques liés à l’âge, selon le CM.","pages":"9","topic":"Âges"},{"q":"Que signifie « thanato- » ?","a":"Mort. Exemple : thanatopraxie : soins destinés à retarder la décomposition d’un corps.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « lét- » ?","a":"Mort, mortel. Exemple : létal : qui provoque la mort.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « -cide » ?","a":"Qui tue. Exemple : cytocide : qui tue des cellules.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « sapro- » ?","a":"Pourri, putréfaction. Exemple : saprophyte : lié à des matières organiques inertes.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « sept- / sepsi(c)- » ?","a":"Putréfaction, infection dans les exemples du cours. Exemple : septicémie : terme expliqué par des germes et leurs toxines dans le sang.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « a- (asepsie) » ?","a":"Absence, privation. Exemple : asepsie : prévention visant à éviter la contamination microbienne.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « anti- (antiseptique) » ?","a":"Contre. Exemple : antiseptique : détruit les microbes et empêche leur développement, selon le CM.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « xén(o)- » ?","a":"Étranger. Exemple : axénique : exempt de pathogènes ou de saprophytes selon la ronéo.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « -lyse / -lytique » ?","a":"Dissolution, destruction, mais parfois libération. Exemple : ostéolyse : destruction du tissu osseux ; salpingolyse : libération des trompes.","pages":"9","topic":"Destruction / réparation"},{"q":"Que signifie « -clasie » ?","a":"Brisure, fracture. Exemple : ostéoclasie : fracture chirurgicale d’un os pour le remettre en place.","pages":"10","topic":"Destruction / réparation"},{"q":"Que signifie « -tripsie » ?","a":"Écrasement, fragmentation. Exemple : lithotripsie : fragmentation des calculs.","pages":"10","topic":"Destruction / réparation"},{"q":"Que signifie « -plastie » ?","a":"Réparation ou modelage. Exemple : élytroplastie : chirurgie réparatrice du vagin.","pages":"10","topic":"Destruction / réparation"},{"q":"Que signifie « -physe » ?","a":"Excroissance d’origine naturelle. Exemple : hypophyse : protubérance à la base du cerveau, selon le CM.","pages":"10","topic":"Destruction / réparation"},{"q":"Que signifie « -phyte » ?","a":"Excroissance pathologique. Exemple : ostéophyte : excroissance osseuse.","pages":"10","topic":"Destruction / réparation"},{"q":"RRHÉE / RRHAGIE / STAXIS : restitue les trois sens.","a":"RRHÉE = écoulement ; RRHAGIE = jaillissement, flux intense ; STAXIS = goutte à goutte.","pages":"3","topic":"Écoulements"},{"q":"PARÉSIE / PLÉGIE : quelle différence ?","a":"Parésie : atteinte partielle ; plégie : paralysie totale.","pages":"4","topic":"Paralysie"},{"q":"CYTO / CYSTO : quel est le piège ?","a":"Cyto = cellule ; cysto = vessie.","pages":"8","topic":"Vie / cellule"},{"q":"AGÉNÉSIE / DYSGÉNÉSIE : différence ?","a":"Agénésie = absence de formation ; dysgénésie = mauvaise formation.","pages":"7","topic":"Origine / genèse"},{"q":"CONGÉNITAL et HÉRÉDITAIRE : synonymes ?","a":"Non. Congénital signifie présent dès la naissance ; le cours indique que ce n’est pas nécessairement héréditaire.","pages":"7","topic":"Origine / genèse"},{"q":"ASEPSIE / ANTISEPTIQUE : distinction du CM ?","a":"Asepsie = mesures de prévention visant à écarter les microbes. Antiseptique = produit qui détruit les microbes ou empêche leur développement.","pages":"9","topic":"Mort / putréfaction"},{"q":"LYSE / CLASIE / TRIPSIE / PLASTIE : associe les verbes.","a":"Lyse = dissoudre/délier ; clasie = briser ; tripsie = écraser/fragmenter ; plastie = réparer/modeler.","pages":"9–10","topic":"Destruction / réparation"}],"flow":["Repérer la racine","Lire préfixe et suffixe","Traduire le mot","Vérifier le contexte"],"flags":["Source p. 4 : le tableau associe « -chalasie » à « relâchement » et cite « achalasie » ; ne pas utiliser cela comme définition clinique autonome.","Certains termes du cours ont plusieurs sens selon le contexte : -lyse, -pathie, -gène, gon-/gen-."]},"cm-9b2dde96a5767cb5":{"id":"cm-9b2dde96a5767cb5","subject":"semio","title":"Sémantique 2 — anatomie, couleurs, positions, lumière","courseName":"SÉMIOLOGIE SEMANTIQUE 2 (version définitive).pdf","date":"2026-09-10","teacher":"Pr Aubert-Baillot","source":{"label":"Ronéo & Juliette 2026–2027, Sémantique 2, 12 pages","url":"https://drive.google.com/file/d/15fyFvu1D6i7pztGF5JT97r-hym59TX1M/view","pages":12},"editorialNote":"Leçon narrative dérivée du PDF de cours « Sémantique 2 » (12 pages). Les exemples sont reformulés sans ajouter de faits médicaux externes ; les analogies et acronymes sont des aides pédagogiques. Les QCM sont inédits et ne sont pas des annales.","hook":"Tu entres dans un hôpital où chaque porte est écrite en grec ou en latin. En apprenant à lire ces étiquettes, un mot médical compliqué se transforme en indice logique : assembler, séparer, colorer, localiser, éclairer.","flow":["Assembler ou couper","Comparer et mesurer","Reconnaître les couleurs","Se situer dans l’espace","Suivre le temps","Retrouver la lumière"],"flags":["PDF p. 3 : l’explication de la schizophrénie dans la ronéo emploie une description clinique datée. Elle sert ici uniquement d’exemple étymologique pour « schiz- » et ne doit pas être utilisée comme définition de cette pathologie.","PDF p. 5 : « jumeaux homozygotes = vrais jumeaux » est une simplification du support ; ne l’utilise pas comme règle clinique générale.","PDF p. 9 : les exemples « -ose », « hyperthermie » et p. 9 « subfébrile » ne doivent pas être généralisés comme définitions médicales sans vérification.","PDF p. 12 : les racines hémér- (jour) et nyct- (nuit) sont retenues ici ; ne déduis pas une définition clinique complète des troubles visuels de leur étymologie seule."],"summary":[{"name":"La boîte à outils du chirurgien","detail":"-synthèse : réunion ; -rraphie : suture ; -pexie et -dèse : fixation ; -ectomie : ablation ; -tomie : section.","pages":"2"},{"name":"Détruire, ouvrir, dilater","detail":"-lyse = destruction/dissolution ou libération selon le contexte ; -ectasie = dilatation ; hiat- = ouverture ; -pénie = diminution.","pages":"3"},{"name":"Les flèches du mouvement","detail":"ab- et -fuge = éloignement ; ad- et -pète = rapprochement ; -trope = orientation ; -fère = conduction.","pages":"4"},{"name":"Les balises anatomiques","detail":"acro- = extrémité ; radic-/rhiz- = racine ; caud- = partie inférieure ; sept- = cloison ; pariét- = paroi.","pages":"4–5"},{"name":"Identité et différences","detail":"iso- = égal ; aniso- = inégal ; homo- = même ; hétéro- = différent ; dextr(o)- = droite ; lévo- = gauche.","pages":"5"},{"name":"Norme et dimensions","detail":"eu- = normal, dys- = difficile ; sténo- = étroit ; platy- = plat ; micro- = petit ; méga- = grand.","pages":"6"},{"name":"Palette de couleurs","detail":"cyan- bleu ; chlor- vert ; xanth- jaune ; éryth- rouge ; mélan- noir ; polio- gris ; leuco- blanc.","pages":"7–8"},{"name":"Dedans / dehors / autour","detail":"endo-, ento-, intra- = dedans ; exo-, ecto-, extra- = dehors ; péri- = autour ; para- = à côté.","pages":"8–9"},{"name":"Haut / bas","detail":"hyper- = excès ; hypo- = en dessous ; ultra- = au-delà ; supra- = au-dessus ; infra- = au-dessous.","pages":"9–10"},{"name":"Construction et temps","detail":"ana- = construction ; cata- = dégradation ; pré- = avant ; post- = après ; proto- = début ; télo- = fin.","pages":"10"},{"name":"Directions et posture","detail":"trans-, per-, dia- = à travers ; rétro- = en arrière ; crypt- = caché ; stat- = debout ; clin- = couché.","pages":"11"},{"name":"Lumière et obscurité","detail":"hélio- = soleil ; luc-/photo- = lumière ; actin- = rayon lumineux ; hémér- = jour ; nyct- = nuit ; scot- = obscurité.","pages":"11–12"}],"sections":[{"heading":"Le service de chirurgie : assembler, suturer, retirer","pages":"2","paragraphs":["Imagine une salle opératoire avec quatre étiquettes accrochées aux instruments. « Synthèse » rassemble les éléments ; « rraphie » suture ; « pexie » fixe artificiellement ; « ectomie » retire. Si tu distingues ces quatre verbes, une grande partie du vocabulaire de cette page devient compréhensible.","La première station est celle des os. Une ostéosynthèse réunit des éléments osseux afin qu'ils se ressoudent. Le cours distingue une ostéosynthèse chirurgicale et une réparation naturelle liée au périoste. Juste à côté, un chirurgien effectue une cardiorraphie : ici, « rraphie » évoque la suture.","Plus loin, les ligaments entrent en scène. « Syndesm- » les évoque ; une syndesmotomie est leur section. « Pexie » évoque la fixation chirurgicale et « dèse » la liaison ou le blocage, comme dans la ténodèse. Enfin, l'appendicectomie retire l'appendice, tandis que « tomie » évoque la coupure. Retirer n'est pas seulement couper.","Le préfixe « syn-/sym- » réunit : syndrome et synergie appartiennent à cette famille de l'ensemble. L'astuce est de traduire d'abord chaque pièce du mot avant d'apprendre le terme entier."],"memory":"Mémo : RRA = « raccord par suture » (-rraphie) ; PEX = « fixer » ; ECT = « extraire » ; TOM = « tailler ». Ce sont des images mnémotechniques, pas des étymologies."},{"heading":"Ce qui se défait : lyse, dilatation, séparation","pages":"3","paragraphs":["Dans le deuxième couloir, les mots racontent ce qui se défait ou s'ouvre. « Lyse » peut évoquer une destruction : ostéolyse pour le tissu osseux, thrombolytique pour la dissolution d'un caillot. Mais le cours insiste sur un piège : le même suffixe peut aussi évoquer une libération, comme dans salpingolyse.","À côté, « ectasie » signifie dilatation : une phlébectasie concerne une veine. Une ouverture s'exprime avec « hiat- », et le hiatus désigne un orifice. « Sciss- » renvoie à la séparation, comme dans scissiparité. « Schiz- » appartient également à la famille de la séparation ; le cours cite le terme schizophrénie pour illustrer la racine, sans qu'une analyse étymologique suffise à définir la maladie.","Une autre paire décrit le manque. « -prive » signale une privation, comme dans ferriprive. « -pénie » traduit une pauvreté ou une diminution : le cours donne la sarcopénie pour exemple. Ici, la terminaison peut déjà t'aider à anticiper le sens du mot."],"memory":"LYSE = se défaire ou libérer ; ECTASIE = se dilater ; HIAT = ouverture ; PÉNIE = manque."},{"heading":"La boussole du corps : s’éloigner ou revenir","pages":"4","paragraphs":["Place-toi au milieu d'une pièce et imagine deux portes. Celle qui t'éloigne du centre porte « ab- » et « -fuge » : l'abduction écarte, la force centrifuge s'éloigne du centre. L'autre porte est « ad- » et « -pète » : l'adduction rapproche, le mouvement centripète va vers le centre.","Le cours ajoute d'autres verbes de direction. « Dé(s)- » peut marquer un retrait, comme dans déshydratation. « Dis- » évoque la séparation, illustrée par dissection. « -trope » indique une orientation ou une affinité : un virus neurotrope est orienté vers le système nerveux. « -fère » fait penser à ce qui conduit, comme dans lactifère.","En examen, les paires sont plus importantes que les définitions isolées : abduction ≠ adduction et centrifuge ≠ centripète. Dessine une flèche qui quitte le centre, puis une flèche qui y revient."],"memory":"AB = Away (s'éloigne) ; AD = À destination du centre. FUGE = fuite ; PÈTE = se précipite vers."},{"heading":"GPS anatomique : extrémités, racines et cloisons","pages":"4–5","paragraphs":["Ton corps devient une carte. « Acro- » marque l'extrémité ; l'acrodynie concerne notamment les mains et les pieds. « Radic- » et « rhiz- » signalent tous deux une racine : radicotomie pour une section de racine nerveuse, rhizalyse pour une résorption de racine dentaire.","Descends sur la carte : « caud- » renvoie à la queue ou à la partie inférieure. Puis ouvre une porte : « sept- » désigne une cloison qui sépare deux espaces ; « pariét- » évoque une paroi. Ces éléments sont utiles pour décomposer un mot avant même d'en connaître la définition complète."],"memory":"ACRO = extrémité ; RADIC/RHIZ = racines ; CAUD = bas ; SEPT = séparation par cloison ; PARIÉT = paroi."},{"heading":"Le jeu des comparaisons : identique, différent, droite, gauche","pages":"5","paragraphs":["Imagine une balance à deux plateaux. « Iso- » est l'égalité ; « aniso- » est l'inégalité. L'anisocorie compare les pupilles : elles ne sont pas de taille identique. Le cours oppose également « homo- », qui signifie le même, et « hétéro- », qui indique le différent.","Une nuance utile apparaît entre « homo- » et « homéo- » : le premier renvoie au même ; le second, au similaire ou au maintien d'un état, comme dans homéotherme. « Poikilo- » désigne au contraire le varié, illustré par poikilotherme. Visualise un thermostat stable face à un thermomètre variable.","Deux flèches latérales terminent la carte. « Dextr(o)- » pointe vers la droite ; « lévo- » vers la gauche. Et « acu- » signifie pointu ou aigu. Le cours rappelle que, lorsqu'on fait face au patient, sa droite n'est pas ta droite."],"memory":"ISO = égal ; ANISO = inégal ; HOMO = même ; HÉTÉRO = différent ; DEXTRO = droite ; LÉVO = gauche."},{"heading":"Quand le mot indique la norme… ou un problème","pages":"6","paragraphs":["Une lumière verte affiche « eu- » : ça va bien ou normalement. Une autre affiche « orth(o)- » : droit ou correct. Le panneau orange est « dys- » : il signale une difficulté ou une anomalie. L'exemple le plus parlant du cours est « dyspnée », difficulté à respirer.","Ne prends pas le préfixe pour un diagnostic. Il donne une direction de sens, pas la description complète d'une affection. Dans le doute, fais toujours correspondre la racine à l'exemple donné par le professeur."],"memory":"EU = ça va ; ORTHO = droit ; DYS = ça dysfonctionne (association mnémotechnique)."},{"heading":"La règle graduée du corps : épais, étroit, petit, géant","pages":"6","paragraphs":["Imagine un magasin qui vend des vêtements à une cellule géante. Le tissu « pachy- » est épais, « pycn- » est compact, tandis que « lepto- » est mince ou léger. Dans le cours, pachydermie concerne l'épaississement de la peau et leptocyte une hématie particulièrement amincie.","Passe au rayon des formes : « sténo- » est étroit et « platy- » plat. Puis au rayon des tailles : « micro- » est petit, « macro- » est grand, « méga- » très grand et « giga- » géant. Le cours met aussi « bar(y)- » du côté de ce qui est lourd, comme dans bariatrique.","Attention à la petite porte de sortie : « -ole » et « -ule » servent à former des diminutifs. Ventricule correspond littéralement à un petit ventre. Au lieu d'apprendre les tailles dans le désordre, range-les sur une échelle mentale."],"memory":"Échelle visuelle : MICRO ← petit | MACRO → grand | MÉGA → très grand | GIGA → géant."},{"heading":"La palette du laboratoire : couleurs vives","pages":"7","paragraphs":["Ouvre une boîte de peinture. Sur le couvercle, « chrom- » et « colori- » annoncent la couleur en général. Chaque tube a ensuite sa propre étiquette : « cyan- » bleu, « chlor- » vert, « xanth- » jaune, « chrys- » doré, « argyr- » argent.","Le cours relie ces racines à des mots médicaux : cyanose, chlorémie, xanthopsie, chryséose, argyrémie. Le but est de repérer la couleur cachée dans le terme, non de supposer qu'une racine suffit à expliquer toute une pathologie.","Au rayon des rouges, on distingue « rub- », « éryth- » et « rhod- » : rouge, rouge et rose. Une grande tache rouge peut faire penser à érythème. Enfin, « mélan- » et « atr(a)- » évoquent le noir. « Auri- » peut être ambigu selon le mot : le document indique lui-même qu'une racine proche sert aussi à désigner l'oreille."],"memory":"Palette : CYAN = bleu ; CHLOR = vert ; XANTH = jaune ; ÉRYTH = rouge ; MÉLAN = noir."},{"heading":"Les couleurs moins évidentes : gris, ivoire, transparent","pages":"8","paragraphs":["Il reste cinq tubes inhabituels. « Anthrac- » représente le noir du charbon, « polio- » le gris, « leuc(o)- » le blanc, « éburn- » l'ivoire et « hyal- » le transparent. La poliomyélite donne ici un exemple de « polio- » associé à la substance grise.","L'éburnation illustre le rapprochement avec l'ivoire ; la hyalite fournit l'exemple de la transparence associée au corps vitré. Le principe reste identique : apprendre la racine comme une étiquette qui aide à déchiffrer le terme."],"memory":"ANTHRAC = charbon ; POLIO = gris ; LEUCO = blanc ; ÉBURN = ivoire ; HYAL = transparent."},{"heading":"Portes et frontières : dedans ou dehors ?","pages":"8–9","paragraphs":["Imagine un bâtiment aux portes concentriques. À l'intérieur se trouvent « intra- », « en- », « endo- » et « ento- ». Intraveineux signifie dans une veine ; endogène indique ce qui est produit à l'intérieur ; entozoaire décrit un parasite vivant à l'intérieur du corps.","Tu quittes maintenant le bâtiment. « Ex-/ec- », « extra- », « exo- » et « ecto- » te font franchir la frontière vers le dehors. Une grossesse extra-utérine se situe hors de l'utérus ; un ectoparasite vit à l'extérieur de son hôte. « Topo- » s'intéresse à la position, et « claustr- » décrit l'enfermement.","À côté du bâtiment, « para- » signifie à côté. Ne mélange pas « para- » avec « péri- » : le deuxième évoque ce qui entoure, comme dans péridurale. Le cours cite aussi « circon- » pour ce qui fait le tour."],"memory":"Imagine trois cercles : ENDO dedans → ECTO dehors → PÉRI autour ; PARA est à côté."},{"heading":"Monter, descendre et dépasser","pages":"9–10","paragraphs":["Voici un ascenseur avec plusieurs boutons. « Sur- », « épi- » et « supra- » te font monter au-dessus : surrénal, épithalamus, supraclaviculaire. « Hyper- » ajoute l'idée d'excès, comme dans hypersthésie.","Pour descendre, « sub- », « infra- » et « hypo- » désignent différentes nuances du dessous ou de la diminution. « Méio-/mio- » évoque une réduction, comme dans méiopragie. « Ultra- » franchit la limite : le mot ultraviolet se place au-delà du violet visible.","Il existe des pièges de formulation dans la ronéo : les explications données pour « subfébrile », « -ose » et « hyperthermie » ne doivent pas être apprises comme des définitions cliniques générales. Ici, retiens surtout les directions sémantiques des préfixes."],"memory":"HYPER = trop ; HYPO = en-dessous / pas assez ; ULTRA = au-delà ; INFRA = en-dessous."},{"heading":"Fabriquer ou démonter : le sens des processus","pages":"10","paragraphs":["Dans l'atelier du métabolisme, deux équipes ont des tâches inverses. L'équipe « ana- » assemble et construit : c'est l'image proposée pour l'anabolisme. L'équipe « cata- » dégrade : c'est la direction de sens du catabolisme.","À l'étage de l'histoire, le vieux portrait porte « paléo- » (ancien) ; le portrait encore plus ancien « archéo- » (très ancien). « Éco- » renvoie à la maison ou à l'habitat. Ces éléments aident à décrypter des termes qui paraissent complexes au premier regard."],"memory":"ANA = assembler ; CATA = casser (moyens mnémotechniques pour la direction des préfixes)."},{"heading":"La frise chronologique : avant, après, début, fin","pages":"10–11","paragraphs":["Imagine une ligne du temps tracée à travers tout le service. À gauche, « pro-/pré- » et « ante- » indiquent avant : prénatal signifie avant la naissance. Au centre se tient « primo- », ce qui vient en premier. « Proto- » marque le début ; « télo- » signale la fin.","À droite, « post- » signifie après, comme dans post-partum. Et « méso-/méd- » signale le milieu. Pour ancrer la chronologie, raconte une histoire dans l'ordre : avant → premier → début → milieu → fin → après."],"memory":"PRÉ = avant ; PRIMO = premier ; PROTO = début ; MÉSO = milieu ; TÉLO = fin ; POST = après."},{"heading":"La position du corps et les mots qui traversent","pages":"11","paragraphs":["Une dernière visite du bâtiment ajoute le sens du mouvement à travers. « Trans- », « per- », « pell- » et « dia- » composent cette famille ; le cours propose notamment « percutané » pour ce qui traverse la peau et « diaphane » pour ce qui laisse passer des rayons lumineux.","Tu croises ensuite « postéro- » et « rétro- », qui renvoient à l'arrière, puis « crypt(o)- » pour ce qui reste caché. Enfin, deux postures : « stat- » correspond à debout, « clin- » à couché. « -stase » peut servir à parler de station ou d'arrêt selon le contexte ; « astasie » concerne l'incapacité de rester debout.","Le fil conducteur est de ne jamais apprendre une racine sans son contexte. Un même morceau de mot peut avoir plusieurs emplois ; le reste du terme t'indique lequel retenir."],"memory":"TRANS/PER/DIA = à travers ; RÉTRO = en arrière ; STAT = debout ; CLIN = couché ; CRYPT = caché."},{"heading":"La salle lumineuse : jour, nuit et obscurité","pages":"11–12","paragraphs":["Au bout du parcours, entre dans une pièce éclairée. « Hélio- » te montre le soleil ; « luc(i)- », « -photo » et « -phos » renvoient à la lumière. « Actin- » représente un rayon lumineux et « radi- » un rayon.","On ferme ensuite les volets : « hémér- » signifie jour ; « nyct- » nuit ; « scot- » obscurité. Le cours cite héméralopie, nyctalopie et scotome. La racine facilite la mémorisation de la famille de mots, mais ne remplace pas une définition clinique précise des troubles visuels."],"memory":"Mémo : HÉLIO = soleil ; PHOTO = lumière ; NYCT = nuit ; SCOT = noir obscur."}],"qcm":[{"q":"Dans le cours, que signifie « -synthèse » ?","choices":["ablation","dilatation","ouverture, orifice","fixation et réunion"],"answer":3,"why":"« -synthèse » signifie fixation et réunion. Exemple de la ronéo : ostéosynthèse — réunion d'éléments osseux.","pages":"2","topic":"Fixation et gestes","difficulty":"Fondamentaux"},{"q":"Dans le cours, que signifie « -rraphie » ?","choices":["ouverture, orifice","suture","liaison, fixation, blocage","section, coupure"],"answer":1,"why":"« -rraphie » signifie suture. Exemple de la ronéo : cardiorraphie — suture du cœur.","pages":"2","topic":"Fixation et gestes","difficulty":"Fondamentaux"},{"q":"Dans le cours, que signifie « syn- / sym- » ?","choices":["destruction, dissolution ou parfois libération","suture","dilatation","ensemble, avec"],"answer":3,"why":"« syn- / sym- » signifie ensemble, avec. Exemple de la ronéo : synergie — association en vue d'une fonction commune.","pages":"2","topic":"Fixation et gestes","difficulty":"Fondamentaux"},{"q":"Dans le cours, que signifie « syndesm- » ?","choices":["ablation","suture","destruction, dissolution ou parfois libération","ligament, liaison"],"answer":3,"why":"« syndesm- » signifie ligament, liaison. Exemple de la ronéo : syndesmotomie — section des ligaments articulaires.","pages":"2","topic":"Fixation et gestes","difficulty":"Fondamentaux"},{"q":"Dans le cours, que signifie « -pexie » ?","choices":["ablation","dilatation","fixation artificielle","destruction, dissolution ou parfois libération"],"answer":2,"why":"« -pexie » signifie fixation artificielle. Exemple de la ronéo : syndesmopexie — fixation chirurgicale de ligaments.","pages":"2","topic":"Fixation et gestes","difficulty":"Fondamentaux"},{"q":"Dans le cours, que signifie « -dèse » ?","choices":["section, coupure","dilatation","destruction, dissolution ou parfois libération","liaison, fixation, blocage"],"answer":3,"why":"« -dèse » signifie liaison, fixation, blocage. Exemple de la ronéo : ténodèse — fixation d'un tendon sur un os.","pages":"2","topic":"Fixation et gestes","difficulty":"Fondamentaux"},{"q":"Dans le cours, que signifie « -ectomie » ?","choices":["section, coupure","dilatation","ablation","liaison, fixation, blocage"],"answer":2,"why":"« -ectomie » signifie ablation. Exemple de la ronéo : appendicectomie — ablation de l'appendice.","pages":"2","topic":"Fixation et gestes","difficulty":"Fondamentaux"},{"q":"Dans le cours, que signifie « -tom(i)e » ?","choices":["section, coupure","ouverture, orifice","liaison, fixation, blocage","destruction, dissolution ou parfois libération"],"answer":0,"why":"« -tom(i)e » signifie section, coupure. Exemple de la ronéo : amniotome — instrument utilisé pour rompre les enveloppes fœtales.","pages"
