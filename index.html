function beginLesson(id,tab='story'){
 if(!lesson(id))return;
 learning={id,tab,card:0,shown:false,quizPage:0};
 drawLesson(true);
}
function drawLesson(reset=false){
 const l=lesson(learning.id);if(!l)return;
 const before=modal.querySelector('.modal')?.scrollTop||0;
 const tabs=[['story','📖 Cours intéressant'],['summary','⚡ Synthèse'],['qcm',`🧠 ${l.qcm.length} QCM`],['cards',`🃏 ${l.flashcards.length} cartes`],['source','📄 Source']];
 const tabsHtml=tabs.map(([id,label])=>`<button class="${learning.tab===id?'active':''}" data-action="lesson-tab" data-id="${id}">${label}</button>`).join('');
 const sourceLine=`<p class="note">Source : ${esc(l.source.label)} · Pr ${esc(l.teacher.replace(/^Pr\s*/,''))}. Les pages indiquées renvoient au PDF.</p>`;
 const intro=`<div class="learning-head"><span class="tag green">${esc(subject(l.subject).name)}</span><h3>${esc(l.title)}</h3><p class="subtle" style="margin:0">${esc(l.hook)}</p></div>`;
 const flags=l.flags?.length?`<div class="lesson-warning"><strong>⚠️ Points de vigilance dans le cours source</strong>${l.flags.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:'';
 const flowSteps=l.flow||['Premier contact','Interrogatoire','Examen physique','Décision et information'];
 const flow=`<div class="logic-chain">${flowSteps.map((x,i)=>`${i?'<b>→</b>':''}<span>${esc(x)}</span>`).join('')}</div>`;
 let body='';
 if(learning.tab==='story')body=`${intro}${flow}${flags}${l.sections.map((sect,i)=>`<section class="lesson-section"><span class="lesson-pages">PARTIE ${i+1} · PDF p. ${esc(sect.pages)}</span><h3>${esc(sect.heading)}</h3>${sect.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="lesson-memory"><strong>À retenir :</strong> ${esc(sect.memory)}</div></section>`).join('')}`;
 if(learning.tab==='summary')body=`<div class="learning-head"><h3>Le chapitre en ${l.summary.length} idées</h3><p class="subtle">Synthèse fidèle au cours. Utilise-la pour réactiver tes connaissances avant l'examen.</p></div>${flow}${l.summary.map((s,i)=>`<div class="lesson-section"><span class="lesson-pages">REPÈRE ${i+1} · p. ${esc(s.pages)}</span><h3>${esc(s.name)}</h3><p>${esc(s.detail)}</p></div>`).join('')}`;
 if(learning.tab==='qcm'){
  const done=l.qcm.filter((_,i)=>st.quizAnswers?.[`${l.id}#${i}`]!==undefined).length;
  const good=l.qcm.filter((q,i)=>st.quizAnswers?.[`${l.id}#${i}`]?.choice===q.answer).length;
  const perPage=10, totalPages=Math.max(1,Math.ceil(l.qcm.length/perPage));
  learning.quizPage=Math.max(0,Math.min(learning.quizPage||0,totalPages-1));
  const page=learning.quizPage, start=page*perPage, end=Math.min(l.qcm.length,start+perPage);
  const pct=done?Math.round(100*good/done):0;
  body=`<div class="learning-head"><h3>${l.qcm.length} QCM · ${done} réponses enregistrées</h3><p class="subtle">${done?`${good} correctes sur ${done} réponses (${pct} %).`: 'Réponds, puis lis l’explication.'} Questions pédagogiques inédites, non issues d’annales. Correction et page du PDF pour chaque réponse.</p><div class="quiz-meter"><span style="width:${Math.round(100*done/(l.qcm.length||1))}%"></span></div><p class="tiny">Série ${page+1} / ${totalPages} · questions ${start+1} à ${end}</p></div>${l.qcm.slice(start,end).map((q,local)=>{const i=start+local,a=st.quizAnswers?.[`${l.id}#${i}`];return `<article class="qitem"><span class="lesson-pages">QUESTION ${i+1} · PDF p. ${esc(q.pages)}${q.topic?' · '+esc(q.topic):''}</span><h3>${esc(q.q)}</h3>${q.choices.map((c,j)=>`<button class="qchoice ${a&&a.choice===j?(j===q.answer?'selected-correct':'selected-wrong'):''}" data-action="quiz-answer" data-id="${i}:${j}">${'ABCD'[j]}. ${esc(c)} ${a&&j===q.answer?'✓':''}</button>`).join('')}${a?`<div class="qfeedback"><strong>${a.choice===q.answer?'✅ Exact':'🔎 À revoir'}</strong><p style="margin:5px 0 0">${esc(q.why)} Réponse : ${'ABCD'[q.answer]}.</p></div>`:''}</article>`}).join('')}<div class="quiz-pagination"><button class="btn secondary" data-action="quiz-page" data-id="${page-1}" ${page===0?'disabled':''}>← Précédente</button><span class="tiny">${page+1} / ${totalPages}</span><button class="btn" data-action="quiz-page" data-id="${page+1}" ${page>=totalPages-1?'disabled':''}>Suivante →</button></div>`;
 }
 if(learning.tab==='cards'){
  const i=learning.card,q=l.flashcards[i],a=st.flashcards?.[`${l.id}#${i}`];
  body=`<div class="learning-head"><h3>Flashcards · ${i+1}/${l.flashcards.length}</h3><p class="subtle">Rappelle la réponse sans regarder ; retourne ensuite la carte.</p></div><div class="fc ${learning.shown?'answer':''}">${esc(learning.shown?q.a:q.q)}</div><p class="tiny">Source PDF : p. ${esc(q.pages)} ${a?'· Dernière autoévaluation : '+esc(a.result):''}</p><div class="actions" style="margin:16px 0">${learning.shown?`<button class="btn secondary" data-action="card-mark" data-id="again">🔁 À retravailler</button><button class="btn" data-action="card-mark" data-id="good">✅ Je savais</button>`:`<button class="btn" data-action="card-reveal">Afficher la réponse</button>`}</div><div class="actions"><button class="btn ghost small" data-action="card-prev" ${i===0?'disabled':''}>← Précédente</button><button class="btn ghost small" data-action="card-next" ${i===l.flashcards.length-1?'disabled':''}>Suivante →</button></div>`;
 }
 if(learning.tab==='source')body=`<div class="learning-head"><h3>Retrouver le cours original</h3><p class="subtle">${esc(l.editorialNote)}</p></div>${flags}${sourceLine}<p>Les descriptions complètes, les illustrations cliniques et le texte original se trouvent dans la ronéo.</p><a href="${esc(l.source.url)}" class="btn" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none">Ouvrir le PDF sur Drive ↗</a><p class="note" style="margin-top:17px">La réécriture et les exercices sont des supports pédagogiques nouveaux, fondés exclusivement sur le chapitre cité. Ils ne remplacent pas le document original.</p>`;
 modal.innerHTML=`<div class="modalbg" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="Module pédagogique"><div class="row between"><span class="tag">✨ Module pédagogique</span><button class="btn ghost small" data-action="close-modal">✕ Fermer</button></div><div class="lesson-tabs">${tabsHtml}</div>${body}<hr class="divider">${sourceLine}</div></div>`;
 const el=modal.querySelector('.modal');if(el)el.scrollTop=reset?0:before;
}
function grade(score){if(!st.currentMission)return;const id=st.currentMission, r=cms().find(x=>x.id===id);if(!r)return;const prev=gradeOf(id);const step=score==='good'?(prev.count?Math.min(4,(prev.step||0)+1):0):score==='partial'?Math.max(0,(prev.step||0)):0;const days=[1,3,7,14,30][step];const nd=new Date(today()+'T12:00:00');nd.setDate(nd.getDate()+days);const due=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}-${String(nd.getDate()).padStart(2,'0')}`;
st.memory[id]={count:(prev.count||0)+1,step,lastScore:score,nextDue:due,lastReviewed:today()};if(!st.cycleDone.includes(id))st.cycleDone.push(id);st.history.push({id,subject:r.subject,date:today(),score});save();closeModal();render();toast('Autoévaluation enregistrée · prochain rappel '+due)}
function toast(message){let box=document.createElement('div');box.setAttribute('role','status');box.style.cssText='position:fixed;z-index:90;left:15px;right:15px;bottom:95px;max-width:550px;margin:auto;background:#142f4f;color:white;border-radius:13px;padding:13px 16px;box-shadow:0 6px 24px #0003;text-align:center;font-size:13px';box.textContent=message;document.body.appendChild(box);setTimeout(()=>box.remove(),3000)}
function download(name,text,mime='application/json'){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
const importer=(catalog)=>{if(!catalog||!Array.isArray(catalog.resources)||!Array.isArray(catalog.subjects)||catalog.schemaVersion!==1)throw Error('Schéma de manifeste invalide.');const ids=new Set();for(const r of catalog.resources){if(!r.id||!r.subject||!r.kind||!r.title||ids.has(r.id))throw Error('Entrée de document manquante ou dupliquée.');ids.add(r.id)}for(const s of catalog.subjects){if(!s.id||!s.name)throw Error('Matière incomplète.')}cat=catalog;syncCounts();localStorage.setItem(OVERRIDE,JSON.stringify(catalog));st.cycleDone=st.cycleDone.filter(id=>ids.has(id));save();render()};
function fileImport(type){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const f=input.files[0];if(!f)return;const j=JSON.parse(await f.text());if(type==='state'){if(!j||j.app!=='med2-s1'||!j.state)throw Error('Cette sauvegarde n’appartient pas à MED2 S1.');st={...defaultState,...j.state};save();render();toast('Sauvegarde importée.')}else{importer(j);toast('Nouveau catalogue importé localement : '+cat.resources.length+' documents.')}}catch(e){alert('Import impossible : '+e.message)}};input.click();}
app.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const x=document.getElementById('search');if(x){x.focus();x.setSelectionRange(pos,pos)}}});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action,id=btn.dataset.id;if(act==='nav'){st.view=id;st.expanded=false;save();render();scrollTo({top:0,behavior:'instant'})}
if(act==='settings'){st.view='settings';save();render();scrollTo(0,0)}if(act==='subject'){st.selectedSubject=id;save();render();document.getElementById('subject-detail')?.scrollIntoView({behavior:'smooth'})}
if(act==='close-subject'){st.selectedSubject=null;save();render()}
if(act==='pace'){st.pace=Number(id);save();render()}
if(act==='expand'){st.expanded=!st.expanded;save();render()}
if(act==='open-mission'){const r=cms().find(r=>r.id===id);if(r)missionDialog(r)}
if(act==='open-lesson')beginLesson(id,'story');
if(act==='quick-quiz')beginLesson(id,'qcm');
if(act==='quick-cards')beginLesson(id,'cards');
if(act==='lesson-tab'){learning.tab=id;learning.shown=false;drawLesson(true)}
if(act==='quiz-answer'&&learning.id){const [i,j]=id.split(':').map(Number);const l=lesson(learning.id);if(l?.qcm?.[i]?.choices?.[j]!==undefined){st.quizAnswers??={};st.quizAnswers[`${learning.id}#${i}`]={choice:j,at:today()};save();drawLesson();}}
if(act==='quiz-page'&&learning.id){learning.quizPage=Number(id)||0;drawLesson(true)}
if(act==='card-reveal'){learning.shown=true;drawLesson()}
if(act==='card-next'&&learning.id){learning.card=Math.min(lesson(learning.id).flashcards.length-1,learning.card+1);learning.shown=false;drawLesson(true)}
if(act==='card-prev'&&learning.id){learning.card=Math.max(0,learning.card-1);learning.shown=false;drawLesson(true)}
if(act==='card-mark'&&learning.id){st.flashcards??={};st.flashcards[`${learning.id}#${learning.card}`]={result:id,at:today()};save();if(learning.card<lesson(learning.id).flashcards.length-1){learning.card++;learning.shown=false;drawLesson(true)}else{toast(`${lesson(learning.id).flashcards.length} cartes parcourues.`);drawLesson()}}
if(act==='close-modal'){if(e.target.classList.contains('modalbg')||btn!==e.target.closest('.modal'))closeModal()}
if(act==='grade')grade(id)
if(act==='nextday'){if(confirm('Clore cette journée de révision ? Les tâches non faites ne provoqueront aucune pénalité.')){st.activeDay+=1;st.expanded=false;save();render();toast('Nouvelle journée active prête')}}
if(act==='resetcycle'){if(confirm('Recommencer une rotation ? Les mémorisations et rappels déjà enregistrés seront conservés.')){st.cycleDone=[];st.activeDay=0;save();render()}}
if(act==='export')download('MED2_S1_sauvegarde_'+today()+'.json',JSON.stringify({app:'med2-s1',version:1,exported:today(),state:st},null,2))
if(act==='import-state')fileImport('state')
if(act==='import-catalogue')fileImport('catalogue')
if(act==='reload'){localStorage.removeItem(OVERRIDE);location.reload()}
if(act==='open-semio')window.open('https://djamenstj7-hash.github.io/semiomed2/','_blank','noopener')
if(act==='clear'){if(confirm('Effacer uniquement la progression MED2 S1 de cet appareil ? Sémio MED2 restera intact.')){localStorage.removeItem(STORE);st={...defaultState};render()}}
});
async function hydrate(){try{const response=await fetch('./data/catalogue.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(j.schemaVersion===1&&Array.isArray(j.resources))cat=j;}}catch{}
try{const response=await fetch('./data/examens.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(Array.isArray(j.exams))exams=j.exams;}}catch{}
try{const override=JSON.parse(localStorage.getItem(OVERRIDE)||'null');if(override?.schemaVersion===1){const ids=new Set(cat.resources.map(x=>x.id));for(const r of override.resources||[]){if(!ids.has(r.id)){cat.resources.push(r);ids.add(r.id)}}const sids=new Set(cat.subjects.map(x=>x.id));for(const s of override.subjects||[]){if(!sids.has(s.id)){cat.subjects.push(s);sids.add(s.id)}}}}catch{}
try{const response=await fetch('./data/pedagogie.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(j.schemaVersion===1&&j.lessons&&typeof j.lessons==='object')pedagogie=j;}}catch{}
syncCounts();render();}
render();hydrate();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
})();
</script></body></html>
