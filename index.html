<script id="default-pedagogie" type="application/json">{"schemaVersion":1,"revision":"2026-10-11-v02-first-verified-module","lessons":{"cm-de715b67886d4881":{"id":"cm-de715b67886d4881","subject":"semio","title":"Abord et examen clinique du malade","courseName":"SÉMIOLOGIE ABORD DE L’EXAMEN.pdf","date":"2026-09-11","teacher":"Pr D. Launay","source":{"label":"Ronéo & Juliette 2026–2027, 9 pages","url":"https://drive.google.com/file/d/1OfrYxAE9x-QJYpcrjbXauBCF2UtC3Arm/view","pages":9},"editorialNote":"Réécriture pédagogique à partir du CM, sans ajout de connaissance médicale extérieure. Les images et observations détaillées restent consultables dans le PDF original.","hook":"Une consultation ressemble à une enquête : chaque mot du patient est une piste, chaque signe observé est un indice. Mais le but n’est pas de jouer au détective solitaire : c’est de comprendre, examiner, décider et expliquer avec le patient.","summary":[{"name":"Le cap","detail":"L’examen clinique est central pour le diagnostic et la relation médecin–malade. Il doit être méthodique, respectueux et adapté à l’urgence.","pages":"2"},{"name":"Le langage des signes","detail":"Sémiologie = science des signes. Signes cliniques : généraux, fonctionnels, physiques. Examens paracliniques : prise de sang, ECG, imagerie…","pages":"2–3"},{"name":"Le raisonnement","detail":"Un syndrome regroupe plusieurs signes cohérents. Il ne suffit pas, à lui seul, à identifier une cause.","pages":"3"},{"name":"Le déroulé","detail":"Premier contact → interrogatoire (motif, contexte, anamnèse) → examen physique → synthèse, décision, information.","pages":"3–9"},{"name":"Le geste","detail":"IPPA = inspection, palpation, percussion, auscultation. Examen ciblé ou systématique selon la situation.","pages":"7"},{"name":"La trace","detail":"Le dossier doit consigner date, heure, observateur, fonction, signature et validation médicale appropriée.","pages":"7"}],"sections":[{"heading":"Avant le diagnostic, il y a une rencontre","pages":"2, 4","paragraphs":["Imagine un patient qui entre dans ton cabinet. Avant même sa première phrase, vous échangez déjà des informations : son attitude, ton regard, votre façon de vous asseoir. Le cours insiste sur cette communication non verbale. On observe le patient ; mais lui aussi nous observe.","L’objectif du premier contact n’est pas de montrer que tu sais tout. C’est d’inspirer confiance. Présente-toi, reste poli, respecte sa pudeur, évite aussi bien la froideur que la familiarité. Place-toi à sa hauteur plutôt qu’en position dominante.","Le professeur propose une posture de « policier », au sens d’une enquête systématique et persévérante, jamais agressive. Si un élément ne colle pas au tableau, ne le balaie pas d’un revers de main. Il faut accepter l’incompréhensible et essayer de l’expliquer.","Enfin, adapte le rythme à la situation. Une consultation sans urgence et une situation aiguë ne se conduisent pas de la même manière. Le bon examen est celui réalisé au moment opportun."],"memory":"Premier contact : confiance + respect + méthode + adaptation."},{"heading":"Comprendre ce qu’on appelle un « signe »","pages":"2–3","paragraphs":["La sémiologie est la science des signes. Pour ne pas te perdre, imagine trois tiroirs dans lesquels ranger ce que tu apprends sur un malade.","Premier tiroir : les signes généraux. Dans ce cours, ils sont au nombre de quatre : fièvre, amaigrissement, asthénie (fatigue) et anorexie (perte d’appétit). L’association amaigrissement–asthénie–anorexie correspond ici à l’altération de l’état général, ou AEG.","Deuxième tiroir : les signes fonctionnels. Ce sont les sensations et troubles racontés par le patient : « j’ai mal », « je suis essoufflé ». Leur recueil repose sur la parole du malade.","Troisième tiroir : les signes physiques. Ils sont constatés lors de l’examen : un érythème, un souffle ou une hépatomégalie. Pour les rechercher, tu utilises notamment l’inspection, la palpation, la percussion et l’auscultation.","À côté de ces trois tiroirs existe une autre famille : les signes paracliniques, fournis par des examens complémentaires tels qu’une prise de sang, un ECG ou une radiographie. Attention : un marteau-réflexe, un diapason ou un tensiomètre sont des outils de l’examen clinique dans ce cours."],"memory":"Généraux = état global ; fonctionnels = racontés ; physiques = constatés ; paracliniques = examens complémentaires."},{"heading":"Un syndrome n’est pas encore une maladie","pages":"3","paragraphs":["Tu rassembles plusieurs indices et tu reconnais un motif répétitif. Voilà l’idée d’un syndrome : un ensemble cohérent et reproductible de signes.","Par exemple, le cours associe pâleur, dyspnée et asthénie au syndrome anémique. Il décrit aussi un syndrome sec avec sécheresse de plusieurs surfaces, et un syndrome néphritique associant notamment œdèmes des membres inférieurs et hypertension artérielle.","Mais attention au piège : identifier un syndrome permet un diagnostic sémiologique, pas forcément un diagnostic étiologique. Plusieurs maladies peuvent produire le même syndrome. Inversement, une même maladie peut provoquer plusieurs syndromes.","C’est comme reconnaître une fumée avant de savoir précisément ce qui brûle : tu as identifié un phénomène, pas nécessairement sa cause."],"memory":"Syndrome = motif de signes ; étiologie = cause. Ne pas les confondre."},{"heading":"L’interrogatoire : construire la carte avant d’explorer le territoire","pages":"4–6","paragraphs":["Tu commences par une question ouverte : « Qu’est-ce qui vous amène ? » Laisse le patient te raconter son histoire dans ses propres mots. Le cours insiste fortement sur l’écoute : un interrogatoire insuffisant peut conduire à des erreurs de diagnostic ou à des examens complémentaires mal orientés.","Ensuite, tu organises ce que tu entends en trois dossiers mentaux. D’abord, le motif de consultation : pourquoi est-il là aujourd’hui ? Puis le contexte : antécédents personnels et familiaux, métier, traitements, allergies, voyages, facteurs de risque. Enfin, l’anamnèse : comment le problème a-t-il commencé et évolué ?","Prenons une scène fictive construite seulement pour illustrer cette méthode : un patient dit « je suis essoufflé ». Tu notes le mot biomédical « dyspnée ». Mais tu ne t’arrêtes pas au mot : tu précises depuis quand, dans quelles circonstances, s’il s’agit d’un premier épisode et quelles autres manifestations sont présentes.","Les questions ouvertes permettent le récit ; les questions fermées servent ensuite à préciser. Certains patients parlent peu : sollicite-les. D’autres s’éloignent du sujet : recentre poliment. La qualité de ton interrogatoire dépend autant de l’écoute que des questions.","Avant de passer à la suite, reformule en langage compréhensible. Le but est de vérifier que vous parlez bien de la même chose et de ne pas imposer tes propres réponses. La prise de notes permet de retrouver les détails plus tard."],"memory":"Interrogatoire = motif → contexte/ATCD → anamnèse ; ouvert d’abord, fermé pour préciser, reformulation pour vérifier."},{"heading":"L’examen physique : regarder, toucher, écouter… avec méthode","pages":"3, 7–9","paragraphs":["Maintenant que tu as une carte du problème, tu passes au terrain : l’examen physique. Le cours distingue deux approches. La méthode ciblée explore en priorité le problème évoqué ; la méthode méthodique parcourt les appareils un par un, souvent dans un contexte hospitalier plus propice à l’exhaustivité.","Le fil rouge de l’examen physique est IPPA : Inspection, Palpation, Percussion, Auscultation. Le choix et la profondeur des gestes dépendent du contexte clinique. Prends le temps d’expliquer ce que tu vas faire et préserve la pudeur du patient.","En pneumologie, le cours recommande notamment de rechercher à l’interrogatoire la dyspnée, la toux, l’expectoration, l’hémoptysie et la douleur thoracique, puis de procéder à l’examen physique. En cardiologie, il mentionne dyspnée, douleur thoracique, lipothymie, syncope et palpitations, complétées par l’examen cardiovasculaire.","La première anecdote du CM montre une patiente avec des bouffées de chaleur, des troubles digestifs et un bilan hépatique perturbé. Plusieurs consultations n’avaient pas conduit à l’examen cutané complet ; l’observation de lésions profuses a finalement orienté vers une mastocytose. Le message n’est pas de deviner la maladie à la première minute : c’est d’oser regarder ce qui n’a pas encore été examiné.","Autre exemple rapporté par le professeur : des uvéites répétées associées à des lésions indurées au niveau de cicatrices font penser à une sarcoïdose. Chez une patiente jeune avec une phlébite spontanée, la constatation d’un livedo racemosa oriente vers un syndrome des antiphospholipides. Ce sont des associations de signes à reconnaître, pas une invitation à conclure sans contexte.","Le cours montre aussi le phénomène de Raynaud (doigts qui changent de couleur au froid), puis des myalgies avec déficit musculaire et lésions inflammatoires cutanées évoquant une dermatomyosite. Enfin, chez un patient avec cardiopathie hypertrophique, antécédent d’AVC et insuffisance rénale, des angiokératomes observés à l’aine sont présentés comme des signes précieux de maladie de Fabry.","Le dossier clinique doit garder une trace de l’examen : date, heure, identité et fonction de l’observateur, signature et validation par un médecin habilité selon le cadre rappelé dans le cours."],"memory":"Deux méthodes : ciblée ou systématique. Dans les deux cas : IPPA et recherche de signes pertinents."},{"heading":"Conclure : le patient doit connaître la suite de l’histoire","pages":"9","paragraphs":["Un mauvais scénario médical serait de poser beaucoup de questions, examiner longuement, puis sortir de la pièce sans expliquer la suite. Le cours demande de ne pas négliger la phase III : conclusion et décision.","Fais une synthèse. Propose un diagnostic ou plusieurs hypothèses si le tableau reste incertain. Décide, selon le contexte, d’une prise en charge, d’examens complémentaires, d’une prescription ou d’une orientation spécialisée.","Enfin, explique clairement au patient, avec des mots adaptés. Fais particulièrement attention aux termes anxiogènes quand tu n’es encore qu’au stade d’une hypothèse. Et consigne les constatations de la consultation.","L’idée maîtresse de ce chapitre tient en une phrase : un bon examen clinique est à la fois une méthode pour chercher des signes et une manière de construire une relation de soin."],"memory":"Phase III = synthèse → hypothèses → décision → information claire → traçabilité."}],"flashcards":[{"q":"Définis la sémiologie.","a":"La science des signes.","pages":"2"},{"q":"Cite les quatre signes généraux listés dans ce cours.","a":"Fièvre, amaigrissement, asthénie et anorexie.","pages":"2"},{"q":"Quels trois éléments composent l’AEG selon ce cours ?","a":"Amaigrissement, asthénie et anorexie.","pages":"2"},{"q":"Différence : signe fonctionnel versus signe physique ?","a":"Fonctionnel : rapporté par le patient. Physique : constaté lors de l’examen clinique.","pages":"2–3"},{"q":"Donne deux exemples de signes paracliniques.","a":"Par exemple un résultat de prise de sang et un ECG (ou un examen d’imagerie).","pages":"2"},{"q":"Un syndrome établit-il directement une étiologie ?","a":"Non. Il regroupe des signes cohérents, mais plusieurs maladies peuvent entraîner le même syndrome.","pages":"3"},{"q":"Quelles sont les trois finalités de l’interrogatoire ?","a":"Comprendre le motif ; situer le contexte et les ATCD ; comprendre l’histoire de la maladie (anamnèse).","pages":"5–6"},{"q":"Pourquoi commencer par des questions ouvertes ?","a":"Pour permettre au patient de formuler spontanément son motif et son récit. Les questions fermées viendront ensuite préciser.","pages":"4–6"},{"q":"Que signifie IPPA ?","a":"Inspection, Palpation, Percussion, Auscultation.","pages":"7"},{"q":"Deux méthodes d’examen clinique ?","a":"Une méthode ciblée sur le motif de consultation et une méthode systématique appareil par appareil.","pages":"7"},{"q":"Quelles sont les quatre grandes phases de l’examen médical ?","a":"Phase initiale de contact, interrogatoire, examen physique, conclusion/décision avec information.","pages":"3–4, 9"},{"q":"Que doit-on consigner dans le dossier à l’issue de l’examen ?","a":"Notamment date, heure, nom de l’observateur, fonction, signature et validation médicale selon le cours.","pages":"7"}],"qcm":[{"q":"Parmi les propositions suivantes, laquelle correspond à la définition de la sémiologie ?","choices":["Science des signes","Science du médicament","Analyse exclusive des examens complémentaires","Étude des seuls symptômes douloureux"],"answer":0,"why":"Le cours définit explicitement la sémiologie comme la science des signes.","pages":"2"},{"q":"Lequel des éléments suivants est classé comme un signe fonctionnel ?","choices":["Souffle perçu à l’auscultation","Douleur décrite par le patient","Érythème observé","Hépatomégalie palpée"],"answer":1,"why":"Un signe fonctionnel est rapporté par le patient ; la douleur en est un exemple.","pages":"2–3"},{"q":"Quel triplet correspond à l’AEG selon le cours ?","choices":["Fièvre, tachycardie, douleur","Fièvre, dyspnée, toux","Amaigrissement, asthénie, anorexie","Œdème, hypertension, pâleur"],"answer":2,"why":"Le document distingue quatre signes généraux et précise que les trois derniers — amaigrissement, asthénie, anorexie — définissent l’AEG.","pages":"2"},{"q":"Quel examen est cité parmi les examens paracliniques ?","choices":["Palpation","Inspection","Examen au marteau-réflexe","Électrocardiogramme"],"answer":3,"why":"L’ECG figure dans la liste des examens paracliniques du cours. Le marteau-réflexe est présenté comme un outil clinique.","pages":"2"},{"q":"Un syndrome est…","choices":["Un ensemble cohérent et reproductible de signes","Toujours synonyme d’une maladie unique","Uniquement un résultat biologique","Nécessairement lié à un seul organe"],"answer":0,"why":"Un syndrome rassemble plusieurs signes ; il n’identifie pas automatiquement l’étiologie.","pages":"3"},{"q":"Quelle question convient le mieux pour ouvrir l’interrogatoire ?","choices":["Vous avez forcément une infection, non ?","Qu’est-ce qui vous amène ?","Vous n’avez pas mal ailleurs ?","La douleur date-t-elle exactement de quatre jours ?"],"answer":1,"why":"Le professeur recommande une question neutre et ouverte au premier contact ; les questions fermées servent ensuite à préciser.","pages":"4–6"},{"q":"Quels sont les trois grands objectifs de l’interrogatoire ?","choices":["Imagerie, biologie, prescription","Auscultation, palpation, percussion","Motif, contexte/ATCD, anamnèse","Diagnostic définitif, traitement, sortie"],"answer":2,"why":"Comprendre le motif, situer le contexte et reconstruire l’histoire de la maladie sont les trois objectifs explicitement énoncés.","pages":"5–6"},{"q":"IPPA signifie :","choices":["Investigation, Prélèvement, Prescription, Analyse","Interrogatoire, Palpation, Prise de sang, Auscultation","Inspection, Pression, Percussion, Anamnèse","Inspection, Palpation, Percussion, Auscultation"],"answer":3,"why":"Le sigle IPPA structure l’examen physique dans le CM.","pages":"7"},{"q":"Concernant les deux méthodes d’examen physique, quelle affirmation est juste ?","choices":["L’une est ciblée, l’autre systématique appareil par appareil","La méthode systématique exclut l’interrogatoire","La méthode ciblée ne doit jamais être utilisée","Elles sont strictement identiques"],"answer":0,"why":"Le cours distingue la méthode ciblée en consultation et l’examen méthodique, appareil par appareil.","pages":"7"},{"q":"À propos de la conclusion de consultation, quel comportement est attendu ?","choices":["Éviter toute explication au patient","Faire une synthèse, exposer les hypothèses et informer clairement","Attendre nécessairement tous les examens avant d’émettre une hypothèse","Omettre les notes cliniques"],"answer":1,"why":"La phase III comprend synthèse, hypothèses diagnostiques, décisions et information adaptée au patient.","pages":"9"},{"q":"Lequel des éléments suivants figure dans les informations à documenter après l’examen ?","choices":["La couleur préférée du patient","L’adresse de chaque membre de sa famille","La date, l’heure, le nom et la fonction de l’observateur","Une hypothèse présentée obligatoirement comme une certitude"],"answer":2,"why":"Le cours mentionne ces données de traçabilité ainsi que signature et validation médicale.","pages":"7"},{"q":"Un patient raconte une gêne respiratoire ; comment le cours classe-t-il ce renseignement ?","choices":["Signe exclusivement paraclinique","Signe physique uniquement","Syndrome étiologique confirmé","Signe fonctionnel recueilli à l’interrogatoire"],"answer":3,"why":"La dyspnée, rapportée par le malade, est l’un des exemples de signes fonctionnels du cours.","pages":"2, 7"}]}}}</script>

,"title":"HISTOIRE DE LA MÉDECINE 3.pdf","kind":"cm","status":"source_indexee"},{"id":"cm-92e51fcb0663ec84","subject":"ssh","title":"HISTOIRE DE LA MÉDECINE 2.pdf","kind":"cm","status":"source_indexee"},{"id":"cm-2aa6612fb797e2ce","subject":"ssh","title":"HISTOIRE DE LA MÉDECINE 1.pdf","kind":"cm","status":"source_indexee"}],"sourceNotice":"Index vérifié. Les PDF ne sont pas publiés; tous les contenus pédagogiques restent à rédiger et vérifier. Les nouveaux cours devront être intégrés lors des mises à jour de ce manifeste."}</script>

<script>
(()=>{'use strict';
const basePath='./';const STORE='med2.semestre1.etat.v1';const OVERRIDE='med2.semestre1.catalogue.import.v1';
const app=document.getElementById('app'), modal=document.getElementById('modal-root');
const fallback=id=>JSON.parse(document.getElementById(id).textContent);
let cat=fallback('default-catalogue'), exams=fallback('default-examens').exams, modes=fallback('default-modalites');
let pedagogie=fallback('default-pedagogie'); let learning={id:null,tab:'story',card:0,shown:false};
const lesson=id=>pedagogie.lessons?.[id];
const defaultState={pace:14,view:'home',selectedSubject:null,activeDay:0,cycleDone:[],memory:{},history:[],currentMission:null,expanded:false};
let st=(()=>{try{return {...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{return {...defaultState}}})();
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(st))}catch(e){alert('La mémoire locale est pleine. Exporte ta progression depuis Suivi.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const diff=date=>Math.ceil((new Date(date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);
const shortDate=date=>new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const subjects=()=>cat.subjects||[];
const syncCounts=()=>{for(const s of subjects()){s.cmCount=cat.resources.filter(r=>r.subject===s.id&&r.kind==='cm').length;s.annaleCount=cat.resources.filter(r=>r.subject===s.id&&r.kind==='annale').length;}};
syncCounts();
const subject=id=>subjects().find(s=>s.id===id)||{name:id,date:'2099-01-01'};
const cms=()=>cat.resources.filter(r=>r.kind==='cm');
const gradeOf=id=>st.memory[id]||{count:0,step:0};
const nextExam=()=>[...exams].filter(x=>diff(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];
function urg(subjectId){const e=exams.filter(x=>x.subject===subjectId&&diff(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];if(!e)return 0.5;let d=diff(e.date);return d<=7?8:d<=21?5:d<=45?3:d<=75?1.5:1;}
function rank(r){const m=gradeOf(r.id);let due=m.nextDue&&m.nextDue<=today()?6:0;const lag=m.count?Math.max(0,5-m.step):2;return urg(r.subject)*10+due+lag+(m.lastScore==='forgot'?12:0)}
function dueRecalls(){return cms().filter(r=>st.memory[r.id]?.nextDue&&st.memory[r.id].nextDue<=today()).sort((a,b)=>rank(b)-rank(a));}
function cycles(){return cms().filter(r=>!st.cycleDone.includes(r.id));}
function missionBatch(){const active=cms();if(!active.length)return [];
 let pending=cycles();const left=Math.max(1,st.pace-(st.activeDay%st.pace));const num=Math.max(1,Math.ceil(pending.length/left));
 // Blend subjects instead of showing a wall of the same subject; exam urgency still controls order.
 const bins={};for(const r of pending){(bins[r.subject]??=[]).push(r)}
 for(const arr of Object.values(bins))arr.sort((a,b)=>rank(b)-rank(a)||a.id.localeCompare(b.id));
 const subjectOrder=Object.keys(bins).sort((a,b)=>urg(b)-urg(a)||a.localeCompare(b));
 const chosen=[];while(chosen.length<num){let added=0;for(const key of subjectOrder){if(bins[key].length){chosen.push(bins[key].shift());added++;if(chosen.length>=num)break;}}if(!added)break;}
 return chosen;
}
function stage(r){const m=gradeOf(r.id);return !m.count?'Découverte':m.lastScore==='forgot'?'Renforcement':'Consolidation'}
const bar=(n,d)=>`<div class="progressbar"><span style="width:${Math.max(0,Math.min(100,100*n/(d||1)))}%"></span></div>`;
function mast(){const e=nextExam();return `<header class="masthead"><div class="shell"><div class="mastline"><div class="logo">MED<em>2</em> <span style="font-weight:400;color:#c6dbed;font-size:14px">/ Semestre 1</span></div><span class="pill">Modules · V0.2</span></div><div class="hero"><div><small>Ton prochain examen</small><h1>${e?esc(e.title):'Planning terminé'}</h1><small>${e?shortDate(e.date):'Toutes les échéances sont passées'}</small></div><div class="days num">${e?diff(e.date):'✓'}<small>${e?'jours restants':''}</small></div></div><div class="head-actions"><span class="chip">📚 ${cms().length} CM indexés</span><span class="chip">🎯 ${exams.length} épreuves</span><span class="chip">🔁 Rythme ${st.pace} jours</span><span class="chip">✨ ${Object.keys(pedagogie.lessons||{}).length} leçon expliquée</span></div></div></header>`}
function nav(){const v=[['home','⌂','Accueil'],['library','▤','Cours'],['missions','◎','Missions'],['exams','▦','Examens'],['progress','▥','Suivi']];return `<nav class="nav" aria-label="Navigation principale"><div class="navinner">${v.map(([id,icon,l])=>`<button type="button" data-action="nav" data-id="${id}" aria-label="${l}" class="${st.view===id?'active':''}"><span class="symbol">${icon}</span>${l}</button>`).join('')}</div></nav>`}
function home(){const e=nextExam();const done=cms().filter(r=>gradeOf(r.id).count>0).length;const next=missionBatch();return `${mast()}<main class="shell"><section class="section tally"><div class="panel"><strong>${subjects().length}</strong><span>Matières</span></div><div class="panel"><strong>${cms().length}</strong><span>CM répertoriés</span></div><div class="panel"><strong>${cat.resources.filter(r=>r.kind==='annale').length}</strong><span>Annales</span></div></section><section class="section"><div class="panel" style="background:linear-gradient(125deg,#e6f1ff,#eefbf5)"><div class="row between"><div><span class="tag">Missions du Jour</span><h2 style="margin:12px 0 5px">Un défi à la fois</h2><p class="subtle" style="margin:0">${next.length} nouveaux CM proposés pour le passage actif nº ${st.activeDay+1}. Les rappels échus viennent en priorité.</p></div><span style="font-size:33px">⚡</span></div><div style="margin-top:15px"><button class="btn" data-action="nav" data-id="missions">Voir mes missions →</button></div></div></section><section class="section"><div class="row between"><h2>Progression personnelle</h2><span class="tag green">${done}/${cms().length}</span></div>${bar(done,cms().length)}<p class="subtle">Le suivi commence dès que tu autoévalues une notion. Les supports de cours sont pour l'instant indexés, pas encore réécrits.</p></section><section class="section"><h2>Priorités par échéance</h2><div class="stack">${[{date:'2026-11-04',end:'2026-11-04',name:'4 novembre · Premier bloc'},{date:'2026-12-15',end:'2026-12-16',name:'15–16 décembre · Deuxième bloc'},{date:'2027-01-07',end:'2027-01-08',name:'7–8 janvier · Troisième bloc'}].map(w=>{const xs=exams.filter(x=>x.date>=w.date&&x.date<=w.end);return `<div class="panel"><div class="row between"><strong>${w.name}</strong><span class="tag ${diff(w.date)<25?'warn':''}">${diff(w.date)>=0?'J−'+diff(w.date):'Passé'}</span></div><p class="subtle" style="margin-bottom:0">${xs.map(x=>esc(x.title)).join(' · ')}</p></div>`}).join('')}</div></section><section class="section"><div class="notice">🔒 <strong>Version fondation :</strong> les sources sont recensées sans copier les PDF dans ce site public. Les leçons narratives et les entraînements validés arriveront par matière. L'application de sémiologie précédente reste indépendante.</div><div class="actions" style="margin-top:11px"><button class="btn secondary" data-action="open-semio">Ouvrir Sémio MED2 ↗</button><button class="btn ghost" data-action="settings">Paramètres et mises à jour</button></div></section></main>`}
let query='';
function library(){const q=query.toLowerCase();let list=subjects().filter(s=>s.name.toLowerCase().includes(q)||cat.resources.some(r=>r.subject===s.id&&r.title.toLowerCase().includes(q)));const current=st.selectedSubject&&subject(st.selectedSubject);return `${mast()}<main class="shell"><div class="topbar"><h1>Bibliothèque</h1><span class="tag">${subjects().length} matières</span></div><p class="subtle">Catalogue vivant de tes supports. Les titres viennent du Drive; aucun PDF privé n’est inclus dans le site.</p><input class="search" id="search" placeholder="Rechercher une matière ou un cours..." value="${esc(query)}" aria-label="Rechercher les cours"><section class="section subject-list">${list.map(s=>`<div class="panel coursecard"><div><h3>${esc(s.name)}</h3><p class="subtle" style="margin:0">${s.cmCount} CM · ${s.annaleCount} fichiers d’annales</p><span class="tag ${s.cmCount?'green':'warn'}" style="margin-top:8px">${s.cmCount?'Sources indexées':'À compléter'}</span></div><button class="btn secondary small" data-action="subject" data-id="${s.id}">Voir →</button></div>`).join('')||'<p>Aucun résultat.</p>'}</section>${current&&current.id?subjectView(current):''}</main>`}
function subjectView(s){const rs=cat.resources.filter(r=>r.subject===s.id);return `<section class="section" id="subject-detail"><div class="panel"><div class="row between"><h2>${esc(s.name)}</h2><button class="btn ghost small" data-action="close-subject">Fermer</button></div><p class="subtle">Échéance : ${shortDate(s.date)} · ${s.cmCount} CM · ${s.annaleCount} annales.</p><div class="notice">Les cours sont répertoriés. Les modules affichant « Cours intéressant » possèdent une leçon narrative et des entraînements. Les autres restent accessibles via leur source originale.</div><h3 style="margin:17px 0 8px">Cours magistraux</h3><div class="resources">${rs.filter(r=>r.kind==='cm').map(r=>`<div class="source"><div style="font-size:21px">📄</div><div style="flex:1"><p>${esc(r.title)}</p><span class="tiny">${gradeOf(r.id).count?'Déjà travaillé · '+esc(stage(r)):'À découvrir'}</span></div>${lesson(r.id)?`<button class="btn small" data-action="open-lesson" data-id="${r.id}">✨ Cours intéressant</button>`:''}<button class="btn small secondary" data-action="open-mission" data-id="${r.id}">Réviser</button></div>`).join('')||'<div class="notice">Aucun CM dans ce dossier au moment de l’inventaire.</div>'}</div><h3 style="margin:20px 0 7px">Annales repérées</h3><p class="subtle">${s.annaleCount} documents. Leur extraction en questions avec corrigés vérifiés sera ajoutée dans une phase suivante.</p><details><summary class="subtle" style="font-weight:750;cursor:pointer">Voir les fichiers d’annales</summary><div class="resources">${rs.filter(r=>r.kind==='annale').map(r=>`<div class="source"><span>🗂️</span><p>${esc(r.title)}</p></div>`).join('')||'<p>Aucun fichier d’annales ici.</p>'}</div></details></div></section>`}
function missions(){const missions=missionBatch(), due=dueRecalls(), left=cycles().length;const count=Math.max(1,Math.ceil(left/Math.max(1,st.pace-st.activeDay%st.pace)));return `${mast()}<main class="shell"><div class="topbar"><h1>Missions du Jour</h1><span class="tag pink">Jour actif ${st.activeDay+1}</span></div><p class="subtle">Trois rythmes. Aucune pénalité si tu ne viens pas. Les dates d'examen modifient la priorité, pas la couverture totale.</p><div class="panel"><div class="speed">${[[21,'Chill'],[14,'Normal'],[7,'Intense']].map(([n,t])=>`<button class="${st.pace===n?'active':''}" data-action="pace" data-id="${n}">${t}<br><span style="font-weight:500;font-size:10px">${n} jours</span></button>`).join('')}</div><div style="margin-top:13px"><div class="row between"><strong style="font-size:13px">Cycle en cours</strong><span class="tiny">${st.cycleDone.length}/${cms().length} CM abordés</span></div>${bar(st.cycleDone.length,cms().length)}</div><p class="subtle" style="margin-bottom:0">${left?`~${count} points de contact avec les cours aujourd'hui pour terminer le cycle en ${st.pace} jours actifs.`:'Tous les CM indexés ont été abordés dans ce cycle.'} Un point de contact ne signifie pas qu’un cours entier est maîtrisé.</p></div>${due.length?`<section class="section"><div class="row between"><h2>🧠 Rappels échus</h2><span class="tag warn">${due.length}</span></div><p class="subtle">Rappelle la notion sans la relire, puis vérifie seulement en cas d’oubli.</p>${due.slice(0,st.expanded?due.length:3).map((r,i)=>missionCard(r,true)).join('')}</section>`:''}<section class="section"><div class="row between"><h2>🎯 Cycle de couverture</h2><span class="tag">${missions.length} CM</span></div>${missions.length?missions.slice(0,st.expanded?missions.length:3).map(r=>missionCard(r,false)).join(''):'<div class="notice success">Bravo, le passage complet est terminé. Relance un nouveau cycle quand tu es prêt.</div>'}${(missions.length>3||due.length>3)?`<button class="btn secondary" data-action="expand">${st.expanded?'Réduire les missions':'Afficher toutes les missions du jour'}</button>`:''}<div class="actions" style="margin-top:13px"><button class="btn" data-action="nextday">Clore cette journée active →</button>${!left?'<button class="btn secondary" data-action="resetcycle">Commencer un nouveau cycle</button>':''}</div></section><section class="section"><div class="notice">📅 Les rappels suivent une base J+1, J+3, J+7, J+14, J+30, ajustée par ton autoévaluation. Pas de notification automatique pour le moment.</div></section></main>`}
function missionCard(r,recall){const m=gradeOf(r.id),done=st.cycleDone.includes(r.id);return `<article class="mission ${done&&!recall?'done':''}"><div class="row between"><span class="tag ${stage(r)==='Renforcement'?'warn':stage(r)==='Découverte'?'':'green'}">${recall?'Rappel espacé':stage(r)}</span><small>${esc(subject(r.subject).name)}</small></div><h3>${esc(r.title)}</h3><div class="row between"><span class="tiny">${done?'✓ Vu pendant ce cycle':m.nextDue?'Prochain rappel : '+esc(m.nextDue):'Non encore évalué'}</span><button class="btn secondary small" data-action="open-mission" data-id="${r.id}">${recall?'Réactiver':'Commencer'} →</button></div>${lesson(r.id)?`<div class="learning-tools" style="margin-top:9px"><button class="btn small ghost" data-action="open-lesson" data-id="${r.id}">📖 Cours</button><button class="btn small ghost" data-action="quick-quiz" data-id="${r.id}">🧠 QCM</button><button class="btn small ghost" data-action="quick-cards" data-id="${r.id}">🃏 Cartes</button></div>`:''}</article>`}
function examsView(){const groups=[...new Set(exams.map(x=>x.date))];return `${mast()}<main class="shell"><div class="topbar"><h1>Calendrier d'examens</h1><span class="tag">Dates confirmées</span></div><p class="subtle">Planning transmis par photographie. Les dates des 7–8 janvier 2027 ont été corrigées et confirmées.</p>${groups.map(d=>`<section class="section"><div class="panel"><div class="row between"><h2 style="margin:0">${shortDate(d)}</h2><span class="tag ${diff(d)<22?'warn':''}">${diff(d)<0?'Passé':'J−'+diff(d)}</span></div><hr class="divider">${exams.filter(e=>e.date===d).map(e=>`<div class="exam-row"><div><strong>${esc(e.title)}</strong><br><small>${esc(subject(e.subject).name)}</small></div><div class="tiny num">${e.start?esc(e.start)+'–'+esc(e.end):'Horaire à confirmer'}</div></div>`).join('')}</div></section>`).join('')}<div class="notice">Les <strong>modalités d’évaluation</strong> (QCM, rédaction, exercices, schémas…) seront renseignées selon les nouvelles consignes de chaque enseignement. Aucune modalité non fournie n'a été supposée.</div></main>`}
function progress(){let n=cms().filter(r=>gradeOf(r.id).count>0).length;let correct=st.history.filter(h=>h.score==='good').length;return `${mast()}<main class="shell"><div class="topbar"><h1>Suivi & sauvegarde</h1><button class="btn ghost small" data-action="settings">Réglages</button></div><section class="section tally"><div class="panel"><strong>${n}</strong><span>CM réactivés</span></div><div class="panel"><strong>${st.history.length}</strong><span>Autoévaluations</span></div><div class="panel"><strong>${correct}</strong><span>Rappels réussis</span></div></section><section class="section"><h2>Couverture par matière</h2><div class="stack">${subjects().filter(s=>s.cmCount).map(s=>{const done=cms().filter(r=>r.subject===s.id&&gradeOf(r.id).count>0).length;return `<div class="panel"><div class="row between"><strong>${esc(s.name)}</strong><span class="tiny">${done}/${s.cmCount}</span></div><div style="margin-top:9px">${bar(done,s.cmCount)}</div></div>`}).join('')}</div></section><section class="section"><h2>Protection des résultats</h2><div class="panel"><p class="subtle">Les données sont enregistrées <strong>uniquement dans ce navigateur et sur cet appareil</strong>. Elles ne sont pas synchronisées avec ton compte GitHub. Exporte une sauvegarde avant chaque mise à jour importante.</p><div class="actions"><button class="btn" data-action="export">Exporter mes résultats</button><button class="btn secondary" data-action="import-state">Importer une sauvegarde</button></div></div></section></main>`}
function settings(){return `${mast()}<main class="shell"><div class="topbar"><h1>Réglages & synchronisation</h1><button class="btn ghost small" data-action="nav" data-id="home">Retour</button></div><section class="section"><div class="panel"><h2>La ronéo évolue chaque semaine</h2><p class="subtle">Cette V0.2 ne surveille pas Google Drive en arrière-plan. Après un contrôle des nouveaux documents, il suffit de mettre à jour <code>data/catalogue.json</code> dans le dépôt GitHub : les nouveaux CM rejoignent la rotation sans effacer les résultats.</p><div class="actions"><button class="btn secondary" data-action="import-catalogue">Importer un manifeste de cours</button><button class="btn ghost" data-action="reload">Vérifier la version publiée</button></div><p class="tiny">Révision actuelle : ${esc(cat.revision)}</p></div></section><section class="section"><div class="panel"><h2>Modalités d'examen</h2><p class="subtle">Les formats propres à chaque matière seront ajoutés lorsqu'ils auront été confirmés. Les anciennes modalités resteront disponibles.</p><span class="tag warn">À préciser pour les matières concernées</span></div></section><section class="section"><div class="panel"><h2>Compatibilité avec Sémio MED2</h2><p class="subtle">Le module actuel de sémiologie reste accessible séparément. MED2 S1 utilise volontairement une <strong>nouvelle clé de stockage</strong> afin de ne pas altérer ses anciennes sauvegardes.</p><button class="btn secondary" data-action="open-semio">Ouvrir l'ancienne application ↗</button></div></section><section class="section"><div class="panel"><h2>Sauvegardes</h2><div class="actions"><button class="btn" data-action="export">Exporter</button><button class="btn secondary" data-action="import-state">Importer</button></div><hr class="divider"><button class="btn danger small" data-action="clear">Réinitialiser MED2 S1 uniquement</button></div></section></main>`}
function render(){if(st.view==='home')app.innerHTML=home()+nav();if(st.view==='library')app.innerHTML=library()+nav();if(st.view==='missions')app.innerHTML=missions()+nav();if(st.view==='exams')app.innerHTML=examsView()+nav();if(st.view==='progress')app.innerHTML=progress()+nav();if(st.view==='settings')app.innerHTML=settings()+nav();}
const closeModal=()=>{modal.innerHTML='';st.currentMission=null};
function missionDialog(r){st.currentMission=r.id;const m=gradeOf(r.id);modal.innerHTML=`<div class="modalbg" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="Mission de restitution"><div class="row between"><span class="tag">${stage(r)}</span><button class="btn ghost small" data-action="close-modal">✕ Fermer</button></div><h2>${esc(r.title)}</h2><p class="subtle">Matière : ${esc(subject(r.subject).name)}</p>${lesson(r.id)?`<div class="notice success"><strong>Module pédagogique disponible.</strong> Tu peux maintenant étudier la leçon réécrite, répondre aux QCM ou revoir les cartes de cette matière.</div><div class="learning-tools" style="margin:12px 0"><button class="btn" data-action="open-lesson" data-id="${r.id}">📖 Cours intéressant</button><button class="btn secondary" data-action="quick-quiz" data-id="${r.id}">🧠 QCM</button><button class="btn secondary" data-action="quick-cards" data-id="${r.id}">🃏 Flashcards</button></div>`:`<div class="notice"><strong>Source indexée, leçon narrative à venir.</strong> Pour étudier son contenu exact, ouvre pour le moment le document correspondant dans ta ronéo Google Drive. Il n'est pas reproduit dans ce site.</div>`}<div class="lesson-box"><h3>Mini-défi de restitution active</h3><p>1. Sans relire, cite trois idées majeures de ce CM.<br>2. Explique une relation, définition ou mécanisme avec tes propres mots.<br>3. Repère une notion incertaine, puis vérifie-la dans la source originale.</p></div><p class="subtle">Autoévalue ce que tu as réellement restitué, et non le temps passé à lire :</p><button class="choicebtn" data-action="grade" data-id="good">✅ Restitué sans aide</button><button class="choicebtn" data-action="grade" data-id="partial">🟡 Partiellement restitué</button><button class="choicebtn" data-action="grade" data-id="forgot">🔁 Oublié — à revoir bientôt</button><p class="tiny">${m.nextDue?'Prochain rappel actuellement prévu : '+esc(m.nextDue):'Aucune date de rappel enregistrée.'}</p></div></div>`}
function beginLesson(id,tab='story'){
 if(!lesson(id))return;
 learning={id,tab,card:0,shown:false};
 drawLesson(true);
}
function drawLesson(reset=false){
 const l=lesson(learning.id);if(!l)return;
 const before=modal.querySelector('.modal')?.scrollTop||0;
 const tabs=[['story','📖 Cours intéressant'],['summary','⚡ Synthèse'],['qcm','🧠 12 QCM'],['cards','🃏 12 cartes'],['source','📄 Source']];
 const tabsHtml=tabs.map(([id,label])=>`<button class="${learning.tab===id?'active':''}" data-action="lesson-tab" data-id="${id}">${label}</button>`).join('');
 const sourceLine=`<p class="note">Source : ${esc(l.source.label)} · Pr ${esc(l.teacher.replace(/^Pr\s*/,''))}. Les pages indiquées renvoient au PDF.</p>`;
 const intro=`<div class="learning-head"><span class="tag green">Cours 1 · Sémiologie</span><h3>${esc(l.title)}</h3><p class="subtle" style="margin:0">${esc(l.hook)}</p></div>`;
 const flow=`<div class="logic-chain"><span>Premier contact</span><b>→</b><span>Interrogatoire</span><b>→</b><span>Examen physique</span><b>→</b><span>Décision et information</span></div>`;
 let body='';
 if(learning.tab==='story')body=`${intro}${flow}${l.sections.map((sect,i)=>`<section class="lesson-section"><span class="lesson-pages">PARTIE ${i+1} · PDF p. ${esc(sect.pages)}</span><h3>${esc(sect.heading)}</h3>${sect.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="lesson-memory"><strong>À retenir :</strong> ${esc(sect.memory)}</div></section>`).join('')}`;
 if(learning.tab==='summary')body=`<div class="learning-head"><h3>Le chapitre en 6 idées</h3><p class="subtle">Synthèse fidèle au cours. Utilise-la pour réactiver tes connaissances avant l'examen.</p></div>${flow}${l.summary.map((s,i)=>`<div class="lesson-section"><span class="lesson-pages">REPÈRE ${i+1} · p. ${esc(s.pages)}</span><h3>${esc(s.name)}</h3><p>${esc(s.detail)}</p></div>`).join('')}`;
 if(learning.tab==='qcm'){
  const done=l.qcm.filter((_,i)=>st.quizAnswers?.[`${l.id}#${i}`]!==undefined).length;
  const good=l.qcm.filter((q,i)=>st.quizAnswers?.[`${l.id}#${i}`]?.choice===q.answer).length;
  body=`<div class="learning-head"><h3>Entraînement QCM · ${done}/${l.qcm.length}</h3><p class="subtle">${done?`${good} bonne(s) réponse(s) sur ${done} question(s) tentée(s).`: 'Réponds avant d’afficher l’explication.'} Ces questions sont créées à partir du CM ; ce ne sont pas des annales authentifiées.</p></div>${l.qcm.map((q,i)=>{const a=st.quizAnswers?.[`${l.id}#${i}`];return `<article class="qitem"><span class="lesson-pages">QUESTION ${i+1} · PDF p. ${esc(q.pages)}</span><h3>${esc(q.q)}</h3>${q.choices.map((c,j)=>`<button class="qchoice ${a&&a.choice===j?(j===q.answer?'selected-correct':'selected-wrong'):''}" data-action="quiz-answer" data-id="${i}:${j}">${'ABCD'[j]}. ${esc(c)} ${a&&j===q.answer?'✓':''}</button>`).join('')}${a?`<div class="qfeedback"><strong>${a.choice===q.answer?'✅ Exact':'🔎 À revoir'}</strong><p style="margin:5px 0 0">${esc(q.why)} Réponse : ${'ABCD'[q.answer]}.</p></div>`:''}</article>`}).join('')}`;
 }
 if(learning.tab==='cards'){
  const i=learning.card,q=l.flashcards[i],a=st.flashcards?.[`${l.id}#${i}`];
  body=`<div class="learning-head"><h3>Flashcards · ${i+1}/${l.flashcards.length}</h3><p class="subtle">Rappelle la réponse sans regarder ; retourne ensuite la carte.</p></div><div class="fc ${learning.shown?'answer':''}">${esc(learning.shown?q.a:q.q)}</div><p class="tiny">Source PDF : p. ${esc(q.pages)} ${a?'· Dernière autoévaluation : '+esc(a.result):''}</p><div class="actions" style="margin:16px 0">${learning.shown?`<button class="btn secondary" data-action="card-mark" data-id="again">🔁 À retravailler</button><button class="btn" data-action="card-mark" data-id="good">✅ Je savais</button>`:`<button class="btn" data-action="card-reveal">Afficher la réponse</button>`}</div><div class="actions"><button class="btn ghost small" data-action="card-prev" ${i===0?'disabled':''}>← Précédente</button><button class="btn ghost small" data-action="card-next" ${i===l.flashcards.length-1?'disabled':''}>Suivante →</button></div>`;
 }
 if(learning.tab==='source')body=`<div class="learning-head"><h3>Retrouver le cours original</h3><p class="subtle">${esc(l.editorialNote)}</p></div>${sourceLine}<p>Les descriptions complètes, les illustrations cliniques et le texte original se trouvent dans la ronéo.</p><a href="${esc(l.source.url)}" class="btn" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none">Ouvrir le PDF sur Drive ↗</a><p class="note" style="margin-top:17px">La réécriture et les exercices sont des supports pédagogiques nouveaux, fondés exclusivement sur le chapitre cité. Ils ne remplacent pas le document original.</p>`;
 modal.innerHTML=`<div class="modalbg" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="Module pédagogique"><div class="row between"><span class="tag">✨ Module vérifié</span><button class="btn ghost small" data-action="close-modal">✕ Fermer</button></div><div class="lesson-tabs">${tabsHtml}</div>${body}<hr class="divider">${sourceLine}</div></div>`;
 const el=modal.querySelector('.modal');if(el)el.scrollTop=reset?0:before;
}
function grade(score){if(!st.currentMission)return;const id=st.currentMission, r=cms().find(x=>x.id===id);if(!r)return;const prev=gradeOf(id);const step=score==='good'?(prev.count?Math.min(4,(prev.step||0)+1):0):score==='partial'?Math.max(0,(prev.step||0)):0;const days=[1,3,7,14,30][step];const nd=new Date(today()+'T12:00:00');nd.setDate(nd.getDate()+days);const due=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}-${String(nd.getDate()).padStart(2,'0')}`;
st.memory[id]={count:(prev.count||0)+1,step,lastScore:score,nextDue:due,lastReviewed:today()};if(!st.cycleDone.includes(id))st.cycleDone.push(id);st.history.push({id,subject:r.subject,date:today(),score});save();closeModal();render();toast('Autoévaluation enregistrée · prochain rappel '+due)}
function toast(message){let box=document.createElement('div');box.setAttribute('role','status');box.style.cssText='position:fixed;z-index:90;left:15px;right:15px;bottom:95px;max-width:550px;margin:auto;background:#142f4f;color:white;border-radius:13px;padding:13px 16px;box-shadow:0 6px 24px #0003;text-align:center;font-size:13px';box.textContent=message;document.body.appendChild(box);setTimeout(()=>box.remove(),3000)}
function download(name,text,mime='application/json'){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
const importer=(catalog)=>{if(!catalog||!Array.isArray(catalog.resources)||!Array.isArray(catalog.subjects)||catalog.schemaVersion!==1)throw Error('Schéma de manifeste invalide.');const ids=new Set();for(const r of catalog.resources){if(!r.id||!r.subject||!r.kind||!r.title||ids.has(r.id))throw Error('Entrée de document manquante ou dupliquée.');ids.add(r.id)}for(const s of catalog.subjects){if(!s.id||!s.name)throw Error('Matière incomplète.')}cat=catalog;syncCounts();localStorage.setItem(OVERRIDE,JSON.stringify(catalog));st.cycleDone=st.cycleDone.filter(id=>ids.has(id));save();render()};
function fileImport(type){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const f=input.files[0];if(!f)return;const j=JSON.parse(await f.text());if(type==='state'){if(!j||j.app!=='med2-s1'||!j.state)throw Error('Cette sauvegarde n’appartient pas à MED2 S1.');st={...defaultState,...j.state};save();render();toast('Sauvegarde importée.')}else{importer(j);toast('Nouveau catalogue importé localement : '+cat.resources.length+' documents.')}}catch(e){alert('Import impossible : '+e.message)}};input.click();}
app.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const x=document.getElementById('search');if(x){x.focus();x.setSelectionRange(pos,pos)}}});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action,id=btn.dataset.id;if(act==='nav'){st.view=id;st.expanded=false;save();render();scrollTo({top:0,behavior:'instant'})}
if(act==='settings'){st.view='settings';save();render();scrollTo(0,0)}if(act==='subject'){st.selectedSubject=id;save();render();document.getElementById('subject-detail')?.scrollIntoView({behavior:'smooth'})}
if(act==='close-subject'){st.selectedSubject=null;save();render()}
if(act==='pace'){st.pace=Number(id);save();render()}
if(act==='expand'){st.expanded=!st.expanded;save();render()}
if(act==='open-mission'){const r=cms().find(r=>r.id===id);if(r)missionDialog(r)}
if(act==='open-lesson')beginLesson(id,'story');
if(act==='quick-quiz')beginLesson(id,'qcm');
if(act==='quick-cards')beginLesson(id,'cards');
if(act==='lesson-tab'){learning.tab=id;learning.shown=false;drawLesson(true)}
if(act==='quiz-answer'&&learning.id){const [i,j]=id.split(':').map(Number);const l=lesson(learning.id);if(l?.qcm?.[i]?.choices?.[j]!==undefined){st.quizAnswers??={};st.quizAnswers[`${learning.id}#${i}`]={choice:j,at:today()};save();drawLesson();}}
if(act==='card-reveal'){learning.shown=true;drawLesson()}
if(act==='card-next'&&learning.id){learning.card=Math.min(lesson(learning.id).flashcards.length-1,learning.card+1);learning.shown=false;drawLesson(true)}
if(act==='card-prev'&&learning.id){learning.card=Math.max(0,learning.card-1);learning.shown=false;drawLesson(true)}
if(act==='card-mark'&&learning.id){st.flashcards??={};st.flashcards[`${learning.id}#${learning.card}`]={result:id,at:today()};save();if(learning.card<lesson(learning.id).flashcards.length-1){learning.card++;learning.shown=false;drawLesson(true)}else{toast('Les 12 cartes ont été parcourues.');drawLesson()}}
if(act==='close-modal'){if(e.target.classList.contains('modalbg')||btn!==e.target.closest('.modal'))closeModal()}
if(act==='grade')grade(id)
if(act==='nextday'){if(confirm('Clore cette journée de révision ? Les tâches non faites ne provoqueront aucune pénalité.')){st.activeDay+=1;st.expanded=false;save();render();toast('Nouvelle journée active prête')}}
if(act==='resetcycle'){if(confirm('Recommencer une rotation ? Les mémorisations et rappels déjà enregistrés seront conservés.')){st.cycleDone=[];st.activeDay=0;save();render()}}
if(act==='export')download('MED2_S1_sauvegarde_'+today()+'.json',JSON.stringify({app:'med2-s1',version:1,exported:today(),state:st},null,2))
if(act==='import-state')fileImport('state')
if(act==='import-catalogue')fileImport('catalogue')
if(act==='reload'){localStorage.removeItem(OVERRIDE);location.reload()}
if(act==='open-semio')window.open('https://djamenstj7-hash.github.io/semiomed2/','_blank','noopener')
if(act==='clear'){if(confirm('Effacer uniquement la progression MED2 S1 de cet appareil ? Sémio MED2 restera intact.')){localStorage.removeItem(STORE);st={...defaultState};render()}}
});
async function hydrate(){try{const response=await fetch('./data/catalogue.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(j.schemaVersion===1&&Array.isArray(j.resources))cat=j;}}catch{}
try{const response=await fetch('./data/examens.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(Array.isArray(j.exams))exams=j.exams;}}catch{}
try{const override=JSON.parse(localStorage.getItem(OVERRIDE)||'null');if(override?.schemaVersion===1){const ids=new Set(cat.resources.map(x=>x.id));for(const r of override.resources||[]){if(!ids.has(r.id)){cat.resources.push(r);ids.add(r.id)}}const sids=new Set(cat.subjects.map(x=>x.id));for(const s of override.subjects||[]){if(!sids.has(s.id)){cat.subjects.push(s);sids.add(s.id)}}}}catch{}
try{const response=await fetch('./data/pedagogie.json?fresh='+Date.now(),{cache:'no-store'});if(response.ok){const j=await response.json();if(j.schemaVersion===1&&j.lessons&&typeof j.lessons==='object')pedagogie=j;}}catch{}
syncCounts();render();}
render();hydrate();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
})();
</script></body></html>
