<div id="app"></div><div id="modal-root"></div>
<script id="default-pedagogie" type="application/json">{"schemaVersion":1,"revision":"2026-10-11-v03-semantique1","lessons":{"cm-de715b67886d4881":{"id":"cm-de715b67886d4881","subject":"semio","title":"Abord et examen clinique du malade","courseName":"SÉMIOLOGIE ABORD DE L’EXAMEN.pdf","date":"2026-09-11","teacher":"Pr D. Launay","source":{"label":"Ronéo & Juliette 2026–2027, 9 pages","url":"https://drive.google.com/file/d/1OfrYxAE9x-QJYpcrjbXauBCF2UtC3Arm/view","pages":9},"editorialNote":"Réécriture pédagogique à partir du CM, sans ajout de connaissance médicale extérieure. Les images et observations détaillées restent consultables dans le PDF original.","hook":"Une consultation ressemble à une enquête : chaque mot du patient est une piste, chaque signe observé est un indice. Mais le but n’est pas de jouer au détective solitaire : c’est de comprendre, examiner, décider et expliquer avec le patient.","summary":[{"name":"Le cap","detail":"L’examen clinique est central pour le diagnostic et la relation médecin–malade. Il doit être méthodique, respectueux et adapté à l’urgence.","pages":"2"},{"name":"Le langage des signes","detail":"Sémiologie = science des signes. Signes cliniques : généraux, fonctionnels, physiques. Examens paracliniques : prise de sang, ECG, imagerie…","pages":"2–3"},{"name":"Le raisonnement","detail":"Un syndrome regroupe plusieurs signes cohérents. Il ne suffit pas, à lui seul, à identifier une cause.","pages":"3"},{"name":"Le déroulé","detail":"Premier contact → interrogatoire (motif, contexte, anamnèse) → examen physique → synthèse, décision, information.","pages":"3–9"},{"name":"Le geste","detail":"IPPA = inspection, palpation, percussion, auscultation. Examen ciblé ou systématique selon la situation.","pages":"7"},{"name":"La trace","detail":"Le dossier doit consigner date, heure, observateur, fonction, signature et validation médicale appropriée.","pages":"7"}],"sections":[{"heading":"Avant le diagnostic, il y a une rencontre","pages":"2, 4","paragraphs":["Imagine un patient qui entre dans ton cabinet. Avant même sa première phrase, vous échangez déjà des informations : son attitude, ton regard, votre façon de vous asseoir. Le cours insiste sur cette communication non verbale. On observe le patient ; mais lui aussi nous observe.","L’objectif du premier contact n’est pas de montrer que tu sais tout. C’est d’inspirer confiance. Présente-toi, reste poli, respecte sa pudeur, évite aussi bien la froideur que la familiarité. Place-toi à sa hauteur plutôt qu’en position dominante.","Le professeur propose une posture de « policier », au sens d’une enquête systématique et persévérante, jamais agressive. Si un élément ne colle pas au tableau, ne le balaie pas d’un revers de main. Il faut accepter l’incompréhensible et essayer de l’expliquer.","Enfin, adapte le rythme à la situation. Une consultation sans urgence et une situation aiguë ne se conduisent pas de la même manière. Le bon examen est celui réalisé au moment opportun."],"memory":"Premier contact : confiance + respect + méthode + adaptation."},{"heading":"Comprendre ce qu’on appelle un « signe »","pages":"2–3","paragraphs":["La sémiologie est la science des signes. Pour ne pas te perdre, imagine trois tiroirs dans lesquels ranger ce que tu apprends sur un malade.","Premier tiroir : les signes généraux. Dans ce cours, ils sont au nombre de quatre : fièvre, amaigrissement, asthénie (fatigue) et anorexie (perte d’appétit). L’association amaigrissement–asthénie–anorexie correspond ici à l’altération de l’état général, ou AEG.","Deuxième tiroir : les signes fonctionnels. Ce sont les sensations et troubles racontés par le patient : « j’ai mal », « je suis essoufflé ». Leur recueil repose sur la parole du malade.","Troisième tiroir : les signes physiques. Ils sont constatés lors de l’examen : un érythème, un souffle ou une hépatomégalie. Pour les rechercher, tu utilises notamment l’inspection, la palpation, la percussion et l’auscultation.","À côté de ces trois tiroirs existe une autre famille : les signes paracliniques, fournis par des examens complémentaires tels qu’une prise de sang, un ECG ou une radiographie. Attention : un marteau-réflexe, un diapason ou un tensiomètre sont des outils de l’examen clinique dans ce cours."],"memory":"Généraux = état global ; fonctionnels = racontés ; physiques = constatés ; paracliniques = examens complémentaires."},{"heading":"Un syndrome n’est pas encore une maladie","pages":"3","paragraphs":["Tu rassembles plusieurs indices et tu reconnais un motif répétitif. Voilà l’idée d’un syndrome : un ensemble cohérent et reproductible de signes.","Par exemple, le cours associe pâleur, dyspnée et asthénie au syndrome anémique. Il décrit aussi un syndrome sec avec sécheresse de plusieurs surfaces, et un syndrome néphritique associant notamment œdèmes des membres inférieurs et hypertension artérielle.","Mais attention au piège : identifier un syndrome permet un diagnostic sémiologique, pas forcément un diagnostic étiologique. Plusieurs maladies peuvent produire le même syndrome. Inversement, une même maladie peut provoquer plusieurs syndromes.","C’est comme reconnaître une fumée avant de savoir précisément ce qui brûle : tu as identifié un phénomène, pas nécessairement sa cause."],"memory":"Syndrome = motif de signes ; étiologie = cause. Ne pas les confondre."},{"heading":"L’interrogatoire : construire la carte avant d’explorer le territoire","pages":"4–6","paragraphs":["Tu commences par une question ouverte : « Qu’est-ce qui vous amène ? » Laisse le patient te raconter son histoire dans ses propres mots. Le cours insiste fortement sur l’écoute : un interrogatoire insuffisant peut conduire à des erreurs de diagnostic ou à des examens complémentaires mal orientés.","Ensuite, tu organises ce que tu entends en trois dossiers mentaux. D’abord, le motif de consultation : pourquoi est-il là aujourd’hui ? Puis le contexte : antécédents personnels et familiaux, métier, traitements, allergies, voyages, facteurs de risque. Enfin, l’anamnèse : comment le problème a-t-il commencé et évolué ?","Prenons une scène fictive construite seulement pour illustrer cette méthode : un patient dit « je suis essoufflé ». Tu notes le mot biomédical « dyspnée ». Mais tu ne t’arrêtes pas au mot : tu précises depuis quand, dans quelles circonstances, s’il s’agit d’un premier épisode et quelles autres manifestations sont présentes.","Les questions ouvertes permettent le récit ; les questions fermées servent ensuite à préciser. Certains patients parlent peu : sollicite-les. D’autres s’éloignent du sujet : recentre poliment. La qualité de ton interrogatoire dépend autant de l’écoute que des questions.","Avant de passer à la suite, reformule en langage compréhensible. Le but est de vérifier que vous parlez bien de la même chose et de ne pas imposer tes propres réponses. La prise de notes permet de retrouver les détails plus tard."],"memory":"Interrogatoire = motif → contexte/ATCD → anamnèse ; ouvert d’abord, fermé pour préciser, reformulation pour vérifier."},{"heading":"L’examen physique : regarder, toucher, écouter… avec méthode","pages":"3, 7–9","paragraphs":["Maintenant que tu as une carte du problème, tu passes au terrain : l’examen physique. Le cours distingue deux approches. La méthode ciblée explore en priorité le problème évoqué ; la méthode méthodique parcourt les appareils un par un, souvent dans un contexte hospitalier plus propice à l’exhaustivité.","Le fil rouge de l’examen physique est IPPA : Inspection, Palpation, Percussion, Auscultation. Le choix et la profondeur des gestes dépendent du contexte clinique. Prends le temps d’expliquer ce que tu vas faire et préserve la pudeur du patient.","En pneumologie, le cours recommande notamment de rechercher à l’interrogatoire la dyspnée, la toux, l’expectoration, l’hémoptysie et la douleur thoracique, puis de procéder à l’examen physique. En cardiologie, il mentionne dyspnée, douleur thoracique, lipothymie, syncope et palpitations, complétées par l’examen cardiovasculaire.","La première anecdote du CM montre une patiente avec des bouffées de chaleur, des troubles digestifs et un bilan hépatique perturbé. Plusieurs consultations n’avaient pas conduit à l’examen cutané complet ; l’observation de lésions profuses a finalement orienté vers une mastocytose. Le message n’est pas de deviner la maladie à la première minute : c’est d’oser regarder ce qui n’a pas encore été examiné.","Autre exemple rapporté par le professeur : des uvéites répétées associées à des lésions indurées au niveau de cicatrices font penser à une sarcoïdose. Chez une patiente jeune avec une phlébite spontanée, la constatation d’un livedo racemosa oriente vers un syndrome des antiphospholipides. Ce sont des associations de signes à reconnaître, pas une invitation à conclure sans contexte.","Le cours montre aussi le phénomène de Raynaud (doigts qui changent de couleur au froid), puis des myalgies avec déficit musculaire et lésions inflammatoires cutanées évoquant une dermatomyosite. Enfin, chez un patient avec cardiopathie hypertrophique, antécédent d’AVC et insuffisance rénale, des angiokératomes observés à l’aine sont présentés comme des signes précieux de maladie de Fabry.","Le dossier clinique doit garder une trace de l’examen : date, heure, identité et fonction de l’observateur, signature et validation par un médecin habilité selon le cadre rappelé dans le cours."],"memory":"Deux méthodes : ciblée ou systématique. Dans les deux cas : IPPA et recherche de signes pertinents."},{"heading":"Conclure : le patient doit connaître la suite de l’histoire","pages":"9","paragraphs":["Un mauvais scénario médical serait de poser beaucoup de questions, examiner longuement, puis sortir de la pièce sans expliquer la suite. Le cours demande de ne pas négliger la phase III : conclusion et décision.","Fais une synthèse. Propose un diagnostic ou plusieurs hypothèses si le tableau reste incertain. Décide, selon le contexte, d’une prise en charge, d’examens complémentaires, d’une prescription ou d’une orientation spécialisée.","Enfin, explique clairement au patient, avec des mots adaptés. Fais particulièrement attention aux termes anxiogènes quand tu n’es encore qu’au stade d’une hypothèse. Et consigne les constatations de la consultation.","L’idée maîtresse de ce chapitre tient en une phrase : un bon examen clinique est à la fois une méthode pour chercher des signes et une manière de construire une relation de soin."],"memory":"Phase III = synthèse → hypothèses → décision → information claire → traçabilité."}],"flashcards":[{"q":"Définis la sémiologie.","a":"La science des signes.","pages":"2"},{"q":"Cite les quatre signes généraux listés dans ce cours.","a":"Fièvre, amaigrissement, asthénie et anorexie.","pages":"2"},{"q":"Quels trois éléments composent l’AEG selon ce cours ?","a":"Amaigrissement, asthénie et anorexie.","pages":"2"},{"q":"Différence : signe fonctionnel versus signe physique ?","a":"Fonctionnel : rapporté par le patient. Physique : constaté lors de l’examen clinique.","pages":"2–3"},{"q":"Donne deux exemples de signes paracliniques.","a":"Par exemple un résultat de prise de sang et un ECG (ou un examen d’imagerie).","pages":"2"},{"q":"Un syndrome établit-il directement une étiologie ?","a":"Non. Il regroupe des signes cohérents, mais plusieurs maladies peuvent entraîner le même syndrome.","pages":"3"},{"q":"Quelles sont les trois finalités de l’interrogatoire ?","a":"Comprendre le motif ; situer le contexte et les ATCD ; comprendre l’histoire de la maladie (anamnèse).","pages":"5–6"},{"q":"Pourquoi commencer par des questions ouvertes ?","a":"Pour permettre au patient de formuler spontanément son motif et son récit. Les questions fermées viendront ensuite préciser.","pages":"4–6"},{"q":"Que signifie IPPA ?","a":"Inspection, Palpation, Percussion, Auscultation.","pages":"7"},{"q":"Deux méthodes d’examen clinique ?","a":"Une méthode ciblée sur le motif de consultation et une méthode systématique appareil par appareil.","pages":"7"},{"q":"Quelles sont les quatre grandes phases de l’examen médical ?","a":"Phase initiale de contact, interrogatoire, examen physique, conclusion/décision avec information.","pages":"3–4, 9"},{"q":"Que doit-on consigner dans le dossier à l’issue de l’examen ?","a":"Notamment date, heure, nom de l’observateur, fonction, signature et validation médicale selon le cours.","pages":"7"}],"qcm":[{"q":"Parmi les propositions suivantes, laquelle correspond à la définition de la sémiologie ?","choices":["Science des signes","Science du médicament","Analyse exclusive des examens complémentaires","Étude des seuls symptômes douloureux"],"answer":0,"why":"Le cours définit explicitement la sémiologie comme la science des signes.","pages":"2"},{"q":"Lequel des éléments suivants est classé comme un signe fonctionnel ?","choices":["Souffle perçu à l’auscultation","Douleur décrite par le patient","Érythème observé","Hépatomégalie palpée"],"answer":1,"why":"Un signe fonctionnel est rapporté par le patient ; la douleur en est un exemple.","pages":"2–3"},{"q":"Quel triplet correspond à l’AEG selon le cours ?","choices":["Fièvre, tachycardie, douleur","Fièvre, dyspnée, toux","Amaigrissement, asthénie, anorexie","Œdème, hypertension, pâleur"],"answer":2,"why":"Le document distingue quatre signes généraux et précise que les trois derniers — amaigrissement, asthénie, anorexie — définissent l’AEG.","pages":"2"},{"q":"Quel examen est cité parmi les examens paracliniques ?","choices":["Palpation","Inspection","Examen au marteau-réflexe","Électrocardiogramme"],"answer":3,"why":"L’ECG figure dans la liste des examens paracliniques du cours. Le marteau-réflexe est présenté comme un outil clinique.","pages":"2"},{"q":"Un syndrome est…","choices":["Un ensemble cohérent et reproductible de signes","Toujours synonyme d’une maladie unique","Uniquement un résultat biologique","Nécessairement lié à un seul organe"],"answer":0,"why":"Un syndrome rassemble plusieurs signes ; il n’identifie pas automatiquement l’étiologie.","pages":"3"},{"q":"Quelle question convient le mieux pour ouvrir l’interrogatoire ?","choices":["Vous avez forcément une infection, non ?","Qu’est-ce qui vous amène ?","Vous n’avez pas mal ailleurs ?","La douleur date-t-elle exactement de quatre jours ?"],"answer":1,"why":"Le professeur recommande une question neutre et ouverte au premier contact ; les questions fermées servent ensuite à préciser.","pages":"4–6"},{"q":"Quels sont les trois grands objectifs de l’interrogatoire ?","choices":["Imagerie, biologie, prescription","Auscultation, palpation, percussion","Motif, contexte/ATCD, anamnèse","Diagnostic définitif, traitement, sortie"],"answer":2,"why":"Comprendre le motif, situer le contexte et reconstruire l’histoire de la maladie sont les trois objectifs explicitement énoncés.","pages":"5–6"},{"q":"IPPA signifie :","choices":["Investigation, Prélèvement, Prescription, Analyse","Interrogatoire, Palpation, Prise de sang, Auscultation","Inspection, Pression, Percussion, Anamnèse","Inspection, Palpation, Percussion, Auscultation"],"answer":3,"why":"Le sigle IPPA structure l’examen physique dans le CM.","pages":"7"},{"q":"Concernant les deux méthodes d’examen physique, quelle affirmation est juste ?","choices":["L’une est ciblée, l’autre systématique appareil par appareil","La méthode systématique exclut l’interrogatoire","La méthode ciblée ne doit jamais être utilisée","Elles sont strictement identiques"],"answer":0,"why":"Le cours distingue la méthode ciblée en consultation et l’examen méthodique, appareil par appareil.","pages":"7"},{"q":"À propos de la conclusion de consultation, quel comportement est attendu ?","choices":["Éviter toute explication au patient","Faire une synthèse, exposer les hypothèses et informer clairement","Attendre nécessairement tous les examens avant d’émettre une hypothèse","Omettre les notes cliniques"],"answer":1,"why":"La phase III comprend synthèse, hypothèses diagnostiques, décisions et information adaptée au patient.","pages":"9"},{"q":"Lequel des éléments suivants figure dans les informations à documenter après l’examen ?","choices":["La couleur préférée du patient","L’adresse de chaque membre de sa famille","La date, l’heure, le nom et la fonction de l’observateur","Une hypothèse présentée obligatoirement comme une certitude"],"answer":2,"why":"Le cours mentionne ces données de traçabilité ainsi que signature et validation médicale.","pages":"7"},{"q":"Un patient raconte une gêne respiratoire ; comment le cours classe-t-il ce renseignement ?","choices":["Signe exclusivement paraclinique","Signe physique uniquement","Syndrome étiologique confirmé","Signe fonctionnel recueilli à l’interrogatoire"],"answer":3,"why":"La dyspnée, rapportée par le malade, est l’un des exemples de signes fonctionnels du cours.","pages":"2, 7"}]},"cm-f3c1f87a603ee97a":{"id":"cm-f3c1f87a603ee97a","subject":"semio","title":"Sémiologie — Sémantique 1 : décoder les mots médicaux","courseName":"SÉMIOLOGIE SEMANTIQUE 1 (version définitive).pdf","date":"2026-09-10","teacher":"Pr Aubert-Baillot","source":{"label":"Ronéo & Juliette 2026–2027, 10 pages","url":"https://drive.google.com/file/d/1UagUeBm6EWlgXZ4f3ygNKq1bEVBRDocu/view","pages":10},"editorialNote":"Réécriture explicative établie à partir de la ronéo de 10 pages, sans ajout de faits médicaux. Certaines formulations de la source demandent vérification (notamment l’exemple « achalasie » dans le tableau de -chalasie). Les exercices sont inédits, non issus d’annales.","hook":"Les mots médicaux ne sont pas des codes secrets à réciter. Ce sont souvent des mots construits comme des LEGO : une racine raconte une fonction, un préfixe la modifie, et le suffixe précise le phénomène. Aujourd’hui, on visite 14 ateliers de fabrication des mots.","summary":[{"name":"Mouvement et arrêt","detail":"Isch- = diminution/arrêt ; kinésie = mouvement ; praxie = geste coordonné ; stase = arrêt d’écoulement ; pause = cessation.","pages":"2"},{"name":"Sécrétion / écoulement","detail":"Endo- = intérieur, crin- = sécrétion ; -agogue = conduit ; -rrhée = flux ; -rrhagie = jaillissement ; -staxis = gouttes.","pages":"2–3"},{"name":"Chute et tonus","detail":"Ptose = chute ; lapsus = glissement ; sclérose = dur ; malacie = mou ; spasme = contraction ; chalasie = relâchement au sens du radical.","pages":"3–4"},{"name":"Motricité et attitudes","detail":"Parésie = déficit partiel ; plégie = paralysie totale ; phil(o)- = aimer ; mis(o)- = rejeter.","pages":"4"},{"name":"Nocivité et maladie","detail":"Noc(i)- = nuisible ; phtisi(o)- = consomption ; path(o)- = maladie ; -pathie change de sens selon le contexte.","pages":"5–6"},{"name":"Génération et origine","detail":"-gène peut être actif ou passif ; -genèse = production ; agénésie = absence ; dysgénésie = formation anormale ; congénital = depuis la naissance.","pages":"6–7"},{"name":"Microscopie et croissance","detail":"Bio = vie ; blasto = germe ; histo = tissu ; cyto = cellule ≠ cysto = vessie ; caryo/nucléo = noyau ; plasie = formation.","pages":"7–8"},{"name":"Âges","detail":"Péd/puér = enfant ; hébé = jeune ; gér/presby = âgé ; sénesc = vieillissement.","pages":"8–9"},{"name":"Mort et microbes","detail":"Thanato/lét = mort ; cide = qui tue ; sapro = pourri ; sept/sepsi = lié à la putréfaction ; xéno = étranger.","pages":"9"},{"name":"Destruction / réparation","detail":"Lyse = dissolution ou libération ; clasie = brisure ; tripsie = écrasement ; plastie = réparation ; physe/phyte = excroissance.","pages":"9–10"}],"sections":[{"heading":"1. Le corps freine, s’arrête ou réalise un geste","pages":"2","paragraphs":["Entre dans un hôpital imaginaire dont les portes indiquent la fonction de chaque mot. Dans le premier couloir, un panneau « isch- » avertit que la circulation sanguine ralentit ou s’arrête : c’est le début du mot ischémie. Plus loin, « kinésie » annonce le mouvement. Avec le préfixe dys-, la dyskinésie devient un mouvement anormal ou difficile.","Dans la salle des gestes techniques, « praxie » désigne l’action coordonnée. La dyspraxie concerne donc une difficulté à réaliser des gestes. Il ne faut pas la confondre avec une simple anomalie de mouvement. À la sortie, deux panneaux disent « arrêt », mais dans des contextes différents : « stase » évoque un écoulement ralenti ou arrêté ; « pause » une cessation, comme dans ménopause.","Mémo : imagine un cinéma pour kinésie (ça bouge), une pratique pour praxie (ça s’organise), et une station d’arrêt pour stase (ça ne coule plus). Ces associations servent à mémoriser la racine, pas à remplacer la définition du cours."],"memory":"ISCH = flux sanguin diminué ; KINÉSIE = bouger ; PRAXIE = geste coordonné ; STASE = écoulement bloqué ; PAUSE = arrêt."},{"heading":"2. La sécrétion : dedans ou dehors ?","pages":"2","paragraphs":["Tu vois une glande comme une petite usine. Le radical « crin- » t’annonce ce qu’elle fabrique ou libère : une sécrétion. « Endo- » indique la direction intérieure. Assemble-les : le cours définit la glande endocrine par sa sécrétion libérée à l’intérieur de l’organisme, dans le sang.","À l’examen, plutôt que d’apprendre « endocrine » comme un bloc, découpe le terme en deux questions : « Où ? » et « Quoi ? ». Où : endo, à l’intérieur. Quoi : crin, la sécrétion."],"memory":"ENDO = intérieur ; CRIN = sécrétion. Deux morceaux, un seul principe de lecture."},{"heading":"3. Trois façons de voir un liquide couler","pages":"2–3","paragraphs":["Imagine une canalisation. Avec « -rrhée », un liquide s’écoule : l’aménorrhée correspond à l’absence du flux menstruel. Avec « -rrhagie », le débit devient bien plus intense : pense à hémorragie. Avec « -staxis », imagine une fuite au goutte-à-goutte : le cours donne l’épistaxis comme exemple de saignement de nez.","Il reste « -agogue », le conducteur de la scène : un cholagogue participe à évacuer la bile. Et « cata- » suggère un mouvement descendant, que la ronéo retrouve dans l’étymologie de catarrhe.","Mémo visuel : un robinet qui coule (RRHÉE), un tuyau qui éclate (RRHAGIE), une pipette qui goutte (STAXIS). Attention : ce sont des images mnémotechniques, pas des critères de gravité clinique."],"memory":"RRHÉE = ça coule ; RRHAGIE = ça jaillit fortement ; STAXIS = goutte à goutte ; AGOGUE = ça conduit."},{"heading":"4. Quand quelque chose tombe","pages":"3","paragraphs":["Au quatrième étage, une pancarte tombe : voici « ptose » ou « ptosis ». Le CM cite l’onychoptose, chute d’un ongle, et le mot apoptose dans le vocabulaire des chutes au sens étymologique.","Dans le couloir suivant, « lapsus » rappelle le glissement. Le cours rapproche cette racine du collapsus, présenté comme un affaissement. Retenir la famille étymologique ne dispense pas d’apprendre le sens médical précis de chaque mot."],"memory":"PTOSE = chute ; LAPSUS = glissement. Deux images proches mais non interchangeables."},{"heading":"5. Des tissus durs, mous, contractés ou relâchés","pages":"3–4","paragraphs":["Quatre portes, quatre sensations. La première est dure comme de la pierre : « -sclérose » décrit le durcissement d’un tissu ou d’un organe ; l’artériosclérose est donnée en exemple. La deuxième ressemble à une éponge : « -malacie » signifie ramollissement, comme dans ostéomalacie.","La troisième porte se ferme brusquement : « -spasme » traduit la contraction. La quatrième porte revient au relâchement : « -chalasie ». Le tableau de la ronéo donne l’achalasie comme illustration, mais ce rapprochement nécessite une vérification médicale, car la définition clinique d’achalasie ne doit pas être déduite littéralement du seul radical.","Le cours mentionne encore les termes « analeptique » et « neuroleptique » pour illustrer le radical « -leptique ». Ici, il faut apprendre les exemples et leur contexte plutôt que d’appliquer une traduction unique à tous les mots."],"memory":"SCLÉROSE = dur ; MALACIE = mou ; SPASME = contracté ; CHALASIE = relâchement (sens radical du tableau)."},{"heading":"6. Un muscle affaibli n’est pas toujours totalement paralysé","pages":"4","paragraphs":["Imagine une télécommande musculaire. Avec la parésie, le signal arrive trop faiblement : le cours décrit une perte partielle de la contraction. Avec la plégie, la paralysie est totale. L’hémiplégie associe « hémi- », moitié, à « -plégie » : une moitié du corps est paralysée.","Le piège à éliminer immédiatement : « parésie » n’est pas synonyme de « plégie ». Un seul changement de suffixe, une différence majeure de signification."],"memory":"PARÉSIE = déficit partiel ; PLÉGIE = paralysie totale."},{"heading":"7. Aimer ou rejeter : le vocabulaire des attitudes","pages":"4","paragraphs":["Les racines peuvent raconter une préférence ou une aversion. « Phil(o)- » marque l’attirance ou le fait d’aimer. « Mis(o)- » renvoie au rejet. Le cours illustre cette seconde racine avec misandrie, misogynie et misanthropie.","Le secret est de lire la deuxième moitié du mot : andr(o)- renvoie à l’homme, gyn- à la femme, anthrop- à l’être humain. Tu peux ainsi décoder ces termes sans mémoriser chaque définition comme un mot isolé."],"memory":"PHIL(O) = aimer ; MIS(O) = détester ; ANDR(O) = homme ; GYN = femme ; ANTHROP = humain."},{"heading":"8. Ce qui nuit et ce qui consume","pages":"5","paragraphs":["Dans ce chapitre, « noc(i)- » signale ce qui est nuisible. Le CM rapproche cette famille de nociception, la réception des stimuli potentiellement nuisibles, et de l’innocuité, décrite comme l’absence de risque pour la santé.","« Phtisi(o)- » porte l’idée de consomption, d’un épuisement progressif. Le cours l’utilise notamment dans phtisie, phtisiologie et phtisiothérapie, rattachées à la tuberculose pulmonaire."],"memory":"NOC = nuisible ; PHTISI = consomption progressive."},{"heading":"9. PATH : une même famille, plusieurs sens selon l’entourage","pages":"5–6","paragraphs":["Le radical « path- / patho- » renvoie à la maladie ou à ce que l’on subit. C’est le cœur de pathologie. Il se combine avec d’autres éléments : « neuropathie » concerne les nerfs, « myopathie » les muscles, « pneumopathie » les poumons.","Mais ne déclenche pas automatiquement la même traduction dès que tu vois « -pathie » : le CM consacre une autre série au ressenti. Apathie, empathie et sympathie sont expliquées par des préfixes qui modifient la manière de ressentir.","Autre nuance : « pathognomonique » renvoie à des signes caractéristiques permettant de reconnaître une maladie. « Pathomimie » évoque la simulation ou l’imitation d’une maladie. Homéo- signifie semblable, allo- autre : le cours s’en sert aussi pour expliquer homéopathique et allopathique."],"memory":"PATH(O) = maladie ; organe + PATHIE = maladie de cet organe ; A-PATHIE = absence de ressenti."},{"heading":"10. GEN : actif, passif ou formation ?","pages":"6–7","paragraphs":["Voici le piège principal de cette partie. « -gène » peut indiquer ce qui engendre quelque chose, comme dans lacrymogène, mais aussi ce qui est engendré par une cause : iatrogène signifie engendré par le médecin. Il faut lire le mot entier pour savoir si le sens est actif ou passif.","« -genèse » ou « -génèse » signale une formation : angiogenèse pour les vaisseaux, chondrogenèse pour le cartilage. Ajoute « a- » : agénésie, absence de formation ; ajoute « dys- » : dysgénésie, formation perturbée.","Le cours oppose aussi « endogène » (origine intérieure) à « exogène » (origine extérieure). « Congénital » signifie présent dès la naissance, ce qui n’implique pas nécessairement une transmission héréditaire.","Attention aux faux amis des racines : « gon- » intervient dans gonade, lié à la reproduction ; « gon- / gony- » évoque aussi le genou dans gonarthrite ; et « gen- » peut désigner le menton, comme dans rétrogénie."],"memory":"GÈNE : poser « qui produit quoi ? » ; GENÈSE : formation ; A-GÉNÉSIE : absence ; DYS-GÉNÉSIE : formation anormale."},{"heading":"11. La carte microscopique : vie, tissus, cellules et noyaux","pages":"7–8","paragraphs":["Changeons d’échelle. « Bi(o)- » renvoie à la vie ; « blasto- » au germe dans le tableau. Avec « histo- », tu arrives au tissu ; avec « cyto- », à la cellule. Un ostéocyte est une cellule de l’os. Le cours cite aussi les leucocytes et les érythrocytes.","Le piège visuel est redoutable : CYTO (cellule) et CYSTO (vessie) ne sont séparés que par une lettre. Imagine le S de cySto comme la forme d’une poche pour te rappeler la vessie. Pour le noyau, tu disposes de « nucléo- » et « caryo- ».","Enfin, « -plasie » concerne le développement ou la formation. Une aplasie est une absence de développement ; une dysplasie correspond à un développement anormal. Ici encore, le préfixe donne la nature du problème."],"memory":"BIO = vie ; HISTO = tissu ; CYTO = cellule ; CYSTO = vessie ; CARYO/NUCLÉO = noyau."},{"heading":"12. L’âge se cache dans les mots","pages":"8–9","paragraphs":["Imagine une frise chronologique. Au départ, l’enfant : péd- et puér-. Puis vient le jeune avec hébé-. Plus loin, la personne âgée avec gér- et presby-. Les exemples de la ronéo sont pédiatre, puériculture, hébéphrénie, gériatrie et presbytie.","« Sénesc- » évoque le vieillissement : dans le CM, la sénescence rassemble des transformations liées à l’âge décrites comme non pathologiques. Ne confonds donc pas vieillissement et maladie par réflexe."],"memory":"PÉD/PUÉR = enfant ; HÉBÉ = jeune ; GÉR/PRESBY = âgé ; SÉNESC = vieillissement."},{"heading":"13. Mort, putréfaction et microbes","pages":"9","paragraphs":["Dernier couloir : celui des termes qui impressionnent. « Thanato- » et « lét- » renvoient à la mort ; « -cide » à ce qui tue. Le CM cite la thanatopraxie, létal, insecticide et cytocide.","« Sapro- » désigne le pourri ; « sept- » et « sepsi(c)- » se rattachent dans le tableau à la putréfaction et aux germes. Pour mémoriser, oppose l’asepsie, ensemble de mesures préventives destinées à écarter les microbes, et l’antiseptique, qui détruit les microbes ou empêche leur développement dans la formulation du cours.","Enfin « xéno- » veut dire étranger. Le CM donne « axénique » comme exemple. Garde le sens étymologique distinct des définitions microbiologiques qui peuvent dépendre du contexte."],"memory":"THANATO/LÉT = mort ; CIDE = qui tue ; SAPRO = pourri ; SEPT/SEPSI = putréfaction/infection ; XÉNO = étranger."},{"heading":"14. Détruire, briser, fragmenter ou réparer","pages":"9–10","paragraphs":["Imagine un atelier de réparation. « -lyse » dissout ou détruit, comme ostéolyse ; mais attention au sens de libération, que la ronéo illustre par salpingolyse. La même racine change de nuance selon l’ensemble du mot.","Un ouvrier casse : « -clasie » signifie brisure. Un autre fragmente : « -tripsie » signifie écrasement, avec lithotripsie comme exemple. Enfin, « -plastie » désigne la réparation ou le modelage, notamment en chirurgie.","Deux mots voisins terminent le parcours : « -physe » désigne ici une excroissance d’origine naturelle ; « -phyte » une excroissance pathologique. L’ostéophyte est l’exemple à retenir pour la seconde. Imagine un petit arbre (« phyte ») qui pousse là où il n’est pas attendu."],"memory":"LYSE = dissoudre / délier ; CLASIE = briser ; TRIPSIE = écraser ; PLASTIE = réparer ; PHYSE/PHYTE = excroissance."}],"qcm":[{"q":"Que signifie le radical « isch(é)- » ?","choices":["durcissement d’un tissu ou d’un organe","mouvement","lenteur ou arrêt d’un écoulement","diminution ou arrêt"],"answer":3,"why":"« isch(é)- » : diminution ou arrêt. Exemple du cours : ischémie : diminution ou arrêt de la circulation sanguine.","pages":"2","topic":"Mouvement","difficulty":"Fondamentaux"},{"q":"Dans un terme médical, « kinés(i)- / -kinésie » évoque :","choices":["action ou geste coordonné","mouvement","arrêt ou cessation","diminution ou arrêt"],"answer":1,"why":"« kinés(i)- / -kinésie » : mouvement. Exemple du cours : dyskinésie : mouvement anormal ou difficile.","pages":"2","topic":"Mouvement","difficulty":"Fondamentaux"},{"q":"Quelle idée associer à « -praxie » ?","choices":["action ou geste coordonné","mouvement","lenteur ou arrêt d’un écoulement","arrêt ou cessation"],"answer":0,"why":"« -praxie » : action ou geste coordonné. Exemple du cours : dyspraxie : difficulté à effectuer des gestes coordonnés.","pages":"2","topic":"Mouvement","difficulty":"Fondamentaux"},{"q":"On rencontre « dyspraxie » : quelle composante précise est difficile ?","choices":["L’écoulement d’un liquide","La réalisation coordonnée de gestes","La contraction totale d’un muscle","La sécrétion vers le sang"],"answer":1,"why":"Praxie signifie action ou mouvement coordonné ; dys- marque une difficulté.","pages":"2","topic":"Mouvement","difficulty":"Piège / distinction"},{"q":"Pour décoder « -stase », quelle définition faut-il retenir ?","choices":["arrêt ou cessation","mouvement","diminution ou arrêt","lenteur ou arrêt d’un écoulement"],"answer":3,"why":"« -stase » : lenteur ou arrêt d’un écoulement. Exemple du cours : cholostase : arrêt de l’écoulement de la bile, selon le CM.","pages":"2","topic":"Mouvement","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « -pause » ?","choices":["mouvement","arrêt ou cessation","action ou geste coordonné","lenteur ou arrêt d’un écoulement"],"answer":1,"why":"« -pause » : arrêt ou cessation. Exemple du cours : ménopause : fin de la fonction menstruelle.","pages":"2","topic":"Mouvement","difficulty":"Fondamentaux"},{"q":"Dans un terme médical, « endo- » évoque :","choices":["à l’intérieur","action ou geste coordonné","écoulement, flux","diminution ou arrêt"],"answer":0,"why":"« endo- » : à l’intérieur. Exemple du cours : endocrine : sécrétion vers l’intérieur de l’organisme, dans le sang.","pages":"2","topic":"Sécrétion","difficulty":"Fondamentaux"},{"q":"Quel couple oppose correctement mouvement et geste coordonné ?","choices":["Kinésie = vieillissement ; praxie = noyau","Kinésie = sécrétion ; praxie = écoulement","Kinésie = paralysie ; praxie = chute","Kinésie = mouvement ; praxie = geste coordonné"],"answer":3,"why":"Les deux racines appartiennent au domaine moteur, mais la praxie insiste sur la coordination des gestes.","pages":"2","topic":"Mouvement","difficulty":"Application"},{"q":"Quelle idée associer à « crin- » ?","choices":["écoulement, flux","à l’intérieur","sécrétion","lenteur ou arrêt d’un écoulement"],"answer":2,"why":"« crin- » : sécrétion. Exemple du cours : endocrine : endo- (intérieur) + crin- (sécrétion).","pages":"2","topic":"Sécrétion","difficulty":"Fondamentaux"},{"q":"Pour décoder « -agogue », quelle définition faut-il retenir ?","choices":["écoulement, flux","qui conduit ou évacue","écoulement goutte à goutte","mouvement descendant"],"answer":1,"why":"« -agogue » : qui conduit ou évacue. Exemple du cours : cholagogue : qui évacue la bile.","pages":"3","topic":"Écoulements","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « -rrhée » ?","choices":["mouvement descendant","écoulement goutte à goutte","écoulement, flux","jaillissement, écoulement intense"],"answer":2,"why":"« -rrhée » : écoulement, flux. Exemple du cours : aménorrhée : absence de flux menstruel.","pages":"3","topic":"Écoulements","difficulty":"Fondamentaux"},{"q":"À partir des radicaux du CM, quel suffixe renvoie au flux menstruel dans « aménorrhée » ?","choices":["-rrhée","-clasie","-tripsie","-plégie"],"answer":0,"why":"-rrhée signifie écoulement ; a- indique l’absence.","pages":"3","topic":"Écoulements","difficulty":"Application"},{"q":"Dans un terme médical, « -rrhagie / -ragie » évoque :","choices":["qui conduit ou évacue","écoulement, flux","jaillissement, écoulement intense","mouvement descendant"],"answer":2,"why":"« -rrhagie / -ragie » : jaillissement, écoulement intense. Exemple du cours : hémorragie : écoulement important de sang.","pages":"3","topic":"Écoulements","difficulty":"Fondamentaux"},{"q":"Quelle idée associer à « -staxis » ?","choices":["écoulement goutte à goutte","qui conduit ou évacue","mouvement descendant","jaillissement, écoulement intense"],"answer":0,"why":"« -staxis » : écoulement goutte à goutte. Exemple du cours : épistaxis : saignement de nez.","pages":"3","topic":"Écoulements","difficulty":"Fondamentaux"},{"q":"Pour décoder « cata- », quelle définition faut-il retenir ?","choices":["écoulement goutte à goutte","écoulement, flux","mouvement descendant","qui conduit ou évacue"],"answer":2,"why":"« cata- » : mouvement descendant. Exemple du cours : catarrhe : écoulement ou hypersécrétion des muqueuses.","pages":"3","topic":"Écoulements","difficulty":"Fondamentaux"},{"q":"Quelle image mentale correspond le mieux à « -staxis » ?","choices":["Un goutte-à-goutte","Une contraction brusque","Une production tissulaire","Une excroissance"],"answer":0,"why":"Le CM associe -staxis à l’écoulement goutte à goutte.","pages":"3","topic":"Écoulements","difficulty":"Piège / distinction"},{"q":"Que signifie le radical « -ptose / -ptosis » ?","choices":["glissement, affaissement","diminution ou arrêt","chute","relâchement (sens du radical dans le tableau)"],"answer":2,"why":"« -ptose / -ptosis » : chute. Exemple du cours : onychoptose : chute de l’ongle.","pages":"3","topic":"Chute","difficulty":"Fondamentaux"},{"q":"Dans un terme médical, « lapsus / collapsus » évoque :","choices":["diminution ou arrêt","contraction","chute","glissement, affaissement"],"answer":3,"why":"« lapsus / collapsus » : glissement, affaissement. Exemple du cours : collapsus : affaissement d’un organe, selon le CM.","pages":"3","topic":"Chute","difficulty":"Fondamentaux"},{"q":"Quelle idée associer à « -sclérose » ?","choices":["relâchement (sens du radical dans le tableau)","durcissement d’un tissu ou d’un organe","contraction","ramollissement"],"answer":1,"why":"« -sclérose » : durcissement d’un tissu ou d’un organe. Exemple du cours : artériosclérose : épaississement et durcissement artériel.","pages":"3","topic":"Tonus des tissus","difficulty":"Fondamentaux"},{"q":"Le suffixe « -rrhagie » se distingue de « -rrhée » par :","choices":["une notion de noyau","une notion de jaillissement ou de flux plus intense","une notion exclusive d’absence","une notion de ramollissement"],"answer":1,"why":"Le CM oppose écoulement et jaillissement/écoulement plus intense.","pages":"3","topic":"Écoulements","difficulty":"Application"},{"q":"Pour décoder « -spasme », quelle définition faut-il retenir ?","choices":["durcissement d’un tissu ou d’un organe","contraction","ramollissement","qui agit sur, diminue ou calme, selon le terme"],"answer":1,"why":"« -spasme » : contraction. Exemple du cours : cystospasme : spasme de la vessie.","pages":"3","topic":"Tonus des tissus","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « -malacie » ?","choices":["durcissement d’un tissu ou d’un organe","contraction","relâchement (sens du radical dans le tableau)","ramollissement"],"answer":3,"why":"« -malacie » : ramollissement. Exemple du cours : ostéomalacie : ramollissement des os.","pages":"4","topic":"Tonus des tissus","difficulty":"Fondamentaux"},{"q":"Dans un terme médical, « -chalasie » évoque :","choices":["relâchement (sens du radical dans le tableau)","ramollissement","contraction","qui agit sur, diminue ou calme, selon le terme"],"answer":0,"why":"« -chalasie » : relâchement (sens du radical dans le tableau). Exemple du cours : chalasie : radical présenté avec le relâchement ; voir alerte de vérification sur « achalasie ».","pages":"4","topic":"Tonus des tissus","difficulty":"Fondamentaux"},{"q":"Dans « ostéomalacie », quelle idée apporte « -malacie » ?","choices":["Une brisure","Un ramollissement","Une chute","Une réparation chirurgicale"],"answer":1,"why":"-malacie signifie ramollissement ; le CM l’illustre avec l’os.","pages":"4","topic":"Tonus des tissus","difficulty":"Application"},{"q":"Quelle idée associer à « -leptique » ?","choices":["contraction","ramollissement","relâchement (sens du radical dans le tableau)","qui agit sur, diminue ou calme, selon le terme"],"answer":3,"why":"« -leptique » : qui agit sur, diminue ou calme, selon le terme. Exemple du cours : neuroleptique : calme l’agitation et l’hyperactivité neuromusculaire.","pages":"4","topic":"Tonus des tissus","difficulty":"Fondamentaux"},{"q":"Pour décoder « -parésie », quelle définition faut-il retenir ?","choices":["déficit moteur partiel, paralysie légère","lenteur ou arrêt d’un écoulement","diminution ou arrêt","relâchement (sens du radical dans le tableau)"],"answer":0,"why":"« -parésie » : déficit moteur partiel, paralysie légère. Exemple du cours : parésie : affaiblissement de la contraction musculaire.","pages":"4","topic":"Paralysie","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « -plégie » ?","choices":["lenteur ou arrêt d’un écoulement","contraction","mouvement","paralysie totale"],"answer":3,"why":"« -plégie » : paralysie totale. Exemple du cours : hémiplégie : paralysie d’une moitié du corps.","pages":"4","topic":"Paralysie","difficulty":"Fondamentaux"},{"q":"Quel terme indique un déficit moteur partiel plutôt qu’une paralysie complète ?","choices":["Ptose","Plégie","Sclérose","Parésie"],"answer":3,"why":"La parésie est partielle tandis que la plégie désigne une paralysie totale.","pages":"4","topic":"Paralysie","difficulty":"Piège / distinction"},{"q":"Dans un terme médical, « hémi- » évoque :","choices":["moitié","ramollissement","relâchement (sens du radical dans le tableau)","durcissement d’un tissu ou d’un organe"],"answer":0,"why":"« hémi- » : moitié. Exemple du cours : hémiplégie : atteinte d’une moitié du corps.","pages":"4","topic":"Paralysie","difficulty":"Fondamentaux"},{"q":"Quelle idée associer à « phil(o)- » ?","choices":["détester, avoir de l’aversion","aimer, être attiré par","femme, sexe féminin","homme, sexe masculin"],"answer":1,"why":"« phil(o)- » : aimer, être attiré par. Exemple du cours : coprophilie : attirance liée aux excréments.","pages":"4","topic":"Attirance / aversion","difficulty":"Fondamentaux"},{"q":"Pour décoder « mis(o)- », quelle définition faut-il retenir ?","choices":["aimer, être attiré par","détester, avoir de l’aversion","femme, sexe féminin","être humain"],"answer":1,"why":"« mis(o)- » : détester, avoir de l’aversion. Exemple du cours : misandrie : aversion pour les hommes ; misogynie : aversion pour les femmes.","pages":"4","topic":"Attirance / aversion","difficulty":"Fondamentaux"},{"q":"Quelle association explique correctement « misanthropie » ?","choices":["miso- = mouvement ; anthrop- = muscle","miso- = détester ; anthrop- = humain","miso- = sécréter ; anthrop- = cellule","philo- = aimer ; anthrop- = os"],"answer":1,"why":"Misanthropie signifie aversion pour le genre humain d’après les racines du tableau.","pages":"4","topic":"Attirance / aversion","difficulty":"Application"},{"q":"Que signifie le radical « andr- / andro- » ?","choices":["femme, sexe féminin","être humain","homme, sexe masculin","détester, avoir de l’aversion"],"answer":2,"why":"« andr- / andro- » : homme, sexe masculin. Exemple du cours : misandrie : aversion envers les hommes.","pages":"4","topic":"Attirance / aversion","difficulty":"Fondamentaux"},{"q":"Dans un terme médical, « gyn- / gyné- » évoque :","choices":["être humain","femme, sexe féminin","détester, avoir de l’aversion","homme, sexe masculin"],"answer":1,"why":"« gyn- / gyné- » : femme, sexe féminin. Exemple du cours : misogynie : aversion envers les femmes.","pages":"4","topic":"Attirance / aversion","difficulty":"Fondamentaux"},{"q":"Quelle idée associer à « anthrop- » ?","choices":["être humain","femme, sexe féminin","homme, sexe masculin","détester, avoir de l’aversion"],"answer":0,"why":"« anthrop- » : être humain. Exemple du cours : misanthropie : aversion à l’égard du genre humain.","pages":"4","topic":"Attirance / aversion","difficulty":"Fondamentaux"},{"q":"Quelle famille contient la notion de « qui peut nuire » ?","choices":["gér-","plastie","crin-","noc(i)-"],"answer":3,"why":"Noc(i)- est le radical du nuisible dans la ronéo.","pages":"5","topic":"Nocivité","difficulty":"Application"},{"q":"Pour décoder « noc(i)- », quelle définition faut-il retenir ?","choices":["nuisible","absence","putréfaction, infection dans les exemples du cours","mort"],"answer":0,"why":"« noc(i)- » : nuisible. Exemple du cours : innocuité : absence de risque pour la santé, selon le CM.","pages":"5","topic":"Nocivité","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « phtisi(o)- » ?","choices":["consomption progressive","semblable","maladie de l’organe nommé","simulation ou imitation d’une maladie"],"answer":0,"why":"« phtisi(o)- » : consomption progressive. Exemple du cours : phtisiologie : étude de la tuberculose.","pages":"5","topic":"Nocivité","difficulty":"Fondamentaux"},{"q":"Dans un terme médical, « path- / patho- » évoque :","choices":["maladie, affection, ce que l’on subit","propre, particulier","avec, ensemble","semblable"],"answer":0,"why":"« path- / patho- » : maladie, affection, ce que l’on subit. Exemple du cours : pathologie : étude de la maladie.","pages":"5","topic":"Maladie / ressenti","difficulty":"Fondamentaux"},{"q":"Quelle construction décrit une maladie des nerfs ?","choices":["Neuro + tripsie","Neuro + pathie","Neuro + philo","Neuro + pause"],"answer":1,"why":"Le tableau associe le nom d’organe à -pathie pour former une maladie d’organe, ex. neuropathie.","pages":"5","topic":"Maladie / ressenti","difficulty":"Piège / distinction"},{"q":"Quelle idée associer à « -pathie (après un organe) » ?","choices":["maladie de l’organe nommé","permet de reconnaître une maladie par ses signes caractéristiques","propre, particulier","simulation ou imitation d’une maladie"],"answer":0,"why":"« -pathie (après un organe) » : maladie de l’organe nommé. Exemple du cours : neuropathie : maladie des nerfs.","pages":"5","topic":"Maladie / ressenti","difficulty":"Fondamentaux"},{"q":"Pour décoder « pathognomonique », quelle définition faut-il retenir ?","choices":["permet de reconnaître une maladie par ses signes caractéristiques","propre, particulier","simulation ou imitation d’une maladie","autre"],"answer":0,"why":"« pathognomonique » : permet de reconnaître une maladie par ses signes caractéristiques. Exemple du cours : signe pathognomonique : signe caractéristique d’une maladie.","pages":"5","topic":"Maladie / ressenti","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « pathomimie » ?","choices":["avec, ensemble","semblable","simulation ou imitation d’une maladie","autre"],"answer":2,"why":"« pathomimie » : simulation ou imitation d’une maladie. Exemple du cours : pathomimie : fait de simuler une maladie.","pages":"5","topic":"Maladie / ressenti","difficulty":"Fondamentaux"},{"q":"Quelle distinction résume les sens d’« apathie » et « empathie » dans le cours ?","choices":["Développer / détruire un tissu","Conduire / jaillir","Vieillir / tomber","Ne rien ressentir / ressentir de l’intérieur autrui"],"answer":3,"why":"Dans cette série de -pathie, le préfixe modifie la manière de ressentir.","pages":"6","topic":"Maladie / ressenti","difficulty":"Application"},{"q":"Dans un terme médical, « idio- » évoque :","choices":["avec, ensemble","propre, particulier","semblable","autre"],"answer":1,"why":"« idio- » : propre, particulier. Exemple du cours : idiopathique : terme expliqué via « particulier » dans le CM.","pages":"6","topic":"Maladie / ressenti","difficulty":"Fondamentaux"},{"q":"Quelle idée associer à « homéo- » ?","choices":["semblable","propre, particulier","maladie de l’organe nommé","simulation ou imitation d’une maladie"],"answer":0,"why":"« homéo- » : semblable. Exemple du cours : homéopathique : homéo- exprime le semblable.","pages":"6","topic":"Maladie / ressenti","difficulty":"Fondamentaux"},{"q":"Pour décoder « allo- », quelle définition faut-il retenir ?","choices":["simulation ou imitation d’une maladie","semblable","autre","maladie, affection, ce que l’on subit"],"answer":2,"why":"« allo- » : autre. Exemple du cours : allopathique : allo- exprime l’autre.","pages":"6","topic":"Maladie / ressenti","difficulty":"Fondamentaux"},{"q":"Pourquoi « -gène » ne suffit-il pas toujours à donner une traduction unique ?","choices":["Il désigne toujours l’absence de formation","Il peut désigner ce qui engendre ou ce qui est engendré","Il signifie seulement « genou »","Il indique toujours un mouvement"],"answer":1,"why":"Le tableau distingue sens actif (qui génère) et passif (généré par).","pages":"6","topic":"Origine / genèse","difficulty":"Application"},{"q":"Que signifie le radical « a- (apathie) » ?","choices":["maladie, affection, ce que l’on subit","propre, particulier","absence","autre"],"answer":2,"why":"« a- (apathie) » : absence. Exemple du cours : apathie : ne rien ressentir, selon le découpage du CM.","pages":"6","topic":"Maladie / ressenti","difficulty":"Fondamentaux"},{"q":"Dans un terme médical, « em- (empathie) » évoque :","choices":["intérieur","propre, particulier","simulation ou imitation d’une maladie","avec, ensemble"],"answer":0,"why":"« em- (empathie) » : intérieur. Exemple du cours : empathie : ressentir de l’intérieur les sentiments d’autrui.","pages":"6","topic":"Maladie / ressenti","difficulty":"Fondamentaux"},{"q":"Quelle idée associer à « sym- (sympathie) » ?","choices":["avec, ensemble","semblable","intérieur","propre, particulier"],"answer":0,"why":"« sym- (sympathie) » : avec, ensemble. Exemple du cours : sympathie : souffrir ou ressentir à l’unisson, selon le cours.","pages":"6","topic":"Maladie / ressenti","difficulty":"Fondamentaux"},{"q":"Comment le cours interprète-t-il « iatrogène » ?","choices":["Généré par le médecin","Qui produit du cartilage","Produit des larmes","Généré par l’intérieur"],"answer":0,"why":"Iatrogène est donné comme exemple du sens passif de -gène.","pages":"6","topic":"Origine / genèse","difficulty":"Piège / distinction"},{"q":"Pour décoder « -gène (sens actif) », quelle définition faut-il retenir ?","choices":["production, formation, développement","qui engendre ou provoque X","genou","sous, peu"],"answer":1,"why":"« -gène (sens actif) » : qui engendre ou provoque X. Exemple du cours : tératogène : qui produit des malformations, traduit par « génère un monstre » dans la ronéo.","pages":"6","topic":"Origine / genèse","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « -gène (sens passif) » ?","choices":["de l’extérieur","présent dès la naissance","anomalie, difficulté, mauvaise formation","qui est engendré par X"],"answer":3,"why":"« -gène (sens passif) » : qui est engendré par X. Exemple du cours : iatrogène : engendré par le médecin.","pages":"6","topic":"Origine / genèse","difficulty":"Fondamentaux"},{"q":"Dans un terme médical, « hypo- » évoque :","choices":["sous, peu","genou","anomalie, difficulté, mauvaise formation","menton, dans certains termes"],"answer":0,"why":"« hypo- » : sous, peu. Exemple du cours : hypoallergène : qui provoque peu d’allergies.","pages":"6","topic":"Origine / genèse","difficulty":"Fondamentaux"},{"q":"Que distingue « agénésie » de « dysgénésie » ?","choices":["Absence de formation / mauvaise formation","Ramollissement / durcissement","Noyau / cellule","Enfant / personne âgée"],"answer":0,"why":"a- = absence ; dys- = mauvais fonctionnement ou mauvaise formation.","pages":"7","topic":"Origine / genèse","difficulty":"Application"},{"q":"Quelle idée associer à « endo- (endogène) » ?","choices":["sous, peu","origine intérieure","présent dès la naissance","qui est engendré par X"],"answer":1,"why":"« endo- (endogène) » : origine intérieure. Exemple du cours : endogène : engendré de l’intérieur.","pages":"6","topic":"Origine / genèse","difficulty":"Fondamentaux"},{"q":"Pour décoder « exo- », quelle définition faut-il retenir ?","choices":["de l’extérieur","descendance, semence, reproduction","genou","menton, dans certains termes"],"answer":0,"why":"« exo- » : de l’extérieur. Exemple du cours : exogène : engendré de l’extérieur.","pages":"6","topic":"Origine / genèse","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « -genèse / -génèse » ?","choic es exemples du cours","étranger","contre"],"answer":0,"why":"« -cide » : qui tue. Exemple du cours : cytocide : qui tue des cellules.","pages":"9","topic":"Mort / putréfaction","difficulty":"Fondamentaux"},{"q":"Quelle idée associer à « sapro- » ?","choices":["pourri, putréfaction","contre","putréfaction, infection dans les exemples du cours","mort, mortel"],"answer":0,"why":"« sapro- » : pourri, putréfaction. Exemple du cours : saprophyte : lié à des matières organiques inertes.","pages":"9","topic":"Mort / putréfaction","difficulty":"Fondamentaux"},{"q":"Pour décoder « sept- / sepsi(c)- », quelle définition faut-il retenir ?","choices":["absence, privation","qui tue","mort","putréfaction, infection dans les exemples du cours"],"answer":3,"why":"« sept- / sepsi(c)- » : putréfaction, infection dans les exemples du cours. Exemple du cours : septicémie : terme expliqué par des germes et leurs toxines dans le sang.","pages":"9","topic":"Mort / putréfaction","difficulty":"Fondamentaux"},{"q":"Quel couple renvoie à la mort ?","choices":["crin- et endo-","thanato- et lét-","cyto- et cysto-","péd- et gér-"],"answer":1,"why":"Thanato- (grec) et lét- (latin) sont réunis dans le tableau sous « mort ».","pages":"9","topic":"Mort / putréfaction","difficulty":"Application"},{"q":"Que signifie le radical « a- (asepsie) » ?","choices":["putréfaction, infection dans les exemples du cours","mort, mortel","pourri, putréfaction","absence, privation"],"answer":3,"why":"« a- (asepsie) » : absence, privation. Exemple du cours : asepsie : prévention visant à éviter la contamination microbienne.","pages":"9","topic":"Mort / putréfaction","difficulty":"Fondamentaux"},{"q":"Dans un terme médical, « anti- (antiseptique) » évoque :","choices":["mort, mortel","absence, privation","contre","putréfaction, infection dans les exemples du cours"],"answer":2,"why":"« anti- (antiseptique) » : contre. Exemple du cours : antiseptique : détruit les microbes et empêche leur développement, selon le CM.","p ndamentaux"},{"q":"Quel suffixe signifie « brisure » et non « dissolution » ?","choices":["-phyte","-lyse","-plastie","-clasie"],"answer":3,"why":"-clasie = brisure ; -lyse = dissolution/destruction ou libération selon le contexte.","pages":"10","topic":"Destruction / réparation","difficulty":"Application"},{"q":"Quelle idée associer à « -plastie » ?","choices":["brisure, fracture","excroissance pathologique","écrasement, fragmentation","réparation ou modelage"],"answer":3,"why":"« -plastie » : réparation ou modelage. Exemple du cours : élytroplastie : chirurgie réparatrice du vagin.","pages":"10","topic":"Destruction / réparation","difficulty":"Fondamentaux"},{"q":"Pour décoder « -physe », quelle définition faut-il retenir ?","choices":["écrasement, fragmentation","excroissance pathologique","excroissance d’origine naturelle","dissolution, destruction, mais parfois libération"],"answer":2,"why":"« -physe » : excroissance d’origine naturelle. Exemple du cours : hypophyse : protubérance à la base du cerveau, selon le CM.","pages":"10","topic":"Destruction / réparation","difficulty":"Fondamentaux"},{"q":"Que signifie le radical « -phyte » ?","choices":["excroissance d’origine naturelle","dissolution, destruction, mais parfois libération","excroissance pathologique","écrasement, fragmentation"],"answer":2,"why":"« -phyte » : excroissance pathologique. Exemple du cours : ostéophyte : excroissance osseuse.","pages":"10","topic":"Destruction / réparation","difficulty":"Fondamentaux"},{"q":"Quelle combinaison exprime la fragmentation des calculs ?","choices":["litho- + -tripsie","litho- + -rrhée","litho- + -crin","litho- + -plégie"],"answer":0,"why":"Lithotripsie est l’exemple de fragmentation de calculs donné par le cours.","pages":"10","topic":"Destruction / réparation","difficulty":"Application"},{"q":"Dans le cours, pourquoi « -lyse » demande-t-il de lire le mot complet ?","choices":["Parce qu’il indique toujours la mort","Parce qu’il peut évoquer dissolution ou libération","Parce qu’il ne s’utilise que dans les âges","Parce qu’il signifie toujours noyau"],"answer":1,"why":"Ostéolyse = destruction ; salpingolyse illustre le sens de libération.","pages":"9–10","topic":"Destruction / réparation","difficulty":"Piège / distinction"},{"q":"Quelle association est correcte ?","choices":["-phyte = cellule ; -physe = vessie","-phyte = enfant ; -physe = âgé","-phyte = paralysie ; -physe = chute","-phyte = excroissance pathologique ; -physe = excroissance naturelle"],"answer":3,"why":"Le tableau oppose les deux suffixes en fonction du type d’excroissance.","pages":"10","topic":"Destruction / réparation","difficulty":"Application"},{"q":"Quel terme renvoie à une intervention de réparation ou de modelage ?","choices":["-staxis","-plastie","-ptose","-plégie"],"answer":1,"why":"-plastie signifie réparation ou modelage, illustré en chirurgie.","pages":"10","topic":"Destruction / réparation","difficulty":"Application"}],"flashcards":[{"q":"Que signifie « isch(é)- » ?","a":"Diminution ou arrêt. Exemple : ischémie : diminution ou arrêt de la circulation sanguine.","pages":"2","topic":"Mouvement"},{"q":"Que signifie « kinés(i)- / -kinésie » ?","a":"Mouvement. Exemple : dyskinésie : mouvement anormal ou difficile.","pages":"2","topic":"Mouvement"},{"q":"Que signifie « -praxie » ?","a":"Action ou geste coordonné. Exemple : dyspraxie : difficulté à effectuer des gestes coordonnés.","pages":"2","topic":"Mouvement"},{"q":"Que signifie « -stase » ?","a":"Lenteur ou arrêt d’un écoulement. Exemple : cholostase : arrêt de l’écoulement de la bile, selon le CM.","pages":"2","topic":"Mouvement"},{"q":"Que signifie « -pause » ?","a":"Arrêt ou cessation. Exemple : ménopause : fin de la fonction menstruelle.","pages":"2","topic":"Mouvement"},{"q":"Que signifie « endo- » ?","a":"À l’intérieur. Exemple : endocrine : sécrétion vers l’intérieur de l’organisme, dans le sang.","pages":"2","topic":"Sécrétion"},{"q":"Que signifie « crin- » ?","a":"Sécrétion. Exemple : endocrine : endo- (intérieur) + crin- (sécrétion).","pages":"2","topic":"Sécrétion"},{"q":"Que signifie « -agogue » ?","a":"Qui conduit ou évacue. Exemple : cholagogue : qui évacue la bile.","pages":"3","topic":"Écoulements"},{"q":"Que signifie « -rrhée » ?","a":"Écoulement, flux. Exemple : aménorrhée : absence de flux menstruel.","pages":"3","topic":"Écoulements"},{"q":"Que signifie « -rrhagie / -ragie » ?","a":"Jaillissement, écoulement intense. Exemple : hémorragie : écoulement important de sang.","pages":"3","topic":"Écoulements"},{"q":"Que signifie « -staxis » ?","a":"Écoulement goutte à goutte. Exemple : épistaxis : saignement de nez.","pages":"3","topic":"Écoulements"},{"q":"Que signifie « cata- » ?","a":"Mouvement descendant. Exemple : catarrhe : écoulement ou hypersécrétion des muqueuses.","pages":"3","topic":"Écoulements"},{"q":"Que signifie « -ptose / -ptosis » ?","a":"Chute. Exemple : onychoptose : chute de l’ongle.","pages":"3","topic":"Chute"},{"q":"Que signifie « lapsus / collapsus » ?","a":"Glissement, affaissement. Exemple : collapsus : affaissement d’un organe, selon le CM.","pages":"3","topic":"Chute"},{"q":"Que signifie « -sclérose » ?","a":"Durcissement d’un tissu ou d’un organe. Exemple : artériosclérose : épaississement et durcissement artériel.","pages":"3","topic":"Tonus des tissus"},{"q":"Que signifie « -spasme » ?","a":"Contraction. Exemple : cystospasme : spasme de la vessie.","pages":"3","topic":"Tonus des tissus"},{"q":"Que signifie « -malacie » ?","a":"Ramollissement. Exemple : ostéomalacie : ramollissement des os.","pages":"4","topic":"Tonus des tissus"},{"q":"Que signifie « -chalasie » ?","a":"Relâchement (sens du radical dans le tableau). Exemple : chalasie : radical présenté avec le relâchement ; voir alerte de vérification sur « achalasie ».","pages":"4","topic":"Tonus des tissus"},{"q":"Que signifie « -leptique » ?","a":"Qui agit sur, diminue ou calme, selon le terme. Exemple : neuroleptique : calme l’agitation et l’hyperactivité neuromusculaire.","pages":"4","topic":"Tonus des tissus"},{"q":"Que signifie « -parésie » ?","a":"Déficit moteur partiel, paralysie légère. Exemple : parésie : affaiblissement de la contraction musculaire.","pages":"4","topic":"Paralysie"},{"q":"Que signifie « -plégie » ?","a":"Paralysie totale. Exemple : hémiplégie : paralysie d’une moitié du corps.","pages":"4","topic":"Paralysie"},{"q":"Que signifie « hémi- » ?","a":"Moitié. Exemple : hémiplégie : atteinte d’une moitié du corps.","pages":"4","topic":"Paralysie"},{"q":"Que signifie « phil(o)- » ?","a":"Aimer, être attiré par. Exemple : coprophilie : attirance liée aux excréments.","pages":"4","topic":"Attirance / aversion"},{"q":"Que signifie « mis(o)- » ?","a":"Détester, avoir de l’aversion. Exemple : misandrie : aversion pour les hommes ; misogynie : aversion pour les femmes.","pages":"4","topic":"Attirance / aversion"},{"q":"Que signifie « andr- / andro- » ?","a":"Homme, sexe masculin. Exemple : misandrie : aversion envers les hommes.","pages":"4","topic":"Attirance / aversion"},{"q":"Que signifie « gyn- / gyné- » ?","a":"Femme, sexe féminin. Exemple : misogynie : aversion envers les femmes.","pages":"4","topic":"Attirance / aversion"},{"q":"Que signifie « anthrop- » ?","a":"Être humain. Exemple : misanthropie : aversion à l’égard du genre humain.","pages":"4","topic":"Attirance / aversion"},{"q":"Que signifie « noc(i)- » ?","a":"Nuisible. Exemple : innocuité : absence de risque pour la santé, selon le CM.","pages":"5","topic":"Nocivité"},{"q":"Que signifie « phtisi(o)- » ?","a":"Consomption progressive. Exemple : phtisiologie : étude de la tuberculose.","pages":"5","topic":"Nocivité"},{"q":"Que signifie « path- / patho- » ?","a":"Maladie, affection, ce que l’on subit. Exemple : pathologie : étude de la maladie.","pages":"5","topic":"Maladie / ressenti"},{"q":"Que signifie « -pathie (après un organe) » ?","a":"Maladie de l’organe nommé. Exemple : neuropathie : maladie des nerfs.","pages":"5","topic":"Maladie / ressenti"},{"q":"Que signifie « pathognomonique » ?","a":"Permet de reconnaître une maladie par ses signes caractéristiques. Exemple : signe pathognomonique : signe caractéristique d’une maladie.","pages":"5","topic":"Maladie / ressenti"},{"q":"Que signifie « pathomimie » ?","a":"Simulation ou imitation d’une maladie. Exemple : pathomimie : fait de simuler une maladie.","pages":"5","topic":"Maladie / ressenti"},{"q":"Que signifie « idio- » ?","a":"Propre, particulier. Exemple : idiopathique : terme expliqué via « particulier » dans le CM.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « homéo- » ?","a":"Semblable. Exemple : homéopathique : homéo- exprime le semblable.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « allo- » ?","a":"Autre. Exemple : allopathique : allo- exprime l’autre.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « a- (apathie) » ?","a":"Absence. Exemple : apathie : ne rien ressentir, selon le découpage du CM.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « em- (empathie) » ?","a":"Intérieur. Exemple : empathie : ressentir de l’intérieur les sentiments d’autrui.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « sym- (sympathie) » ?","a":"Avec, ensemble. Exemple : sympathie : souffrir ou ressentir à l’unisson, selon le cours.","pages":"6","topic":"Maladie / ressenti"},{"q":"Que signifie « -gène (sens actif) » ?","a":"Qui engendre ou provoque x. Exemple : tératogène : qui produit des malformations, traduit par « génère un monstre » dans la ronéo.","pages":"6","topic":"Origine / genèse"},{"q":"Que signifie « -gène (sens passif) » ?","a":"Qui est engendré par x. Exemple : iatrogène : engendré par le médecin.","pages":"6","topic":"Origine / genèse"},{"q":"Que signifie « hypo- » ?","a":"Sous, peu. Exemple : hypoallergène : qui provoque peu d’allergies.","pages":"6","topic":"Origine / genèse"},{"q":"Que signifie « endo- (endogène) » ?","a":"Origine intérieure. Exemple : endogène : engendré de l’intérieur.","pages":"6","topic":"Origine / genèse"},{"q":"Que signifie « exo- » ?","a":"De l’extérieur. Exemple : exogène : engendré de l’extérieur.","pages":"6","topic":"Origine / genèse"},{"q":"Que signifie « -genèse / -génèse » ?","a":"Production, formation, développement. Exemple : angiogenèse : formation de vaisseaux.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « a- (agénésie) » ?","a":"Absence. Exemple : agénésie : absence de formation d’un organe.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « dys- (dysgénésie) » ?","a":"Anomalie, difficulté, mauvaise formation. Exemple : dysgénésie : mauvaise formation d’un organe.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « congénital » ?","a":"Présent dès la naissance. Exemple : congénital ne signifie pas nécessairement héréditaire.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « gon- (gonade) » ?","a":"Descendance, semence, reproduction. Exemple : gonade : ovaire ou testicule produisant les gamètes.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « gon- / gony- (genou) » ?","a":"Genou. Exemple : gonarthrite : inflammation de l’articulation du genou.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « gen- (menton) » ?","a":"Menton, dans certains termes. Exemple : rétrogénie : menton fuyant.","pages":"7","topic":"Origine / genèse"},{"q":"Que signifie « bi(o)- / -bie » ?","a":"Vie. Exemple : biopsie : prélèvement d’un fragment de tissu pour examen.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « blast(o)- / -blaste » ?","a":"Germe, cellule peu différenciée dans les exemples du cm. Exemple : néoblaste : cellule décrite comme indifférenciée dans le CM.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « hist(o)- » ?","a":"Tissu. Exemple : histologie : étude microscopique des tissus.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « cyto- / -cyte » ?","a":"Cellule. Exemple : ostéocyte : cellule de l’os.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « cysto- » ?","a":"Vessie, à distinguer de cyto-. Exemple : cystospasme : spasme de la vessie.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « nucléo- » ?","a":"Noyau. Exemple : mononucléaire : cellule à un seul noyau.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « caryo- » ?","a":"Noyau. Exemple : caryoclasique : qui frappe la cellule en division, selon le CM.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « -plasie » ?","a":"Formation ou développement d’un tissu / organe. Exemple : dysplasie : développement anormal.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « aplasie » ?","a":"Absence de développement d’un tissu ou organe. Exemple : aplasie : défaut de formation ou développement.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « dysplasie » ?","a":"Anomalie du développement d’un tissu ou organe. Exemple : dysplasie : mauvais développement.","pages":"8","topic":"Vie / cellule"},{"q":"Que signifie « péd- » ?","a":"Enfant. Exemple : pédiatre : médecin spécialiste des enfants.","pages":"8","topic":"Âges"},{"q":"Que signifie « puér- » ?","a":"Enfant. Exemple : puériculture : art d’élever les enfants.","pages":"8","topic":"Âges"},{"q":"Que signifie « hébé- » ?","a":"Jeune, adolescent. Exemple : hébéphrénie : forme de schizophrénie débutant à l’adolescence selon le CM.","pages":"8","topic":"Âges"},{"q":"Que signifie « gér- » ?","a":"Personne âgée. Exemple : gériatrie : médecine de la personne âgée.","pages":"8","topic":"Âges"},{"q":"Que signifie « presby- » ?","a":"Vieux, lié à l’âge. Exemple : presbytie : diminution de l’accommodation visuelle.","pages":"8","topic":"Âges"},{"q":"Que signifie « sénesc- » ?","a":"Vieillissement. Exemple : sénescence : phénomènes non pathologiques liés à l’âge, selon le CM.","pages":"9","topic":"Âges"},{"q":"Que signifie « thanato- » ?","a":"Mort. Exemple : thanatopraxie : soins destinés à retarder la décomposition d’un corps.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « lét- » ?","a":"Mort, mortel. Exemple : létal : qui provoque la mort.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « -cide » ?","a":"Qui tue. Exemple : cytocide : qui tue des cellules.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « sapro- » ?","a":"Pourri, putréfaction. Exemple : saprophyte : lié à des matières organiques inertes.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « sept- / sepsi(c)- » ?","a":"Putréfaction, infection dans les exemples du cours. Exemple : septicémie : terme expliqué par des germes et leurs toxines dans le sang.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « a- (asepsie) » ?","a":"Absence, privation. Exemple : asepsie : prévention visant à éviter la contamination microbienne.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « anti- (antiseptique) » ?","a":"Contre. Exemple : antiseptique : détruit les microbes et empêche leur développement, selon le CM.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « xén(o)- » ?","a":"Étranger. Exemple : axénique : exempt de pathogènes ou de saprophytes selon la ronéo.","pages":"9","topic":"Mort / putréfaction"},{"q":"Que signifie « -lyse / -lytique » ?","a":"Dissolution, destruction, mais parfois libération. Exemple : ostéolyse : destruction du tissu osseux ; salpingolyse : libération des trompes.","pages":"9","topic":"Destruction / réparation"},{"q":"Que signifie « -clasie » ?","a":"Brisure, fracture. Exemple : ostéoclasie : fracture chirurgicale d’un os pour le remettre en place.","pages":"10","topic":"Destruction / réparation"},{"q":"Que signifie « -tripsie » ?","a":"Écrasement, fragmentation. Exemple : lithotripsie : fragmentation des calculs.","pages":"10","topic":"Destruction / réparation"},{"q":"Que signifie « -plastie » ?","a":"Réparation ou modelage. Exemple : élytroplastie : chirurgie réparatrice du vagin.","pages":"10","topic":"Destruction / réparation"},{"q":"Que signifie « -physe » ?","a":"Excroissance d’origine naturelle. Exemple : hypophyse : protubérance à la base du cerveau, selon le CM.","pages":"10","topic":"Destruction / réparation"},{"q":"Que signifie « -phyte » ?","a":"Excroissance pathologique. Exemple : ostéophyte : excroissance osseuse.","pages":"10","topic":"Destruction / réparation"},{"q":"RRHÉE / RRHAGIE / STAXIS : restitue les trois sens.","a":"RRHÉE = écoulement ; RRHAGIE = jaillissement, flux intense ; STAXIS = goutte à goutte.","pages":"3","topic":"Écoulements"},{"q":"PARÉSIE / PLÉGIE : quelle différence ?","a":"Parésie : atteinte partielle ; plégie : paralysie totale.","pages":"4","topic":"Paralysie"},{"q":"CYTO / CYSTO : quel est le piège ?","a":"Cyto = cellule ; cysto = vessie.","pages":"8","topic":"Vie / cellule"},{"q":"AGÉNÉSIE / DYSGÉNÉSIE : différence ?","a":"Agénésie = absence de formation ; dysgénésie = mauvaise formation.","pages":"7","topic":"Origine / genèse"},{"q":"CONGÉNITAL et HÉRÉDITAIRE : synonymes ?","a":"Non. Congénital signifie présent dès la naissance ; le cours indique que ce n’est pas nécessairement héréditaire.","pages":"7","topic":"Origine / genèse"},{"q":"ASEPSIE / ANTISEPTIQUE : distinction du CM ?","a":"Asepsie = mesures de prévention visant à écarter les microbes. Antiseptique = produit qui détruit les microbes ou empêche leur développement.","pages":"9","topic":"Mort / putréfaction"},{"q":"LYSE / CLASIE / TRIPSIE / PLASTIE : associe les verbes.","a":"Lyse = dissoudre/délier ; clasie = briser ; tripsie = écraser/fragmenter ; plastie = réparer/modeler.","pages":"9–10","topic":"Destruction / réparation"}],"flow":["Repérer la racine","Lire préfixe et suffixe","Traduire le mot","Vérifier le contexte"],"flags":["Source p. 4 : le tableau associe « -chalasie » à « relâchement » et cite « achalasie » ; ne pas utiliser cela comme définition clinique autonome.","Certains termes du cours ont plusieurs sens selon le contexte : -lyse, -pathie, -gène, gon-/gen-."]}}}</script>

<script>
(()=>{'use strict';
const basePath='./';const STORE='med2.semestre1.etat.v1';const OVERRIDE='med2.semestre1.catalogue.import.v1';
const app=document.getElementById('app'), modal=document.getElementById('modal-root');
const fallback=id=>JSON.parse(document.getElementById(id).textContent);
let cat=fallback('default-catalogue'), exams=fallback('default-examens').exams, modes=fallback('default-modalites');
let pedagogie=fallback('default-pedagogie'); let learning={id:null,tab:'story',card:0,shown:false,quizPage:0};
const lesson=id=>pedagogie.lessons?.[id];
const defaultState={pace:14,view:'home',selectedSubject:null,activeDay:0,cycleDone:[],memory:{},history:[],currentMission:null,expanded:false};
let st=(()=>{try{return {...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{return {...defaultState}}})();
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(st))}catch(e){alert('La mémoire locale est pleine. Exporte ta progression depuis Suivi.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const diff=date=>Math.ceil((new Date(date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);
const shortDate=date=>new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const subjects=()=>cat.subjects||[];
const syncCounts=()=>{for(const s of subjects()){s.cmCount=cat.resources.filter(r=>r.subject===s.id&&r.kind==='cm').length;s.annaleCount=cat.resources.filter(r=>r.subject===s.id&&r.kind==='annale').length;}};
syncCounts();
const subject=id=>subjects().find(s=>s.id===id)||{name:id,date:'2099-01-01'};
const cms=()=>cat.resources.filter(r=>r.kind==='cm');
const gradeOf=id=>st.memory[id]||{count:0,step:0};
const nextExam=()=>[...exams].filter(x=>diff(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];
function urg(subjectId){const e=exams.filter(x=>x.subject===subjectId&&diff(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];if(!e)return 0.5;let d=diff(e.date);return d<=7?8:d<=21?5:d<=45?3:d<=75?1.5:1;}
function rank(r){const m=gradeOf(r.id);let due=m.nextDue&&m.nextDue<=today()?6:0;const lag=m.count?Math.max(0,5-m.step):2;return urg(r.subject)*10+due+lag+(m.lastScore==='forgot'?12:0)}
function dueRecalls(){return cms().filter(r=>st.memory[r.id]?.nextDue&&st.memory[r.id].nextDue<=today()).sort((a,b)=>rank(b)-rank(a));}
function cycles(){return cms().filter(r=>!st.cycleDone.includes(r.id));}
function missionBatch(){const active=cms();if(!active.length)return [];
 let pending=cycles();const left=Math.max(1,st.pace-(st.activeDay%st.pace));const num=Math.max(1,Math.ceil(pending.length/left));
 // Blend subjects instead of showing a wall of the same subject; exam urgency still controls order.
 const bins={};for(const r of pending){(bins[r.subject]??=[]).push(r)}
 for(const arr of Object.values(bins))arr.sort((a,b)=>rank(b)-rank(a)||a.id.localeCompare(b.id));
 const subjectOrder=Object.keys(bins).sort((a,b)=>urg(b)-urg(a)||a.localeCompare(b));
 const chosen=[];while(chosen.length<num){let added=0;for(const key of subjectOrder){if(bins[key].length){chosen.push(bins[key].shift());added++;if(chosen.length>=num)break;}}if(!added)break;}
 return chosen;

v>`}).join('')}</div></section><section class="section"><div class="notice">🔒 <strong>Version fondation :</strong> les sources sont recensées sans copier les PDF dans ce site public. Les leçons narratives et les entraînements validés arriveront par matière. L'application de sémiologie précédente reste indépendante.</div><div class="actions" style="margin-top:11px"><button class="btn secondary" data-action="open-semio">Ouvrir Sémio MED2 ↗</button><button class="btn ghost" data-action="settings">Paramètres et mises à jour</button></div></section></main>`}
