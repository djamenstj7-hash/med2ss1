   Une seule feuille de style, découpée en couches :

/* Police d'interface : Atkinson Hyperlegible Next (Braille Institute, licence OFL).
   Choisie pour la lisibilité sur de longues sessions : chiffres et lettres proches (1 l I, 0 O, rn m)
   bien différenciés, utile pour les valeurs biologiques, les doses et les sigles médicaux. */
@font-face {
  font-family: "Atkinson Next";
  font-style: normal;
  font-display: swap;
  font-weight: 200 800;
  src: url(./Assets/fonts/atkinson-next-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Atkinson Next";
  font-style: normal;
  font-display: swap;
  font-weight: 200 800;
  src: url(./Assets/fonts/atkinson-next-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}

/* ---------- Jetons : thème clair ---------- */
:root {
  color-scheme: light;
  /* Surfaces : un fond bleu-gris froid, des feuilles blanches, un niveau « creusé » pour les champs */
  --canvas: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --sunken: #edf1f6;
  --line: #e1e7ef;
  --line-2: #cdd6e2;
  /* Encre : marine de la marque MED2 ; gris secondaires tous ≥ 4,5:1 sur blanc */
  --ink: #142038;
  --ink-2: #36445c;
  --muted: #586579;
  --brand: #16305c;
  --brand-2: #2559c9;
  /* Interaction : un seul accent bleu, réservé à ce qui se clique ou se sélectionne */
  --primary: #1c3f7c;
  --primary-hover: #17346a;
  --on-primary: #ffffff;
  --accent: #2559c9;
  --accent-ink: #1d4aa8;
  --accent-soft: #e8eefc;
  --accent-line: #b9cbf5;
  --focus: #2563eb;
  /* Sens : juste / erreur / à revoir / plusieurs réponses */
  --ok: #11795a;
  --ok-soft: #e4f4ec;
  --ok-line: #9ed4bc;
  --ko: #c42f3a;
  --ko-soft: #fceced;
  --ko-line: #f0b1b5;
  --warn: #95580a;
  --warn-soft: #fdf1dc;
  --warn-line: #ecc98f;
  --violet: #5b3fc4;
  --violet-soft: #efebfd;
  /* Repères du lecteur (exemple, mécanisme, piège, à retenir) */
  --mk-ex: #a35d07;
  --mk-ex-bg: rgba(232, 155, 35, 0.09);
  --mk-ex-line: rgba(220, 145, 30, 0.34);
  --mk-mech: #2155b8;
  --mk-mech-bg: rgba(59, 120, 240, 0.075);
  --mk-mech-line: rgba(59, 120, 240, 0.28);
  --mk-trap: #b52a35;
  --mk-trap-bg: rgba(224, 72, 79, 0.075);
  --mk-trap-line: rgba(224, 72, 79, 0.32);
  --mk-key: #0f6e51;
  --mk-key-bg: rgba(23, 153, 111, 0.08);
  --mk-key-line: rgba(23, 153, 111, 0.32);
  /* Typographie */
  --font: "Atkinson Next", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Charter", "Bitstream Charter", "Sitka Text", Cambria, "Palatino Linotype", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* Échelle d'espacement (4 px) et rayons */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s7: 32px;
  --s8: 40px;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --pill: 999px;
  /* Élévation : discrète, la structure vient des bordures */
  --sh-1: 0 1px 2px rgba(16, 32, 64, 0.05);
  --sh-2: 0 1px 2px rgba(16, 32, 64, 0.04), 0 6px 18px rgba(16, 32, 64, 0.07);
  --sh-pop: 0 18px 48px rgba(12, 26, 52, 0.22), 0 2px 8px rgba(12, 26, 52, 0.08);
  --scrim: rgba(9, 20, 40, 0.46);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t-fast: 0.14s;
  --t: 0.22s;
  /* Coquille */
  --bar-h: 56px;
  --tab-h: 64px;
  --side-w: 248px;
}

/* ---------- Couleurs des matières : un repère constant (icône, liseré), jamais un aplat décoratif ---------- */
.tone-sky { --t1: #eaf3ff; --t3: #3b82f6; --t4: #1e4f9a; }
.tone-rose { --t1: #ffeef2; --t3: #e5486a; --t4: #9c2445; }
.tone-violet { --t1: #f1edff; --t3: #7c5cf0; --t4: #4b32a8; }
.tone-mint { --t1: #e6f8f1; --t3: #18a077; --t4: #0f6a4f; }
.tone-amber { --t1: #fff5e3; --t3: #e0952b; --t4: #8f5a12; }
.tone-sand { --t1: #f7f1e7; --t3: #a8793c; --t4: #6e4c1f; }
.tone-coral { --t1: #ffefe8; --t3: #e2683f; --t4: #9a3c1c; }
.tone-teal { --t1: #e5f7f8; --t3: #139aa4; --t4: #0d6369; }
.tone-slate { --t1: #eff2f7; --t3: #5a6b85; --t4: #36445a; }
.tone-indigo { --t1: #ecefff; --t3: #4b5bd6; --t4: #2d3a99; }
.tone-lime { --t1: #f0f8e3; --t3: #6a9c1f; --t4: #41620f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [class*="tone-"] {
    --t1: color-mix(in srgb, var(--t3) 17%, var(--surface));
    --t4: color-mix(in srgb, var(--t3) 55%, #ffffff);
  }
}
:root[data-theme="dark"] [class*="tone-"] {
  --t1: color-mix(in srgb, var(--t3) 17%, var(--surface));
  --t4: color-mix(in srgb, var(--t3) 55%, #ffffff);
}

/* ---------- Base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  font-family: var(--font);
  font-size: 100%;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  scroll-padding-top: calc(var(--bar-h) + 12px);
}
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-size: 16px;
  font-feature-settings: "kern" 1;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
html.modal-open,
html.modal-open body {
  overflow: hidden;
  overscroll-behavior: none;
}
h1,
h2,
h3,
h4 {
  color: var(--ink);
  margin: 0;
  font-weight: 750;
  letter-spacing: -0.012em;
  line-height: 1.25;
  text-wrap: balance;
}
p {
  margin: 0;
}
p + p {
  margin-top: 0.6em;
}
ul,
ol {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}
button:disabled {
  cursor: default;
}
a {
  color: var(--accent);
  text-underline-offset: 0.18em;
  text-decoration-thickness: 1px;
}
a:hover {
  text-decoration-thickness: 2px;
}
img,
svg {
  max-width: 100%;
}
:focus {
  outline: none;
}
:focus-visible {
  outline: 2.5px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}
input:focus-visible,
textarea:focus-visible {
  outline-offset: 0;
}
::selection {
  background: color-mix(in srgb, var(--accent) 26%, transparent);
}
code,
kbd {
  font-family: var(--mono);
  font-size: 0.88em;
}
code {
  background: var(--sunken);
  border-radius: 6px;
  padding: 0.1em 0.35em;
  overflow-wrap: anywhere;
}
kbd {
  display: inline-block;
  min-width: 1.7em;
  padding: 0.12em 0.42em;
  border-radius: 6px;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: 0.8em;
  line-height: 1.5;
  text-align: center;
  font-weight: 600;
}

/* ---------- Utilitaires ---------- */
.num {
  font-variant-numeric: tabular-nums;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 13.5px;
}
.center {
  text-align: center;
  justify-content: center;
}
.sr-only {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: fixed;
  z-index: 500;
  left: 12px;
  top: -60px;
  padding: 10px 14px;
  border-radius: var(--r);
  background: var(--primary);
  color: var(--on-primary);
  font-weight: 700;
  text-decoration: none;
  transition: top var(--t) var(--ease);
}
.skip-link:focus {
  top: calc(10px + env(safe-area-inset-top));
}
.row {
  display: flex;
  align-items: center;
  gap: var(--s3);
}
.row.between {
  justify-content: space-between;
}
.row.wrap {
  flex-wrap: wrap;
  row-gap: var(--s2);
}
.ico {
  display: block;
  flex: none;
}
.divider {
  border: 0;
  border-top: 1px solid var(--line);
  margin: var(--s4) 0;
}
.mini-label {
  display: block;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  margin: var(--s3) 0 var(--s2);
}
.kicker {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.footnote {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--muted);
  margin-top: var(--s3);
}
.footnote.center {
  display: block;
  margin: var(--s7) 0 var(--s4);
}
.note {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.55;
}
.tiny {
  font-size: 12.5px;
  color: var(--muted);
}
.prose-sm p {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink-2);
}
.prose-sm p + p {
  margin-top: 0.75em;
}

/* =====================================================================
   10 · Composants partagés
   ===================================================================== */

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  min-height: 44px;
  padding: 10px 16px;
  border-radius: var(--r);
  border: 1px solid transparent;
  background: var(--primary);
  color: var(--on-primary);
  font-size: 15px;
  font-weight: 650;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  white-space: normal;
  transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast) var(--ease);
}
.btn:hover:not(:disabled) {
  background: var(--primary-hover);
}
.btn:active:not(:disabled) {
  transform: scale(0.98);
}
.btn:disabled {
  opacity: 0.45;
}
.btn .ico {
  flex: none;
}
.btn.secondary {
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.btn.secondary:hover:not(:disabled) {
  background: var(--accent-soft);
  background: color-mix(in srgb, var(--accent-soft) 70%, var(--accent-line));
}
.btn.ghost {
  background: var(--surface);
  color: var(--ink-2);
  border-color: var(--line-2);
}
.btn.ghost:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--muted);
}
.btn.quiet {
  background: transparent;
  color: var(--accent);
  padding-left: 10px;
  padding-right: 10px;
}
.btn.quiet:hover:not(:disabled) {
  background: var(--accent-soft);
}
.btn.danger {
  background: var(--ko-soft);
  color: var(--ko);
}
.btn.danger:hover:not(:disabled) {
  background: var(--ko-soft);
  background: color-mix(in srgb, var(--ko-soft) 70%, var(--ko-line));
}
.btn.small {
  min-height: 36px;
  padding: 7px 12px;
  font-size: 14px;
  border-radius: 10px;
}
.btn.block {
  display: flex;
  width: 100%;
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: var(--pill);
  color: var(--ink-2);
  font-weight: 700;
  transition: background-color var(--t-fast), color var(--t-fast);
}
.icon-btn:hover:not(:disabled) {
  background: var(--sunken);
  color: var(--ink);
}
.icon-btn:disabled {
  opacity: 0.32;
}
.icon-btn.light {
  color: #fff;
  background: rgba(255, 255, 255, 0.14);
}
.icon-btn.light:hover {
  background: rgba(255, 255, 255, 0.26);
  color: #fff;
}
.chip-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 12px;
  border-radius: var(--pill);
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 650;
}
.chip-btn:hover {
  border-color: var(--muted);
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s3);
}
.actions.center {
  justify-content: center;
}
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}

/* ---------- Badges (états, compteurs) ---------- */
.badge,
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--pill);
  background: var(--sunken);
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 650;
  line-height: 1.4;
  white-space: nowrap;
}
.badge.ok,
.tag.green {
  background: var(--ok-soft);
  color: var(--ok);
}
.badge.ko {
  background: var(--ko-soft);
  color: var(--ko);
}
.badge.warn,
.tag.warn {
  background: var(--warn-soft);
  color: var(--warn);
}
.badge.info {
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.badge.violet,
.tag.pink {
  background: var(--violet-soft);
  color: var(--violet);
}
.badge.tone {
  background: var(--t1);
  color: var(--t4);
}
.badge .ico {
  flex: none;
}
.count {
  display: inline-block;
  min-width: 1.6em;
  padding: 0 6px;
  border-radius: var(--pill);
  background: var(--sunken);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.6;
  text-align: center;
}

/* ---------- Cartes et groupes ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s4);
  box-shadow: var(--sh-1);
}
.card.flush {
  padding: 0;
  overflow: hidden;
}
.card + .card {
  margin-top: var(--s3);
}
.card-title {
  font-size: 16px;
  margin-bottom: var(--s3);
}
.card-sub {
  display: block;
  margin-top: 2px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}
.card > p.muted {
  font-size: 14.5px;
  line-height: 1.55;
}
.group {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--sh-1);
}
.group.flush {
  border: 0;
  box-shadow: none;
  border-radius: 0;
  margin: 0 calc(-1 * var(--s4)) calc(-1 * var(--s2));
}
.group > * + * {
  border-top: 1px solid var(--line);
}
.list-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-height: 60px;
  padding: 10px var(--s4);
  text-align: left;
  background: var(--surface);
  color: var(--ink);
  transition: background-color var(--t-fast);
}
button.list-row:hover:not(:disabled) {
  background: var(--surface-2);
}
.list-row:disabled {
  cursor: default;
}
.list-txt {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.list-txt b {
  font-weight: 650;
  font-size: 15.5px;
  line-height: 1.3;
}
.list-txt small {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.4;
}
.chev {
  flex: none;
  color: var(--muted);
  opacity: 0.7;
}
.dot-tone {
  flex: none;
  width: 4px;
  align-self: stretch;
  margin: 4px 0;
  border-radius: 4px;
  background: var(--t3, var(--accent));
}
.row-ico {
  flex: none;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--t1, var(--accent-soft));
  color: var(--t4, var(--accent-ink));
}
.chap-num {
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--t1, var(--sunken));
  color: var(--t4, var(--ink-2));
  font-size: 13px;
  font-weight: 750;
}

/* ---------- Jauges ---------- */
.meter {
  position: relative;
  height: 6px;
  border-radius: var(--pill);
  background: var(--sunken);
  overflow: hidden;
}
.meter > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--t3, var(--accent));
  transition: width 0.5s var(--ease);
}
.meter.green > span {
  background: var(--ok);
}
.meter.amber > span {
  background: #d9902a;
}
.meter.red > span {
  background: var(--ko);
}
.rate {
  font-weight: 750;
  color: var(--ink-2);
}
.rate.good {
  color: var(--ok);
}
.rate.mid {
  color: var(--warn);
}
.rate.low {
  color: var(--ko);
}
.pips {
  display: inline-flex;
  gap: 3px;
  vertical-align: middle;
}
.pips i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1.5px solid var(--line-2);
}
.pips i.on {
  background: var(--ok);
  border-color: var(--ok);
}
.ring {
  --p: 0;
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: conic-gradient(var(--t3, var(--accent)) calc(var(--p) * 1%), var(--sunken) 0);
}
.ring::before {
  content: "";
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  background: var(--surface);
}
.ring span {
  position: relative;
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
}
.ring small {
  font-size: 11px;
  font-weight: 700;
}
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: 1px;
}
.dot.done {
  background: var(--ok);
}
.dot.doing {
  background: var(--accent);
}
.dot.todo {
  background: var(--line-2);
}

/* ---------- Contrôle segmenté (filtres, modes, réglages) ---------- */
.seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: var(--r);
  background: var(--sunken);
  overflow-x: auto;
  scrollbar-width: none;
}
.seg::-webkit-scrollbar {
  display: none;
}
.seg button {
  flex: 1 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 12px;
  border-radius: 9px;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 650;
  white-space: nowrap;
  transition: background-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast);
}
.seg button:hover:not(.active) {
  color: var(--ink);
  background: color-mix(in srgb, var(--surface) 50%, transparent);
}
.seg button.active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(16, 32, 64, 0.14);
}
.seg button.active .count {
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.seg.wrap {
  flex-wrap: wrap;
}
.seg.wrap button {
  flex: 1 1 auto;
}
.seg-lg button {
  min-height: 42px;
}
.seg + p,
.seg + .muted {
  margin-top: var(--s2);
}

/* ---------- Messages ---------- */
.notice {
  display: flex;
  gap: var(--s3);
  align-items: flex-start;
  padding: 12px 14px;
  border-radius: var(--r);
  border: 1px solid var(--accent-line);
  background: var(--accent-soft);
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.55;
}
.notice > .ico {
  margin-top: 2px;
  color: var(--accent);
}
.notice p {
  margin: 0;
}
.notice.success {
  background: var(--ok-soft);
  border-color: var(--ok-line);
}
.notice.success > .ico {
  color: var(--ok);
}
.notice.warn {
  background: var(--warn-soft);
  border-color: var(--warn-line);
}
.notice.warn > .ico {
  color: var(--warn);
}
.notice.ko {
  background: var(--ko-soft);
  border-color: var(--ko-line);
}
.notice.ko > .ico {
  color: var(--ko);
}
.notice + .notice {
  margin-top: var(--s2);
}
.status-line {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: var(--s3) 0 0;
  font-size: 14px;
  font-weight: 650;
}
.status-line.ok {
  color: var(--ok);
}
.status-line.warn {
  color: var(--warn);
}
.status-line.ko {
  color: var(--ko);
}
.empty-state {
  padding: var(--s6) var(--s5);
  border: 1px dashed var(--line-2);
  border-radius: var(--r-lg);
  background: var(--surface);
  text-align: center;
  color: var(--ink-2);
}
.empty-state p + p {
  margin-top: 6px;
}
.empty-state .btn {
  margin-top: var(--s4);
}
.empty-state.small {
  padding: var(--s4);
  text-align: left;
}
.empty-ico {
  display: inline-grid;
  place-items: center;
  width: 56px;
  height: 56px;
  margin-bottom: var(--s3);
  border-radius: 50%;
  background: var(--sunken);
  color: var(--muted);
}
.empty-state h1 {
  font-size: 22px;
  margin-bottom: var(--s2);
}

/* ---------- Listes d'information ---------- */
.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: var(--s3) 0 0;
  padding: 0;
  list-style: none;
}
.facts li {
  padding: 4px 10px;
  border-radius: var(--pill);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 600;
}
.check-list,
.missing-list,
.file-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.check-list li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 6px 0;
  font-size: 14.5px;
  line-height: 1.5;
}
.check-list li.ok .ico {
  color: var(--ok);
}
.check-list li.ko .ico {
  color: var(--warn);
}
.missing-list {
  margin: var(--s2) 0;
  max-height: 220px;
  overflow: auto;
}
.missing-list li {
  padding: 3px 0;
  font-size: 13px;
}
.file-list li {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 7px 0;
  border-top: 1px solid var(--line);
  font-size: 13.5px;
  color: var(--ink-2);
  overflow-wrap: anywhere;
}
.file-list li .ico {
  margin-top: 2px;
  color: var(--muted);
}
.kbd-list {
  margin: 0;
  display: grid;
  gap: 2px;
}
.kbd-list div {
  display: grid;
  grid-template-columns: minmax(130px, 38%) 1fr;
  gap: var(--s3);
  align-items: baseline;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}
.kbd-list div:first-child {
  border-top: 0;
}
.kbd-list dt {
  white-space: nowrap;
  color: var(--muted);
}
.kbd-list dd {
  margin: 0;
  font-size: 14.5px;
}
.eval-info {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  margin-top: 6px;
  font-size: 13.5px;
  color: var(--ink-2);
}
.eval-info p {
  flex-basis: 100%;
  margin: 2px 0 0 !important;
  font-size: 13.5px !important;
}

/* ---------- Dépliants ---------- */
details > summary {
  cursor: pointer;
  list-style: none;
}
details > summary::-webkit-details-marker {
  display: none;
}
.disclosure {
  padding: 0;
}
.disclosure > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  min-height: 56px;
  padding: 10px var(--s4);
}
.disclosure > summary > span {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.disclosure > summary small {
  font-size: 13.5px;
  color: var(--muted);
}
.disclosure > summary > .ico {
  color: var(--muted);
  transition: transform var(--t) var(--ease);
}
.disclosure[open] > summary > .ico {
  transform: rotate(180deg);
}
.disclosure-body {
  padding: 0 var(--s4) var(--s4);
}

/* ---------- Champs ---------- */
.search-wrap {
  display: flex;
  align-items: center;
  gap: var(--s2);
  min-height: 48px;
  padding: 0 var(--s3) 0 14px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--muted);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.search-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-line);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.search {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  padding: 12px 0;
  font-size: 16px;
  color: var(--ink);
  outline: none;
}
.search::placeholder {
  color: var(--muted);
  opacity: 1;
}
.search::-webkit-search-cancel-button {
  cursor: pointer;
}
.search:focus-visible {
  outline: none;
}
.field-label {
  display: block;
  margin: var(--s3) 0 6px;
  font-size: 14px;
  font-weight: 650;
}

/* ---------- Notifications ---------- */
.toast-root {
  position: fixed;
  z-index: 400;
  left: 0;
  right: 0;
  bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 0 16px;
  pointer-events: none;
}
html.modal-open .toast-root {
  bottom: calc(92px + env(safe-area-inset-bottom));
}
.toast {
  max-width: 520px;
  padding: 11px 16px;
  border-radius: var(--r);
  background: #142038;
  color: #fff;
  font-size: 14.5px;
  font-weight: 600;
  line-height: 1.45;
  text-align: center;
  box-shadow: var(--sh-pop);
  animation: toastIn 0.26s var(--ease) both;
}
:root[data-theme="dark"] .toast {
  background: #e6ebf2;
  color: #0d131c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .toast {
    background: #e6ebf2;
    color: #0d131c;
  }
}
.toast.out {
  animation: toastOut 0.3s var(--ease) both;
}
@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
  }
}
@keyframes toastOut {
  to {
    opacity: 0;
    transform: translateY(6px);
  }
}

/* ---------- Chargement (squelette) ---------- */
.boot {
  min-height: 100vh;
  min-height: 100dvh;
}
.boot-bar {
  height: calc(var(--bar-h) + env(safe-area-inset-top));
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.boot .shell {
  padding-top: var(--s6);
}
.sk {
  border-radius: var(--r-lg);
  background: linear-gradient(90deg, var(--sunken) 0, var(--surface-2) 40%, var(--sunken) 80%) 0 0 / 300% 100%;
  animation: shimmer 1.4s linear infinite;
  margin-bottom: var(--s4);
}
.sk-title {
  width: 46%;
  height: 34px;
  border-radius: var(--r);
}
.sk-card {
  height: 150px;
}
.sk-line {
  height: 16px;
  border-radius: 8px;
  width: 92%;
}
.sk-line.short {
  width: 58%;
}
@keyframes shimmer {
  to {
    background-position: -150% 0;
  }
}
.boot-error {
  padding-top: var(--s8);
  max-width: 560px;
}
.boot-error .empty-state p {
  margin-top: var(--s2);
  line-height: 1.6;
}

/* ---------- Fenêtres : feuilles (téléphone) et boîtes de dialogue (grand écran) ---------- */
.modalbg {
  position: fixed;
  z-index: 60;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: var(--scrim);
  animation: fadeIn 0.2s ease both;
}
.modal {
  position: relative;
  width: min(100%, 640px);
  max-height: 92vh;
  max-height: 92dvh;
  overflow: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 10px var(--s5) calc(var(--s6) + env(safe-area-inset-bottom));
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--sh-pop);
}
.modal.sheet.enter {
  animation: sheetUp 0.34s var(--ease);
}
.modal h2 {
  font-size: 21px;
  margin: 6px 0 4px;
}
.modal > p.muted,
.modal .muted:not(small) {
  font-size: 14.5px;
  line-height: 1.55;
}
.modal > .notice,
.modal > .recall-box,
.modal > .action-grid,
.modal > .choice-list,
.modal > p {
  margin-top: var(--s4);
}
.sheet-grabber {
  width: 36px;
  height: 5px;
  margin: 0 auto 10px;
  border-radius: 5px;
  background: var(--line-2);
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
}
@keyframes sheetUp {
  from {
    transform: translateY(30%);
    opacity: 0.4;
  }
}
.choice-list {
  display: grid;
  gap: var(--s2);
}
.choicebtn {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: var(--surface);
  text-align: left;
  font-weight: 650;
  font-size: 15.5px;
  transition: border-color var(--t-fast), background-color var(--t-fast);
}
.choicebtn:hover {
  border-color: var(--accent);
  background: var(--surface-2);
}
.choicebtn > .ico {
  margin-top: 1px;
  color: var(--accent);
}
.choicebtn > span {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.choicebtn small {
  font-weight: 400;
  font-size: 13.5px;
  color: var(--muted);
}
.choicebtn[data-id="good"] > .ico,
.choicebtn[data-id$="|maitrise"] > .ico {
  color: var(--ok);
}
.choicebtn[data-id="partial"] > .ico,
.choicebtn[data-id$="|moyen"] > .ico {
  color: var(--warn);
}
.choicebtn[data-id="forgot"] > .ico,
.choicebtn[data-id$="|revoir"] > .ico {
  color: var(--ko);
}
.choicebtn.is-suggested {
  border-color: var(--ok);
  box-shadow: 0 0 0 3px var(--ok-soft);
}
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s2);
}
.action-grid .btn:first-child {
  grid-column: 1 / -1;
}
.recall-box {
  padding: 14px var(--s4);
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.recall-box h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  margin-bottom: 6px;
}
.recall-box p,
.recall-box li {
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--ink-2);
}
.recall-box ol {
  padding-left: 1.2em;
}
.recall-box .btn {
  margin-top: var(--s3);
}

/* Feuilles secondaires (grille de l'épreuve, sommaire, réglages de lecture) */
.sheet-layer {
  position: fixed;
  z-index: 200;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: var(--scrim);
  animation: fadeIn 0.2s ease both;
}
.sheet {
  width: min(100%, 560px);
  max-height: 86vh;
  max-height: 86dvh;
  overflow: auto;
  padding: 10px var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--sh-pop);
  animation: sheetUp 0.32s var(--ease);
}
.sheet h3 {
  font-size: 18px;
}
.grid-summary {
  margin: 6px 0 14px;
  color: var(--muted);
  font-size: 14.5px;
}
.q-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
  gap: 6px;
}
.q-grid button {
  height: 44px;
  border-radius: 10px;
  border: 1.5px solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  font-weight: 700;
  font-size: 14.5px;
  font-variant-numeric: tabular-nums;
}
.q-grid .g-ok {
  background: var(--ok-soft);
  border-color: var(--ok-line);
  color: var(--ok);
}
.q-grid .g-ko {
  background: var(--ko-soft);
  border-color: var(--ko-line);
  color: var(--ko);
}
.q-grid .g-ans {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
}
.q-grid .g-cur {
  outline: 2.5px solid var(--ink);
  outline-offset: 2px;
}
.grid-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin: var(--s4) 0 4px;
  font-size: 13px;
  color: var(--muted);
}
.grid-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.grid-legend i {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1.5px solid var(--line-2);
  background: var(--surface);
}
.grid-legend i.g-ok {
  background: var(--ok-soft);
  border-color: var(--ok-line);
}
.grid-legend i.g-ko {
  background: var(--ko-soft);
  border-color: var(--ko-line);
}
.grid-legend i.g-ans {
  background: var(--accent-soft);
  border-color: var(--accent-line);
}
.grid-legend i.g-cur {
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}

/* =====================================================================
   20 · Coquille : barre du haut, navigation, gabarits de page
   Téléphone et tablette portrait : barre d'onglets en bas (pouce).
   Ordinateur (≥ 900 px) : barre latérale fixe, contenu en colonnes.
   ===================================================================== */
#app {
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(var(--tab-h) + 24px + env(safe-area-inset-bottom));
}
.shell {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 0 var(--s4);
}
.view {
  padding-bottom: var(--s6);
}
.view-enter {
  animation: viewIn 0.26s var(--ease) both;
}
@keyframes viewIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}

/* ---------- Barre du haut (téléphone) ---------- */
.appbar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding-top: env(safe-area-inset-top);
  background: var(--canvas);
  background: color-mix(in srgb, var(--canvas) 86%, transparent);
  -webkit-backdrop-filter: saturate(1.5) blur(16px);
  backdrop-filter: saturate(1.5) blur(16px);
  border-bottom: 1px solid var(--line);
}
.appbar-in {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  min-height: var(--bar-h);
}
.brand,
.nav-brand {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 4px;
  margin-left: -4px;
  border-radius: 8px;
  color: var(--brand);
}
.brand-logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--brand);
}
.brand-logo em {
  font-style: normal;
  color: var(--brand-2);
}
.brand-sub {
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
}
.appbar-right {
  display: flex;
  align-items: center;
  gap: 4px;
}
.countdown {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  padding: 5px 10px;
  border-radius: var(--pill);
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
}
.countdown b {
  font-size: 14px;
  color: var(--ink);
}

/* ---------- Navigation principale ---------- */
.nav {
  position: fixed;
  z-index: 30;
  left: 0;
  right: 0;
  bottom: 0;
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(18px);
  backdrop-filter: saturate(1.6) blur(18px);
  border-top: 1px solid var(--line);
}
.navinner {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  max-width: 640px;
  margin: 0 auto;
  height: var(--tab-h);
  padding: 4px max(4px, env(safe-area-inset-left)) 0 max(4px, env(safe-area-inset-right));
}
.nav button.nav-brand,
.nav-foot {
  display: none;
}
.nav button[data-action="nav"]:not(.nav-brand) {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  border-radius: var(--r);
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 650;
  transition: color var(--t-fast);
}
.nav .symbol {
  display: grid;
  place-items: center;
  width: 52px;
  height: 30px;
  border-radius: var(--pill);
  transition: background-color var(--t) var(--ease), color var(--t-fast);
}
.nav button[aria-current="page"] {
  color: var(--accent-ink);
}
.nav button[aria-current="page"] .symbol {
  background: var(--accent-soft);
  color: var(--accent);
}
.nav button[data-action="nav"]:not(.nav-brand):hover:not([aria-current="page"]) {
  color: var(--ink);
}
.nav-label {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- En-têtes de page et sections ---------- */
.page-head {
  margin: var(--s6) 0 var(--s5);
}
.page-head h1 {
  font-size: 28px;
  line-height: 1.15;
  letter-spacing: -0.022em;
}
.page-head p {
  margin-top: 6px;
  font-size: 15.5px;
  line-height: 1.5;
}
.page-date {
  font-size: 14px;
  font-weight: 650;
  color: var(--muted);
  margin-bottom: 2px !important;
  margin-top: 0 !important;
}
.page-date::first-letter {
  text-transform: uppercase;
}
.section {
  margin: var(--s6) 0;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  margin-bottom: var(--s3);
}
.section-head h2 {
  font-size: 19px;
}
.section-head h3 {
  font-size: 16px;
}
.section > p.muted,
.section-head + p.muted {
  font-size: 14.5px;
  line-height: 1.55;
  margin: -4px 0 var(--s3);
}

/* Grilles des écrans (empilées sur téléphone) */
.home-grid,
.missions-grid,
.progress-grid {
  display: grid;
  gap: var(--s5);
}
.home-main,
.home-side,
.missions-main,
.missions-side {
  display: grid;
  gap: var(--s5);
  align-content: start;
  min-width: 0;
}
.home-main > .section,
.home-side > .section,
.missions-main > .section,
.missions-side > .section {
  margin: 0;
}
.later-grid {
  display: grid;
  gap: var(--s3);
}

/* =====================================================================
   30 · Écrans : accueil, cours, matière, examens, suivi, réglages, missions
   ===================================================================== */

/* ---------- Accueil ---------- */
.focus-card {
  position: relative;
  padding: var(--s5) var(--s5) var(--s5) calc(var(--s5) + 4px);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--sh-2);
  overflow: hidden;
}
.focus-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  background: var(--t3, var(--accent));
}
.focus-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: var(--s3);
}
.focus-ico {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--t1, var(--accent-soft));
  color: var(--t4, var(--accent-ink));
}
.focus-kicker {
  font-size: 14px;
  font-weight: 700;
  color: var(--t4, var(--accent-ink));
}
.focus-card h2 {
  font-size: 21px;
  line-height: 1.25;
}
.focus-meta {
  margin-top: 6px !important;
  font-size: 14.5px;
  color: var(--muted);
  line-height: 1.5;
}
.focus-card .meter {
  margin: var(--s3) 0 0;
}
.focus-card .btn {
  margin-top: var(--s4);
  min-height: 48px;
  font-size: 16px;
}
.resume-row {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
}
.task-list {
  list-style: none;
  padding: 0;
  margin: var(--s3) 0 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--sh-1);
}
.task + .task {
  border-top: 1px solid var(--line);
}
.task-main {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-height: 62px;
  padding: 10px var(--s4);
  text-align: left;
  transition: background-color var(--t-fast);
}
.task-main:hover {
  background: var(--surface-2);
}
.task-check {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--t3, var(--accent));
  color: #fff;
}
.task.is-done .task-check {
  border-color: var(--ok);
  background: var(--ok);
}
.task-txt {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.task-txt b {
  font-weight: 650;
  font-size: 15.5px;
  line-height: 1.3;
}
.task-txt small {
  font-size: 13.5px;
  color: var(--muted);
}
.task.is-done .task-txt b {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}
.task-min {
  flex: none;
  font-size: 13.5px;
  font-weight: 650;
  color: var(--muted);
}
.section > .btn.quiet,
.card > .btn.quiet {
  margin-top: var(--s2);
}
.exam-focus-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s3);
}
.exam-focus h2,
.plan-hero h2 {
  font-size: 19px;
  margin-top: 2px;
}
.exam-focus-top p.muted {
  font-size: 14px;
  margin-top: 2px;
}
.countdown-lg {
  flex: none;
  padding: 6px 12px;
  border-radius: var(--r);
  background: var(--sunken);
  color: var(--ink);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.tour-bars {
  display: grid;
  gap: 8px;
  margin-top: var(--s4);
}
.tour-bar {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 52px;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  font-weight: 650;
  color: var(--ink-2);
}
.tour-bar > b {
  text-align: right;
  font-weight: 650;
  color: var(--muted);
}
.exam-focus .btn.block {
  margin-top: var(--s4);
}
.activity-mini {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s2) var(--s3);
  align-items: center;
}
.act-cell {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.3;
}
.act-ico {
  flex: none;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--warn-soft);
  color: var(--warn);
}
.act-cell.today .act-ico {
  background: var(--ok-soft);
  color: var(--ok);
}
.act-cell b {
  display: block;
  font-size: 20px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--ink);
}
.activity-mini .btn {
  grid-column: 1 / -1;
  justify-self: start;
  margin-left: -10px;
}
.later-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.later-list li {
  display: grid;
  grid-template-columns: minmax(84px, auto) 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  font-size: 14.5px;
}
.later-list li:first-child {
  border-top: 0;
  padding-top: 0;
}
.later-date {
  font-weight: 700;
}
.later-subj {
  color: var(--muted);
  min-width: 0;
}

/* ---------- Bibliothèque ---------- */
.lib-tools {
  display: grid;
  gap: var(--s3);
  margin-bottom: var(--s5);
}
.lib-group {
  margin-bottom: var(--s6);
}
.subject-row {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-height: 72px;
  padding: 12px var(--s4);
  text-align: left;
  background: var(--surface);
  transition: background-color var(--t-fast);
}
.subject-row:hover {
  background: var(--surface-2);
}
.subject-ico {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--t1, var(--accent-soft));
  color: var(--t4, var(--accent-ink));
}
.subject-ico.lg {
  width: 56px;
  height: 56px;
  border-radius: 14px;
}
.subject-ico.sm {
  width: 34px;
  height: 34px;
  border-radius: 10px;
}
.subject-txt {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.subject-txt b {
  font-size: 16.5px;
  font-weight: 700;
}
.subject-txt small {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.4;
}
.subject-txt .due,
.subject-counts .due {
  color: var(--warn);
  font-weight: 700;
}
.subject-pct {
  flex: none;
  width: 76px;
  display: grid;
  gap: 5px;
  text-align: right;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink-2);
}
.subject-row.is-empty .subject-txt b {
  color: var(--ink-2);
}

/* ---------- Fiche matière ---------- */
.subject-detail {
  padding-top: var(--s3);
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  min-height: 40px;
  padding: 6px 10px 6px 4px;
  margin-left: -4px;
  border-radius: 10px;
  color: var(--accent);
  font-weight: 650;
  font-size: 15px;
}
.back-link:hover {
  background: var(--accent-soft);
}
.subject-head {
  display: flex;
  align-items: center;
  gap: var(--s4);
  margin-top: var(--s3);
}
.subject-head-txt {
  flex: 1;
  min-width: 0;
}
.subject-head h1 {
  font-size: 27px;
  letter-spacing: -0.022em;
}
.subject-head p {
  margin-top: 4px;
  font-size: 14.5px;
  color: var(--muted);
}
.subject-format {
  margin-top: var(--s4);
}
.subject-format > p {
  font-size: 14.5px;
  line-height: 1.5;
  color: var(--ink-2);
}
.subject-format .facts {
  margin-top: var(--s2);
}
.subject-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin: var(--s5) 0 var(--s3);
}
.subject-actions .btn {
  flex: 1 1 260px;
  justify-content: flex-start;
  text-align: left;
}
.subject-counts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  margin: var(--s3) 0 var(--s6);
  font-size: 14px;
  color: var(--ink-2);
}
.course-list {
  list-style: none;
  padding: 0;
  margin: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--sh-1);
}
.course-item {
  display: flex;
  align-items: center;
}
.course-item + .course-item {
  border-top: 1px solid var(--line);
}
.course-row {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: 6px 12px;
  align-items: start;
  padding: 14px 4px 14px var(--s4);
  text-align: left;
  transition: background-color var(--t-fast);
}
.course-row:hover {
  background: var(--surface-2);
}
.course-num {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--sunken);
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 750;
}
.status-doing .course-num {
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.status-done .course-num {
  background: var(--ok-soft);
  color: var(--ok);
}
.course-main {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.course-main b {
  font-size: 15.5px;
  font-weight: 650;
  line-height: 1.35;
}
.course-main small {
  font-size: 13.5px;
  color: var(--muted);
}
.course-state {
  grid-column: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.score {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
}
.course-recall {
  margin: 0 var(--s2);
  color: var(--muted);
}
.course-recall:hover {
  color: var(--accent);
}
.legend-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  margin: var(--s3) 2px 0;
  font-size: 13px;
  line-height: 1.5;
}
.legend-line .ico {
  display: inline-block;
  vertical-align: -2px;
}
.annales {
  margin-top: var(--s6);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  padding: 0 var(--s4);
}
.annales > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  font-weight: 700;
}
.annales > summary::after {
  content: "";
  margin-left: auto;
  width: 8px;
  height: 8px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(45deg) translateY(-3px);
  transition: transform var(--t) var(--ease);
}
.annales[open] > summary::after {
  transform: rotate(225deg) translateY(-3px);
}
.annales > p {
  font-size: 14px;
  line-height: 1.55;
  margin-bottom: var(--s2);
}
.annales .file-list {
  padding-bottom: var(--s3);
}

/* ---------- Examens ---------- */
.exam-day {
  margin-bottom: var(--s6);
}
.exam-day h2::first-letter {
  text-transform: uppercase;
}
.exam-list {
  display: grid;
  gap: var(--s3);
}
.exam-item {
  position: relative;
  display: grid;
  grid-template-columns: 58px minmax(0, 1fr);
  gap: var(--s3);
  padding: var(--s4) var(--s4) var(--s4) calc(var(--s4) + 2px);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--sh-1);
  overflow: hidden;
}
.exam-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--t3, var(--accent));
}
.exam-time {
  display: flex;
  flex-direction: column;
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.35;
}
.exam-time b {
  font-size: 16px;
  color: var(--ink);
}
.exam-main h3 {
  font-size: 16.5px;
}
.exam-format {
  margin-top: 4px !important;
  font-size: 14.5px;
  color: var(--ink-2);
  line-height: 1.45;
}
.exam-facts {
  margin-top: 4px !important;
  font-size: 13.5px;
}
.exam-train {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--s2) var(--s3);
  margin-top: var(--s3);
  padding-top: var(--s3);
  border-top: 1px solid var(--line);
}
.exam-train-txt {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 14px;
}
.exam-train-txt small {
  color: var(--muted);
  font-size: 13px;
}
.past-exams {
  margin-top: var(--s5);
}
.past-exams > summary {
  display: inline-flex;
  gap: 8px;
  padding: 8px 0;
  font-weight: 700;
  color: var(--ink-2);
}
.past-exams .exam-item {
  opacity: 0.8;
}

/* ---------- Suivi ---------- */
.act-kpis {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--s2);
  margin-bottom: var(--s4);
}
.act-kpis > div {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 12px;
  border-radius: var(--r);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.act-kpis b {
  font-size: 22px;
  font-weight: 800;
  line-height: 1.1;
}
.act-kpis span {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.3;
}
.act-bars {
  display: grid;
  grid-template-columns: repeat(14, minmax(0, 1fr));
  gap: 4px;
  list-style: none;
  padding: 0;
  margin: 0;
}
.act-bars li {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.act-bars .bar {
  display: flex;
  align-items: flex-end;
  width: 100%;
  height: 72px;
  border-radius: 6px;
  background: var(--sunken);
  overflow: hidden;
}
.act-bars .bar span {
  display: block;
  width: 100%;
  border-radius: 6px 6px 0 0;
  background: var(--accent);
  transition: height 0.5s var(--ease);
}
.act-bars small {
  font-size: 11.5px;
  color: var(--muted);
  text-transform: capitalize;
}
.act-bars li.is-today small {
  color: var(--ink);
  font-weight: 800;
}
.act-bars li.is-today .bar {
  box-shadow: inset 0 0 0 1.5px var(--accent-line);
}
.weak-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2) var(--s3);
  padding: 12px var(--s4);
  background: var(--surface);
  border-left: 4px solid var(--t3, var(--ko));
}
.weak-row .list-txt {
  flex: 1 1 220px;
}
.weak-row .rate {
  font-size: 13.5px;
}
.weak-actions {
  display: flex;
  gap: var(--s2);
}
.mastery-row {
  display: flex;
  gap: var(--s3);
  align-items: flex-start;
  padding: 14px var(--s4);
}
.mastery-row + .mastery-row {
  border-top: 1px solid var(--line);
}
.mastery-main {
  flex: 1;
  min-width: 0;
}
.mastery-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
}
.mastery-top b {
  font-size: 15.5px;
}
.mastery-cols {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 96px;
  gap: var(--s4);
  margin-top: 8px;
  align-items: end;
}
.mastery-cols .mini-label {
  margin: 0 0 4px;
}
.mastery-cols > div:first-child {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: auto auto;
  column-gap: 10px;
  align-items: center;
}
.mastery-cols > div:first-child .mini-label {
  grid-column: 1 / -1;
}
.mastery-cols > div:first-child .num {
  font-size: 13px;
}
.mastery-cols .rate {
  font-size: 18px;
}

/* ---------- Réglages ---------- */
.settings .seg-lg button {
  flex-direction: column;
  gap: 4px;
  min-height: 64px;
}
.storage-status {
  margin-top: var(--s3);
}
.storage-status p {
  font-size: 14px;
  line-height: 1.55;
}
.storage-status .btn {
  margin-top: var(--s2);
}
.mod-details > summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: var(--s3);
  padding: 6px 0;
  font-weight: 700;
  color: var(--accent);
}
.mod-list {
  display: grid;
  gap: 0;
  margin-top: var(--s2);
}
.mod-item {
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.mod-item > b {
  font-size: 15px;
}

/* ---------- Missions (plan du jour) ---------- */
.plan-hero {
  position: relative;
  overflow: hidden;
}
.plan-hero::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  height: 4px;
  background: var(--t3, var(--accent));
}
.plan-hero > p.muted.small {
  margin-top: var(--s2);
}
.plan-hero .notice {
  margin-top: var(--s4);
}
.plan-list {
  display: grid;
  gap: var(--s3);
  margin-top: var(--s3);
}
.plan-list + .btn {
  margin-top: var(--s3);
}
.plan-item {
  position: relative;
  padding: 14px var(--s4) var(--s4) calc(var(--s4) + 3px);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--sh-1);
  overflow: hidden;
}
.plan-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--t3, var(--accent));
}
.plan-item.is-done {
  background: var(--surface-2);
}
.plan-item.is-done::before {
  background: var(--ok);
}
.plan-item.is-done h3 {
  color: var(--muted);
}
.plan-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 650;
  color: var(--t4, var(--accent-ink));
}
.plan-ico {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--t1);
  color: var(--t4);
}
.plan-sub {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.plan-min {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
}
.plan-item h3 {
  margin: 10px 0 8px;
  font-size: 16.5px;
  line-height: 1.3;
}
.plan-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.plan-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s3);
}
.plan-validate {
  margin-top: var(--s2);
}
.plan-later h3 {
  font-size: 16px;
}
.plan-later p.muted {
  margin-top: 4px;
}
.plan-settings .seg {
  margin-bottom: var(--s2);
}
.missions-side .later-grid {
  grid-template-columns: 1fr;
}
.missions-side .card + .card,
.missions-side details + details {
  margin-top: var(--s3);
}

/* =====================================================================
   40 · Lecteur de cours : espace de concentration
   Les thèmes de lecture ne redéfinissent que les jetons : tous les composants
   (questions, cartes, encadrés) suivent automatiquement.
   ===================================================================== */
.modalbg.reader-bg,
.modalbg.exam-bg {
  background: var(--canvas);
  align-items: stretch;
  animation: none;
}
.modal.reader,
.modal.exam {
  width: 100%;
  max-width: none;
  height: 100vh;
  height: 100dvh;
  max-height: none;
  padding: 0;
  border-radius: 0;
  box-shadow: none;
}
.modal.reader.enter,
.modal.exam.enter {
  animation: pushIn 0.3s var(--ease);
}
@keyframes pushIn {
  from {
    opacity: 0.4;
    transform: translateY(14px);
  }
}

/* ---------- Thèmes de lecture ---------- */
.reader {
  --rs: 18px;
  --rlh: 1.75;
  background: var(--surface) !important;
  color: var(--ink);
}
.reader[data-theme="papier"],
.reader[data-theme="calme"],
.reader[data-theme="focus"],
.reader[data-theme="contraste"] {
  color-scheme: light;
  --primary: #1c3f7c;
  --primary-hover: #17346a;
  --on-primary: #ffffff;
  --accent: #2559c9;
  --accent-ink: #1d4aa8;
  --accent-soft: rgba(37, 89, 201, 0.1);
  --accent-line: rgba(37, 89, 201, 0.35);
  --focus: #2563eb;
  --ok: #11795a;
  --ok-soft: rgba(17, 121, 90, 0.1);
  --ok-line: rgba(17, 121, 90, 0.4);
  --ko: #c42f3a;
  --ko-soft: rgba(196, 47, 58, 0.09);
  --ko-line: rgba(196, 47, 58, 0.38);
  --warn: #95580a;
  --warn-soft: rgba(200, 130, 20, 0.12);
  --warn-line: rgba(200, 130, 20, 0.4);
  --violet: #5b3fc4;
  --violet-soft: rgba(91, 63, 196, 0.1);
  --mk-ex: #a35d07;
  --mk-ex-bg: rgba(232, 155, 35, 0.1);
  --mk-ex-line: rgba(220, 145, 30, 0.36);
  --mk-mech: #2155b8;
  --mk-mech-bg: rgba(59, 120, 240, 0.08);
  --mk-mech-line: rgba(59, 120, 240, 0.3);
  --mk-trap: #b52a35;
  --mk-trap-bg: rgba(224, 72, 79, 0.08);
  --mk-trap-line: rgba(224, 72, 79, 0.34);
  --mk-key: #0f6e51;
  --mk-key-bg: rgba(23, 153, 111, 0.09);
  --mk-key-line: rgba(23, 153, 111, 0.34);
  --sh-1: none;
  --sh-2: none;
}
.reader[data-theme="papier"] {
  --surface: #f1f0ec;
  --surface-2: #e9e7e1;
  --sunken: #e2dfd8;
  --line: #d9d5cc;
  --line-2: #c4bfb3;
  --ink: #22262c;
  --ink-2: #3d424a;
  --muted: #5d636b;
}
.reader[data-theme="calme"] {
  --surface: #f4e8d3;
  --surface-2: #eedfc4;
  --sunken: #e7d5b5;
  --line: #dcc8a6;
  --line-2: #c8b088;
  --ink: #3b2e20;
  --ink-2: #55432f;
  --muted: #6a5640;
  --accent: #8a4f16;
  --accent-ink: #7a4510;
  --accent-soft: rgba(138, 79, 22, 0.11);
  --accent-line: rgba(138, 79, 22, 0.35);
  --primary: #6e4318;
  --primary-hover: #5c3813;
  --ok: #0f6e51;
}
.reader[data-theme="focus"] {
  --surface: #fffaf0;
  --surface-2: #f8f0de;
  --sunken: #f1e7d1;
  --line: #ebe1cb;
  --line-2: #d8c9a8;
  --ink: #2a2824;
  --ink-2: #45413a;
  --muted: #69635a;
}
.reader[data-theme="contraste"] {
  --surface: #ffffff;
  --surface-2: #f4f4f4;
  --sunken: #e9e9e9;
  --line: #9a9a9a;
  --line-2: #6b6b6b;
  --ink: #000000;
  --ink-2: #111111;
  --muted: #333333;
  --accent: #0b4fc4;
  --accent-ink: #0a3f9c;
  --primary: #0a3f9c;
}
.reader[data-theme="contraste"] .reader-body {
  font-weight: 500;
}
.reader[data-theme="nuit"] {
  color-scheme: dark;
  --surface: #1c1c1e;
  --surface-2: #232326;
  --sunken: #2c2c30;
  --line: #38383d;
  --line-2: #4a4a51;
  --ink: #e8e6e3;
  --ink-2: #cfccc8;
  --muted: #a3a1a6;
  --primary: #3563c4;
  --primary-hover: #3d6fd6;
  --on-primary: #ffffff;
  --accent: #86aefc;
  --accent-ink: #a9c4ff;
  --accent-soft: rgba(110, 150, 250, 0.15);
  --accent-line: rgba(134, 174, 252, 0.42);
  --focus: #8fb4ff;
  --ok: #5ad1a3;
  --ok-soft: rgba(70, 200, 150, 0.13);
  --ok-line: rgba(90, 209, 163, 0.42);
  --ko: #ff8f96;
  --ko-soft: rgba(255, 110, 120, 0.13);
  --ko-line: rgba(255, 143, 150, 0.42);
  --warn: #f3bc63;
  --warn-soft: rgba(240, 180, 80, 0.13);
  --warn-line: rgba(243, 188, 99, 0.42);
  --violet: #b8a6ff;
  --violet-soft: rgba(160, 140, 255, 0.15);
  --mk-ex: #ffc46b;
  --mk-ex-bg: rgba(255, 196, 107, 0.08);
  --mk-ex-line: rgba(255, 196, 107, 0.28);
  --mk-mech: #9dbcff;
  --mk-mech-bg: rgba(140, 180, 255, 0.08);
  --mk-mech-line: rgba(140, 180, 255, 0.28);
  --mk-trap: #ff9aa0;
  --mk-trap-bg: rgba(255, 140, 150, 0.08);
  --mk-trap-line: rgba(255, 140, 150, 0.3);
  --mk-key: #6fe0b5;
  --mk-key-bg: rgba(90, 209, 163, 0.08);
  --mk-key-line: rgba(90, 209, 163, 0.3);
  --sh-1: none;
  --sh-2: none;
}
.reader[data-theme="nuit"] [class*="tone-"],
.reader[data-theme="nuit"][class*="tone-"] {
  --t1: color-mix(in srgb, var(--t3) 18%, #1c1c1e);
  --t4: color-mix(in srgb, var(--t3) 55%, #ffffff);
}

/* ---------- Barre du lecteur ---------- */
.reader-bar {
  position: sticky;
  top: 0;
  z-index: 6;
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 44px 44px;
  align-items: center;
  gap: 4px;
  padding: calc(6px + env(safe-area-inset-top)) 8px 6px;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 97%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(16px);
  backdrop-filter: saturate(1.4) blur(16px);
  border-bottom: 1px solid transparent;
  transition: border-color var(--t);
}
.reader.scrolled .reader-bar {
  border-bottom-color: var(--line);
}
.reader-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  line-height: 1.25;
  text-align: center;
}
.reader-title span {
  max-width: 100%;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.reader-title b {
  max-width: 100%;
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.aa-btn {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.reader-progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 3px;
  pointer-events: none;
}
.reader-progress span {
  display: block;
  width: 0;
  height: 100%;
  border-radius: 0 3px 3px 0;
  background: var(--t3, var(--accent));
  transition: width 0.12s linear;
}

/* ---------- Mise en page : sommaire latéral (grand écran) + colonne de lecture ---------- */
.reader-layout {
  display: block;
}
.reader-toc {
  display: none;
}
.reader-col {
  min-width: 0;
}
.toc-title {
  margin: 0 8px var(--s3) !important;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--muted);
  line-height: 1.4;
}
.toc-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 2px;
}
.toc-item {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: start;
  width: 100%;
  padding: 8px 10px;
  border-radius: 10px;
  text-align: left;
  color: var(--ink-2);
  font-size: 14.5px;
  line-height: 1.35;
  transition: background-color var(--t-fast), color var(--t-fast);
}
.toc-item:hover {
  background: var(--sunken);
  color: var(--ink);
}
.toc-item.is-current {
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 650;
}
.toc-n {
  display: grid;
  place-items: center;
  width: 24px;
  height: 22px;
  border-radius: 6px;
  background: var(--sunken);
  font-size: 12px;
  font-weight: 750;
  color: var(--muted);
}
.toc-item.is-current .toc-n {
  background: var(--accent);
  color: var(--surface);
}
.toc-q {
  margin-top: 2px;
  font-size: 12px;
  font-weight: 650;
  color: var(--muted);
}
.toc-q.full {
  color: var(--ok);
}
.toc-extra {
  display: grid;
  gap: 2px;
  margin-top: var(--s3);
  padding-top: var(--s3);
  border-top: 1px solid var(--line);
}
.toc-link {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 10px;
  color: var(--accent);
  font-weight: 650;
  font-size: 14.5px;
  text-align: left;
}
.toc-link:hover {
  background: var(--accent-soft);
}
.toc-sheet nav {
  margin-top: var(--s3);
}

/* ---------- Onglets du cours ---------- */
.lesson-tabs {
  display: flex;
  gap: 6px;
  max-width: 760px;
  margin: 0 auto;
  padding: 10px 20px 6px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 18px), transparent);
  mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 18px), transparent);
}
.lesson-tabs::-webkit-scrollbar {
  display: none;
}
.lesson-tabs button {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  padding: 6px 12px;
  border-radius: var(--pill);
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 650;
  white-space: nowrap;
  transition: background-color var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.lesson-tabs button:hover:not(.active) {
  border-color: var(--line-2);
  color: var(--ink);
}
.lesson-tabs button.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--surface);
}
.lesson-tabs button.active .count {
  background: color-mix(in srgb, var(--surface) 22%, transparent);
  color: var(--surface);
}

/* ---------- Corps du lecteur ---------- */
.reader-body {
  max-width: 760px;
  margin: 0 auto;
  padding: var(--s2) var(--s5) calc(var(--s8) + env(safe-area-inset-bottom));
}
.reader-body.fade-in {
  animation: viewIn 0.24s var(--ease) both;
}
.reader-source {
  margin-top: var(--s7);
  padding-top: var(--s4);
  border-top: 1px solid var(--line);
}
.lesson-intro {
  padding: var(--s4) 0 var(--s3);
}
.lesson-title {
  margin-top: var(--s3);
  font-size: calc(var(--rs) + 11px);
  line-height: 1.15;
  letter-spacing: -0.025em;
}
.lesson-hook {
  margin-top: var(--s3) !important;
  font-size: calc(var(--rs) + 1px);
  line-height: 1.55;
  color: var(--ink-2);
}
.lesson-facts {
  margin-top: var(--s3) !important;
  font-size: 13.5px;
  color: var(--muted);
}
.intro-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s4);
}
.mk-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: var(--s2) 0 0;
}
.mk-legend .mk {
  flex: none;
}
.logic-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: var(--s4) 0;
  padding: 0;
  list-style: none;
  counter-reset: step;
}
.logic-chain li {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: var(--pill);
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 650;
  counter-increment: step;
}
.logic-chain li::before {
  content: counter(step);
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--t1, var(--accent-soft));
  color: var(--t4, var(--accent-ink));
  font-size: 11px;
  font-weight: 800;
}
.logic-chain li + li {
  position: relative;
  margin-left: 12px;
}
.logic-chain li + li::after {
  content: "";
  position: absolute;
  left: -13px;
  top: 50%;
  width: 6px;
  height: 6px;
  border-top: 1.5px solid var(--muted);
  border-right: 1.5px solid var(--muted);
  transform: translateY(-50%) rotate(45deg);
}
.lesson-warning {
  margin: var(--s4) 0;
  border-radius: var(--r);
  border: 1px solid var(--warn-line);
  background: var(--warn-soft);
}
.lesson-warning > summary {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 8px 14px;
  font-weight: 700;
  font-size: 14.5px;
  color: var(--warn);
}
.lesson-warning > summary span {
  flex: 1;
}
.lesson-warning > summary > .ico:last-child {
  transition: transform var(--t) var(--ease);
}
.lesson-warning[open] > summary > .ico:last-child {
  transform: rotate(180deg);
}
.lesson-warning > p {
  padding: 0 14px 12px;
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--ink);
}

/* Chapitres */
.lesson-section {
  padding: var(--s6) 0 var(--s2);
  border-top: 1px solid var(--line);
  scroll-margin-top: calc(var(--bar-h) + 12px);
}
.lesson-intro + .logic-chain + .lesson-section,
.logic-chain + .lesson-section {
  margin-top: var(--s4);
}
.chapter-kicker {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 10px;
  margin: 0 0 6px !important;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--t4, var(--muted));
}
.page-ref {
  padding: 1px 8px;
  border-radius: var(--pill);
  background: var(--sunken);
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
}
.lesson-section > h2 {
  margin-bottom: var(--s4);
  font-size: calc(var(--rs) + 7px);
  line-height: 1.22;
  letter-spacing: -0.02em;
}
.lesson-section > p:not(.chapter-kicker),
.callout p,
.retenir-box li,
.retenir-box p,
.lesson-memory p,
.essence-section p:not(.chapter-kicker),
.chapter-recall p,
.chapter-answer p,
.ssh-answer p,
.ssh-answer li {
  font-size: var(--rs);
  line-height: var(--rlh);
  color: var(--ink);
}
.lesson-section > p:not(.chapter-kicker) {
  margin: 0 0 1em;
  text-wrap: pretty;
  hyphens: auto;
  -webkit-hyphens: auto;
  overflow-wrap: break-word;
}
.lesson-section > p + p:not(.chapter-kicker) {
  margin-top: 0;
}
.lesson-section strong,
.retenir-box strong,
.callout strong {
  font-weight: 750;
}
.reader[data-font="serif"] :is(.lesson-section > p:not(.chapter-kicker), .callout p, .lesson-hook, .lesson-memory p, .essence-section p:not(.chapter-kicker), .chapter-recall p, .chapter-answer p, .ssh-answer p) {
  font-family: var(--serif);
}
.reader[data-font="serif"] :is(.lesson-section > p, .callout p, .lesson-memory p) strong {
  font-weight: 700;
}

/* Repères graphiques constants */
.mk {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px 3px 7px;
  border-radius: var(--pill);
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 750;
  line-height: 1.3;
}
.mk-ex {
  background: var(--mk-ex-bg);
  color: var(--mk-ex);
  box-shadow: inset 0 0 0 1px var(--mk-ex-line);
}
.mk-mech {
  background: var(--mk-mech-bg);
  color: var(--mk-mech);
  box-shadow: inset 0 0 0 1px var(--mk-mech-line);
}
.mk-trap {
  background: var(--mk-trap-bg);
  color: var(--mk-trap);
  box-shadow: inset 0 0 0 1px var(--mk-trap-line);
}
.mk-key {
  background: var(--mk-key-bg);
  color: var(--mk-key);
  box-shadow: inset 0 0 0 1px var(--mk-key-line);
}
.callout,
.retenir-box,
.lesson-memory {
  margin: 4px 0 1.15em;
  padding: 12px 16px 4px;
  border-radius: var(--r);
  border: 1px solid transparent;
}
.callout .mk,
.retenir-box .mk,
.lesson-memory .mk {
  margin-bottom: 8px;
}
.callout p {
  margin: 0 0 0.75em;
}
.callout-ex {
  background: var(--mk-ex-bg);
  border-color: var(--mk-ex-line);
}
.callout-mech {
  background: var(--mk-mech-bg);
  border-color: var(--mk-mech-line);
}
.callout-trap {
  background: var(--mk-trap-bg);
  border-color: var(--mk-trap-line);
  box-shadow: inset 4px 0 0 var(--mk-trap);
}
.callout-ex .mk,
.callout-mech .mk,
.callout-trap .mk {
  box-shadow: none;
  padding-left: 0;
  background: none;
}
.retenir-box {
  background: var(--mk-key-bg);
  border-color: var(--mk-key-line);
  box-shadow: inset 4px 0 0 var(--mk-key);
  padding-bottom: 8px;
}
.retenir-box .mk {
  background: none;
  box-shadow: none;
  padding-left: 0;
  font-size: 13.5px;
}
.retenir-box ul {
  margin: 0;
  padding-left: 1.1em;
}
.retenir-box li {
  margin: 0 0 0.4em;
  font-size: calc(var(--rs) - 1px);
  line-height: 1.6;
}
.retenir-box li::marker {
  color: var(--mk-key);
}
.retenir-box p {
  margin: 0 0 0.5em;
  font-size: calc(var(--rs) - 1px);
  line-height: 1.6;
}
.retenir-box strong {
  color: var(--mk-key);
}
.lesson-memory.callout-key {
  background: var(--surface-2);
  border-color: var(--line);
  border-top: 3px solid var(--mk-key);
  padding: 12px 16px 6px;
  margin-top: var(--s4);
}
.lesson-memory .mk {
  background: none;
  box-shadow: none;
  padding-left: 0;
}
.lesson-memory p {
  margin: 0 0 0.6em;
  font-weight: 600;
}

/* Fin de chapitre : passage direct à l'auto-évaluation */
.chapter-end {
  margin: var(--s4) 0 var(--s3);
  padding: 14px var(--s4) var(--s4);
  border-radius: var(--r);
  border: 1px dashed var(--line-2);
  background: var(--surface);
}
.chapter-end > p {
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--ink-2);
}
.chapter-action-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s3);
}

/* ---------- Figures et illustrations ---------- */
.med-figure,
.fiche-figure {
  margin: var(--s5) 0 var(--s6);
  padding: 8px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.med-figure-hit,
.fiche-open {
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  border-radius: var(--r);
  overflow: hidden;
  cursor: zoom-in;
  background: #ffffff;
}
.med-figure-hit img,
.fiche-open img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 480px;
  object-fit: contain;
  background: #ffffff;
}
.med-figure-zoom,
.fiche-zoom-hint {
  position: absolute;
  right: 8px;
  bottom: 8px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: var(--pill);
  background: rgba(16, 26, 44, 0.72);
  color: #fff;
  font-size: 12.5px;
  font-weight: 650;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.med-figure figcaption,
.fiche-figure figcaption {
  margin: 10px 6px 2px;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--muted);
  text-align: center;
}
.med-visual {
  margin: var(--s4) 0;
  padding: 10px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: #ffffff;
}
.med-visual svg {
  display: block;
  width: 100%;
  height: auto;
  max-width: 520px;
  margin: auto;
}
.med-visual text {
  font-family: var(--font);
  font-size: 12px;
  fill: #233d59;
}
.figure-overlay {
  position: fixed;
  z-index: 1000;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: rgba(6, 14, 28, 0.94);
  animation: fadeIn 0.18s ease both;
}
.figure-overlay-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
}
.fo-zoom {
  display: flex;
  gap: 6px;
}
.fo-stage {
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 12px;
}
.fo-stage img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  background: #ffffff;
}
.fo-stage img.zoomed {
  max-width: none;
  max-height: none;
}
.fo-cap {
  margin: 0;
  padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
  color: #dfe6f0;
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
}
.fo-error {
  max-width: 34ch;
  color: #fff;
  font-size: 16px;
  line-height: 1.6;
  text-align: center;
}

/* ---------- Synthèse ---------- */
.summary-switch {
  margin: var(--s4) 0 var(--s2);
}
.learning-head {
  margin: var(--s4) 0 var(--s4);
}
.learning-head h2 {
  font-size: calc(var(--rs) + 6px);
  letter-spacing: -0.02em;
}
.learning-head p.muted {
  margin-top: 6px;
  font-size: 15px;
  line-height: 1.6;
}
.learning-head .practice-progress,
.learning-head .lesson-facts {
  margin-top: var(--s3) !important;
}
.essence-section,
.express-section {
  padding: var(--s5) 0 var(--s3);
  border-top: 1px solid var(--line);
}
.essence-section h3,
.express-section h3 {
  margin-bottom: var(--s3);
  font-size: calc(var(--rs) + 3px);
  line-height: 1.3;
}
.essence-goal,
.essence-reason,
.essence-reflex,
.essence-anchor {
  margin: 0 0 10px;
  padding: 10px 14px;
  border-radius: var(--r);
  border-left: 4px solid var(--line-2);
  background: var(--surface-2);
}
.essence-goal > span,
.essence-reason > span,
.essence-reflex > span,
.essence-anchor > span {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  font-size: 13.5px;
  font-weight: 750;
}
.essence-section p:not(.chapter-kicker) {
  font-size: calc(var(--rs) - 1px);
  line-height: 1.65;
}
.essence-goal {
  border-left-color: var(--violet);
}
.essence-goal > span {
  color: var(--violet);
}
.essence-reason {
  border-left-color: var(--mk-mech);
}
.essence-reason > span {
  color: var(--mk-mech);
}
.essence-reflex {
  border-left-color: var(--mk-key);
}
.essence-reflex > span {
  color: var(--mk-key);
}
.essence-anchor {
  border-left-color: var(--mk-ex);
}
.essence-anchor > span {
  color: var(--mk-ex);
}

/* ---------- Passage au cours suivant ---------- */
.course-switch {
  margin: var(--s7) 0 var(--s2);
  padding: var(--s4);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.course-switch h3 {
  font-size: 17px;
  margin-bottom: var(--s3);
}
.next-course {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--r);
  background: var(--primary);
  color: var(--on-primary);
  text-align: left;
}
.next-course:hover {
  background: var(--primary-hover);
}
.next-course span {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.next-course b {
  font-size: 16px;
  font-weight: 700;
}
.next-course small {
  font-size: 13.5px;
  opacity: 0.85;
}
.course-switch-buttons {
  display: flex;
  justify-content: space-between;
  gap: var(--s2);
  margin-top: var(--s2);
}
.course-switch > p.muted {
  font-size: 14.5px;
}

/* ---------- Réglages de lecture (Aa) ---------- */
.reader-sheet .rs-row {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 10px;
  margin: var(--s4) 0 var(--s2);
}
.size-seg button {
  font-family: var(--serif);
  font-weight: 600;
}
.size-out {
  align-self: center;
  min-width: 52px;
  text-align: center;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--muted);
}
.rs-label {
  margin: var(--s3) 2px 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.theme-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: var(--s4);
}
.theme-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 84px;
  border-radius: var(--r-lg);
  border: 2px solid transparent;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
}
.theme-tile span {
  font-family: var(--serif);
  font-size: 26px;
  line-height: 1;
}
.theme-tile small {
  font-size: 13px;
  font-weight: 650;
}
.theme-tile.active {
  border-color: var(--accent);
}
.th-original {
  background: var(--surface);
  color: var(--ink);
}
.th-nuit {
  background: #1c1c1e;
  color: #e8e6e3;
}
.th-papier {
  background: #f1f0ec;
  color: #22262c;
}
.th-contraste {
  background: #ffffff;
  color: #000000;
}
.th-contraste span {
  font-weight: 800;
}
.th-calme {
  background: #f4e8d3;
  color: #3b2e20;
}
.th-focus {
  background: #fffaf0;
  color: #2a2824;
}

/* =====================================================================
   50 · Exercices : QCM, cartes mémoire, QROC, évaluation, rédaction, entraînement
   Couleurs de sens identiques partout : vert = juste, rouge = erreur,
   vert pointillé = bonne réponse oubliée, violet = plusieurs réponses (QRM).
   ===================================================================== */

/* ---------- Question ---------- */
.qitem {
  margin: var(--s4) 0;
  padding: var(--s4);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--sh-1);
  scroll-margin-top: calc(var(--bar-h) + 16px);
}
.reader .qitem {
  background: var(--surface-2);
  box-shadow: none;
}
.q-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
}
.q-format {
  padding: 2px 8px;
  border-radius: var(--pill);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: 0.02em;
}
.q-format.multi {
  background: var(--violet-soft);
  color: var(--violet);
}
.q-prob {
  padding: 2px 8px;
  border-radius: var(--pill);
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
}
.q-prob.p1 {
  background: var(--sunken);
  color: var(--ink-2);
}
.q-prob.p2 {
  background: var(--warn-soft);
  color: var(--warn);
}
.q-prob.p3 {
  background: var(--ko-soft);
  color: var(--ko);
}
.q-num {
  margin-left: auto;
  font-size: 13px;
  color: var(--muted);
}
.qitem h3,
.exam-q h3 {
  margin: var(--s3) 0 4px;
  font-size: 17.5px;
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: -0.005em;
  text-wrap: pretty;
}
.q-hint {
  margin: 0 0 var(--s2) !important;
  font-size: 13.5px;
  color: var(--muted);
}

/* Propositions */
.opt {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  width: 100%;
  min-height: 52px;
  margin: 8px 0;
  padding: 12px 14px;
  border-radius: var(--r);
  border: 1.5px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.45;
  text-align: left;
  transition: border-color var(--t-fast), background-color var(--t-fast), box-shadow var(--t-fast);
}
.opt:hover:not(:disabled) {
  border-color: var(--accent-line);
  background: var(--surface);
  background: color-mix(in srgb, var(--accent-soft) 40%, var(--surface));
}
.opt:disabled {
  cursor: default;
  color: var(--ink);
}
.opt-letter {
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  margin-top: -1px;
  border-radius: 50%;
  border: 1.5px solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 800;
  transition: background-color var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.opt-multi .opt-letter {
  border-radius: 7px;
}
.opt-text {
  flex: 1;
  min-width: 0;
  padding-top: 1px;
}
.opt-tag {
  flex: none;
  align-self: center;
  padding: 2px 8px;
  border-radius: var(--pill);
  font-size: 12.5px;
  font-weight: 750;
}
.opt.picked {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent);
}
.opt.picked .opt-letter {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--surface);
}
.opt.is-right {
  border-color: var(--ok);
  background: var(--ok-soft);
}
.opt.is-right .opt-letter,
.opt.is-right .opt-tag {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--surface);
}
.opt.is-wrong {
  border-color: var(--ko);
  background: var(--ko-soft);
}
.opt.is-wrong .opt-letter,
.opt.is-wrong .opt-tag {
  background: var(--ko);
  border-color: var(--ko);
  color: var(--surface);
}
.opt.is-missed {
  border-color: var(--ok);
  border-style: dashed;
  background: transparent;
}
.opt.is-missed .opt-letter {
  border-color: var(--ok);
  color: var(--ok);
}
.opt.is-missed .opt-tag {
  color: var(--ok);
  box-shadow: inset 0 0 0 1.5px var(--ok);
}
.opt.is-neutral {
  opacity: 0.62;
}
.q-submit {
  margin-top: var(--s3);
}
.q-submit .btn {
  width: 100%;
}
.qfeedback,
.train-explain {
  margin-top: var(--s3);
  padding: 12px 14px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  border-left-width: 4px;
  background: var(--surface);
  font-size: 15px;
  line-height: 1.6;
  animation: viewIn 0.22s var(--ease) both;
}
.qfeedback.ok,
.train-explain {
  border-color: var(--ok-line);
  border-left-color: var(--ok);
  background: var(--ok-soft);
}
.qfeedback.ko,
.train-explain.train-weak {
  border-color: var(--ko-line);
  border-left-color: var(--ko);
  background: var(--ko-soft);
}
.qfeedback p + p,
.train-explain p + p {
  margin-top: 6px;
}
.qf-verdict {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  font-weight: 750;
}
.qfeedback.ok .qf-verdict,
.train-explain .qf-verdict {
  color: var(--ok);
}
.qfeedback.ko .qf-verdict,
.train-explain.train-weak .qf-verdict {
  color: var(--ko);
}
.qf-answer {
  margin-left: auto;
  padding: 1px 8px;
  border-radius: var(--pill);
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 700;
}
.qf-src {
  font-size: 13px;
  color: var(--muted);
}

/* Progression d'une série */
.practice-progress {
  display: grid;
  gap: 8px;
  margin: var(--s3) 0;
}
.practice-progress p {
  font-size: 14.5px;
  color: var(--ink-2);
}
.quiz-pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  margin-top: var(--s5);
}
.quiz-pagination .muted {
  font-size: 14px;
}

/* ---------- Entraînement d'un chapitre ---------- */
.chapter-work-title {
  padding: var(--s4) 0 var(--s2);
}
.chapter-work-title h2 {
  font-size: calc(var(--rs, 18px) + 5px);
  line-height: 1.25;
}
.chapter-work-title p.muted {
  margin-top: 6px;
  font-size: 15px;
  line-height: 1.55;
}
.chapter-mode-switch {
  margin: var(--s3) 0 var(--s2);
}
.chapter-nav-footer {
  display: flex;
  flex-wrap: wrap;
