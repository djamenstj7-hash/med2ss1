ie « xanth- » ?","a":"Jaune. Exemple du cours : xanthopsie (vision teintée de jaune).","pages":"7","topic":"Palette des couleurs"},{"q":"Que signifie « chrys- » ?","a":"Doré. Exemple du cours : chryséose (dépôt de couleur dorée).","pages":"7","topic":"Palette des couleurs"},{"q":"Que signifie « aur(i/o)- » ?","a":"Or, doré. Exemple du cours : auride (substance contenant de l'or).","pages":"7","topic":"Palette des couleurs"},{"q":"Que signifie « argyr- » ?","a":"Argent. Exemple du cours : argyrémie (présence d'argent dans le sang).","pages":"7","topic":"Palette des couleurs"},{"q":"Que signifie « rub- » ?","a":"Rouge. Exemple du cours : rubéole (mot de la famille du rouge).","pages":"7","topic":"Palette des couleurs"},{"q":"Que signifie « éryth- » ?","a":"Rouge. Exemple du cours : érythème (rougeur de la peau).","pages":"7","topic":"Palette des couleurs"},{"q":"Que signifie « rhod- » ?","a":"Rose. Exemple du cours : rhodopsine (pigment dont le nom repose sur cette racine).","pages":"7","topic":"Palette des couleurs"},{"q":"Que signifie « mélan- » ?","a":"Noir. Exemple du cours : mélancolie (mot construit historiquement à partir de bile noire).","pages":"7","topic":"Palette des couleurs"},{"q":"Que signifie « atr(a)- » ?","a":"Noir. Exemple du cours : atrabilaire (relatif à l'atrabile (bile noire)).","pages":"7","topic":"Palette des couleurs"},{"q":"Que signifie « anthrac- » ?","a":"Noir, charbon. Exemple du cours : anthrax (mot construit sur le charbon).","pages":"8","topic":"Palette des couleurs"},{"q":"Que signifie « polio- » ?","a":"Gris. Exemple du cours : poliomyélite (mot construit sur la substance grise).","pages":"8","topic":"Palette des couleurs"},{"q":"Que signifie « leuc(o)- » ?","a":"Blanc. Exemple du cours : leucémie (mot de la famille des leucocytes, globules blancs).","pages":"8","topic":"Palette des couleurs"},{"q":"Que signifie « éburn- » ?","a":"Ivoire. Exemple du cours : éburnation (os rendu compact comme de l'ivoire).","pages":"8","topic":"Palette des couleurs"},{"q":"Que signifie « hyal- » ?","a":"Transparent. Exemple du cours : hyalite (atteinte du corps vitré de l'œil dans le cours).","pages":"8","topic":"Palette des couleurs"},{"q":"Que signifie « topo- » ?","a":"Lieu, position. Exemple du cours : ectopie (localisation anormale d'un organe).","pages":"8","topic":"Localisation et intérieur"},{"q":"Que signifie « in- / intra- » ?","a":"Dans, à l'intérieur. Exemple du cours : intraveineux (à l'intérieur d'une veine).","pages":"8","topic":"Localisation et intérieur"},{"q":"Que signifie « en- » ?","a":"Dedans, à l'intérieur. Exemple du cours : encéphale (structures contenues dans la boîte crânienne).","pages":"8","topic":"Localisation et intérieur"},{"q":"Que signifie « endo- » ?","a":"À l'intérieur. Exemple du cours : endogène (produit de l'intérieur).","pages":"8","topic":"Localisation et intérieur"},{"q":"Que signifie « ento- » ?","a":"À l'intérieur. Exemple du cours : entozoaire (parasite vivant à l'intérieur du corps).","pages":"8","topic":"Localisation et intérieur"},{"q":"Que signifie « claustr- » ?","a":"Enfermé. Exemple du cours : claustrophobie (peur des espaces clos).","pages":"8","topic":"Localisation et intérieur"},{"q":"Que signifie « par(a)- » ?","a":"À côté. Exemple du cours : paracentèse (ponction mentionnée dans le cours).","pages":"8","topic":"Localisation et intérieur"},{"q":"Que signifie « ex- / ec- » ?","a":"Dehors, hors de. Exemple du cours : exfoliation (élimination de couches superficielles).","pages":"8","topic":"Localisation et intérieur"},{"q":"Que signifie « extra- » ?","a":"Hors de, à l'extérieur. Exemple du cours : extra-utérine (en dehors de l'utérus).","pages":"9","topic":"Dehors et autour"},{"q":"Que signifie « exo- » ?","a":"À l'extérieur. Exemple du cours : exophtalmie (saillie du globe oculaire hors de l'orbite).","pages":"9","topic":"Dehors et autour"},{"q":"Que signifie « ecto- » ?","a":"À l'extérieur. Exemple du cours : ectoparasite (parasite vivant à l'extérieur de l'hôte).","pages":"9","topic":"Dehors et autour"},{"q":"Que signifie « circon- » ?","a":"Autour. Exemple du cours : circonvolution (enroulement autour d'un axe).","pages":"9","topic":"Dehors et autour"},{"q":"Que signifie « péri- » ?","a":"Autour. Exemple du cours : péridurale (autour de la dure-mère).","pages":"9","topic":"Dehors et autour"},{"q":"Que signifie « sur- » ?","a":"Sur, au-dessus. Exemple du cours : surrénal (au-dessus du rein).","pages":"9","topic":"Haut et excès"},{"q":"Que signifie « épi- » ?","a":"Sur, au-dessus. Exemple du cours : épithalamus (au-dessus du thalamus).","pages":"9","topic":"Haut et excès"},{"q":"Que signifie « super- / supra- » ?","a":"Au-dessus. Exemple du cours : supraclaviculaire (au-dessus de la clavicule).","pages":"9","topic":"Haut et excès"},{"q":"Que signifie « hyper- » ?","a":"Augmentation, excès. Exemple du cours : hypersthésie (augmentation anormale de la sensibilité).","pages":"9","topic":"Haut et excès"},{"q":"Que signifie « ultra- » ?","a":"Au-delà. Exemple du cours : ultraviolet (au-delà du violet visible).","pages":"9","topic":"Haut et excès"},{"q":"Que signifie « sub- » ?","a":"Sous, légèrement inférieur. Exemple du cours : subfébrile (qualificatif cité pour un état proche de la fièvre).","pages":"9","topic":"Bas et diminution"},{"q":"Que signifie « infra- » ?","a":"Au-dessous. Exemple du cours : infrarouge (au-dessous du rouge visible).","pages":"10","topic":"Bas et diminution"},{"q":"Que signifie « hypo- » ?","a":"Au-dessous, diminution. Exemple du cours : hypotrophie (défaut de nutrition d'un organe).","pages":"10","topic":"Bas et diminution"},{"q":"Que signifie « méio- / mio- » ?","a":"Diminution. Exemple du cours : méiopragie (perte d'une partie des fonctions d'un organe).","pages":"10","topic":"Bas et diminution"},{"q":"Que signifie « ana- » ?","a":"Vers le haut, construction. Exemple du cours : anabolisme (phase de synthèse du métabolisme).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « cata- » ?","a":"Vers le bas, dégradation. Exemple du cours : catabolisme (phase de dégradation du métabolisme).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « éco- » ?","a":"Maison, habitat. Exemple du cours : écotropisme (migration vers des territoires particuliers).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « paléo- » ?","a":"Ancien. Exemple du cours : paléocérébellum (partie ancienne du cervelet).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « archéo- » ?","a":"Très ancien. Exemple du cours : archéocérébellum (partie très ancienne du cervelet).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « pro- / pré- » ?","a":"Avant. Exemple du cours : prénatal (avant la naissance).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « ante- » ?","a":"Avant. Exemple du cours : antépénultième (avant-avant-dernier).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « post- » ?","a":"Après. Exemple du cours : post-partum (après l'accouchement).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « primo- » ?","a":"En premier. Exemple du cours : primo-infection (première infection).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « proto- » ?","a":"Au début. Exemple du cours : protosystole (début de la systole).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « télo- » ?","a":"À la fin. Exemple du cours : télomère (extrémité d'un chromosome).","pages":"10","topic":"Sens et chronologie"},{"q":"Que signifie « méso- / méd- » ?","a":"Milieu. Exemple du cours : médian (situé au milieu).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « postéro- » ?","a":"En arrière. Exemple du cours : postéro-latéral (en arrière et sur le côté).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « rétro- » ?","a":"En arrière. Exemple du cours : rétroactif (qui agit sur un événement antérieur).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « crypt(o)- » ?","a":"Caché, obscur. Exemple du cours : cryptogénique (d'origine cachée).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « trans- » ?","a":"À travers. Exemple du cours : transplantation (greffe avec rétablissement de continuité vasculaire dans le cours).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « per- » ?","a":"À travers. Exemple du cours : percutané (à travers la peau).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « pell- » ?","a":"À travers. Exemple du cours : pellucide (translucide).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « dia- » ?","a":"À travers. Exemple du cours : diaphane (laissant passer des rayons lumineux).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « -stase » ?","a":"Station debout, parfois arrêt. Exemple du cours : astasie (incapacité de garder la station debout).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « stat- » ?","a":"Debout. Exemple du cours : examen statique (examen pratiqué debout dans le cours).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « clin- » ?","a":"Couché. Exemple du cours : clinomanie (tendance exagérée à rester couché).","pages":"11","topic":"Repères spatiaux"},{"q":"Que signifie « hélio- » ?","a":"Soleil. Exemple du cours : héliothérapie (usage thérapeutique des rayons solaires).","pages":"11","topic":"Lumière et vision"},{"q":"Que signifie « luc(i)- » ?","a":"Lumière. Exemple du cours : translucide (qui laisse passer la lumière).","pages":"12","topic":"Lumière et vision"},{"q":"Que signifie « -photo » ?","a":"Lumière. Exemple du cours : photomètre (appareil mesurant l'intensité lumineuse).","pages":"12","topic":"Lumière et vision"},{"q":"Que signifie « -phos » ?","a":"Lumière. Exemple du cours : phosphore (mot de la famille de la lumière dans le cours).","pages":"12","topic":"Lumière et vision"},{"q":"Que signifie « actin- » ?","a":"Rayon lumineux. Exemple du cours : actinocancer (cancer cutané en rapport avec des radiations lumineuses).","pages":"12","topic":"Lumière et vision"},{"q":"Que signifie « radi- » ?","a":"Rayon. Exemple du cours : radiation (rayonnement électromagnétique).","pages":"12","topic":"Lumière et vision"},{"q":"Que signifie « hémér- » ?","a":"Jour. Exemple du cours : héméralopie (mot formé sur le jour et la vision).","pages":"12","topic":"Lumière et vision"},{"q":"Que signifie « nyct- » ?","a":"Nuit. Exemple du cours : nyctalopie (mot formé sur la nuit et la vision).","pages":"12","topic":"Lumière et vision"},{"q":"Que signifie « scot- » ?","a":"Obscurité. Exemple du cours : scotome (lacune du champ visuel).","pages":"12","topic":"Lumière et vision"}]},"cm-25910e7347112e7a":{"id":"cm-25910e7347112e7a","subject":"sang","title":"Cellules souches et progéniteurs hématopoïétiques — comprendre toute la fabrique du sang","courseName":"CELLULES SOUCHES ET PROGENITEURS HEMATOPOÏETIQUES.pdf","date":"2026-09-18","teacher":"Pr N. Duployez","source":{"label":"Ronéo & Juliette 2026–2027, CM Tissu sanguin, 9 pages","url":"https://drive.google.com/file/d/13xkGlNOkar2aegeSMA5rLHEJt_NeEHwn/view","pages":9},"editorialNote":"Réécriture narrative élaborée à partir du CM de Pr Duployez (9 pages) ; illustrations mentales et exercices inédits. Les formulations ambiguës du PDF sont signalées, non transmises comme faits avérés. Le texte source et les images restent sur Drive.","hook":"Tu entres dans la plus grande usine de remplacement de ton organisme : la moelle osseuse. Ici, on protège une poignée de cellules souches, on choisit les filières, on fabrique des millions de cellules et on contrôle la livraison jour et nuit.","flow":["Besoin permanent","CSH (stock)","Progéniteurs (choix)","Précurseurs (fabrication)","Cellules matures","Facteurs + niche"],"flags":["Le PDF p. 8 contient un exemple qui associe un granulocyte à la production d’hémoglobine ; il ne doit pas être retenu comme mécanisme de différenciation. Dans le reste du cours, la synthèse d’hémoglobine relève de la lignée érythrocytaire.","Les durées, pourcentages et formulations sont rapportés tels que présentés dans le CM. Ils servent à réviser ce support ; certaines phrases de la ronéo simplifient la physiologie clinique."],"summary":[{"name":"Définition","detail":"Hématopoïèse = production et renouvellement continu, régulé, des cellules sanguines à partir des CSH.","pages":"2"},{"name":"Valeurs repères","detail":"Durées mentionnées : GR 120 jours ; plaquettes 7 jours ; neutrophiles 1–3 jours.","pages":"3"},{"name":"Formule leucocytaire","detail":"La valeur absolue d’une population = leucocytes totaux × pourcentage / 100.","pages":"3"},{"name":"Leucocytes","detail":"Trois granulocytes : neutrophiles, éosinophiles, basophiles ; plus monocytes et lymphocytes. Un polynucléaire n’a qu’un noyau polylobé.","pages":"3"},{"name":"Localisation au cours de la vie","detail":"Début embryonnaire → foie/rate → prédominance médullaire. Le myélogramme explore la moelle.","pages":"4"},{"name":"Preuve expérimentale","detail":"Till et McCulloch : reconstitution de l’hématopoïèse après greffe médullaire chez des souris irradiées ; CFU-S.","pages":"4"},{"name":"CSH","detail":"Cellules rares ; CD34 mentionné ; auto-renouvellement, multipotence, quiescence et homing.","pages":"5"},{"name":"4 étages","detail":"CSH → progéniteur → précurseur → mature. Stock → engagement → amplification/maturation → fonction.","pages":"5–7"},{"name":"Lignages","detail":"CFU-L = lymphoïde ; CFU-GEMM = myéloïde. Précurseurs morphologiquement reconnaissables.","pages":"6–7"},{"name":"3 maturations","detail":"Érythrocyte : extrusion du noyau / réticulocyte ; neutrophile : granulations et noyau polylobé ; plaquettes : fragments de mégacaryocyte.","pages":"7–8"},{"name":"Régulation","detail":"Facteurs de transcription sur l’expression des gènes ; facteurs de croissance via des récepteurs. EPO et G-CSF.","pages":"8"},{"name":"Niche médullaire","detail":"Soutien et protection, sécrétion de facteurs de croissance, interactions adhésives.","pages":"9"}],"sections":[{"heading":"La moelle osseuse, une usine qui ne peut jamais fermer","pages":"2–3","paragraphs":["Imagine une ville dont les véhicules de livraison tombent régulièrement en panne. Elle doit constamment en reconstruire. Ton sang suit cette logique : les cellules circulantes ont une durée de vie limitée, et la moelle assure leur renouvellement continu. Le cours appelle cette fabrication régulée l’hématopoïèse.","Tout commence à partir d’un compartiment minuscule : les cellules souches hématopoïétiques, ou CSH. Elles donnent naissance aux différentes lignées sanguines. Le produit final est une cellule mature, fonctionnelle, mais sans capacité de division selon la présentation du cours.","Sur une lame de sang, les hématies dominent visuellement. Les leucocytes sont nucléés ; les plaquettes se distinguent des grandes cellules sanguines. Pour comprendre les formules leucocytaires, il faut distinguer une proportion d’une quantité : 50 % de neutrophiles parmi 10 G/L de leucocytes représentent 5 G/L de neutrophiles.","Le cours donne trois durées de vie repères : globule rouge environ 120 jours, plaquette environ 7 jours, neutrophile 1 à 3 jours. Il évoque aussi une production quotidienne très importante. Plus les cellules vivent peu longtemps, plus la fabrication continue devient indispensable."],"memory":"Mémo « production sans pause » : durée de vie courte → renouvellement permanent. Une proportion n’est pas une valeur absolue : TOTAL × POURCENTAGE / 100."},{"heading":"Reconnaître les cellules qui circulent","pages":"3","paragraphs":["Il existe cinq grandes familles de leucocytes citées dans ce CM. D’abord trois granulocytes : neutrophiles, éosinophiles et basophiles. Leur noyau peut être polylobé : « polynucléaire » ne veut pas dire qu’ils possèdent plusieurs noyaux.","Le cours cite ensuite les monocytes, décrits comme les plus grandes cellules sanguines, puis les lymphocytes. Chez l’adulte sain, les intervalles donnés sont : neutrophiles 55–70 %, éosinophiles 1–4 %, basophiles 0,5–1 %, monocytes 2–8 %, lymphocytes 20–40 %. Le cours précise que ces proportions évoluent notamment avec l’âge.","Imagine un amphithéâtre où 50 % des étudiants portent une blouse rouge. Connaître la proportion ne te dit rien du nombre réel tant que tu ignores combien d’étudiants sont présents. C’est pourquoi le cours insiste : sur un bilan sanguin, la valeur absolue compte davantage que le pourcentage isolé."],"memory":"Polynucléaire = UN noyau polylobé. Et pour la formule : valeur absolue = leucocytes totaux × % / 100."},{"heading":"Changer d’adresse au fil de la vie","pages":"4","paragraphs":["L’usine du sang ne reste pas au même endroit pendant toute la vie. Au début, l’hématopoïèse primitive a lieu au cours du développement embryonnaire dans les îlots de Wolf-Pander. Le cours situe ensuite une phase foie–rate entre le 40e jour et le sixième mois.","À partir du sixième mois, la moelle osseuse prend progressivement le relais. Chez l’adulte, l’hématopoïèse habituelle se déroule dans les territoires médullaires décrits dans le cours : os plats et courts ainsi que certaines extrémités des os longs. Chez l’enfant, elle intéresse davantage d’os.","Le myélogramme, lui, revient à prélever un petit échantillon de l’atelier : aspiration médullaire, étalement sur lame, coloration MGG puis observation microscopique. La coloration associe éosine et bleu de méthylène ; le cours décrit notamment le rose-orangé de certaines protéines cytoplasmiques et le bleu-violet du matériel nucléaire."],"memory":"Mémo d’itinéraire : début embryonnaire → foie/rate → moelle osseuse. Myélogramme = prélèvement de moelle, pas simple prise de sang."},{"heading":"L’expérience des souris : prouver qu’une cellule peut tout reconstruire","pages":"4–5","paragraphs":["Imagine deux souris soumises à une irradiation détruisant leur tissu hématopoïétique. La seconde reçoit ensuite des cellules de moelle d’un donneur : son hématopoïèse peut être reconstituée. C’est le raisonnement de l’expérience historique de Till et McCulloch présentée dans le cours.","Les chercheurs observent des colonies spléniques appelées CFU-S et relient la quantité de moelle administrée aux résultats observés. L’expérience appuie l’existence de cellules capables de reconstituer durablement des lignées sanguines.","Ces cellules sont multipotentes dans le système sanguin : elles peuvent contribuer aux différentes cellules du sang. Elles ne sont pas totipotentes : elles ne génèrent pas tous les tissus de l’organisme."],"memory":"Multipotente = plusieurs destins sanguins. Totipotente = capacité beaucoup plus large. Ne confonds pas les deux."},{"heading":"Le quartier général : les quatre pouvoirs des CSH","pages":"5","paragraphs":["Une CSH est rare, indifférenciée et impossible à identifier simplement par la morphologie. Le cours signale la présence du marqueur CD34 et insiste sur quatre propriétés : autorenouvellement, multipotence, quiescence et migration.","L’autorenouvellement entretient le stock : une cellule mère peut produire une cellule qui reste souche, tandis qu’une autre s’engage vers la différenciation. La multipotence explique la diversité des lignées sanguines qui suivront.","La quiescence correspond à une cellule qui attend en G0 une grande partie de son temps. Ce repos aide à préserver le compartiment souche, et le cours souligne les enjeux face à certains traitements cytotoxiques.","Enfin, le homing est son GPS : après mobilisation puis passage dans le sang, les cellules souches peuvent rejoindre la moelle osseuse. C’est un principe important pour comprendre la greffe de CSH."],"memory":"Mémo « A–M–Q–H » : Auto-renouvellement, Multipotence, Quiescence, Homing. A garde le stock, M diversifie, Q protège, H ramène à la moelle."},{"heading":"La chaîne de production : 4 compartiments à ne plus confondre","pages":"5–7","paragraphs":["Voici le plan de l’usine. Premier étage : les cellules souches, qui conservent la capacité de s’auto-renouveler. Deuxième étage : les progéniteurs, déjà engagés dans une orientation de lignée. Troisième étage : les précurseurs, reconnaissables au microscope et capables de nombreuses divisions de maturation. Quatrième étage : les cellules matures fonctionnelles.","Le choix de filière survient chez les progéniteurs : le cours distingue un versant lymphoïde (CFU-L) et un versant myéloïde (CFU-GEMM). Ces progéniteurs acquièrent des marqueurs de lignée et peuvent former des colonies dans un milieu semi-solide. Le cours précise qu’ils ressemblent encore morphologiquement aux CSH.","Les précurseurs, eux, deviennent identifiables par leurs caractéristiques morphologiques. Leur mission n’est plus de conserver indéfiniment le stock souche : ils se multiplient, effectuent plusieurs mitoses selon la lignée, puis maturent.","En avançant, la cellule tend à diminuer de taille ; la chromatine se condense et le nucléole disparaît. Selon la filière : apparition de granulations et de lobes nucléaires, perte du noyau avec synthèse d’hémoglobine, ou phénomènes particuliers de la lignée plaquettaire."],"memory":"Chaîne : **CSH → progéniteur → précurseur → mature**. Stock → choix de lignée → amplification et maturation → fonction."},{"heading":"Trois filières, trois transformations spectaculaires","pages":"7–8","paragraphs":["Dans la filière érythrocytaire, le proérythroblaste est un précurseur immature. Au fil de la maturation, la cellule se réduit et expulse son noyau. Le réticulocyte est l’étape immédiatement antérieure au globule rouge mature ; il garde des traces d’ARN détectables selon les méthodes décrites.","Le cours utilise les réticulocytes comme indicateur de la réponse médullaire : devant une anémie, en trouver ou non aide à réfléchir à la capacité de régénération. Attention toutefois : l’interprétation complète d’un patient ne se réduit jamais à un seul élément biologique.","Dans la granulopoïèse, le myéloblaste évolue vers les granulocytes ; le cours mentionne environ 7 à 10 jours pour les neutrophiles. Dans certaines situations, des formes plus immatures peuvent apparaître dans le sang, ce que le cours appelle myélémie.","Enfin, le mégacaryocyte ressemble à une fabrique géante : il libère des fragments de cytoplasme qui deviennent les plaquettes. Le mécanisme d’endomitose est caractéristique de sa maturation."],"memory":"Mémo visuel : GR = expulse le noyau ; neutrophile = granulations + noyau lobé ; plaquette = fragment de mégacaryocyte."},{"heading":"Les ordres de fabrication : facteurs de transcription et de croissance","pages":"8","paragraphs":["Dans cette usine, il existe deux types d’instructions complémentaires. Les facteurs de transcription règlent les programmes génétiques : ils activent ou répriment des gènes, orientant l’identité et la différenciation des cellules.","Les facteurs de croissance sont plutôt des messages reçus par des récepteurs : ils favorisent notamment survie, multiplication et maturation. Le cours distingue des facteurs multipotents, de promotion et restreints selon le niveau de la chaîne sur lequel ils interviennent.","Deux noms méritent un éclairage particulier : l’EPO pour la lignée érythrocytaire, et le G-CSF pour la production de neutrophiles. Le cours évoque aussi un rôle de l’IL-6 dans le contexte inflammatoire et la production plaquettaire.","Si un collègue te dit « un facteur de transcription et l’EPO sont exactement la même chose », tu peux expliquer la différence : l’un module l’expression de gènes ; l’autre est présenté dans ce cours comme un signal agissant via son récepteur."],"memory":"Transcription = programme de gènes ; croissance = message via récepteur. EPO → érythrocytes ; G-CSF → neutrophiles."},{"heading":"La niche médullaire : plus qu’un simple bâtiment","pages":"9","paragraphs":["La chaîne hématopoïétique ne fonctionne pas dans le vide. Le cours appelle niche hématopoïétique le micro-environnement médullaire qui accueille et soutient ces cellules.","Cette niche protège les CSH contre certains stress, fournit des signaux par des facteurs de croissance et permet des interactions d’adhérence. Elle joue donc plusieurs rôles : abriter, nourrir, guider et réguler.","Dernière image à garder : une petite équipe de CSH ne suffit pas. Il lui faut une réserve entretenue, des filières de spécialisation, des précurseurs amplificateurs, des messages de régulation et un environnement protecteur. C’est l’ensemble qui produit le renouvellement du sang."],"memory":"Le triptyque de la niche : protection + facteurs de croissance + adhérence."}],"qcm":[{"q":"Dans le cours, l’hématopoïèse désigne quoi ?","choices":["La fabrication et le renouvellement régulé des cellules sanguines","La dégradation des os longs","La coagulation seule","L’élimination des lymphocytes seulement"],"answer":0,"why":"Le cours définit l’hématopoïèse comme la production continue et régulée de différentes cellules du sang.","pages":"2","topic":"Fondations"},{"q":"À partir de quel type de cellule se forment les lignées sanguines ?","choices":["Le globule rouge mature","La cellule souche hématopoïétique","Le lymphocyte mature","La plaquette"],"answer":1,"why":"La CSH se situe en amont des différents compartiments de différenciation sanguine.","pages":"2","topic":"Fondations"},{"q":"Quel élément est quantitativement le plus visible sur un frottis sanguin normal ?","choices":["Les basophiles","Les mégacaryocytes","Les hématies","Les monocytes"],"answer":2,"why":"Le cours décrit les globules rouges comme majoritaires au microscope.","pages":"2","topic":"Cellules"},{"q":"Un polynucléaire est une cellule qui comporte...","choices":["Plusieurs noyaux indépendants","Toujours aucun noyau","Exclusivement deux noyaux","Un noyau unique pouvant présenter plusieurs lobes"],"answer":3,"why":"Le terme désigne ici le noyau polylobé, pas plusieurs noyaux.","pages":"3","topic":"Cellules"},{"q":"Quel groupe comporte uniquement les trois granulocytes du CM ?","choices":["Neutrophiles, éosinophiles, basophiles","Monocytes, plaquettes, lymphocytes","Hématies, monocytes, mégacaryocytes","Neutrophiles, hématies, lymphocytes"],"answer":0,"why":"Les neutrophiles, éosinophiles et basophiles constituent les trois groupes granulocytaires mentionnés.","pages":"3","topic":"Cellules"},{"q":"Selon le CM, quels leucocytes sont les plus grands dans le sang ?","choices":["Les érythrocytes","Les monocytes","Les plaquettes","Les basophiles"],"answer":1,"why":"La ronéo présente les monocytes comme les plus grandes cellules sanguines.","pages":"3","topic":"Cellules"},{"q":"Quel type de leucocyte représente 55 à 70 % des leucocytes chez l’adulte sain selon ce CM ?","choices":["Les monocytes","Les éosinophiles","Les neutrophiles","Les basophiles"],"answer":2,"why":"Le cours attribue 55 à 70 % aux neutrophiles dans la formule de référence présentée.","pages":"3","topic":"Cellules"},{"q":"Quel intervalle correspond aux lymphocytes chez l’adulte sain selon ce CM ?","choices":["0,5 à 1 %","1 à 4 %","55 à 70 %","20 à 40 %"],"answer":3,"why":"La fourchette donnée dans le cours pour les lymphocytes est 20 à 40 %.","pages":"3","topic":"Cellules"},{"q":"Les éosinophiles constituent environ...","choices":["1 à 4 % des leucocytes","55 à 70 % des leucocytes","20 à 40 % des leucocytes","50 à 80 % des leucocytes"],"answer":0,"why":"L’intervalle de la ronéo est 1 à 4 % pour les éosinophiles.","pages":"3","topic":"Cellules"},{"q":"Selon le CM, les basophiles représentent environ...","choices":["10 à 20 %","0,5 à 1 %","20 à 40 %","55 à 70 %"],"answer":1,"why":"Le cours donne 0,5 à 1 % pour les basophiles.","pages":"3","topic":"Cellules"},{"q":"Selon le CM, les monocytes représentent environ...","choices":["55 à 70 %","20 à 40 %","2 à 8 %","0,5 à 1 %"],"answer":2,"why":"La proportion indiquée est de 2 à 8 % chez l’adulte sain.","pages":"3","topic":"Cellules"},{"q":"Sur un hémogramme, quelle information le cours privilégie-t-il ?","choices":["Uniquement la proportion en pourcentage","La taille de la lame seule","Le volume du prélèvement médullaire","La valeur absolue des cellules"],"answer":3,"why":"Une proportion doit être interprétée avec le nombre total de leucocytes.","pages":"3","topic":"Cellules"},{"q":"Une formule affiche 8 G/L de leucocytes avec 25 % de lymphocytes : combien de lymphocytes ?","choices":["2 G/L","25 G/L","8 G/L","0,25 G/L"],"answer":0,"why":"Calcul : 8 × 25 / 100 = 2 G/L.","pages":"3","topic":"Calcul"},{"q":"Une formule affiche 12 G/L de leucocytes avec 60 % de neutrophiles : valeur absolue ?","choices":["12,6 G/L","7,2 G/L","72 G/L","0,6 G/L"],"answer":1,"why":"Calcul : 12 × 0,60 = 7,2 G/L.","pages":"3","topic":"Calcul"},{"q":"Quelle durée de vie moyenne des globules rouges est citée ?","choices":["1 à 3 jours","1 an","120 jours","7 jours"],"answer":2,"why":"La ronéo retient 120 jours pour les globules rouges.","pages":"3","topic":"Repères"},{"q":"Quelle durée de vie moyenne des plaquettes est citée ?","choices":["120 jours","1 à 3 mois","6 mois","7 jours"],"answer":3,"why":"La ronéo retient environ 7 jours pour les plaquettes.","pages":"3","topic":"Repères"},{"q":"Quelle durée de vie moyenne des neutrophiles est citée ?","choices":["1 à 3 jours","120 jours","7 mois","3 à 5 ans"],"answer":0,"why":"La ronéo donne 1 à 3 jours pour les neutrophiles.","pages":"3","topic":"Repères"},{"q":"Pourquoi l’hématopoïèse doit-elle être continue ?","choices":["Parce que les CSH disparaissent systématiquement en un jour","Parce que les cellules sanguines ont une durée de vie limitée","Parce que toutes les cellules matures se divisent sans arrêt","Parce que les globules rouges ont un noyau"],"answer":1,"why":"Les cellules sanguines sont remplacées régulièrement car elles vivent relativement peu longtemps.","pages":"3","topic":"Fondations"},{"q":"Où le cours situe-t-il la phase primitive embryonnaire de l’hématopoïèse ?","choices":["Uniquement dans le sternum","Dans les ganglions lymphatiques","Dans les îlots de Wolf-Pander","Dans le thymus adulte"],"answer":2,"why":"Le cours cite les îlots de Wolf-Pander pour la première période embryonnaire.","pages":"4","topic":"Localisation"},{"q":"Entre le 40e jour et le 6e mois, quels organes jouent un rôle majeur selon le CM ?","choices":["Thymus et cerveau","Peau et reins","Poumons et cœur","Foie et rate"],"answer":3,"why":"La ronéo décrit une phase de production hépato-splénique.","pages":"4","topic":"Localisation"},{"q":"À partir de quel moment la moelle devient-elle progressivement principale ?","choices":["À partir du 6e mois du développement","Dès la première semaine adulte","Seulement après 30 ans","Uniquement après la puberté"],"answer":0,"why":"La moelle osseuse prend progressivement le relais à partir du sixième mois.","pages":"4","topic":"Localisation"},{"q":"Quel examen prélève directement de la moelle osseuse ?","choices":["Une radiographie sans prélèvement","Le myélogramme","L’ECG","La spirométrie"],"answer":1,"why":"Le myélogramme consiste à aspirer des cellules médullaires pour les étudier.","pages":"4","topic":"Examen"},{"q":"Quel couple de colorants est décrit dans la coloration MGG ?","choices":["Éthanol et acétone","Hémoglobine et chlorure de sodium","Éosine et bleu de méthylène","Iode et fluorescéine"],"answer":2,"why":"Le cours cite l’éosine et le bleu de méthylène dans le May-Grünwald Giemsa.","pages":"4","topic":"Examen"},{"q":"Dans ce CM, la coloration bleue/violette du noyau est surtout attribuée...","choices":["À l’éosine seule","À l’EPO","Au G-CSF","Au bleu de méthylène"],"answer":3,"why":"Le bleu de méthylène est présenté comme colorant basique du matériel nucléaire.","pages":"4","topic":"Examen"},{"q":"Que démontre schématiquement l’expérience de Till et McCulloch ?","choices":["La reconstitution de l’hématopoïèse après apport médullaire","Le remplacement du sang par du sérum","L’absence de cellules souches","La production de plaquettes par le thymus"],"answer":0,"why":"Chez des souris irradiées, les cellules médullaires injectées permettent de reconstituer la production sanguine.","pages":"4","topic":"Expérience"},{"q":"Que signifie CFU-S dans le contexte de cette expérience ?","choices":["Cellules filtrantes du sternum","Unités formant des colonies dans la rate","Cellules finales urinaires du sérum","Facteurs de croissance uniquement"],"answer":1,"why":"Les colonies spléniques sont les colonies CFU-S présentées dans le cours.","pages":"4","topic":"Expérience"},{"q":"Dire qu’une CSH est multipotente signifie qu’elle peut...","choices":["Devenir uniquement un lymphocyte","Fabriquer directement l’os cortical","Engendrer plusieurs lignées de cellules sanguines","Produire toutes les cellules de tous les tissus de l’organisme"],"answer":2,"why":"La multipotence concerne la diversité des destins cellulaires sanguins.","pages":"5","topic":"CSH"},{"q":"Quelle expression est à éviter pour les CSH ?","choices":["Multipotentes","Capables de migration","Capables d’autorenouvellement","Totipotentes"],"answer":3,"why":"Les CSH ne sont pas totipotentes selon l’opposition formulée par le cours.","pages":"5","topic":"CSH"},{"q":"Quel marqueur de surface est signalé dans le cours pour les CSH ?","choices":["CD34","HbA1c","CRP","IgE"],"answer":0,"why":"CD34 est mentionné comme un marqueur associé au compartiment CSH.","pages":"5","topic":"CSH"},{"q":"Une caractéristique décrite des CSH est...","choices":["Leur absence complète de potentiel de différenciation","Leur rareté","Leur très grand nombre sur le frottis sanguin","Leur identification facile par la morphologie seule"],"answer":1,"why":"Le cours décrit un compartiment rare et difficile à reconnaître morphologiquement.","pages":"5","topic":"CSH"},{"q":"L’autorenouvellement des CSH permet principalement...","choices":["De transformer les plaquettes en globules rouges","De détruire les précurseurs","De conserver un stock de cellules souches","D’expulser le noyau de tous les leucocytes"],"answer":2,"why":"La division de CSH permet de renouveler le compartiment souche.","pages":"5","topic":"CSH"},{"q":"Le terme quiescence des CSH renvoie surtout...","choices":["À une division permanente en mitose","À une absence définitive de vitalité","À une maturation en globule rouge","À un repos cellulaire en phase G0"],"answer":3,"why":"Le cours évoque une proportion importante de temps passée en G0.","pages":"5","topic":"CSH"},{"q":"Après une greffe, quelle propriété aide les CSH à rejoindre la moelle ?","choices":["Le homing","L’endomitose","La polylobulation","L’hémolyse"],"answer":0,"why":"Le homing désigne la migration/retour vers la niche médullaire.","pages":"5","topic":"CSH"},{"q":"Quel est l’ordre des compartiments décrit dans le CM ?","choices":["CSH → cellules matures → progéniteurs → précurseurs","CSH → progéniteurs → précurseurs → cellules matures","Précurseurs → CSH → progéniteurs → cellules matures","Cellules matures → CSH → précurseurs → progéniteurs"],"answer":1,"why":"La progression en quatre étages est centrale dans le cours.","pages":"5","topic":"Compartiments"},{"q":"À quel niveau commence l’engagement dans une lignée ?","choices":["Dans les plaquettes circulantes","Au niveau des neutrophiles déjà matures","Chez les progéniteurs","Uniquement chez les hématies matures"],"answer":2,"why":"Le cours situe les premières étapes de différenciation irréversible au compartiment progéniteur.","pages":"6","topic":"Compartiments"},{"q":"Quel type de progéniteur est désigné CFU-L ?","choices":["Érythrocytaire exclusif","Mégacaryocytaire exclusif","Neutrophile mature","Lymphoïde"],"answer":3,"why":"Le CM indique CFU-L pour le progéniteur lymphoïde commun.","pages":"6","topic":"Compartiments"},{"q":"Quel type de progéniteur est désigné CFU-GEMM ?","choices":["Myéloïde commun","Lymphocyte T mature","Globule rouge circulant","Éosinophile mature"],"answer":0,"why":"CFU-GEMM renvoie au progéniteur myéloïde commun.","pages":"6","topic":"Compartiments"},{"q":"Dans quel milieu peut-on observer des colonies formées par les progéniteurs ?","choices":["Du liquide céphalorachidien exclusivement","Un milieu semi-solide","Du plasma sans cellules","Une lame de radiographie"],"answer":1,"why":"La capacité clonogénique en milieu semi-solide est une propriété des progéniteurs citée.","pages":"6","topic":"Compartiments"},{"q":"Quelle affirmation morphologique distingue surtout progéniteurs et précurseurs ?","choices":["Les précurseurs sont tous dépourvus de noyau","Les progéniteurs sont toujours visibles comme des plaquettes","Les précurseurs deviennent identifiables morphologiquement","Les progéniteurs ont tous des noyaux polylobés"],"answer":2,"why":"Le CM précise que les progéniteurs ressemblent encore aux CSH, tandis que les précurseurs deviennent reconnaissables.","pages":"7","topic":"Compartiments"},{"q":"Quelle capacité est perdue au niveau des précurseurs ?","choices":["La possibilité de se multiplier","La maturation","La réalisation de mitoses","L’autorenouvellement au sens du compartiment souche"],"answer":3,"why":"Les précurseurs ont perdu l’autorenouvellement mais peuvent réaliser plusieurs mitoses.","pages":"7","topic":"Compartiments"},{"q":"Au cours de la maturation, le rapport nucléo-cytoplasmique tend à...","choices":["Diminuer","Augmenter systématiquement","Rester exactement constant","S’annuler dès le premier progéniteur"],"answer":0,"why":"Le cours décrit une diminution du rapport nucléo-cytoplasmique.","pages":"7","topic":"Morphologie"},{"q":"Quelle évolution de la chromatine accompagne la maturation ?","choices":["Apparition systématique de plusieurs noyaux","Condensation de la chromatine","Dispersion définitive de l’ADN hors cellule","Augmentation de la taille du nucléole"],"answer":1,"why":"Le cours évoque condensation de la chromatine et disparition du nucléole.","pages":"7","topic":"Morphologie"},{"q":"Quel élément marque la maturation terminale de la lignée érythrocytaire ?","choices":["L’endomitose","L’acquisition d’un noyau polylobé","L’expulsion du noyau","L’apparition de granulations neutrophiles"],"answer":2,"why":"L’énucléation précède l’état de globule rouge mature.","pages":"7","topic":"Lignées"},{"q":"Le réticulocyte est...","choices":["Une plaquette immature nucléée","Un lymphocyte T issu du thymus","Un neutrophile totalement mature","Un globule rouge jeune ayant récemment expulsé son noyau"],"answer":3,"why":"Le cours situe le réticulocyte juste après l’énucléation de la lignée érythrocytaire.","pages":"7","topic":"Lignées"},{"q":"Quel élément résiduel permet d’identifier les réticulocytes avec une coloration adaptée ?","choices":["L’ARN","Une seconde membrane nucléaire","Les granulations basophiles","Le CD34 obligatoirement"],"answer":0,"why":"Le reste d’ARN est utilisé par le cours pour reconnaître les réticulocytes.","pages":"7","topic":"Lignées"},{"q":"En cas d’anémie, le dosage des réticulocytes renseigne surtout sur...","choices":["Le degré d’anticoagulation","La réponse de production médullaire","La saturation systématique en oxygène","La quantité de G-CSF uniquement"],"answer":1,"why":"Le taux de réticulocytes aide à apprécier la régénération de la lignée érythrocytaire.","pages":"7","topic":"Lignées"},{"q":"Quelle modification est caractéristique de la granulopoïèse ?","choices":["Fragmentation en plaquettes","Absence de maturation du noyau","Apparition de granulations et polylobulation du noyau","Énucléation systématique de tous les granulocytes"],"answer":2,"why":"La granulopoïèse s’accompagne d’une différenciation nucléaire et granulaire.","pages":"7","topic":"Lignées"},{"q":"Qu’appelle-t-on myélémie dans le cours ?","choices":["La disparition physiologique des globules rouges","La concentration absolue des monocytes","La formation de colonies CFU-S dans la rate","La présence de formes granulocytaires immatures dans le sang"],"answer":3,"why":"Le cours évoque l’apparition de myélocytes et autres formes immatures dans le sang.","pages":"8","topic":"Lignées"},{"q":"À partir de quelle cellule se forment les plaquettes ?","choices":["Du mégacaryocyte","Du réticulocyte","Du basophile mature","Du lymphocyte B"],"answer":0,"why":"Les plaquettes proviennent de fragments cytoplasmiques de mégacaryocytes.","pages":"8","topic":"Lignées"},{"q":"Quel phénomène particulier est cité dans la maturation mégacaryocytaire ?","choices":["Le homing","L’endomitose","L’expulsion d’un noyau de réticulocyte","La quiescence exclusive en G0"],"answer":1,"why":"La lignée plaquettaire est associée à des endomitoses.","pages":"7","topic":"Lignées"},{"q":"Un facteur de transcription agit principalement en...","choices":["Transportant les plaquettes","Bloquant tout récepteur membranaire","Modulant l’expression des gènes","Colorant les noyaux en violet"],"answer":2,"why":"Le cours décrit des activations/répressions de gènes par liaison à des séquences d’ADN.","pages":"8","topic":"Régulation"},{"q":"Les facteurs de croissance décrits agissent surtout via...","choices":["Un remplacement des chromosomes","Une coloration MGG","Une destruction universelle des progéniteurs","Une interaction avec des récepteurs cellulaires"],"answer":3,"why":"La signalisation par facteurs de croissance dépend de récepteurs.","pages":"8","topic":"Régulation"},{"q":"Quel facteur de croissance stimule l’érythropoïèse dans ce CM ?","choices":["L’EPO","Le G-CSF","Le bleu de méthylène","L’éosine"],"answer":0,"why":"L’EPO est citée pour stimuler la production de globules rouges.","pages":"8","topic":"Régulation"},{"q":"Quel facteur de croissance stimule la production de neutrophiles ?","choices":["L’hémoglobine","Le G-CSF","L’EPO","Le CD34"],"answer":1,"why":"Le G-CSF est présenté comme facteur stimulant la lignée neutrophile.","pages":"8","topic":"Régulation"},{"q":"Quel groupe de facteurs agit selon le cours au passage progéniteur → précurseur ?","choices":["Facteurs exclusivement nucléaires MGG","Facteurs restreints exclusivement","Facteurs de promotion","Facteurs multipotents"],"answer":2,"why":"Le cours distingue les facteurs de promotion pour la transition progéniteur/précurseur.","pages":"8","topic":"Régulation"},{"q":"Le micro-environnement médullaire est aussi nommé...","choices":["Polynucléaire","CFU-S","Myélémie","Niche hématopoïétique"],"answer":3,"why":"La niche comprend cellules de soutien et matrice extracellulaire autour des cellules hématopoïétiques.","pages":"9","topic":"Niche"},{"q":"Quelle fonction caractérise la niche médullaire ?","choices":["Protection des CSH et sécrétion de facteurs de croissance","Transformation immédiate des plaquettes en globules rouges","Production d’érythrocytes sans aucune cellule souche","Élimination de toute adhérence cellulaire"],"answer":0,"why":"La niche soutient les cellules et participe à leur régulation par facteurs et interactions adhésives.","pages":"9","topic":"Niche"},{"q":"Quel triptyque résume la niche selon ce CM ?","choices":["Érythrocytes, ECG, auscultation","Protection, croissance, adhérence","Bile, cortisol, insuline","Coloration, radiographie, chirurgie"],"answer":1,"why":"Les fonctions citées sont protection, sécrétion de facteurs et interactions adhésives.","pages":"9","topic":"Niche"}],"flashcards":[{"q":"Hématopoïèse : définition en une phrase ?","a":"Fabrication et renouvellement continu, régulé, des cellules sanguines.","pages":"2"},{"q":"Cellule commune à l’origine des lignées sanguines ?","a":"Cellule souche hématopoïétique (CSH).","pages":"2"},{"q":"3 populations observables avec un frottis sanguin ?","a":"Hématies, leucocytes, plaquettes.","pages":"2"},{"q":"Noyau d’un « polynucléaire » ?","a":"Un seul noyau, souvent polylobé.","pages":"3"},{"q":"Quels sont les trois granulocytes ?","a":"Neutrophiles, éosinophiles, basophiles.","pages":"3"},{"q":"Quelle cellule est décrite comme la plus grande cellule du sang ?","a":"Monocyte.","pages":"3"},{"q":"Repère neutrophiles du CM ?","a":"55–70 % des leucocytes de l’adulte sain dans le support.","pages":"3"},{"q":"Repère lymphocytes du CM ?","a":"20–40 % des leucocytes de l’adulte sain dans le support.","pages":"3"},{"q":"Repère éosinophiles du CM ?","a":"1–4 %.","pages":"3"},{"q":"Repère basophiles du CM ?","a":"0,5–1 %.","pages":"3"},{"q":"Repère monocytes du CM ?","a":"2–8 %.","pages":"3"},{"q":"Formule de concentration absolue d’une population ?","a":"Leucocytes totaux × pourcentage / 100.","pages":"3"},{"q":"10 G/L de leucocytes, 50 % neutrophiles = ?","a":"5 G/L de neutrophiles.","pages":"3"},{"q":"Durée de vie GR retenue dans le CM ?","a":"Environ 120 jours.","pages":"3"},{"q":"Durée de vie plaquettes retenue ?","a":"Environ 7 jours.","pages":"3"},{"q":"Durée de vie neutrophiles retenue ?","a":"Environ 1 à 3 jours.","pages":"3"},{"q":"Évolution des sites hématopoïétiques ?","a":"Embryon (îlots de Wolf-Pander) → foie/rate → moelle osseuse.","pages":"4"},{"q":"Qu’est-ce qu’un myélogramme ?","a":"Aspiration de moelle osseuse, étalement sur lame et examen microscopique.","pages":"4"},{"q":"Coloration MGG : deux colorants cités ?","a":"Éosine et bleu de méthylène.","pages":"4"},{"q":"Till et McCulloch : idée de l’expérience ?","a":"Après irradiation, des cellules médullaires injectées peuvent reconstituer l’hématopoïèse.","pages":"4"},{"q":"Signification de CFU-S ?","a":"Colony Forming Units — Spleen (colonies spléniques).","pages":"4"},{"q":"Multipotence d’une CSH ?","a":"Peut contribuer à plusieurs lignées de cellules sanguines.","pages":"5"},{"q":"CSH : quatre propriétés principales ?","a":"Autorenouvellement, multipotence, quiescence, migration (homing).","pages":"5"},{"q":"CSH : marqueur de surface cité ?","a":"CD34.","pages":"5"},{"q":"CSH : que signifie G0 ?","a":"État quiescent, hors du cycle actif de division.","pages":"5"},{"q":"CSH : que signifie homing ?","a":"Migration/retour vers le micro-environnement médullaire.","pages":"5"},{"q":"Quatre compartiments dans l’ordre ?","a":"CSH → progéniteurs → précurseurs → cellules matures.","pages":"5"},{"q":"CFU-L : orientation ?","a":"Lymphoïde.","pages":"6"},{"q":"CFU-GEMM : orientation ?", <script id="default-entrainements" type="application/json">{"schemaVersion":1,"revision":"2026-10-11-v07-enrichissement-sang-csh","disclaimer":"V0.7 : entraînements pédagogiques fictifs construits à partir des cours. Les dossiers cliniques sont des cas d’application ; ils ne correspondent pas à des annales authentiques. La banque de sémiologie reste exclusivement en QCM indépendants.","subjects":{"sang":{"qi":[{"question":"Quel compartiment se caractérise par la capacité d’autorenouvellement ?","options":["Cellules sanguines matures","Cellules souches hématopoïétiques","Plaquettes circulantes","Réticulocytes"],"correct":[1],"explanation":"Les CSH entretiennent leur pool grâce à l’autorenouvellement. Les cellules matures ont achevé leur différenciation.","page":"5","format":"QRU","id":"sang-qi-01"},{"question":"Dans quel ordre se déroule la différenciation hématopoïétique ?","options":["Précurseurs → CSH → cellules matures → progéniteurs","CSH → progéniteurs → précurseurs → cellules matures","CSH → précurseurs → progéniteurs → cellules matures","Progéniteurs → CSH → cellules matures → précurseurs"],"correct":[1],"explanation":"Le cours décrit quatre compartiments successifs, du plus indifférencié au plus mature.","page":"5","format":"QRU","id":"sang-qi-02"},{"question":"Quelle propriété des CSH permet leur retour vers la moelle après une greffe ?","options":["La polylobulation","L’endomitose","Le homing (migration)","La synthèse d’hémoglobine"],"correct":[2],"explanation":"La capacité de migration/homing permet aux CSH injectées dans le sang de rejoindre la moelle osseuse.","page":"5","format":"QRU","id":"sang-qi-03"},{"question":"Quels caractères correspondent au compartiment des précurseurs ?","options":["Reconnaissables morphologiquement","Multiplication importante","Autorenouvellement conservé","Maturation vers des cellules matures"],"correct":[0,1,3],"explanation":"Les précurseurs sont reconnaissables, se multiplient et maturent, mais ont perdu l’autorenouvellement.","page":"7","format":"QRM","id":"sang-qi-04"},{"question":"Quel facteur stimule particulièrement la production de neutrophiles ?","options":["EPO","G-CSF","Bleu de méthylène","Éosine"],"correct":[1],"explanation":"Le G-CSF stimule la production des polynucléaires neutrophiles ; l’EPO concerne surtout la lignée érythrocytaire.","page":"8","format":"QRU","id":"sang-qi-05"},{"question":"Quel est le rôle principal du micro-environnement médullaire ?","options":["Transporter l’oxygène","Soutenir, protéger et réguler les cellules hématopoïétiques","Remplacer les lymphocytes","Détruire tous les progéniteurs"],"correct":[1],"explanation":"La niche médullaire contribue à la protection des CSH, aux interactions adhésives et à la fourniture de facteurs de croissance.","page":"9","format":"QRU","id":"sang-qi-06"},{"question":"Quelles propositions concernant les progéniteurs sont exactes ?","options":["Ils ont commencé à s’engager dans une lignée","Ils peuvent former des colonies en milieu semi-solide","Ils sont toujours morphologiquement distincts des CSH","On distingue notamment des orientations lymphoïde et myéloïde"],"correct":[0,1,3],"explanation":"Les progéniteurs s’engagent dans des voies de différenciation, forment des colonies, mais restent morphologiquement proches des CSH.","page":"6","format":"QRM","id":"sang-qi-07"},{"question":"Une préparation présente 10 G/L de leucocytes dont 50 % de neutrophiles. Quelle est la concentration absolue des neutrophiles ?","options":["0,5 G/L","5 G/L","10 G/L","50 G/L"],"correct":[1],"explanation":"Valeur absolue = leucocytes totaux × proportion / 100, soit 10 × 50/100 = 5 G/L.","page":"3","format":"QRU","id":"sang-qi-08"},{"id":"sang-qi-09","question":"Quelles affirmations décrivent les CSH selon le CM ?","options":["Elles assurent des lignées sanguines variées","Elles sont rares et indifférenciées","Elles sont reconnaissables directement comme des neutrophiles matures","Elles peuvent s’autorenouveler"],"correct":[1,3,0],"explanation":"Les CSH sont rares, non identifiables par leur seule morphologie, et multipotentes.","page":"5","format":"QRM"},{"id":"sang-qi-10","question":"Quels éléments sont associés à la maturation des précurseurs ?","options":["Autorenouvellement maintenu sans limite","Diminution du rapport nucléo-cytoplasmique","Réduction de la taille cellulaire","Condensation de la chromatine"],"correct":[2,3,1],"explanation":"Le CM décrit diminution de taille et du rapport nucléocytoplasmique, avec condensation chromatinienne.","page":"7","format":"QRM"},{"id":"sang-qi-11","question":"Quels sites sont décrits comme ayant participé à l’hématopoïèse au cours de la vie ?","options":["Foie et rate","Moelle osseuse","Thymus seul tout au long de la vie","Îlots embryonnaires"],"correct":[3,0,1],"explanation":"Le cours décrit une succession de sites embryonnaires, hépato-spléniques puis médullaires.","page":"4","format":"QRM"},{"id":"sang-qi-12","question":"Parmi ces composants, lesquels sont des granulocytes ?","options":["Neutrophiles","Lymphocytes","Éosinophiles","Basophiles"],"correct":[0,2,3],"explanation":"Les trois types cités de granulocytes sont neutrophiles, éosinophiles et basophiles.","page":"3","format":"QRM"},{"id":"sang-qi-13","question":"Quelles propriétés du micro-environnement médullaire sont citées ?","options":["Énucléation systématique des lymphocytes","Protection des cellules souches","Interactions adhésives","Sécrétion de facteurs de croissance"],"correct":[1,2,3],"explanation":"La niche joue un rôle de soutien, de protection, d’adhérence et de signalisation.","page":"9","format":"QRM"},{"id":"sang-qi-14","question":"Quelle séquence est correcte ?","options":["Matures → CSH → progéniteurs → précurseurs","Précurseurs → progéniteurs → CSH → matures","CSH → progéniteurs → précurseurs → matures","CSH → précurseurs → matures → progéniteurs"],"correct":[2],"explanation":"C’est le plan des quatre compartiments de l’hématopoïèse.","page":"5","format":"QRU"},{"id":"sang-qi-15","question":"Quel est le marqueur de surface cité par le cours pour le compartiment CSH ?","options":["G-CSF","EPO","MGG","CD34"],"correct":[3],"explanation":"Le CM mentionne CD34 comme marqueur associé au compartiment souche.","page":"5","format":"QRU"},{"id":"sang-qi-16","question":"Quels éléments correspondent à la lignée érythrocytaire décrite ?","options":["Expulsion du noyau","Réticulocyte comme forme jeune","Synthèse d’hémoglobine","Polylobulation terminale du noyau"],"correct":[0,1,2],"explanation":"La lignée érythrocytaire perd son noyau, synthétise l’hémoglobine, puis passe par le stade réticulocyte.","page":"7","format":"QRM"},{"id":"sang-qi-17","question":"Une formule comporte 9 G/L de leucocytes et 40 % de lymphocytes. Quelle valeur absolue ?","options":["0,4 G/L","3,6 G/L","36 G/L","4 G/L"],"correct":[1],"explanation":"9 × 40 / 100 = 3,6 G/L.","page":"3","format":"QRU"},{"id":"sang-qi-18","question":"À quoi sert le homing ?","options":["Produire le bleu de méthylène","Supprimer tous les facteurs de croissance","Permettre le retour des CSH à la moelle","Transformer les réticulocytes en neutrophiles"],"correct":[2],"explanation":"Le homing est la capacité de migration/retour vers la niche médullaire.","page":"5","format":"QRU"},{"id":"sang-qi-19","question":"Quelles correspondances sont exactes selon le CM ?","options":["G-CSF — neutrophiles","Facteur de transcription — régulation des gènes","CD34 — colorant MGG","EPO — globules rouges"],"correct":[3,0,1],"explanation":"EPO et G-CSF stimulent des lignées différentes ; les facteurs de transcription régulent les programmes génétiques.","page":"8","format":"QRM"},{"id":"sang-qi-20","question":"Un prélèvement médullaire coloré au MGG sert principalement à...","options":["Observer des cellules de la moelle au microscope","Mesurer uniquement la pression artérielle","Remplacer systématiquement l’hémogramme","Identifier le fonctionnement du cortex cérébral"],"correct":[0],"explanation":"Le myélogramme prélève de la moelle pour observation après coloration.","page":"4","format":"QRU"}],"cases":[{"title":"Un hémogramme à interpréter","vignette":"Situation pédagogique fictive : l’hémogramme indique 10 G/L de leucocytes, dont 50 % de neutrophiles. Le clinicien cherche ensuite à comprendre le potentiel de régénération érythrocytaire.","questions":[{"question":"Combien de neutrophiles par litre cela représente-t-il ?","options":["5 G/L","50 G/L","0,5 G/L","10 G/L"],"correct":[0],"explanation":"10 × 50 % = 5 G/L. La valeur absolue importe davantage que le seul pourcentage.","page":"3","format":"QRU","id":"sang-dc-01-01"},{"question":"Pour apprécier la réponse de la moelle dans la lignée érythrocytaire, quel élément du cours est particulièrement informatif ?","options":["La proportion de basophiles","La présence de réticulocytes","La seule couleur du plasma","Le nombre de monocytes exclusivement"],"correct":[1],"explanation":"Les réticulocytes permettent d’apprécier la régénération érythrocytaire, car ils sont des globules rouges jeunes ayant expulsé leur noyau.","page":"7","format":"QRU","id":"sang-dc-01-02"},{"question":"Quel énoncé relie correctement une fonction et un facteur de croissance ?","options":["G-CSF : production des globules rouges","EPO : neutrophiles","G-CSF : neutrophiles","Éosine : croissance des plaquettes"],"correct":[2],"explanation":"Le G-CSF stimule les neutrophiles ; l’EPO stimule la production érythrocytaire.","page":"8","format":"QRU","id":"sang-dc-01-03"},{"question":"Quels stades sont situés en amont des cellules sanguines matures ?","options":["CSH","Progéniteurs","Précurseurs","Uniquement le plasma"],"correct":[0,1,2],"explanation":"Le modèle du cours distingue CSH, progéniteurs et précurseurs avant l’état mature.","page":"5","format":"QRM","id":"sang-dc-01-04"}],"id":"sang-dc-01"},{"id":"sang-dc-02","title":"Dans le laboratoire de l’hémogramme","vignette":"Situation pédagogique fictive : un étudiant reçoit une formule de 12 G/L de leucocytes avec 60 % de neutrophiles. Il doit interpréter la valeur absolue, puis proposer l’étape de raisonnement adaptée à la production sanguine.","questions":[{"id":"sang-dc-02-01","question":"Combien de neutrophiles sont présents en valeur absolue ?","options":["72 G/L","6 G/L","0,6 G/L","7,2 G/L"],"correct":[3],"explanation":"12 × 0,60 = 7,2 G/L.","page":"3","format":"QRU"},{"id":"sang-dc-02-02","question":"Pourquoi le pourcentage seul peut-il être insuffisant ?","options":["Il n’exprime pas le nombre absolu de cellules","Il est toujours égal au nombre de leucocytes","Il indique le taux d’EPO","Il mesure la concentration médullaire"],"correct":[0],"explanation":"La proportion doit être multipliée par le nombre total de leucocytes.","page":"3","format":"QRU"},{"id":"sang-dc-02-03","question":"Quel groupe représente les granulocytes selon le cours ?","options":["Lymphocytes","Neutrophiles","Éosinophiles","Basophiles"],"correct":[1,2,3],"explanation":"Neutrophiles, éosinophiles et basophiles forment les granulocytes.","page":"3","format":"QRM"},{"id":"sang-dc-02-04","question":"Pour examiner directement le compartiment médullaire, on réalise plutôt...","options":["Un dosage du Ki","Une spirométrie","Un myélogramme","Une auscultation seule"],"correct":[2],"explanation":"Un myélogramme consiste en une aspiration médullaire puis examen de cellules.","page":"4","format":"QRU"},{"id":"sang-dc-02-05","question":"Dans ce cours, quel facteur favorise la production de neutrophiles ?","options":["EPO","Éosine","Hémoglobine","G-CSF"],"correct":[3],"explanation":"Le G-CSF est associé à la lignée neutrophile.","page":"8","format":"QRU"}]},{"id":"sang-dc-03","title":"La réponse de la moelle osseuse","vignette":"Situation fictive d’apprentissage : devant une baisse d’hématies, on cherche à comprendre si la moelle fournit de nouveaux globules rouges. L’étudiant explore les étapes de maturation et les signaux de régulation, sans conclure sur le diagnostic d’un patient réel.","questions":[{"id":"sang-dc-03-01","question":"Quel paramètre du CM permet d’apprécier la régénération de la lignée érythrocytaire ?","options":["Basophiles uniquement","Nombre de ganglions","Réticulocytes","Neutrophiles uniquement"],"correct":[2],"explanation":"Les réticulocytes sont des globules rouges jeunes et aident à apprécier la production médullaire.","page":"7","format":"QRU"},{"id":"sang-dc-03-02","question":"Quelle caractéristique du réticulocyte est exacte ?","options":["Il conserve toujours deux noyaux","C’est un progéniteur CFU-L","Il produit des plaquettes","Il a expulsé son noyau"],"correct":[3],"explanation":"Le réticulocyte se situe après l’énucléation de la lignée érythrocytaire.","page":"7","format":"QRU"},{"id":"sang-dc-03-03","question":"Quels caractères de maturation érythrocytaire sont mentionnés ?","options":["Synthèse d’hémoglobine","Perte du noyau","Stade réticulocyte","Polylobulation terminale"],"correct":[0,1,2],"explanation":"La maturité érythrocytaire implique notamment hémoglobine et énucléation avant le stade mature.","page":"7","format":"QRM"},{"id":"sang-dc-03-04","question":"Quel facteur de croissance est cité pour stimuler la lignée érythrocytaire ?","options":["MGG","EPO","G-CSF","CD34"],"correct":[1],"explanation":"L’EPO est associée à l’érythropoïèse dans ce CM.","page":"8","format":"QRU"},{"id":"sang-dc-03-05","question":"Quels composants de la niche peuvent soutenir la production sanguine ?","options":["Interactions adhésives","Absence totale d’interactions","Cellules de soutien et matrice extracellulaire","Facteurs de croissance"],"correct":[2,3,0],"explanation":"La niche apporte soutien/protection, facteurs de croissance et adhérence.","page":"9","format":"QRM"}]}],"source":{"title":"Cellules souches et progéniteurs hématopoïétiques — Pr N. Duployez","url":"https://drive.google.com/file/d/13xkGlNOkar2aegeSMA5rLHEJt_NeEHwn/view"},"notice":"CM de Pr Duployez (9 pages). Exercices fictifs ; la simulation de tissu sanguin combine QI (QRU/QRM) et tions":["Les récepteurs sont tous identiques","Il faut sélectionner, multiplier et distribuer les clones pertinents","Elle n’utilise jamais de cellules","Elle précède les défenses innées"],"correct":[1],"explanation":"La réponse adaptative nécessite une expansion clonale et un acheminement vers les tissus.","page":"7","format":"QRU","id":"immuno-qi-06"},{"question":"Quelles propriétés sont attribuées à l’immunité innée ?","options":["Présence immédiate ou mobilisation rapide","Récepteurs relativement invariants","Mémoire spécifique durable","Réponse inflammatoire stéréotypée"],"correct":[0,1,3],"explanation":"L’innée est rapide et fondée sur des récepteurs limités et invariants ; le cours lui oppose l’absence de mémoire spécifique.","page":"7","format":"QRM","id":"immuno-qi-07"},{"question":"Lors d’une nouvelle exposition au même agent, quel mécanisme explique une réaction adaptative plus rapide ?","options":["L’absence de lymphocytes","Le recours aux cellules mémoire","Une multiplication plus lente","La disparition des récepteurs"],"correct":[1],"explanation":"La mémoire se met en place lors de la première réponse et facilite le rappel.","page":"6","format":"QRU","id":"immuno-qi-08"}],"cases":[{"title":"Une première rencontre, puis une seconde","vignette":"Situation fictive : une personne rencontre pour la première fois un agent infectieux. Une réaction rapide apparaît, puis une réponse spécifique se met en place. Plus tard, le même agent est rencontré à nouveau.","questions":[{"question":"Le premier mécanisme de défense rapide correspond surtout à :","options":["L’immunité innée","La mémoire adaptative déjà constituée","Une production de globules rouges","Une suppression de tous les lymphocytes"],"correct":[0],"explanation":"L’immunité innée agit presque immédiatement face à la première exposition.","page":"6","format":"QRU","id":"immuno-dc-01-01"},{"question":"Pourquoi la première réponse adaptative est-elle plus lente ?","options":["Les lymphocytes n’ont pas de récepteurs","Sélection et expansion des clones spécifiques","L’absence de circulation lymphatique","La rate détruit tous les antigènes"],"correct":[1],"explanation":"Il faut sélectionner puis multiplier les lymphocytes appropriés et les distribuer aux tissus.","page":"7","format":"QRU","id":"immuno-dc-01-02"},{"question":"Quels phénomènes rendent la seconde rencontre potentiellement plus efficace ?","options":["Présence de cellules mémoire","Réponse plus rapide des effecteurs spécifiques","Absence permanente d’immunité innée","Reconnaissance spécifique de l’agent déjà rencontré"],"correct":[0,1,3],"explanation":"La mémoire adaptative favorise une réponse spécifique plus rapide lors du rappel.","page":"6","format":"QRM","id":"immuno-dc-01-03"},{"question":"Quel ensemble correspond aux organes lymphoïdes secondaires décrits ?","options":["Moelle et thymus","Rate et ganglions","Cortex et thalamus","Moelle et foie adulte"],"correct":[1],"explanation":"La rate et les ganglions sont les principaux sites de rencontre avec l’antigène parmi les choix proposés.","page":"9","format":"QRU","id":"immuno-dc-01-04"}],"id":"immuno-dc-01"}],"source":{"title":"Organisation temporelle des acteurs de la réponse immunitaire — Pr Dubucquoi","url":"https://drive.google.com/file/d/1dov_OBPNiaf88QoRcLKr3U7mLj8283kP/view"},"notice":"Exercices pédagogiques fictifs issus du CM indiqué, et non annales authentiques. Couverture partielle : premier lot de mise en situation."},"bmct":{"qi":[{"question":"Quel paramètre représente l’affinité pour un récepteur dans le cours ?","options":["Ki","Durée de la consultation","Nombre de plaquettes","Volume du plasma"],"correct":[0],"explanation":"Le cours utilise notamment Ki comme indicateur de l’affinité ligand-récepteur.","page":"3","format":"QRU","id":"bmct-qi-01"},{"question":"À récepteur identique, un Ki plus faible signifie généralement :","options":["Une affinité plus élevée","Une affinité plus faible","Une activité intrinsèque nécessairement nulle","Une efficacité clinique toujours supérieure"],"correct":[0],"explanation":"Une plus faible concentration suffit pour occuper les récepteurs : l’affinité est donc plus élevée.","page":"3","format":"QRU","id":"bmct-qi-02"},{"question":"Quelle propriété caractérise un antagoniste neutre dans le modèle du cours ?","options":["Activité intrinsèque de 1","Activité intrinsèque de 0","Effet maximal certain","Ki systématiquement élevé"],"correct":[1],"explanation":"L’antagoniste neutre n’active pas le récepteur : son activité intrinsèque est nulle.","page":"4","format":"QRU","id":"bmct-qi-03"},{"question":"Quelles propositions concernant un agoniste partiel sont exactes ?","options":["Son effet maximal reste inférieur à celui d’un agoniste entier","Il peut avoir une forte affinité","Son Ki est forcément supérieur à celui de l’agoniste entier","L’activité intrinsèque n’atteint pas 1"],"correct":[0,1,3],"explanation":"L’efficacité intrinsèque et l’affinité ne sont pas interchangeables : un agoniste partiel peut être très affin.","page":"4","format":"QRM","id":"bmct-qi-04"},{"question":"Un antagoniste compétitif réversible est généralement qualifié de :","options":["Surmontable par plus d’agoniste","Toujours insurmontable","Agoniste entier","Agoniste inverse"],"correct":[0],"explanation":"L’augmentation de l’agoniste peut déplacer un antagoniste compétitif réversible au même site.","page":"5","format":"QRU","id":"bmct-qi-05"},{"question":"Quel mécanisme explique l’effet local de la lidocaïne décrit dans le cours ?","options":["Activation des récepteurs μ","Blocage de canaux sodiques voltage-dépendants","Stimulation de l’EPO","Augmentation des réticulocytes"],"correct":[1],"explanation":"Le cours décrit le blocage des canaux Na+ voltage-dépendants pour interrompre la transmission du message nociceptif.","page":"2","format":"QRU","id":"bmct-qi-06"},{"question":"Quelles voies/structures participent au parcours du message douloureux décrit ?","options":["Fibres sensitives périphériques","Corne postérieure médullaire","Thalamus puis cortex","Réduction immédiate du nombre de lymphocytes"],"correct":[0,1,2],"explanation":"Le message est transmis depuis la périphérie vers la moelle, puis les structures centrales telles que le thalamus et le cortex.","page":"2","format":"QRM","id":"bmct-qi-07"},{"question":"Quel type de molécule peut se lier au récepteur sans produire l’effet activateur d’un agoniste ?","options":["Antagoniste","Agoniste entier","Érythrocyte","Facteur de transcription"],"correct":[0],"explanation":"La liaison d’un antagoniste ne produit pas d’activité intrinsèque activatrice malgré son occupation du récepteur.","page":"4","format":"QRU","id":"bmct-qi-08"}],"cases":[{"title":"Deux ligands et un même récepteur","vignette":"Situation fictive de pharmacologie : deux substances A et B sont étudiées sur un même récepteur. Ki(A) = 1 unité et Ki(B) = 100 unités, dans les mêmes conditions. A ne produit cependant qu’un effet partiel à saturation.","questions":[{"question":"Laquelle a la plus grande affinité pour ce récepteur ?","options":["La substance A","La substance B","Elles ont forcément la même affinité","Le Ki ne renseigne jamais sur l’affinité"],"correct":[0],"explanation":"Plus le Ki est faible, plus l’affinité est élevée : A présente le Ki le plus faible.","page":"3","format":"QRU","id":"bmct-dc-01-01"},{"question":"L’effet partiel de A malgré la saturation illustre surtout :","options":["Une absence totale de liaison","Une activité intrinsèque inférieure à celle d’un agoniste entier","Une neutralisation par le plasma","L’impossibilité d’activer un récepteur"],"correct":[1],"explanation":"Un agoniste partiel peut occuper les récepteurs sans atteindre l’effet maximal d’un agoniste entier.","page":"4","format":"QRU","id":"bmct-dc-01-02"},{"question":"Quels paramètres doivent rester distincts pour interpréter A ?","options":["Affinité","Activité intrinsèque","Taille des globules rouges","Effet maximal possible"],"correct":[0,1,3],"explanation":"L’affinité décrit la liaison, l’activité intrinsèque et l’effet maximal décrivent l’activation fonctionnelle.","page":"3","format":"QRM","id":"bmct-dc-01-03"},{"question":"Un antagoniste compétitif réversible est ajouté. Quel moyen peut théoriquement surmonter son blocage ?","options":["Augmenter la concentration d’agoniste","Baisser systématiquement le Ki par un simple choix de dose","Supprimer le récepteur","Aucune modification ne peut jamais être efficace"],"correct":[0],"explanation":"Un antagoniste compétitif réversible peut être déplacé par augmentation de la concentration d’agoniste.","page":"5","format":"QRU","id":"bmct-dc-01-04"}],"id":"bmct-dc-01"}],"source":{"title":"Pharmacodynamie générale 1 — Pr Bordet","url":"https://drive.google.com/file/d/1cgejZpH73jyJlNGgglBbu_JP00FPmXV2/view"},"notice":"Exercices pédagogiques fictifs issus du CM indiqué, et non annales authentiques. Couverture partielle : premier lot de mise en situation."}}}</script>
<script>
(()=>{'use strict';
const basePath='./';const STORE='med2.semestre1.etat.v1';const OVERRIDE='med2.semestre1.catalogue.import.v1';
const app=document.getElementById('app'), modal=document.getElementById('modal-root');
const fallback=id=>JSON.parse(document.getElementById(id).textContent);
let cat=fallback('default-catalogue'), exams=fallback('default-examens').exams, modes=fallback('default-modalites');
let trainingData=fallback('default-entrainements'); let training={subject:null,mode:'qi',index:0,selected:[]}; let pedagogie=fallback('default-pedagogie'); let learning={id:null,tab:'story',card:0,shown:false,quizPage:0};
const lesson=id=>pedagogie.lessons?.[id];
const defaultState={pace:14,view:'home',selectedSubject:null,activeDay:0,cycleDone:[],memory:{},history:[],currentMission:null,expanded:false};
let st=(()=>{try{return {...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{return {...defaultState}}})();
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(st))}catch(e){alert('La mémoire locale est pleine. Exporte ta progression depuis Suivi.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const diff=date=>Math.ceil((new Date(date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);
const shortDate=date=>new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const subjects=()=>cat.subjects||[];
const syncCounts=()=>{for(const s of subjects()){s.cmCount=cat.resources.filter(r=>r.subject===s.id&&r.kind==='cm').length;s.annaleCount=cat.resources.filter(r=>r.subject===s.id&&r.kind==='annale').length;}};
syncCounts();
const subject=id=>subjects().find(s=>s.id===id)||{name:id,date:'2099-01-01'};

const evalOf=id=>modes.subjectModes?.[id]||null;
const examFormats=id=>{const m=evalOf(id);return m?m.components.map(c=>c.label+(c.percent===null?'':` (${c.percent} %)`)).join(' · '):'Modalités à préciser';};
function evalInfo(id){const m=evalOf(id);if(!m)return '<span class="tag warn">Modalités en attente</span>';
 const coef=String(m.coefficient).replace('.',',');
 return `<div class="eval-info"><span class="tag">Coef. ${esc(coef)} · ${esc(m.points)} pts</span><span class="tiny">${esc(m.duration||'Durée selon Moodle')} · ${esc(m.ects)} ECTS</span><p style="margin:6px 0 0;font-size:13px"><strong>Format :</strong> ${esc(examFormats(id))}</p></div>`;}

const cms=()=>cat.resources.filter(r=>r.kind==='cm');
const gradeOf=id=>st.memory[id]||{count:0,step:0};
const nextExam=()=>[...exams].filter(x=>diff(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];
function urg(subjectId){const e=exams.filter(x=>x.subject===subjectId&&diff(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];if(!e)return 0.5;let d=diff(e.date);return d<=7?8:d<=21?5:d<=45?3:d<=75?1.5:1;}
function rank(r){const m=gradeOf(r.id);let due=m.nextDue&&m.nextDue<=today()?6:0;const lag=m.count?Math.max(0,5-m.step):2;return urg(r.subject)*(10+Math.max(0,(evalOf(r.subject)?.coefficient||1)-1)*1.5)+due+lag+(m.lastScore==='forgot'?12:0)}
function dueRecalls(){return cms().filter(r=>st.memory[r.id]?.nextDue&&st.memory[r.id].nextDue<=today()).sort((a,b)=>rank(b)-rank(a));}
function cycles(){return cms().filter(r=>!st.cycleDone.includes(r.id));}
function missionBatch(){const active=cms();if(!active.length)return [];
 let pending=cycles();const left=Math.max(1,st.pace-(st.activeDay%st.pace));const num=Math.max(1,Math.ceil(pending.length/left));
 // Blend subjects instead of showing a wall of the same subject; exam urgency still controls order.
 const bins={};for(const r of pending){(bins[r.subject]??=[]).push(r)}
 for(const arr of Object.values(bins))arr.sort((a,b)=>rank(b)-rank(a)||a.id.localeCompare(b.id));
 const subjectOrder=Object.keys(bins).sort((a,b)=>(urg(b)*(1+0.08*((evalOf(b)?.coefficient||1)-1)))-(urg(a)*(1+0.08*((evalOf(a)?.coefficient||1)-1)))||a.localeCompare(b));
 const chosen=[];while(chosen.length<num){let added=0;for(const key of subjectOrder){if(bins[key].length){chosen.push(bins[key].shift());added++;if(chosen.length>=num)break;}}if(!added)break;}
 return chosen;
}
function stage(r){const m=gradeOf(r.id);return !m.count?'Découverte':m.lastScore==='forgot'?'Renforcement':'Consolidation'}
const bar=(n,d)=>`<div class="progressbar"><span style="width:${Math.max(0,Math.min(100,100*n/(d||1)))}%"></span></div>`;
function mast(){const e=nextExam();return `<header class="masthead"><div class="shell"><div class="mastline"><div class="logo">MED<em>2</em> <span style="font-weight:400;color:#c6dbed;font-size:14px">/ Semestre 1</span></div><span class="pill">Modules · V0.7</span></div><div class="hero"><div><small>Ton prochain examen</small><h1>${e?esc(e.title):'Planning terminé'}</h1><small>${e?shortDate(e.date):'Toutes les échéances sont passées'}</small></div><div class="days num">${e?diff(e.date):'✓'}<small>${e?'jours restants':''}</small></div></div><div class="head-actions"><span class="chip">📚 ${cms().length} CM indexés</span><span class="chip">🎯 ${exams.length} épreuves</span><span class="chip">🔁 Rythme ${st.pace} jours</span><span class="chip">✨ ${Object.keys(pedagogie.lessons||{}).length} module${Object.keys(pedagogie.lessons||{}).length===1?'':'s'} pédagogique${Object.keys(pedagogie.lessons||{}).length===1?'':'s'}</span></div></div></header>`}
function nav(){const v=[['home','⌂','Accueil'],['library','▤','Cours'],['missions','◎','Missions'],['exams','▦','Examens'],['progress','▥','Suivi']];return `<nav class="nav" aria-label="Navigation principale"><div class="navinner">${v.map(([id,icon,l])=>`<button type="button" data-action="nav" data-id="${id}" aria-label="${l}" class="${st.view===id?'active':''}"><span class="symbol">${icon}</span>${l}</button>`).join('')}</div></nav>`}
function home(){const e=nextExam();const done=cms().filter(r=>gradeOf(r.id).count>0).length;const next=missionBatch();return `${mast()}<main class="shell"><section class="section tally"><div class="panel"><strong>${subjects().length}</strong><span>Matières</span></div><div class="panel"><strong>${cms().length}</strong><span>CM répertoriés</span></div><div class="panel"><strong>${cat.resources.filter(r=>r.kind==='annale').length}</strong><span>Annales</span></div></section><section class="section"><div class="panel" style="background:linear-gradient(125deg,#e6f1ff,#eefbf5)"><div class="row between"><div><span class="tag">Missions du Jour</span><h2 style="margin:12px 0 5px">Un défi à la fois</h2><p class="subtle" style="margin:0">${next.length} nouveaux CM proposés pour le passage actif nº ${st.activeDay+1}. Les rappels échus viennent en priorité.</p></div><span style="font-size:33px">⚡</span></div><div style="margin-top:15px"><button class="btn" data-action="nav" data-id="missions">Voir mes missions →</button></div></div></section><section class="section"><div class="panel"><span class="tag green">NOUVEAU · V0.6</span><h2 style="margin:11px 0 5px">Entraînements au format d'examen</h2><p class="subtle">Sémiologie : QCM individuels. Tissu sanguin, immunologie et BMCT : questions individuelles (QRU/QRM) et premiers dossiers cliniques, tous expliqués.</p><div class="train-cta">${['semio','sang','immuno','bmct'].map(key=>`<button class="btn secondary small" data-action="training-open" data-id="${key}">${esc(subject(key).name)} →</button>`).join('')}</div></div></section><section class="section"><div class="row between"><h2>Progression personnelle</h2><span class="tag green">${done}/${cms().length}</span></div>${bar(done,cms().length)}<p class="subtle">Le suivi commence dès que tu autoévalues une notion. Les supports de cours sont pour l'instant indexés, pas encore réécrits.</p></section><section class="section"><h2>Priorités par échéance</h2><div class="stack">${[{date:'2026-11-04',end:'2026-11-04',name:'4 novembre · Premier bloc'},{date:'2026-12-15',end:'2026-12-16',name:'15–16 décembre · Deuxième bloc'},{date:'2027-01-05',end:'2027-01-06',name:'5–6 janvier · Troisième bloc'}].map(w=>{const xs=exams.filter(x=>x.date>=w.date&&x.date<=w.end);return `<div class="panel"><div class="row between"><strong>${w.name}</strong><span class="tag ${diff(w.date)<25?'warn':''}">${diff(w.date)>=0?'J−'+diff(w.date):'Passé'}</span></div><p class="subtle" style="margin-bottom:0">${xs.map(x=>esc(x.title)).join(' · ')}</p></div>`}).join('')}</div></section><section class="section"><div class="notice">🔒 <strong>Version fondation :</strong> les sources sont recensées sans copier les PDF dans ce site public. Les leçons narratives et les entraînements validés arriveront par matière. L'application de sémiologie précédente reste indépendante.</div><div class="actions" style="margin-top:11px"><button class="btn secondary" data-action="open-semio">Ouvrir Sémio MED2 ↗</button><button class="btn ghost" data-action="settings">Paramètres et mises à jour</button></div></section></main>`}
let query='';
function library(){const q=query.toLowerCase();let list=subjects().filter(s=>s.name.toLowerCase().includes(q)||cat.resources.some(r=>r.subject===s.id&&r.title.toLowerCase().includes(q)));const current=st.selectedSubject&&subject(st.selectedSubject);return `${mast()}<main class="shell"><div class="topbar"><h1>Bibliothèque</h1><span class="tag">${subjects().length} matières</span></div><p class="subtle">Catalogue vivant de tes supports. Les titres viennent du Drive; aucun PDF privé n’est inclus dans le site.</p><input class="search" id="search" placeholder="Rechercher une matière ou un cours..." value="${esc(query)}" aria-label="Rechercher les cours"><section class="section subject-list">${list.map(s=>`<div class="panel coursecard"><div><h3>${esc(s.name)}</h3><p class="subtle" style="margin:0">${s.cmCount} CM · ${s.annaleCount} fichiers d’annales</p><span class="tag ${s.cmCount?'green':'warn'}" style="margin-top:8px">${s.cmCount?'Sources indexées':'À compléter'}</span></div><button class="btn secondary small" data-action="subject" data-id="${s.id}">Voir →</button></div>`).join('')||'<p>Aucun résultat.</p>'}</section>${current&&current.id?subjectView(current):''}</main>`}
