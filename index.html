  justify-content: space-between;
  gap: var(--s2);
  margin-top: var(--s6);
  padding-top: var(--s4);
  border-top: 1px solid var(--line);
}
.chapter-recall {
  margin: var(--s3) 0;
  padding: var(--s4);
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.chapter-recall h3 {
  font-size: 17px;
  margin-bottom: 6px;
}
.chapter-answer {
  margin-top: var(--s3);
  padding: 12px 14px;
  border-radius: var(--r);
  border-left: 4px solid var(--ok);
  background: var(--ok-soft);
}

/* ---------- Cartes mémoire ---------- */
.deck {
  margin: var(--s3) 0;
}
.deck-top {
  display: flex;
  justify-content: space-between;
  gap: var(--s3);
  font-size: 14px;
  font-weight: 650;
}
.deck-progress {
  margin: var(--s2) 0 var(--s3);
  padding: 0 !important;
}
.flashcard {
  display: flex;
  flex-direction: column;
  min-height: 240px;
  padding: var(--s5);
  border-radius: var(--r-xl);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--sh-2);
}
.reader .flashcard {
  background: var(--surface-2);
}
.fc-label {
  font-size: 12.5px;
  font-weight: 750;
  color: var(--muted);
  margin-bottom: 6px !important;
}
.fc-q {
  font-size: calc(var(--rs, 18px) + 2px);
  font-weight: 700;
  line-height: 1.45;
  text-wrap: pretty;
}
.fc-sep {
  height: 1px;
  margin: var(--s4) 0;
  background: var(--line);
}
.fc-a {
  font-size: var(--rs, 18px);
  line-height: 1.6;
  color: var(--ink);
  animation: viewIn 0.24s var(--ease) both;
}
.fc-src {
  margin-top: auto !important;
  padding-top: var(--s4);
  font-size: 13px;
  color: var(--muted);
}
.deck-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s2);
  margin-top: var(--s3);
}
.deck-actions .btn.block {
  grid-column: 1 / -1;
}
.deck-actions .btn {
  min-height: 50px;
}
.deck-actions [data-id="again"] {
  background: var(--warn-soft);
  color: var(--warn);
}
.deck-actions [data-id="good"] {
  background: var(--ok);
  color: var(--surface);
}
.deck-nav {
  display: flex;
  justify-content: space-between;
  margin-top: var(--s2);
}
kbd.hint {
  margin-left: 4px;
  border-color: currentColor;
  background: transparent;
  color: inherit;
  opacity: 0.7;
}
@media (hover: none) {
  kbd.hint {
    display: none;
  }
}
.flash-report {
  margin: var(--s3) 0;
}
.report-head h3 {
  margin-top: var(--s2);
  font-size: 20px;
}
.flash-result {
  display: flex;
  align-items: center;
  gap: var(--s4);
  margin: var(--s4) 0 var(--s2);
  padding: var(--s4);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.flash-result strong {
  font-size: 34px;
  font-weight: 800;
  line-height: 1;
}
.flash-result span {
  font-size: 15px;
  color: var(--ink-2);
}
.flash-report > h3 {
  margin: var(--s5) 0 var(--s3);
  font-size: 17px;
}
.flash-review-item {
  margin: var(--s2) 0;
  padding: 12px 14px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  border-left: 4px solid var(--warn);
  background: var(--surface);
}
.flash-review-item > strong {
  display: block;
  margin: 2px 0 4px;
  font-size: 15.5px;
  line-height: 1.45;
}
.flash-review-item > p:not(.fc-label) {
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink-2);
  margin-bottom: var(--s2);
}

/* ---------- QROC à mots-clés ---------- */
.qroc-intro {
  margin: var(--s3) 0;
}
.qroc-intro > p.muted {
  font-size: 14.5px;
  line-height: 1.6;
}
.qroc-card {
  margin: 0 0 var(--s3);
  padding: 14px var(--s4);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--sh-1);
}
.reader .qroc-card {
  background: var(--surface-2);
  box-shadow: none;
}
.qroc-card.good {
  border-color: var(--ok-line);
  box-shadow: inset 4px 0 0 var(--ok);
}
.qroc-card.bad {
  border-color: var(--ko-line);
  box-shadow: inset 4px 0 0 var(--ko);
}
.qroc-q {
  margin: 10px 0 var(--s3);
  font-size: 16.5px;
  font-weight: 650;
  line-height: 1.45;
}
.qroc-row {
  display: flex;
  gap: var(--s2);
}
.qroc-input {
  flex: 1;
  min-width: 0;
  min-height: 46px;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 1.5px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
}
.qroc-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-line);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.qroc-row .btn {
  flex: none;
}
.qroc-given,
.qroc-expected {
  font-size: 15px;
  line-height: 1.5;
}
.qroc-verdict {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 6px 0 !important;
  font-weight: 750;
}
.qroc-card.good .qroc-verdict {
  color: var(--ok);
}
.qroc-card.bad .qroc-verdict {
  color: var(--ko);
}
.qroc-keys {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: var(--s2) 0;
  padding: 0;
  list-style: none;
}
.qroc-keys li {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: var(--pill);
  font-size: 13.5px;
  font-weight: 700;
}
.qroc-keys li.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.qroc-keys li.ko {
  background: var(--ko-soft);
  color: var(--ko);
}
.qroc-why {
  margin: 6px 0 2px !important;
  line-height: 1.55;
}

/* ---------- Évaluation du cours ---------- */
.final-head {
  margin: var(--s4) 0;
  padding: var(--s4);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.final-head h2 {
  margin: var(--s3) 0 4px;
  font-size: calc(var(--rs, 18px) + 4px);
}
.final-head p.muted {
  font-size: 14.5px;
  line-height: 1.55;
}
.final-head .seg-progress {
  margin-top: var(--s3);
  padding: 0;
}
.final-score {
  font-size: 15px;
  color: var(--ink-2);
}
.final-score b {
  font-size: 24px;
  font-weight: 800;
  color: var(--ok);
}
.final-tip {
  margin: var(--s3) 2px !important;
}
.breakdown {
  margin: 0 0 var(--s4);
  padding: 4px var(--s4);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
}
.breakdown > summary {
  padding: 10px 0;
  font-weight: 750;
}
.breakdown ul {
  list-style: none;
  padding: 0 0 6px;
  margin: 0;
}
.breakdown li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(110px, 34%) 72px;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
  font-size: 14px;
}
.bd-name {
  min-width: 0;
  line-height: 1.35;
}
.bd-bar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
}
.bd-bar b {
  font-size: 13px;
}
.bd-ok {
  justify-self: center;
  color: var(--ok);
}
.breakdown li .btn {
  justify-self: end;
}

/* ---------- Rédaction ---------- */
.ssh-writing {
  margin: var(--s3) 0;
  padding: var(--s4);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.ssh-writing > p.muted {
  margin-top: 6px;
}
.ssh-writing h3 {
  margin: var(--s3) 0;
  font-size: 18px;
  line-height: 1.4;
}
.ssh-draft {
  display: block;
  width: 100%;
  min-height: 180px;
  padding: 12px 14px;
  border-radius: var(--r);
  border: 1.5px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.6;
  resize: vertical;
}
.ssh-draft:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-line);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.ssh-answer {
  margin-top: var(--s4);
  padding: 14px var(--s4);
  border-radius: var(--r);
  border: 1px solid var(--ok-line);
  background: var(--ok-soft);
}
.ssh-answer h4 {
  margin: 6px 0;
  font-size: 15.5px;
  color: var(--ok);
}
.ssh-answer ul {
  padding-left: 1.2em;
}

/* ---------- Entraînement au format d'examen ---------- */
.modal.exam {
  display: flex;
  flex-direction: column;
  background: var(--canvas) !important;
}
.exam-top {
  position: sticky;
  top: 0;
  z-index: 6;
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 44px;
  align-items: center;
  gap: 6px;
  padding: calc(6px + env(safe-area-inset-top)) max(8px, calc((100% - 760px) / 2)) 4px;
  background: var(--canvas);
  background: color-mix(in srgb, var(--canvas) 94%, transparent);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}
.exam-top-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  line-height: 1.25;
  text-align: center;
}
.exam-top-title span {
  max-width: 100%;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.exam-top-title b {
  font-size: 16px;
  font-weight: 750;
}
.seg-progress {
  display: flex;
  gap: 3px;
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 4px 16px 10px;
}
.modal.exam > .seg-progress {
  position: sticky;
  top: calc(54px + env(safe-area-inset-top));
  z-index: 5;
  background: var(--canvas);
  background: color-mix(in srgb, var(--canvas) 94%, transparent);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}
.seg-progress i {
  flex: 1;
  height: 5px;
  border-radius: 5px;
  background: var(--line-2);
  transition: background-color var(--t);
}
.seg-progress i.s-ok {
  background: var(--ok);
}
.seg-progress i.s-ko {
  background: var(--ko);
}
.seg-progress i.s-ans {
  background: var(--accent);
}
.seg-progress i.s-cur {
  transform: scaleY(1.7);
}
.seg-progress i.s-cur:not(.s-ok):not(.s-ko):not(.s-ans) {
  background: var(--ink);
}
.seg-progress.continuous {
  display: block;
}
.exam-body {
  flex: 1;
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 4px var(--s4) var(--s5);
}
.exam-controls {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin: 4px 0 var(--s2);
}
.exam-controls .seg {
  flex: 1;
}
.exam-controls .icon-btn {
  border: 1px solid var(--line-2);
  background: var(--surface);
}
.exam-controls .icon-btn[aria-expanded="true"] {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent);
}
.exam-options {
  margin: 0 0 var(--s3);
  padding: 4px var(--s4) var(--s3);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
}
.exam-options .btn {
  margin-top: var(--s2);
}
.train-stat {
  margin: var(--s2) 2px var(--s3) !important;
  font-size: 14px;
  color: var(--muted);
}
.train-vignette {
  margin: 0 0 var(--s3);
  padding: 4px var(--s4) var(--s3);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  border-left: 4px solid var(--violet);
  background: var(--surface);
}
.train-vignette > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  font-weight: 750;
}
.train-vignette > summary .ico {
  color: var(--violet);
}
.train-vignette p {
  font-size: 16px;
  line-height: 1.65;
}
.train-card {
  padding: var(--s4);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--sh-2);
}
.train-card h3 {
  font-size: 18.5px;
}
.train-options {
  margin-top: var(--s2);
}
.train-source {
  margin-top: var(--s4) !important;
  font-size: 13px;
  line-height: 1.55;
  color: var(--muted);
}
.exam-body > .btn.quiet {
  margin-top: var(--s3);
}
.exam-footer {
  position: sticky;
  bottom: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px max(14px, calc((100% - 760px) / 2)) calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 95%, transparent);
  -webkit-backdrop-filter: saturate(1.5) blur(16px);
  backdrop-filter: saturate(1.5) blur(16px);
}
.exam-footer .icon-btn {
  border: 1px solid var(--line-2);
  background: var(--surface);
}
.primary-cta {
  flex: 1;
  min-height: 50px;
  border-radius: var(--r);
  font-size: 16px;
}
.exam-footer.in-reader {
  margin: var(--s5) calc(-1 * var(--s5)) 0;
  padding-left: var(--s4);
  padding-right: var(--s4);
}

/* =====================================================================
   90 · Adaptations : tailles d'écran, mouvements réduits, impression
   Compositions repensées (pas seulement rétrécies) :
   < 600 px téléphone · ≥ 600 px grand téléphone / tablette · ≥ 760 px boîtes de dialogue
   ≥ 900 px barre latérale et colonnes · ≥ 1024 px sommaire du cours à gauche
   ===================================================================== */
@media (max-width: 380px) {
  .shell {
    padding: 0 12px;
  }
  .page-head h1 {
    font-size: 25px;
  }
  .nav button[data-action="nav"] {
    font-size: 10.5px;
  }
  .nav .symbol {
    width: 44px;
  }
  .opt {
    padding: 11px 12px;
    font-size: 15.5px;
  }
  .subject-pct {
    width: 58px;
  }
  .reader-body {
    padding-left: 16px;
    padding-right: 16px;
  }
  .lesson-tabs {
    padding-left: 16px;
    padding-right: 16px;
  }
  .act-kpis {
    grid-template-columns: 1fr 1fr;
  }
  .act-kpis > div:last-child {
    grid-column: 1 / -1;
  }
  .breakdown li {
    grid-template-columns: minmax(0, 1fr) 96px;
  }
  .breakdown li > .btn,
  .breakdown li > .bd-ok {
    grid-column: 1 / -1;
    justify-self: start;
  }
}

@media (min-width: 600px) {
  .shell {
    padding: 0 var(--s6);
  }
  .page-head h1 {
    font-size: 30px;
  }
  .later-grid {
    grid-template-columns: 1fr 1fr;
  }
  .course-row {
    grid-template-columns: 30px minmax(0, 1fr) auto;
    align-items: center;
  }
  .course-state {
    grid-column: 3;
    justify-content: flex-end;
  }
  .action-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .action-grid .btn:first-child {
    grid-column: auto;
  }
  .reader-body {
    padding-left: var(--s7);
    padding-right: var(--s7);
  }
  .lesson-tabs {
    padding-left: var(--s7);
    padding-right: var(--s7);
  }
  .exam-footer.in-reader {
    margin-left: calc(-1 * var(--s7));
    margin-right: calc(-1 * var(--s7));
  }
  .flashcard {
    min-height: 280px;
    padding: var(--s6);
  }
}

/* Boîtes de dialogue centrées dès que l'écran le permet */
@media (min-width: 760px) {
  .modalbg:not(.reader-bg):not(.exam-bg) {
    align-items: center;
    padding: var(--s6);
  }
  .modalbg:not(.reader-bg):not(.exam-bg) > .modal {
    max-height: 88vh;
    max-height: 88dvh;
    border-radius: var(--r-xl);
    padding-bottom: var(--s6);
  }
  .modal.sheet.enter {
    animation: popIn 0.24s var(--ease);
  }
  .sheet-layer {
    align-items: center;
    padding: var(--s6);
  }
  .sheet {
    border-radius: var(--r-xl);
    animation: popIn 0.22s var(--ease);
  }
  .sheet-grabber {
    display: none;
  }
  .modal > .row:first-child,
  .sheet > .row:first-of-type {
    margin-top: 6px;
  }
}
@keyframes popIn {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
  }
}

/* Ordinateur : barre latérale, colonnes, largeurs de lecture */
@media (min-width: 900px) {
  #app {
    padding: 0 0 var(--s8) var(--side-w);
  }
  .appbar {
    display: none;
  }
  .nav {
    top: 0;
    right: auto;
    bottom: 0;
    width: var(--side-w);
    padding: 0;
    border-top: 0;
    border-right: 1px solid var(--line);
    background: var(--surface);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  .navinner {
    display: flex;
    flex-direction: column;
    gap: 2px;
    height: 100%;
    max-width: none;
    padding: var(--s5) 14px var(--s4);
  }
  .nav button.nav-brand {
    display: inline-flex;
    align-self: flex-start;
    margin: 0 0 var(--s5) 6px;
  }
  .nav button[data-action="nav"]:not(.nav-brand) {
    flex: none;
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    color: var(--ink-2);
    font-size: 15px;
  }
  .nav .symbol {
    width: auto;
    height: auto;
    background: none !important;
  }
  .nav button[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .nav button[aria-current="page"] .symbol {
    color: var(--accent);
  }
  .nav button[data-action="nav"]:not(.nav-brand):hover:not([aria-current="page"]) {
    background: var(--sunken);
  }
  .nav-foot {
    display: grid;
    gap: var(--s2);
    margin-top: auto;
  }
  .nav-exam {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 12px;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: var(--surface-2);
    font-size: 13px;
  }
  .nav-exam b {
    font-size: 14.5px;
    line-height: 1.3;
  }
  .nav-exam .num {
    color: var(--ink-2);
    font-weight: 650;
  }
  .nav-settings {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    color: var(--ink-2);
    font-weight: 650;
    font-size: 15px;
  }
  .nav-settings:hover {
    background: var(--sunken);
  }
  .nav-settings.active {
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .shell {
    max-width: 1140px;
    padding: 0 var(--s8);
  }
  .shell.library,
  .shell.exams,
  .shell.settings,
  .shell.subject-page {
    max-width: 920px;
  }
  .page-head {
    margin: var(--s8) 0 var(--s6);
  }
  .page-head h1 {
    font-size: 32px;
  }
  .home-grid,
  .missions-grid {
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: var(--s7);
    align-items: start;
  }
  .progress-grid {
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: var(--s5);
    align-items: start;
  }
  .lib-tools {
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
  }
  .mastery-row {
    align-items: center;
  }
  .mastery-main {
    display: grid;
    grid-template-columns: minmax(150px, 230px) minmax(0, 1fr);
    gap: var(--s5);
    align-items: center;
  }
  .mastery-top {
    flex-direction: column;
    align-items: flex-start;
  }
  .mastery-cols {
    margin-top: 0;
    grid-template-columns: minmax(0, 1fr) 110px;
  }
  .subject-detail {
    padding-top: var(--s6);
  }
  .subject-head h1 {
    font-size: 32px;
  }
  .toast-root {
    left: var(--side-w);
    bottom: 28px;
  }
  html.modal-open .toast-root {
    left: 0;
    bottom: 96px;
  }
  .skip-link:focus {
    left: calc(var(--side-w) + 12px);
  }
}

/* Lecteur : sommaire latéral permanent */
@media (min-width: 1024px) {
  .reader-bar {
    grid-template-columns: 44px minmax(0, 1fr) 44px;
    padding-left: 12px;
    padding-right: 12px;
  }
  .toc-btn,
  .toc-inline {
    display: none !important;
  }
  .reader-layout {
    display: grid;
    grid-template-columns: 288px minmax(0, 1fr);
    max-width: 1240px;
    margin: 0 auto;
  }
  .reader-toc {
    display: block;
    position: sticky;
    top: calc(var(--bar-h) + env(safe-area-inset-top));
    align-self: start;
    max-height: calc(100vh - var(--bar-h) - env(safe-area-inset-top));
    max-height: calc(100dvh - var(--bar-h) - env(safe-area-inset-top));
    overflow: auto;
    padding: var(--s6) var(--s3) var(--s7) var(--s4);
    border-right: 1px solid var(--line);
    scrollbar-width: thin;
  }
  .lesson-tabs {
    padding-top: var(--s5);
  }
}

<script>(() => {
  "use strict";
  const basePath = "./";
  const STORE = "med2.semestre1.etat.v1";
  const OVERRIDE = "med2.semestre1.catalogue.import.v1";
  const app = document.getElementById("app"),
    modal = document.getElementById("modal-root");
  /* V0.30 · seules les petites données (catalogue, examens, modalités) sont intégrées à la page ;
     les cours et la banque d'entraînement sont chargés depuis data/ (mis en cache par le service worker). */
  const fallback = (id) => {
    try {
      return JSON.parse(document.getElementById(id)?.textContent || "null");
    } catch {
      return null;
    }
  };
  let cat = fallback("default-catalogue") || { schemaVersion: 1, subjects: [], resources: [] },
    exams = fallback("default-examens")?.exams || [],
    modes = fallback("default-modalites") || { subjectModes: {} };
  let trainingData = { schemaVersion: 1, subjects: {} };
  const boot = { ready: false, error: "", trainingError: "" };
  let training = {
    subject: null,
    mode: "qi",
    index: 0,
    selected: [],
    sessionAnswers: {},
  };
  let pedagogie = { schemaVersion: 1, lessons: {} };
  let learning = {
    id: null,
    tab: "story",
    card: 0,
    shown: false,
    quizPage: 0,
    quizSession: {},
    chapterIndex: 0,
    chapterPage: 0,
    chapterMode: "qcm",
    chapterCard: 0,
    chapterShown: false,
    chapterRecallShown: false,
    scrollChapter: null,
    writingIndex: 0,
    writingReveal: false,
  };
  const APP_VERSION = "V0.30";
  const lesson = (id) => pedagogie.lessons?.[id];
  const defaultState = {
    pace: 14,
    view: "home",
    selectedSubject: null,
    activeDay: 0,
    cycleDone: [],
    memory: {},
    history: [],
    currentMission: null,
    expanded: false,
  };
  let st = (() => {
    try {
      return {
        ...defaultState,
        ...JSON.parse(localStorage.getItem(STORE) || "{}"),
      };
    } catch {
      return { ...defaultState };
    }
  })();
  const save = () => {
    try {
      localStorage.setItem(STORE, JSON.stringify(st));
    } catch (e) {
      alert(
        "La mémoire locale est pleine. Exporte ta progression depuis Suivi.",
      );
    }
  };
  const esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );
  const today = () => {
    let d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  };
  const diff = (date) =>
    Math.round(
      (new Date(date + "T12:00:00") - new Date(today() + "T12:00:00")) /
        86400000,
    );
  const shortDate = (date) =>
    new Date(date + "T12:00:00").toLocaleDateString("fr-FR", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric",
    });
  const subjects = () => cat.subjects || [];
  const syncCounts = () => {
    for (const s of subjects()) {
      s.cmCount = cat.resources.filter(
        (r) => r.subject === s.id && r.kind === "cm",
      ).length;
      s.annaleCount = cat.resources.filter(
        (r) => r.subject === s.id && r.kind === "annale",
      ).length;
    }
  };
  syncCounts();
  const subject = (id) =>
    subjects().find((s) => s.id === id) || { name: id, date: "2099-01-01" };

  const evalOf = (id) => modes.subjectModes?.[id] || null;
  const examFormats = (id) => {
    const m = evalOf(id);
    return m
      ? m.components
          .map((c) => c.label + (c.percent === null ? "" : ` (${c.percent} %)`))
          .join(" · ")
      : "Modalités à préciser";
  };
  function evalInfo(id) {
    const m = evalOf(id);
    if (!m) return '<span class="tag warn">Modalités en attente</span>';
    const coef = String(m.coefficient).replace(".", ",");
    return `<div class="eval-info"><span class="tag">Coef. ${esc(coef)} · ${esc(m.points)} pts</span><span class="tiny">${esc(m.duration || "Durée selon Moodle")} · ${esc(m.ects)} ECTS</span><p style="margin:6px 0 0;font-size:13px"><strong>Format :</strong> ${esc(examFormats(id))}</p></div>`;
  }

  const cms = () => cat.resources.filter((r) => r.kind === "cm");
  const gradeOf = (id) => st.memory[id] || { count: 0, step: 0 };
  const nextExam = () =>
    [...exams]
      .filter((x) => diff(x.date) >= 0)
      .sort((a, b) => a.date.localeCompare(b.date))[0];
  function urg(subjectId) {
    const e = exams
      .filter((x) => x.subject === subjectId && diff(x.date) >= 0)
      .sort((a, b) => a.date.localeCompare(b.date))[0];
    if (!e) return 0.5;
    let d = diff(e.date);
    return d <= 7 ? 8 : d <= 21 ? 5 : d <= 45 ? 3 : d <= 75 ? 1.5 : 1;
  }
  function rank(r) {
    const m = gradeOf(r.id);
    let due = m.nextDue && m.nextDue <= today() ? 6 : 0;
    const lag = m.count ? Math.max(0, 5 - m.step) : 2;
    return (
      urg(r.subject) *
        (10 + Math.max(0, (evalOf(r.subject)?.coefficient || 1) - 1) * 1.5) +
      due +
      lag +
      (m.lastScore === "forgot" ? 12 : 0)
    );
  }
  function dueRecalls() {
    return cms()
      .filter(
        (r) => st.memory[r.id]?.nextDue && st.memory[r.id].nextDue <= today(),
      )
      .sort((a, b) => rank(b) - rank(a));
  }
  function stage(r) {
    const m = gradeOf(r.id);
    return !m.count
      ? "Découverte"
      : m.lastScore === "forgot"
        ? "Renforcement"
        : "Consolidation";
  }
  /* ===== V0.22 · Planificateur de révision : calendrier réel, tours multiples, ronéo évolutive ===== */
  const PLAN_DEFAULT = { daily: 120, background: 10 };
  const TOUR_TARGET = 3;
  const TOUR_CAP = 6; /* au-delà, le temps libéré part vers les examens suivants */
  const addDays = (d, n) => {
    const x = new Date(d + "T12:00:00");
    x.setDate(x.getDate() + n);
    return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  };
  const fmtDay = (d) =>
    new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const fmtShort = (d) =>
    new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
  const fmtMin = (m) => {
    m = Math.max(0, Math.round(m));
    const h = Math.floor(m / 60), r = m % 60;
    return h ? `${h}\u00a0h${r ? "\u00a0" + String(r).padStart(2, "0") : ""}` : `${r}\u00a0min`;
  };
  function planState() {
    st.plan ??= {};
    const p = st.plan;
    p.settings = { ...PLAN_DEFAULT, ...(p.settings || {}) };
    p.done ??= {};
    p.retry ??= {};
    p.fresh ??= {};
    const t = today();
    if (!p.seen) p.seen = cms().map((r) => r.id);
    for (const r of cms())
      if (!p.seen.includes(r.id)) {
        p.seen.push(r.id);
        p.fresh[r.id] = t;
      }
    for (const [id, d] of Object.entries(p.fresh)) if (diff(d) < -10) delete p.fresh[id];
    return p;
  }
  const lessonMeta = {};
  function meta(r) {
    if (lessonMeta[r.id]) return lessonMeta[r.id];
    const l = lesson(r.id);
    if (!l) return (lessonMeta[r.id] = { words: 0, qcm: 0, cards: 0, final: 0, secs: 0 });
    let chars = 0;
    for (const s of l.sections || []) chars += JSON.stringify(s.paragraphs || []).split(/\s+/).length;
    const secs = (l.sections || []).length;
    return (lessonMeta[r.id] = {
      words: chars,
      qcm: activeQcm(l).length,
      cards: (l.flashcards || []).length + (l.qroc || []).length,
      final: Math.min(36, Math.max(secs * 2, Math.min(24, activeQcm(l).length))),
      secs,
    });
  }
  /* Durées estimées à partir du contenu réel : lecture ≈ 200 mots/min, QCM ≈ 20 s, carte ≈ 12 s. */
  function tourCost(r, k, mode) {
    const m = meta(r);
    if (!lesson(r.id)) return k === 1 ? 30 : k === 2 ? 15 : 10;
    if (mode === "veille") return Math.max(6, Math.round(m.secs * 1.2 + m.cards * 0.1));
    const c = k === 1 ? m.words / 200 + m.qcm * 0.35 : k === 2 ? m.cards * 0.2 + m.qcm * 0.1 : m.final * 0.5 + 3;
    return Math.max(8, Math.round(c));
  }
  const toursOf = (id) => (st.plan?.done?.[id] || []).length;
  const lastLevel = (id) => {
    const a = st.plan?.done?.[id];
    return a && a.length ? a[a.length - 1].level : null;
  };
  const TOUR_NAME = (k) => (k === 1 ? "Comprendre" : k === 2 ? "Consolider" : "S’évaluer");
  function planBlocks() {
    const fut = [...exams].filter((x) => diff(x.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
    const blocks = [];
    for (const x of fut) {
      const last = blocks[blocks.length - 1];
      if (last && diff(x.date) - diff(last.start) <= 3) {
        last.exams.push(x);
        last.end = x.date;
      } else blocks.push({ start: x.date, end: x.date, exams: [x] });
    }
    for (const b of blocks) {
      b.subjects = [...new Set(b.exams.map((x) => x.subject))];
      b.courses = cms().filter((r) => b.subjects.includes(r.subject));
      b.empty = b.subjects.filter((s) => !b.courses.some((r) => r.subject === s));
      const m1 = b.start.slice(0, 7) === b.end.slice(0, 7);
      b.label = b.start === b.end ? fmtShort(b.start) : m1 ? `${+b.start.slice(8)}–${fmtShort(b.end)}` : `${fmtShort(b.start)} – ${fmtShort(b.end)}`;
    }
    return blocks;

        else if (hit(s.memory || "")) mentions.push({ l, i, s });

    const subj = subjects().filter((s) => hit(s.name));

  function libraryResults() {
    const q = norm(query.trim());

    const pass = (id) => {
      const x = stats[id];
      if (libFilter === "doing") return x.total && x.done + x.doing > 0 && x.done < x.total;
      if (libFilter === "done") return x.total && x.done === x.total;
      if (libFilter === "due") return x.due > 0;
      return true;
    };
    const groups = subjectGroups()
      .map((g) => ({ ...g, ids: g.ids.filter(pass) }))
      .filter((g) => g.ids.length);
    if (!groups.length)
      return `<div class="empty-state"><p><b>${libFilter === "due" ? "Aucun rappel en attente." : libFilter === "done" ? "Aucune matière entièrement maîtrisée pour l’instant." : "Aucune matière commencée pour l’instant."}</b></p><p class="muted">${libFilter === "due" ? "Les rappels apparaissent après une autoévaluation, au moment prévu pour restituer le cours." : "Une matière passe « en cours » dès que tu ouvres un de ses cours ou que tu réponds à ses questions."}</p><button class="btn ghost small" data-action="lib-filter" data-id="all">Afficher toutes les matières</button></div>`;

ndiquent les tours validés dans le plan (comprendre, consolider, s’évaluer). ${svgI(I.bulb, 14)} ouvre le rappel actif du cours.</p><details class="annales"><summary>Annales repérées <span class="muted num">${annales.length}</span></summary><p class="muted">Les questions d’entraînement au format examen s’appuient sur l’analyse de ces annales ; les fichiers eux-mêmes restent sur ton Drive.</p><ul class="file-list">${annales.map((r) => `<li>${svgI(I.file, 16)}<span>${esc(r.title)}</span></li>`).join("") || "<li>Aucun fichier d’annales ici.</li>"}</ul></details></section>`;

    return `${mast()}<main id="main" class="shell view progress"><header class="page-head"><h1>Suivi</h1><p class="muted">Ce que tu as fait, et ce que tu sais vraiment. Tout est calculé à partir de tes réponses enregistrées sur cet appareil.</p></header><div class="progress-grid"><section class="card activity" aria-labelledby="act-h"><div class="section-head"><h2 id="act-h">Activité</h2><span class="muted">14 derniers jours</span></div><div class="act-kpis"><div><b class="num">${streak}</b><span>${streak > 1 ? "jours d’affilée" : "jour d’affilée"}</span></div><div><b class="num">${week}</b><span>réponses sur 7 jours</span></div><div><b class="num">${activeDays}/7</b><span>jours actifs</span></div></div><ol class="act-bars">${bars}</ol><p class="footnote">Réponses enregistrées : QCM, QROC, cartes mémoire, entraînement et évaluations de cours. Une carte revue plusieurs fois ne compte qu’à sa dernière révision.</p></section><section class="card" aria-labelledby="weak-h"><div class="section-head"><h2 id="weak-h">Chapitres à retravailler</h2>${weak.length ? `<span class="badge ko num">${weak.length}</span>` : ""}</div><p class="muted">Moins de 60 % de bonnes réponses à ta dernière tentative (au moins 3 questions répondues).</p>${weakHtml}</section></div><section class="section" aria-labelledby="mast-h"><div class="section-head"><h2 id="mast-h">Maîtrise par matière</h2></div><p class="muted">« Travaillé » : questions auxquelles tu as répondu au moins une fois. « Réussite » : part de bonnes réponses à ta dernière tentative. L’un mesure l’activité, l’autre la maîtrise.</p><div class="card flush mastery">${rows.map(rowHtml).join("")}</div></section>${due.length ? `<section class="section" aria-labelledby="due-h"><div class="section-head"><h2 id="due-h">Rappels espacés à faire</h2><span class="badge warn num">${due.length}</span></div><div class="group">${due

  }

><kbd>←</kbd> <kbd>→</kbd></dt><dd>Question ou carte précédente / suivante</dd></div><div><dt><kbd>Espace</kbd></dt><dd>Retourner la carte mémoire</dd></div><div><dt><kbd>1</kbd> / <kbd>2</kbd></dt><dd>Carte : « À revoir » / « Je savais » (une fois retournée)</dd></div><div><dt><kbd>Échap</kbd></dt><dd>Fermer la fenêtre ou le panneau ouvert</dd></div></dl></div></section><section class="section" aria-labelledby="cat-h"><div class="section-head"><h2 id="cat-h">Catalogue de la ronéo</h2></div><div class="card"><p class="muted">Le site ne surveille pas Google Drive. Après contrôle des nouveaux documents, il suffit de remplacer <code>data/catalogue.json</code> dans le dépôt GitHub : les nouveaux cours rejoignent le plan sans effacer les résultats.</p><div class="actions"><button class="btn secondary" data-action="import-catalogue">Importer un manifeste de cours</button><button class="btn ghost" data-action="reload">${svgI(I.refresh, 17)} Recharger la version publiée</button></div><p class="footnote">Catalogue : ${esc(cat.revision || "—")} · cours : ${esc(pedagogie.revision || "—")} · entraînement : ${esc(trainingData.revision || "—")}</p></div></section><section class="section" aria-labelledby="mod-h"><div class="section-head"><h2 id="mod-h">Modalités d’examen</h2></div><div class="card"><p class="muted">Formats et coefficients des 14 UE, d’après le tableau transmis (p. 47). Les premiers dossiers cliniques sont des créations pédagogiques, pas des annales.</p><details class="mod-details"><summary>Voir toutes les modalités</summary><div class="mod-list">${Object.entries(modes.subjectModes || {})

  async function settingsStatus() {
    const box = document.getElementById("install-status");

    try {
      const r = await caches.match(new URL("./__installation.json", location.href).href);
      if (r) report = await r.json();
    } catch {}
    const offline = !!(sw && sw.active && navigator.serviceWorker.controller);
    const missing = report?.missing || [];

    box.innerHTML = `<ul class="check-list">${line(offline, offline ? "Mode hors ligne actif : l’application et les cours s’ouvrent sans connexion." : "Mode hors ligne inactif pour l’instant. Il s’active après un premier chargement complet en ligne (site publié en HTTPS).")}${report ? line(!missing.length, missing.length ? `${plural(missing.length, "fichier")} attendu${missing.length > 1 ? "s" : ""} absent${missing.length > 1 ? "s" : ""} du site publié :` : `${report.total} fichiers essentiels disponibles hors ligne.`) : ""}</ul>${missing.length ? `<ul class="missing-list">${missing.map((m) => `<li><code>${esc(m.replace(/^\.\//, ""))}</code></li>`).join("")}</ul><p class="muted">Dépose ces fichiers dans le dépôt GitHub, en respectant les dossiers (le « A » d’Assets est en majuscule).</p>` : ""}<div class="actions"><button class="btn secondary small" data-action="check-files">${svgI(I.search, 16)} Vérifier toutes les images des cours</button></div><div id="files-check"></div><p class="footnote">Version ${APP_VERSION}${report ? ` · installée le ${esc(new Date(report.at).toLocaleDateString("fr-FR"))}` : ""}</p>`;
    const sbox = document.getElementById("storage-status");

      sbox.innerHTML = `<p class="muted">${est ? `Espace utilisé par le site : ${(est.usage / 1e6).toFixed(1).replace(".", ",")} Mo. ` : ""}${persisted ? "Stockage protégé : le navigateur ne l’effacera pas pour libérer de la place." : "Le navigateur peut effacer ces données s’il manque de place."}</p>${persisted || !navigator.storage.persist ? "" : `<button class="btn ghost small" data-action="persist">${svgI(I.shield, 16)} Protéger mes données sur cet appareil</button>`}`;

  async function checkFiles() {
    const out = document.getElementById("files-check");
    if (!out) return;
    const paths = new Set();
    for (const l of Object.values(pedagogie.lessons || {}))
      for (const s of l.sections || []) for (const f of s.figures || []) if (f.src) paths.add(f.src);
    for (const v of Object.values(V10_VISUALS)) paths.add(v.src);
    const list = [...paths];
    const missing = [];
    let n = 0;
    out.innerHTML = `<p class="muted" role="status">Vérification de ${list.length} images…</p>`;
    const worker = async () => {
      while (list.length) {
        const p = list.shift();
        try {
          const r = await fetch(p, { method: "HEAD", cache: "no-store" });
          if (!r.ok) missing.push(p);
        } catch {
          missing.push(p);
        }
        n++;
      }
    };

  /* V0.6 — structure d'épreuve indépendante du format de réponse */
  function trainSet() {
    /* V0.26 · les anciennes questions remplacées par la banque d'examen sont masquées (retired) */
    const s = trainingData.subjects?.[training.subject];
    if (!s) return null;
    if (!s._active)
      Object.defineProperty(s, "_active", {
        value: { ...s, qi: (s.qi || []).filter((q) => !q.retired), cases: (s.cases || []).filter((c) => !c.retired) },
        enumerable: false,
      });
    return s._active;
  }
  function trainItems() {
    const set = trainSet();
    if (!set) return [];
    /* V0.23 · ordre de probabilité (★ possible → ★★★ très probable), tri stable */
    const ord = training.order || "cours";
    const key = (x) => (ord === "asc" ? x.prob || 1 : -(x.prob || 1));
    const rank = {};
    cms().forEach((r, i) => (rank[r.id] = i));
    const lessonPos = (x) => (x.lessonId in rank ? rank[x.lessonId] * 100 + (x.chapter ?? 50) : 1e9);
    const sortBy = (arr) =>
      arr
        .map((x, i) => [x, i])
        .sort((a, b) => (ord === "cours" ? lessonPos(a[0]) - lessonPos(b[0]) : key(a[0]) - key(b[0])) || a[1] - b[1])
        .map((x) => x[0]);
    return training.mode === "qi"
      ? sortBy(set.qi)
      : sortBy(set.cases).flatMap((c) =>
          c.questions.map((q) => ({
            ...q,
            prob: c.prob || q.prob,
            caseTitle: c.title,
            vignette: c.vignette,
            caseId: c.id,
          })),
        );
  }

  /* ===== V0.30 · coquille de l'application : rendu, chargement des données, focus, notifications ===== */
  const VIEW_TITLE = { home: "Accueil", library: "Cours", missions: "Missions du jour", exams: "Examens", progress: "Suivi", settings: "Réglages" };

  async function loadJSON(name) {

  function applyCatalogueOverride() {

      const ids = new Set(cat.resources.map((x) => x.id));
      for (const r of override.resources || [])
        if (!ids.has(r.id)) {
          cat.resources.push(r);
          ids.add(r.id);
        }
      const sids = new Set(cat.subjects.map((x) => x.id));
      for (const s of override.subjects || [])

    const why = (r) => (r.status === "rejected" ? (navigator.onLine === false ? "pas de connexion" : r.reason?.message || "réseau indisponible") : "format inattendu");
    if (c.status === "fulfilled" && c.value?.schemaVersion === 1 && Array.isArray(c.value.resources) && Array.isArray(c.value.subjects)) cat = c.value;

  function lessonChapter(l, index) {
    const i = Math.max(0, Math.min(l.sections.length - 1, index));
    const saved = l.chapterPractice?.[i];
    if (saved) {
      const q = (saved.qcm || []).filter((j) => l.qcm[j] && !l.qcm[j].retired);
      return { qcm: [...q.filter((j) => l.qcm[j].bankId), ...q.filter((j) => !l.qcm[j].bankId)], cards: saved.cards || [] };
    }
    // Fallback for later imported lessons lacking an explicit mapping: no accidental mix of subjects.
    const numbered = (p) => {
      let out = new Set();
      String(p || "")
        .replace(/[–—]/g, "-")
        .replace(/(\d+)\s*-\s*(\d+)|(\d+)/g, (_, a, b, c) => {
          if (c) out.add(+c);
          else for (let n = +a; n <= +b && n < 101; n++) out.add(n);
        });
      return out;
    };
    const sp = numbered(l.sections[i].pages);
    const matches = (it) =>
      it
        .map((q, n) => ({ n, p: numbered(q.pages) }))
        .filter((x) => [...x.p].some((p) => sp.has(p)))
        .map((x) => x.n);
    return { qcm: matches(l.qcm).filter((j) => !l.qcm[j].retired), cards: matches(l.flashcards) };
  }
  function lessonAnswerCorrect(q, a) {
    if (Array.isArray(q.answer))
      return (
        Array.isArray(a?.choices) &&
        q.answer
          .slice()
          .sort((x, y) => x - y)
          .join(",") ===
          a.choices
            .slice()
            .sort((x, y) => x - y)
            .join(",")
      );
    return a?.choice === q.answer;
  }
  function answerLetters(q) {
    return (Array.isArray(q.answer) ? q.answer : [q.answer])
      .map((i) => "ABCDE"[i])
      .join(", ");
  }

  function chapterEnter(index) {
    const l = lesson(learning.id);
    if (!l) return;
    learning.tab = "chapter";
    learning.chapterIndex = Math.max(
      0,
      Math.min(l.sections.length - 1, Number(index) || 0),
    );
    learning.chapterPage = 0;
    learning.chapterCard = 0;
    learning.chapterShown = false;
    learning.chapterRecallShown = false;
    learning.chapterMode = "qcm";
    // A new chapter practice starts with blank answers, even for questions answered months ago.
    learning.quizSession ??= {};
    for (const n of lessonChapter(l, learning.chapterIndex).qcm) {
      delete learning.quizSession[`${l.id}#${n}`];
      delete learning.quizDraft?.[`${l.id}#${n}`];
    }
    drawLesson(true);
  }
  function chapterRead(index) {
    const l = lesson(learning.id);
    if (!l) return;
    learning.tab = "story";
    learning.scrollChapter = Math.max(
      0,
      Math.min(l.sections.length - 1, Number(index) || 0),
    );
    drawLesson(true);
  }
  function cardChapterIndex(l, cardIndex) {
    const c = l.flashcards[cardIndex];
    if (!c) return 0;
    const matches = [];
    (l.chapterPractice || []).forEach((p, i) => {
      if ((p.cards || []).includes(cardIndex)) matches.push(i);
    });
    if (matches.length) {
      const heading = String(c.topic || "").toLowerCase();
      return (
        matches.find((i) => l.sections[i].heading.toLowerCase() === heading) ??
        matches[0]
      );
    }
    const p = String(c.pages || "").match(/\d+/);
    if (p) {
      let num = +p[0];
      const m = l.sections.findIndex((x) =>
        String(x.pages)
          .split(/[–—,\s-]+/)
          .some((t) => +t === num),
      );
      if (m >= 0) return m;
    }
    return Math.max(
      0,
      l.sections.findIndex((x) => x.heading === c.topic),
    );
  }


  /* ===== V0.26 · QROC à mots-clés (rappel actif, partie cours uniquement) ===== */
  function activeQcm(l) {
    const out = [];
    (l.qcm || []).forEach((q, i) => {
      if (!q.retired) out.push(i);
    });
    return out;
  }
  const QR_MAP = { "α": " alpha ", "β": " beta ", "γ": " gamma ", "δ": " delta ", "ε": " epsilon ", "κ": " kappa ", "λ": " lambda ", "μ": " mu ", "ζ": " zeta ", "σ": " sigma ", "ς": " sigma ", "θ": " theta ", "π": " pi ", "ω": " omega ", "φ": " phi ", "ρ": " rho ", "τ": " tau ", "ν": " nu ", "η": " eta ", "χ": " chi ", "ψ": " psi ", "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "₀": "0", "₁": "1", "₂": "2", "₃": "3", "₄": "4", "₅": "5", "₆": "6", "₇": "7", "₈": "8", "₉": "9", "œ": "oe", "æ": "ae" };
  function qrNorm(x) {
    return String(x || "")
      .toLowerCase()
      .replace(/[αβγδεκλμζσςθπωφρτνηχψ⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉œæ]/g, (c) => QR_MAP[c] || c)
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }
  function qrLev(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let low = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < low) low = cur[j];
      }
      if (low > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }
  /* Tolérance : 0 faute ≤ 3 lettres, 1 jusqu'à 5, 2 jusqu'à 9, 3 au-delà. */
  const qrTol = (k) => {
    const n = k.replace(/ /g, "").length;
    return n <= 3 ? 0 : n <= 5 ? 1 : n <= 9 ? 2 : 3;
  };
  /* Les nombres et les chiffres romains (classe I / II…) doivent être exacts. */
  const qrSig = (x) =>
    x
      .split(" ")
      .filter((t) => /\d/.test(t) || /^(i|ii|iii|iv|vi)$/.test(t))
      .map((t) => t.replace(/\D/g, "") || t)
      .join(",");
  const QR_PRE = [["hypo", "hyper"], ["micro", "macro"], ["brady", "tachy"], ["ab", "ad"], ["af", "ef"], ["endo", "exo"], ["intra", "extra"], ["mono", "poly"], ["oligo", "poly"], ["uni", "bi"], ["homo", "hetero"], ["sys", "dias"], ["in", "ex"], ["pre", "post"], ["ante", "post"], ["dextro", "levo"], ["sur", "sous"], ["iso", "aniso"], ["anti", "pro"], ["pro", "meta"], ["epi", "hypo"]];
  const QR_SUF = [["phile", "phobe"], ["ectomie", "otomie"], ["cytose", "penie"], ["rragie", "rrhee"], ["rrhagie", "rrhee"], ["plegie", "paresie"], ["gene", "lyse"]];
  /* Leurres : un mot de sens opposé proche à 1–2 lettres (hypo/hyper, afférent/efférent…) n'est jamais accepté. */
  function qrDecoys(k) {
    const out = new Set(),
      arr = k.split(" ");
    arr.forEach((w, idx) => {
      const v = [];
      for (const [a, b] of QR_PRE) {

    const CONN = ["a", "et", "au", "sur", "de", "ou", "x", "entre"];
    if (sig && kt.every((t) => /^\d+$/.test(t) || CONN.includes(t))) {

        nums = tokens.flatMap((t) => (/^\d+[a-z]{0,4}$/.test(t) ? [t.match(/^\d+/)[0]] : [])); /* « 2h », « 10e », « 4g » */

    const bankIdx = groups.flat().filter((i) => l.qcm[i].bankId);

    const target = bankN
      ? Math.min(36 + bankN, bankN + Math.max(l.sections.length, Math.min(12, activeQcm(l).length - bankN)))
      : Math.min(36, Math.max(l.sections.length * 2, Math.min(24, l.qcm.length)));

      used = new Set(bankIdx);

    const slots = groups.map((g, c) => {
      const rest = g.filter((i) => !l.qcm[i].bankId),
        off = rest.length ? (c * 7 + l.id.length) % rest.length : 0;
      return [...rest.slice(off), ...rest.slice(0, off)];
    });
    let round = 0;
    while (selected.length < target && round < l.qcm.length + 1) {
      let changed = false;
      for (const g of slots) {
        const i = g[round];

          selected.push(i);

  function grade(score) {
    if (!st.currentMission) return;
    const id = st.currentMission,
      r = cms().find((x) => x.id === id);
    if (!r) return;
    const prev = gradeOf(id);
    const step =
      score === "good"
        ? prev.count
          ? Math.min(4, (prev.step || 0) + 1)
          : 0
        : score === "partial"
          ? Math.max(0, prev.step || 0)
          : 0;
    const days = [1, 3, 7, 14, 30][step];
    const nd = new Date(today() + "T12:00:00");
    nd.setDate(nd.getDate() + days);
    const due = `${nd.getFullYear()}-${String(nd.getMonth() + 1).padStart(2, "0")}-${String(nd.getDate()).padStart(2, "0")}`;
    st.memory[id] = {
      count: (prev.count || 0) + 1,
      step,
      lastScore: score,
      nextDue: due,
      lastReviewed: today(),
    };
    if (!st.cycleDone.includes(id)) st.cycleDone.push(id);
    st.history.push({ id, subject: r.subject, date: today(), score });

    closeModal();
    render();
    toast("Autoévaluation enregistrée · prochain rappel " + due);

      return;
    }
    if (act === "figure-open") {
      openFigure(id || "", btn.closest("figure")?.querySelector("figcaption")?.textContent || "", btn);
      return;
    }
    if (act === "figure-close") {
      closeFigure();
      return;
    }
    if (act === "figure-scale") {
      const ov = document.querySelector(".figure-overlay");
      if (ov) {
        let z = Number(ov.dataset.scale || 1);
        z = Math.max(1, Math.min(3, id === "plus" ? z + 0.5 : z - 0.5));
        ov.dataset.scale = String(z);
        const im = ov.querySelector("img");
        im.style.width = z * 100 + "%";
        im.classList.toggle("zoomed", z > 1);
      }
      return;
    }
    if (act === "nav") {
      if (id === "library" && st.view === "library") st.selectedSubject = null;
      st.view = id;
      st.expanded = false;
      save();
      render();
      scrollTo({ top: 0, behavior: "instant" });
    }
    if (act === "settings") {
      st.view = "settings";
      save();
      render();
      scrollTo(0, 0);
    }
    if (act === "subject") {
      st.selectedSubject = id;
      save();
      render();
      document
        .getElementById("subject-detail")
        ?.scrollIntoView({ behavior: "smooth" });
    }
    if (act === "close-subject") {
      st.selectedSubject = null;
      save();
      render();
    }
    if (act === "train-order") {
      training.order = id;
      training.index = 0;
      training.selected = [];
      drawTraining(true);
    }
    if (act === "plan-open") {
      const [pid, what] = String(id).split("|");
      planOpen(pid, what);
    }
    if (act === "plan-validate") planValidateSheet(id);
    if (act === "plan-level") planLevel(id);
    if (act === "plan-more") planMore();
    if (act === "plan-set") {
      const [k, v] = String(id).split("|");
      const p = planState();
      p.settings[k] = Number(v);
      if (p.settings.background > p.settings.daily) p.settings.background = 0;
      todayPlan(true);
      render();
    }
    if (act === "open-mission") {
      const r = cms().find((r) => r.id === id);
      if (r) missionDialog(r);
    }
    if (act === "training-open") openTraining(id);
    if (act === "training-semio-lesson") beginLesson(id, "qcm");
    if (act === "train-open-lesson" && lesson(id)) beginLesson(id, "story");
    if (act === "train-mode") {
      training.mode = id;
      training.index = 0;
      training.selected = [];
      training.sessionAnswers = {};
      drawTraining(true);
    }
    if (act === "train-reset") {
      training.index = 0;
      training.selected = [];
      training.sessionAnswers = {};
      drawTraining(true);
    }
    if (act === "train-prev") trainMove(-1);
    if (act === "train-next") trainMove(1);
    if (act === "train-toggle") {
      const items = trainItems(),
        q = items[training.index],
        i = Number(id);
      if (q && !training.sessionAnswers?.[q.id] && q.options[i] !== undefined) {
        if (q.format === "QRU") training.selected = [i];
        else
          training.selected = training.selected.includes(i)
            ? training.selected.filter((x) => x !== i)
            : [...training.selected, i];
        drawTraining();
      }
    }
    if (act === "train-check") {
      const q = trainItems()[training.index];
      if (q && training.selected.length && !training.sessionAnswers?.[q.id]) {
        st.trainingAnswers ??= {};
        training.sessionAnswers ??= {};
        const a = {
          selected: training.selected.slice(),
          correct: correctFor(q, training.selected),
          date: today(),
        };
        training.sessionAnswers[q.id] = a;
        st.trainingAnswers[q.id] = a;
        st.trainingAttemptHistory ??= {};
        const history = st.trainingAttemptHistory[q.id] || [];
        st.trainingAttemptHistory[q.id] = [...history.slice(-9), a];
        save();
        drawTraining();
        revealFeedback("#train-explain");
      }
    }
    if (act === "course-neighbor" && learning.id) {
      const l = lesson(learning.id),
        n = courseNeighbors(l);
      if (id && [n.prev, n.next].includes(id)) beginLesson(id, "story");
      return;
    }
    if (act === "course-return" && learning.id) {
      const s = lesson(learning.id).subject;
      closeModal();
      learning.id = null;
      st.view = "library";
      st.selectedSubject = s;
      save();
      render();
      document
        .getElementById("subject-detail")
        ?.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (act === "open-lesson") beginLesson(id, "story");
    if (act === "quick-quiz") beginLesson(id, "qcm");
    if (act === "quick-cards") beginLesson(id, "cards");
    if (act === "chapter-practice" && learning.id) chapterEnter(id);
    if (act === "summary-scroll" && learning.id) {
      const el = document.querySelector(
        '[data-essence-section=\"' + id + '\"]',
      );
      el?.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    if (act === "chapter-read" && learning.id) chapterRead(id);
    if (act === "chapter-next" && learning.id) chapterEnter(id);
    if (act === "qroc-check" && learning.id) qrocCheck(id);
    if (act === "qroc-retry" && learning.id) {
      if (st.qroc) delete st.qroc[id];
      save();
      drawLesson();
      setTimeout(() => [...modal.querySelectorAll("input.qroc-input")].find((x) => x.dataset.qroc === id)?.focus(), 30);
    }
    if (act === "qroc-reset" && learning.id) {
      const l = lesson(learning.id);
      const list = id === "chapter" ? qrocList(l, learning.chapterIndex) : qrocList(l);
      list.forEach((x) => st.qroc && delete st.qroc[x.id]);
      learning.qrocDraft = {};
      save();
      drawLesson();
    }
    if (act === "qroc-page" && learning.id) {
      learning.qrocPage = +id;
      drawLesson(true);
    }
    if (act === "chapter-qroc" && learning.id) {
      chapterEnter(id);
      learning.chapterMode = "qroc";
      drawLesson(true);
    }
    if (act === "chapter-mode" && learning.id) {
      learning.chapterMode = id;
      learning.chapterCard = 0;
      learning.chapterShown = false;
      drawLesson(true);
    }
    if (act === "chapter-quiz-reset" && learning.id) {
      const l = lesson(learning.id);
      if (l) {
        learning.quizSession ??= {};
        for (const i of lessonChapter(l, learning.chapterIndex).qcm) {
          delete learning.quizSession[`${l.id}#${i}`];
          delete learning.quizDraft?.[`${l.id}#${i}`];
        }
        learning.chapterPage = 0;
        drawLesson(true);
      }
    }
    if (act === "quiz-reset" && learning.id) {
      learning.quizSession = {};
      learning.quizDraft = {};
      learning.quizPage = 0;
      drawLesson(true);
    }
    if (act === "chapter-page" && learning.id) {
      learning.chapterPage = Math.max(0, Number(id) || 0);
      drawLesson(true);
    }
    if (act === "chapter-recall-reveal" && learning.id) {
      learning.chapterRecallShown = true;
      drawLesson();
    }
    if (act === "chapter-card-reveal" && learning.id) {
      learning.chapterShown = true;
      drawLesson();
    }
    if (
      (act === "chapter-card-next" || act === "chapter-card-prev") &&
      learning.id
    ) {
      const g = lessonChapter(lesson(learning.id), learning.chapterIndex);
      learning.chapterCard = Math.max(
        0,
        Math.min(
          g.cards.length - 1,
          learning.chapterCard + (act === "chapter-card-next" ? 1 : -1),
        ),
      );
      learning.chapterShown = false;
      drawLesson(true);
    }
    if (act === "chapter-card-mark" && learning.id) {
      const l = lesson(learning.id),
        g = lessonChapter(l, learning.chapterIndex),
        originalIndex = g.cards[learning.chapterCard];
      if (originalIndex !== undefined) {
        st.flashcards ??= {};
        st.flashcards[`${learning.id}#${originalIndex}`] = {
          result: id,
          at: today(),
        };
        learning.chapterCardSession[originalIndex] = id;
        save();
        if (learning.chapterCard < g.cards.length - 1) {
          learning.chapterCard++;
          learning.chapterShown = false;
          drawLesson(true);
        } else {
          learning.chapterCardReport = true;
          drawLesson(true);
        }
      }
    }
    if (act === "writing-chapter" && learning.id) {
      const l = lesson(learning.id);
      const i = (l?.writing || []).findIndex((w) => w.chapter === Number(id));
      if (i >= 0) {
        learning.tab = "writing";
        learning.writingIndex = i;
        learning.writingReveal = false;
        drawLesson(true);
      }
    }
    if (act === "writing-reveal" && learning.id) {
      const l = lesson(learning.id),
        w = l?.writing?.[learning.writingIndex];
      if (w) {
        if (
          !(st.sshWritingDrafts?.[w.id] || "").trim() &&
          !learning.writingReveal
        )
          toast("Écris d’abord une réponse, puis compare-la au modèle.");
        else {
          learning.writingReveal = !learning.writingReveal;
          drawLesson();
        }
      }
    }
    if ((act === "writing-prev" || act === "writing-next") && learning.id) {
      const l = lesson(learning.id);
      learning.writingIndex = Math.max(
        0,
        Math.min(
          l.writing.length - 1,
          learning.writingIndex + (act === "writing-next" ? 1 : -1),
        ),
      );
      learning.writingReveal = false;
      drawLesson(true);
    }
    if (act === "writing-mark" && learning.id) {
      const l = lesson(learning.id),
        w = l?.writing?.[learning.writingIndex];
      if (w && learning.writingReveal) {
        st.sshWritingResults ??= {};
        st.sshWritingResults[w.id] = { result: id, date: today() };
        save();
        drawLesson();
        toast("Autoévaluation de la rédaction enregistrée");
      }
    }
    if (act === "final-choice" && learning.id && !learning.finalSubmitted) {
      const [i, j] = id.split(":").map(Number);
      const l = lesson(learning.id),
        q = l?.qcm?.[i];
      if (q?.choices?.[j] !== undefined) {
        learning.finalDraft ??= {};
        let old = learning.finalDraft[i] || [];
        learning.finalDraft[i] = Array.isArray(q.answer)
          ? old.includes(j)
            ? old.filter((x) => x !== j)
            : [...old, j].sort((a, b) => a - b)
          : [j];
        drawLesson();
      }
    }
    if (act === "final-page" && learning.id) {
      learning.finalPage = Math.max(0, Number(id) || 0);
      drawLesson(true);
    }
    if (act === "final-submit" && learning.id && !learning.finalSubmitted) {
      const l = lesson(learning.id),
        items = finalCourseItems(l);
      if (
        items.length &&
        items.every((i) => (learning.finalDraft?.[i] || []).length)
      ) {
        learning.finalSubmitted = true;
        const score = items.filter((i) =>
          finalCorrect(l.qcm[i], learning.finalDraft[i]),
        ).length;
        st.courseExamResults ??= {};
        st.courseExamHistory ??= {};
        const rec = {
          score,
          total: items.length,
          date: today(),
          answers: items.map((i) => ({
            question: i,
            choices: learning.finalDraft[i].slice(),
          })),
        };
        st.courseExamResults[l.id] = rec;
        st.courseExamHistory[l.id] = [
          ...(st.courseExamHistory[l.id] || []).slice(-9),
          rec,
        ];
        save();
        learning.finalPage = 0;
        drawLesson(true);
      }
    }
    if (act === "final-restart" && learning.id) {
      learning.finalDraft = {};
      learning.finalSubmitted = false;
      learning.finalPage = 0;
      drawLesson(true);
    }
    if (act === "lesson-tab") {
      if (id === "final" && learning.tab !== "final") {
        learning.finalDraft = {};
        learning.finalSubmitted = false;
        learning.finalPage = 0;
      }
      if (id === "writing" && learning.tab !== "writing") {
        learning.writingReveal = false;
        learning.writingIndex = 0;
      }
      if (id === "qcm" && learning.tab !== "qcm") learning.quizSession = {};
      learning.tab = id;
      learning.shown = false;
      drawLesson(true);
    }
    if (act === "quiz-answer" && learning.id) {
      const [i, j] = id.split(":").map(Number);
      const l = lesson(learning.id);
      if (l?.qcm?.[i]?.choices?.[j] !== undefined) {
        learning.quizSession ??= {};
        const key = `${learning.id}#${i}`;
        if (learning.quizSession[key] === undefined) {
          const a = { choice: j, at: today() };
          learning.quizSession[key] = a;
          st.quizAnswers ??= {};
          st.quizAnswers[key] = a;
          st.quizAttemptHistory ??= {};
          const history = st.quizAttemptHistory[key] || [];
          st.quizAttemptHistory[key] = [
            ...history.slice(-9),
            { ...a, correct: j === l.qcm[i].answer },
          ];
          save();
          drawLesson();
          revealFeedback(`#q-${i} .qfeedback`);
        }
      }
    }
    if (act === "qrm-toggle" && learning.id) {
      const [i, j] = id.split(":").map(Number),
        l = lesson(learning.id),
        q = l?.qcm?.[i];
      const key = `${learning.id}#${i}`;
      if (
        Array.isArray(q?.answer) &&
        q.choices?.[j] !== undefined &&
        !learning.quizSession?.[key]
      ) {
        learning.quizDraft ??= {};
        const prev = learning.quizDraft[key] || [];
        learning.quizDraft[key] = prev.includes(j)
          ? prev.filter((x) => x !== j)
          : [...prev, j].sort((x, y) => x - y);
        drawLesson();
      }
    }
    if (act === "qrm-check" && learning.id) {
      const i = Number(id),
        l = lesson(learning.id),
        q = l?.qcm?.[i],
        key = `${learning.id}#${i}`;
      const choices = learning.quizDraft?.[key] || [];
      if (
        Array.isArray(q?.answer) &&
        choices.length &&
        !learning.quizSession?.[key]
      ) {
        const a = { choices: choices.slice(), at: today() };
        learning.quizSession ??= {};
        learning.quizSession[key] = a;
        st.quizAnswers ??= {};
        st.quizAnswers[key] = a;
        st.quizAttemptHistory ??= {};
        const history = st.quizAttemptHistory[key] || [];
        st.quizAttemptHistory[key] = [
          ...history.slice(-9),
          { ...a, correct: lessonAnswerCorrect(q, a) },
        ];
        save();
        drawLesson();
        revealFeedback(`#q-${i} .qfeedback`);
      }
    }
    if (act === "quiz-page" && learning.id) {
      learning.quizPage = Number(id) || 0;
      drawLesson(true);
    }
    if (act === "card-restart" && learning.id) {
      learning.card = 0;
      learning.shown = false;
      learning.cardSession = {};
      learning.cardReport = false;
      drawLesson(true);
    }
    if (act === "chapter-card-restart" && learning.id) {
      learning.chapterCard = 0;
      learning.chapterShown = false;
      learning.chapterCardSession = {};
      learning.chapterCardReport = false;
      drawLesson(true);
    }
    if (act === "flash-review-chapter" && learning.id) {
      chapterRead(Number(id));
    }
    if (act === "card-reveal") {
      learning.shown = true;
      drawLesson();
    }
    if (act === "card-next" && learning.id) {
      learning.card = Math.min(
        lesson(learning.id).flashcards.length - 1,
        learning.card + 1,
      );
      learning.shown = false;
      drawLesson(true);
    }
    if (act === "card-prev" && learning.id) {
      learning.card = Math.max(0, learning.card - 1);
      learning.shown = false;
      drawLesson(true);
    }
    if (act === "card-mark" && learning.id) {
      st.flashcards ??= {};
      st.flashcards[`${learning.id}#${learning.card}`] = {
        result: id,
        at: today(),
      };
      learning.cardSession[learning.card] = id;
      save();
      if (learning.card < lesson(learning.id).flashcards.length - 1) {
        learning.card++;
        learning.shown = false;
        drawLesson(true);
      } else {
        learning.cardReport = true;
        drawLesson(true);
      }
    }
    if (act === "close-modal") {
      if (
        e.target === btn ||
        (btn.tagName === "BUTTON" && btn.contains(e.target))
      ) {
        closeModal();
        render();
      }
    }
    if (act === "grade") grade(id);
    if (act === "export")
      download(
        "MED2_S1_sauvegarde_" + today() + ".json",
        JSON.stringify(
          { app: "med2-s1", version: 1, exported: today(), state: st },
          null,
          2,
        ),
      );
    if (act === "import-state") fileImport("state");
    if (act === "import-catalogue") fileImport("catalogue");
    if (act === "reload") {
      localStorage.removeItem(OVERRIDE);
      location.reload();
    }
    if (act === "open-semio")
      window.open(
        "https://djamenstj7-hash.github.io/semiomed2/",
        "_blank",
        "noopener",
      );
    if (act === "clear") {
      if (
        confirm(
          "Effacer uniquement la progression MED2 S1 de cet appareil ? Sémio MED2 restera intact.",
        )
      ) {
        localStorage.removeItem(STORE);
        st = { ...defaultState };
        render();
      }
    }
  });
  /* ===== V0.30 · fenêtres : verrou du défilement, focus à l'ouverture et au retour, piège du focus ===== */
  let modalWasOpen = false,
    lastOpener = null;
  new MutationObserver(() => {
    const open = modal.childElementCount > 0;
    document.documentElement.classList.toggle("modal-open", open);
    const box = modal.querySelector(".modal");
    if (open && !modalWasOpen) box?.classList.add("enter");
    if (open && box && !modal.contains(document.activeElement) && !document.querySelector(".sheet-layer, .figure-overlay")) box.focus({ preventScroll: true });
    if (!open && modalWasOpen) {
      const back = lastOpener && app.querySelector(lastOpener);
      (back || app.querySelector("main"))?.focus({ preventScroll: true });
    }
    modalWasOpen = open;
  }).observe(modal, { childList: true });
  const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),summary,[tabindex]:not([tabindex="-1"])';
  function topLayer() {
    const layers = [...document.querySelectorAll(".figure-overlay, .sheet-layer")];
    if (layers.length) return layers[layers.length - 1];
    return modal.childElementCount ? modal.querySelector(".modal") : null;
  }
  /* Raccourcis clavier (documentés dans Réglages) : entraînement, évaluation du cours et cartes mémoire */
  function shortcuts(e) {
    if (!boot.ready || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (document.querySelector(".figure-overlay, .sheet-layer")) return;
    const k = e.key;
    const onControl = !!t?.closest?.("button, a, summary");
    const hit = (sel) => {
      const b = modal.querySelector(sel);
      if (!b || b.disabled) return false;
      b.click();
      e.preventDefault();
      return true;
    };
    const letter = /^[a-e]$/i.test(k) ? "abcde".indexOf(k.toLowerCase()) : /^[1-5]$/.test(k) ? Number(k) - 1 : -1;
    if (modal.querySelector(".modal.exam")) {
      if (letter >= 0) return hit(`[data-action="train-toggle"][data-id="${letter}"]`);
      if (k === "Enter" && !onControl) return hit(".exam-footer .primary-cta");
      if (k === "ArrowRight") return hit('.exam-footer .icon-btn[data-action="train-next"]');
      if (k === "ArrowLeft") return hit('.exam-footer .icon-btn[data-action="train-prev"]');
      return;
    }
    if (!learning.id || !modal.querySelector(".modal.reader")) return;
    if (learning.tab === "final") {
      if (letter >= 0) {
        if (learning.finalSubmitted) return;
        const opts = modal.querySelectorAll('[data-action="final-choice"]');
        if (opts[letter] && !opts[letter].disabled) {
          opts[letter].click();
          e.preventDefault();
        }
        return;
      }
      if (k === "Enter" && !onControl) {
        const b = modal.querySelector(".exam-footer .primary-cta");
        if (b && !b.disabled && b.dataset.action !== "final-restart") {
          b.click();
          e.preventDefault();
        }
        return;
      }
      if (k === "ArrowRight" || k === "ArrowLeft") {
        const b = modal.querySelectorAll(".exam-footer .icon-btn")[k === "ArrowRight" ? 1 : 0];
        if (b && !b.disabled) {
          b.click();
          e.preventDefault();
        }
      }
      return;
    }
    const deck = learning.tab === "cards" ? "card" : learning.tab === "chapter" && learning.chapterMode === "cards" ? "chapter-card" : "";
    if (!deck) return;
    if ((k === " " || k === "Enter") && !onControl) return hit(`[data-action="${deck}-reveal"]`);
    if (k === "1") return hit(`[data-action="${deck}-mark"][data-id="again"]`);
    if (k === "2") return hit(`[data-action="${deck}-mark"][data-id="good"]`);
    if (k === "ArrowRight") return hit(`[data-action="${deck}-next"]`);
    if (k === "ArrowLeft") return hit(`[data-action="${deck}-prev"]`);
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (closeFigure()) return;
      if (document.querySelector(".reader-toc-layer")) return readerToc(false);
      if (document.querySelector(".reader-sheet-layer")) return readerSheet(false);
      if (uiGrid) {
        uiGrid = false;
        if (modal.querySelector(".modal.exam")) drawTraining();
        else if (learning.id) drawLesson();
        return;
      }
      if (modal.childElementCount) {
        closeModal();
        render();
      }
      return;
    }
    if (e.key === "Tab") {
      const box = topLayer();
      if (!box) return;
      const f = [...box.querySelectorAll(FOCUSABLE)].filter((x) => x.getClientRects().length);
      if (!f.length) return;
      const first = f[0],
        last = f[f.length - 1],
        a = document.activeElement;
      if (!box.contains(a)) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      } else if (e.shiftKey && (a === first || a === box)) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && a === last) {
        e.preventDefault();
        first.focus();
      }
      return;
    }
    shortcuts(e);
  });
  addEventListener("pagehide", () => {
    if (boot.ready) save();
  });
  hydrate();
})();
</script>
